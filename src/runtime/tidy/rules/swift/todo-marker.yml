id: todo-marker
language: Swift
severity: info
message: TODO/FIXME/XXX comment.
note: Marker comments are informational. They have no autofix; resolve or remove them in a later change.
rule:
  any:
    - kind: comment
      regex: '(?i)(?s).*\b(TODO|FIXME|XXX)\b.*'
    - kind: multiline_comment
      regex: '(?i)(?s).*\b(TODO|FIXME|XXX)\b.*'
