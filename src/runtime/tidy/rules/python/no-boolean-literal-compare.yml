id: no-boolean-literal-compare
language: Python
severity: info
message: Comparison against a boolean literal.
note: When the operand is a bool, `x == True` is just `x` and `x == False` is `not x`. When it is not, the literal comparison is usually the bug. Drop the literal only for a proven bool; `is True` is left alone. This rule has no autofix.
rule:
  any:
    - pattern: $A == True
    - pattern: $A == False
    - pattern: $A != True
    - pattern: $A != False
    - pattern: True == $A
    - pattern: False == $A
    - pattern: True != $A
    - pattern: False != $A
