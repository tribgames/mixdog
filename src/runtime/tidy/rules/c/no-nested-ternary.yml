id: no-nested-ternary
language: C
severity: warning
message: Nested ternary expressions must be flattened.
note: A ternary inside a ternary hides its branches. Rewrite as if/else, early returns, or a lookup table; this rule has no autofix.
rule:
  kind: conditional_expression
  has:
    kind: conditional_expression
    stopBy: end
