id: no-boolean-literal-compare
language: JavaScript
severity: info
message: Comparison against a boolean literal.
note: When the operand is a boolean, `x === true` is just `x` and `x === false` is `!x`. When it is not, the literal comparison is usually the bug. Drop the literal only for a proven boolean; this rule has no autofix.
rule:
  any:
    - pattern: $A === true
    - pattern: $A === false
    - pattern: $A !== true
    - pattern: $A !== false
    - pattern: $A == true
    - pattern: $A == false
    - pattern: $A != true
    - pattern: $A != false
    - pattern: true === $A
    - pattern: false === $A
    - pattern: true !== $A
    - pattern: false !== $A
    - pattern: true == $A
    - pattern: false == $A
    - pattern: true != $A
    - pattern: false != $A
