# Relay network tuning. The listener is one hop from a phone on the other side
# of an ocean: ~150ms RTT, so the first boot's ~750KB of assets is spent almost
# entirely in slow start, not on bandwidth.
#
# bbr paces on measured delivery rate instead of backing off on loss, fq gives
# it the pacing queue it needs, and a leg that idles between pushes must not be
# thrown back to a one-packet window when the next transcript frame arrives.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_slow_start_after_idle = 0
