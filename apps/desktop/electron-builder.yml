appId: io.mixdog.desktop
productName: Mixdog
artifactName: mixdog-desktop-${os}-${arch}.${ext}
asar: true
asarUnpack:
  # Remote UI assets stay readable without Electron's ASAR fs patch.
  - out/renderer/**
  # Resolved relative to its unpacked location, so keep the package's JS, workers, and native bindings together.
  - node_modules/@homebridge/node-pty-prebuilt-multiarch/**
  # Keep the Win32 FFI loader and its platform-native binding on disk.
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-*/**
# Native modules ship as prebuilt binaries mirrored into runtime.asar.unpacked
# by prepare-runtime.mjs; never rebuild them against Electron headers here.
npmRebuild: false
nodeGypRebuild: false
# Notarizes and staples a signed macOS app before its dmg and zip are made.
afterSign: scripts/notarize-mac.cjs
extraMetadata:
  name: mixdog-desktop
  homepage: https://github.com/tribgames/mixdog#readme
protocols:
  name: Mixdog
  schemes:
    - mixdog
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - '!out/main/capture-window.js'
  # The jitter probe is a dev-only harness (main/jitter-probe-gate.ts); its dynamic
  # import lands in out/main/chunks/jitter-probe-<hash>.js.
  - '!out/main/**/jitter-probe*'
  - '!**/*.map'
extraResources:
  # BrowserWindow uses the same explicit icon as the executable/shortcut so
  # Windows taskbar rendering never depends on Explorer's embedded-icon cache.
  - from: build/mixdog.ico
    to: mixdog.ico
  # Linux tray icon: Electron reads ICO only on Windows.
  - from: build/mixdog.png
    to: mixdog.png
  # Electron resolves modules directly from this archive. NSIS therefore
  # installs one runtime file instead of expanding thousands of dependencies.
  - from: .runtime/runtime.asar
    to: runtime.asar
  # electron-builder filters a source path containing node_modules. The
  # preparation step mirrors native binaries and external-process scripts under
  # this neutral root; restore Electron's exact ASAR-unpacked layout at the destination.
  # This is also the Rust core's unpacked resource root (scripts/core-layout.mjs):
  # the mixdog package (src/rules, output-styles, agents, defaults, ...) the core
  # reads with plain fs, the dependency closure of the extension host and the skill
  # launchers, and the ONNX Runtime library with its siblings, as real files.
  # scripts/verify-staged-package.mjs checks the built resources for all of it.
  - from: .runtime/native-modules
    to: runtime.asar.unpacked/node_modules
  # The desktop daemon imports node-pty from app.asar.unpacked. Stage the
  # complete package under a neutral path so electron-builder cannot filter it.
  - from: .runtime/desktop-node-pty
    to: app.asar.unpacked/node_modules/@homebridge/node-pty-prebuilt-multiarch
  # The core this app starts (`mixdogd`, built for the app's own platform) and
  # the per-platform servers the SSH install uploads (servers.json + one
  # binary per Linux/macOS x64/arm64). scripts/stage-core.mjs stages both from
  # the release builds; the installed `resources/core/mixdogd` is also what
  # the fast-deploy script stops the running core with.
  - from: .runtime/core
    to: core
  - from: .runtime/server-cores
    to: server-cores
  # Product-native executables stay canonical GitHub release assets. Desktop
  # preparation downloads, verifies, and embeds only this platform's set,
  # plus the in-repo helpers built from source: the Computer Use helper
  # (mixdog-computer, .exe on Windows) on every platform, and on Windows the
  # browser importer, the secure-desktop helper and the window library.
  - from: .runtime/native-tools
    to: native-tools
  # License obligations travel with the installed app: MIT requires its
  # permission notice alongside the derived files, Apache-2.0 the license
  # text plus the upstream NOTICE.
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../NOTICE.md
    to: NOTICE.md
  - from: ../../LICENSES
    to: LICENSES
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
win:
  icon: build/mixdog.ico
  verifyUpdateCodeSignature: false
  # Only .exe files are signed by default, which covers every native-tools
  # executable (mixdog-computer.exe included); the main process also loads
  # this in-repo library (native-tools). Matched by file-name suffix.
  signExts:
    - mixdog_window.node
  target:
    - nsis
nsis:
  installerIcon: build/mixdog.ico
  installerHeaderIcon: build/mixdog.ico
  # One-click, per-user installation avoids elevation and machine-wide state.
  oneClick: true
  perMachine: false
  # Keep a desktop entry for direct discoverability after a silent one-click install.
  createDesktopShortcut: always
mac:
  # Generated by scripts/generate-brand-icons.mjs with the macOS grid inset.
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  # Developer ID builds run under the hardened runtime. The entitlements keep
  # V8's JIT, bundled native modules, composer dictation, and the osascript
  # helpers (folder picker, clipboard attachments) working; helpers inherit them.
  # Signing and notarization only happen when CI provides the credentials.
  # scripts/notarize-mac.cjs notarizes and staples (with a long staple retry)
  # in place of electron-builder's built-in step.
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Mixdog uses the microphone for voice dictation.
    NSAppleEventsUsageDescription: Mixdog uses AppleScript to show native folder pickers and read clipboard attachments.
linux:
  category: Development
  # hicolor sizes (16-256) generated from build/mixdog.png; the icon name is the
  # executable name, which matches the desktop entry's Icon= key.
  icon: build/icons
  # GNOME Shell extension, copied for per-user install by the app (the .deb also
  # installs it system-wide, see deb.fpm).
  extraResources:
    - from: ../../native/gnome-extension/mixdog-windows@mixdog.io
      to: gnome-extension/mixdog-windows@mixdog.io
  synopsis: Mixdog desktop host
  maintainer: Mixdog <support@mixdog.ai>
  desktop:
    entry:
      # Electron reports the package name (mixdog-desktop) as WM_CLASS and the
      # Wayland app_id; the entry must name the same class or docks and
      # alt-tab fall back to a generic icon.
      StartupWMClass: mixdog-desktop
  target:
    - target: AppImage
    - target: deb
deb:
  # AppArmor profile + alternatives (electron-builder defaults) plus Mixdog's
  # uinput udev/modprobe setup for Computer Use; see build/linux/*.tpl.
  afterInstall: build/linux/after-install.tpl
  afterRemove: build/linux/after-remove.tpl
  fpm:
    - build/linux/70-mixdog-uinput.rules=/usr/lib/udev/rules.d/70-mixdog-uinput.rules
    - build/linux/mixdog-uinput.conf=/usr/lib/modules-load.d/mixdog-uinput.conf
    - ../../native/gnome-extension/mixdog-windows@mixdog.io/=/usr/share/gnome-shell/extensions/mixdog-windows@mixdog.io
  recommends:
    - wl-clipboard
    - tesseract-ocr
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libsecret-tools
    - libasound2t64 | libasound2
# Static AppImage runtime: starts without libfuse2 (absent on stock Ubuntu 24.04).
toolsets:
  appimage: 1.0.3
publish:
  provider: github
  owner: tribgames
  repo: mixdog
  channel: latest
