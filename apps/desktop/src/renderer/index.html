<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <!-- Matches --mx-window-band and the Electron shell's DESKTOP_BACKGROUND_COLOR:
         pure #000000 made Android paint the system navigation-bar zone a DIFFERENT
         black under the app's grey band (user: 프레임 아래 검은 띠). -->
    <meta name="theme-color" content="#151518" />
    <meta name="application-name" content="Mixdog" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./mixdog.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./mixdog-192.png" />
    <title>Mixdog</title>
    <!-- Build-injected first-screen asset hints. Must stay ABOVE the boot
         script, which is what moves them into the head on the installed app. -->
    <!--mixdog-first-screen-->
    <script src="./boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
