<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mixdog Browser Use</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Mixdog Browser Use</h1>
      <p id="status">Checking connection…</p>
      <section id="pairing">
        <label for="token">Pairing token from Mixdog</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false">
        <button id="save" type="button">Pair with Mixdog</button>
      </section>
      <section id="access" hidden>
        <p>Only tabs in the <strong>Mixdog</strong> tab group are available.</p>
        <button id="toggle" type="button">Allow this tab</button>
      </section>
      <p id="error" role="alert"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
