<!doctype html>
<html><head><meta charset="utf-8"><title>Mixdog logo v5 — one-line M</title>
<style>
  body { margin: 0; padding: 40px; background: #1b1b1b; color: #e9e9e9; font: 14px/1.5 "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 26px; }
  .card { background: #232323; border-radius: 14px; padding: 20px; display: grid; gap: 13px; }
  .row { display: flex; align-items: center; gap: 16px; }
  img.lg { width: 128px; height: 128px; }
  img.md { width: 40px; height: 40px; }
  img.sm { width: 20px; height: 20px; }
  .name { color: #bdbdbd; font-size: 12.5px; }
  .bar { display: flex; align-items: center; gap: 10px; background: #131313; border-radius: 8px; padding: 8px 12px; }
</style></head><body>
<h1>Mixdog logo v5 — 22 원라인을 M으로 (128 / 40 / 20)</h1>
<div class="grid">
<div class="card"><div class="row"><img class="lg" src="41-line-ears-m.svg"><div class="bar"><img class="md" src="41-line-ears-m.svg"><img class="sm" src="41-line-ears-m.svg"></div></div><span class="name">41 · Ears M line — 뾰족 귀 M + 눈</span></div>
<div class="card"><div class="row"><img class="lg" src="42-line-nose-m.svg"><div class="bar"><img class="md" src="42-line-nose-m.svg"><img class="sm" src="42-line-nose-m.svg"></div></div><span class="name">42 · Nose M — 가운데 골에 액센트 코</span></div>
<div class="card"><div class="row"><img class="lg" src="43-line-foldear-m.svg"><div class="bar"><img class="md" src="43-line-foldear-m.svg"><img class="sm" src="43-line-foldear-m.svg"></div></div><span class="name">43 · Fold-ear M — 왼쪽 귀 접힘</span></div>
<div class="card"><div class="row"><img class="lg" src="44-line-profile-m.svg"><div class="bar"><img class="md" src="44-line-profile-m.svg"><img class="sm" src="44-line-profile-m.svg"></div></div><span class="name">44 · Profile M — 왼쪽 M + 오른쪽 얼굴 프로필</span></div>
<div class="card"><div class="row"><img class="lg" src="45-line-tail-m.svg"><div class="bar"><img class="md" src="45-line-tail-m.svg"><img class="sm" src="45-line-tail-m.svg"></div></div><span class="name">45 · Tail M — 오른 획 끝 꼬리 훅</span></div>
<div class="card"><div class="row"><img class="lg" src="46-line-soft-m.svg"><div class="bar"><img class="md" src="46-line-soft-m.svg"><img class="sm" src="46-line-soft-m.svg"></div></div><span class="name">46 · Soft M — 곡선 귀 + 눈</span></div>
</div>
</body></html>
