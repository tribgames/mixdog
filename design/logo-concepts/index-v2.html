<!doctype html>
<html><head><meta charset="utf-8"><title>Mixdog logo v2</title>
<style>
  body { margin: 0; padding: 40px; background: #1b1b1b; color: #e9e9e9;
    font: 14px/1.5 "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 28px; }
  .card { background: #232323; border-radius: 14px; padding: 22px; display: grid; gap: 14px; }
  .row { display: flex; align-items: center; gap: 18px; }
  img.lg { width: 128px; height: 128px; }
  img.md { width: 40px; height: 40px; }
  img.sm { width: 20px; height: 20px; }
  .name { color: #bdbdbd; font-size: 12.5px; }
  .bar { display: flex; align-items: center; gap: 10px; background: #131313;
    border-radius: 8px; padding: 8px 12px; }
</style></head><body>
<h1>Mixdog logo v2 — 도그 모티프 · 그라디언트 타일 (128 / 40 / 20)</h1>
<div class="grid">
  <div class="card"><div class="row"><img class="lg" src="11-dog-ears-m.svg"><div class="bar"><img class="md" src="11-dog-ears-m.svg"><img class="sm" src="11-dog-ears-m.svg"></div></div><span class="name">11 · Dog-ears M — M 봉우리가 쫑긋한 귀</span></div>
  <div class="card"><div class="row"><img class="lg" src="12-dog-face-m.svg"><div class="bar"><img class="md" src="12-dog-face-m.svg"><img class="sm" src="12-dog-face-m.svg"></div></div><span class="name">12 · Dog-face M — 귀 M + 눈 두 점</span></div>
  <div class="card"><div class="row"><img class="lg" src="13-m-tail-flick.svg"><div class="bar"><img class="md" src="13-m-tail-flick.svg"><img class="sm" src="13-m-tail-flick.svg"></div></div><span class="name">13 · Tail-flick M — 오른 획이 꼬리로 휙</span></div>
  <div class="card"><div class="row"><img class="lg" src="14-mix-overlap.svg"><div class="bar"><img class="md" src="14-mix-overlap.svg"><img class="sm" src="14-mix-overlap.svg"></div></div><span class="name">14 · Mix overlap — 흰 M + 액센트 M 겹침</span></div>
  <div class="card"><div class="row"><img class="lg" src="15-dog-ears-accent.svg"><div class="bar"><img class="md" src="15-dog-ears-accent.svg"><img class="sm" src="15-dog-ears-accent.svg"></div></div><span class="name">15 · Ears M on accent — 오렌지 타일</span></div>
  <div class="card"><div class="row"><img class="lg" src="16-hound-cloud.svg"><div class="bar"><img class="md" src="16-hound-cloud.svg"><img class="sm" src="16-hound-cloud.svg"></div></div><span class="name">16 · Hound — 지오메트릭 강아지 얼굴</span></div>
</div>
</body></html>
