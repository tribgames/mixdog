<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background -->
    <linearGradient id="s2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="50%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>

    <linearGradient id="s2-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Spectrum: Cyber Cyan to Deep Violet -->
    <linearGradient id="s2-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="s2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- App Tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#s2-bg)" filter="url(#s2-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#s2-border)" stroke-width="1.5"/>

  <!-- Concept 2: Pure Single-Stroke Continuous Circuit (Paseo Style) -->
  <!-- Left Ear -> Center Snout -> Right Ear -> Return Loop -->
  <path d="M 136 348
           V 192
           C 136 148 174 124 206 150
           L 256 192
           L 306 150
           C 338 124 376 148 376 192
           V 348
           M 188 280
           L 256 344
           L 324 280"
        fill="none"
        stroke="url(#s2-gradient)"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>