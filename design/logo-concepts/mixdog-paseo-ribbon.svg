<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark obsidian squircle tile background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16171d"/>
      <stop offset="50%" stop-color="#0c0d11"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Subtle rim light border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Multi-Agent Flow Gradient (Cyan -> Indigo -> Rose) -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow for the tile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Soft glow filter for the ribbon -->
    <filter id="ribbonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Tile (Rounded Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#tileShadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Backlight Glow Behind Logo -->
  <circle cx="256" cy="245" r="160" fill="url(#ambientGlow)"/>

  <!-- Mixdog Symbol: Fluid M Ribbon + Dog Ears + Prompt Chevron -->
  <g id="mixdog-mark">
    <!-- Continuous Outer Ribbon: M-Shape & Perky Canine Ears -->
    <path d="M 136 348
             V 196
             C 136 150 174 126 206 152
             L 256 194
             L 306 152
             C 338 126 376 150 376 196
             V 348"
          fill="none"
          stroke="url(#flowGrad)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#ribbonGlow)"/>

    <!-- Terminal Code Prompt Chevron / Dog Snout & Bridge -->
    <path d="M 194 274
             L 256 332
             L 318 274"
          fill="none"
          stroke="#ffffff"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Core AI Nexus Point / Dog Nose -->
    <circle cx="256" cy="302" r="11" fill="#00f2fe"/>
  </g>
</svg>