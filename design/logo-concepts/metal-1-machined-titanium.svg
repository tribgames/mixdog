<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Space Black / Natural Titanium Tile Substrate -->
    <linearGradient id="m1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191f"/>
      <stop offset="50%" stop-color="#0c0d11"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>

    <!-- CNC Machined Chamfer Rim -->
    <linearGradient id="m1-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#94a3b8" stop-opacity="0.15"/>
      <stop offset="75%" stop-color="#334155" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Titanium Metal Gradient (Main M-Frame) -->
    <linearGradient id="m1-titanium-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Specular Platinum for Inner Chamfer -->
    <linearGradient id="m1-platinum-prompt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Micro Orange Laser Status LED -->
    <radialGradient id="m1-amber-led" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffedd5"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <filter id="m1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="m1-specular-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Tile (Bead-Blasted Titanium Plate) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#m1-bg)" filter="url(#m1-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#m1-rim)" stroke-width="1.5"/>

  <!-- Subtle Hardware Surface Markings (CNC Registration Crosshairs) -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="68" y1="256" x2="80" y2="256"/>
    <line x1="432" y1="256" x2="444" y2="256"/>
    <line x1="256" y1="68" x2="256" y2="80"/>
    <line x1="256" y1="432" x2="256" y2="444"/>
  </g>

  <!-- Precision Machined Titanium Mark: M + Chamfer Ears + Prompt Chevron -->
  <g id="machined-titanium-mark">
    <!-- Outer Shadow Contour for 3D Inset Depth -->
    <path d="M 128 358 V 204 L 188 144 L 248 204 L 256 196 L 264 204 L 324 144 L 384 204 V 358"
          fill="none"
          stroke="#000000"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.6"/>

    <!-- Main Titanium Extruded M-Body -->
    <path d="M 128 356
             V 204
             L 188 144
             L 248 204
             L 256 196
             L 264 204
             L 324 144
             L 384 204
             V 356"
          fill="none"
          stroke="url(#m1-titanium-stem)"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Razor-Sharp Specular Light Highlight Lines (CNC Chamfer Reflection) -->
    <path d="M 128 352 V 204 L 188 144 L 248 204"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.9"
          filter="url(#m1-specular-glow)"/>

    <path d="M 384 352 V 204 L 324 144 L 264 204"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.7"/>

    <!-- Central Code Execution Snout / Platinum Chevron (>_ Vector) -->
    <path d="M 196 280
             L 256 340
             L 316 280"
          fill="none"
          stroke="url(#m1-platinum-prompt)"
          stroke-width="30"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Sharp Specular Line on Prompt Edge -->
    <path d="M 196 280 L 256 340 L 316 280"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.9"/>

    <!-- Micro Precision Laser Status Dot (AI Runtime Active Indicator) -->
    <circle cx="256" cy="242" r="6" fill="url(#m1-amber-led)"/>
    <circle cx="256" cy="242" r="2" fill="#ffffff"/>
  </g>
</svg>