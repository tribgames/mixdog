<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Obsidian Dark Substrate -->
    <linearGradient id="m2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="50%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#010102"/>
    </linearGradient>

    <!-- Polished Chrome Rim Light -->
    <linearGradient id="m2-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#94a3b8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Liquid Chrome Facet 1 (Left Ear Top Reflective Specular) -->
    <linearGradient id="m2-chrome-top-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Liquid Chrome Facet 2 (Left Dark Shadow Wall) -->
    <linearGradient id="m2-chrome-wall-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Liquid Chrome Facet 3 (Right Ear Top Reflective Specular) -->
    <linearGradient id="m2-chrome-top-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Liquid Chrome Facet 4 (Right Dark Shadow Wall) -->
    <linearGradient id="m2-chrome-wall-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Center Forward Terminal Dart (Mirror Specular) -->
    <linearGradient id="m2-center-mirror" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="m2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="m2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#m2-bg)" filter="url(#m2-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#m2-rim)" stroke-width="1.5"/>

  <!-- High-Tech 3D Liquid Chrome Prism (M + Stealth Hound) -->
  <g id="liquid-chrome-prism">
    <!-- 1. Left Vertical Base Wall -->
    <polygon points="128,348 128,208 178,148 178,288" fill="url(#m2-chrome-wall-left)"/>

    <!-- 2. Left Dog Ear (Top Mirror Facet) -->
    <polygon points="178,148 244,208 178,236" fill="url(#m2-chrome-top-left)"/>

    <!-- 3. Left Inner Chute Drop -->
    <polygon points="178,236 244,208 256,264 190,292" fill="#1e293b"/>

    <!-- 4. Right Vertical Base Wall -->
    <polygon points="384,348 384,208 334,148 334,288" fill="url(#m2-chrome-wall-right)"/>

    <!-- 5. Right Dog Ear (Top Mirror Facet) -->
    <polygon points="334,148 268,208 334,236" fill="url(#m2-chrome-top-right)"/>

    <!-- 6. Right Inner Chute Drop -->
    <polygon points="334,236 268,208 256,264 322,292" fill="#0f172a"/>

    <!-- 7. Center Executing Dart (Forward Terminal Vector / Snout) -->
    <polygon points="190,292 256,264 322,292 256,364" fill="url(#m2-center-mirror)"/>

    <!-- High-Definition White Specular Light Creases -->
    <line x1="256" y1="264" x2="256" y2="364" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" filter="url(#m2-glow)"/>
    <line x1="178" y1="148" x2="244" y2="208" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <line x1="334" y1="148" x2="268" y2="208" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <line x1="128" y1="208" x2="178" y2="148" stroke="#e2e8f0" stroke-width="2" opacity="0.8"/>
    <line x1="384" y1="208" x2="334" y2="148" stroke="#e2e8f0" stroke-width="2" opacity="0.8"/>

    <!-- Micro Pure White Laser Reflection Core -->
    <circle cx="256" cy="308" r="4" fill="#ffffff" filter="url(#m2-glow)"/>
  </g>
</svg>