<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Space Black Tile -->
    <linearGradient id="m4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="50%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>

    <linearGradient id="m4-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Liquid Mercury / Platinum Gradient (Continuous Ribbon) -->
    <linearGradient id="m4-mercury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Electric Cyan Laser Core / Prompt Reflection -->
    <linearGradient id="m4-cyan-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="m4-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="m4-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#m4-bg)" filter="url(#m4-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#m4-rim)" stroke-width="1.5"/>

  <!-- Liquid Mercury Streamline Continuous Ribbon -->
  <g id="mercury-streamline">
    <!-- Liquid Metal Outer Loop M & Hound Ears -->
    <path d="M 136 348
             V 192
             C 136 148 174 124 206 150
             L 256 192
             L 306 150
             C 338 124 376 148 376 192
             V 348"
          fill="none"
          stroke="url(#m4-mercury)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Specular White-Hot Light Highlight Streak -->
    <path d="M 136 348 V 192 C 136 148 174 124 206 150 L 256 192"
          fill="none"
          stroke="#ffffff"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.9"
          filter="url(#m4-glow)"/>

    <!-- Center Forward Terminal Prompt Chevron (>_ Snout Vector) in Pure Specular White -->
    <path d="M 194 280
             L 256 342
             L 318 280"
          fill="none"
          stroke="url(#m4-cyan-laser)"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#m4-glow)"/>

    <!-- Razor Highlight on Snout Tip -->
    <path d="M 194 280 L 256 342 L 318 280"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>
  </g>
</svg>