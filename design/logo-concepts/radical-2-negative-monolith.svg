      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="r2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.9"/>
