<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="c5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="c5-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Electric Accent Gradient (Linear / Raycast punchy glow) -->
    <linearGradient id="c5-electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="c5-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="c5-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- App Tile Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#c5-bg)" filter="url(#c5-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#c5-border)" stroke-width="1.5"/>

  <!-- Geometric Monoline Apex Structure (Pure Precision) -->
  <g transform="translate(0, 0)">
    <!-- Outer Hound / M Monogram Stroke -->
    <path d="M 124 356
             V 192
             L 174 142
             L 224 192
             L 256 160
             L 288 192
             L 338 142
             L 388 192
             V 356"
          fill="none"
          stroke="url(#c5-electric)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Center Terminal Prompt Caret / Dog Snout (Vibrant Orange Accent) -->
    <path d="M 196 288
             L 256 348
             L 316 288"
          fill="none"
          stroke="url(#c5-orange)"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Center Code Cursor Bar -->
    <line x1="256" y1="210" x2="256" y2="250" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>