<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="c4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181320"/>
      <stop offset="50%" stop-color="#0e0a14"/>
      <stop offset="100%" stop-color="#040306"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="c4-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Stream 1 (Claude Amber/Rose) -->
    <linearGradient id="c4-stream-claude" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Stream 2 (GPT Emerald/Cyan) -->
    <linearGradient id="c4-stream-gpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Stream 3 (Gemini Indigo/Violet) -->
    <linearGradient id="c4-stream-gemini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- AI Sparkle Core Glow -->
    <radialGradient id="c4-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="c4-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="c4-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Tile Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#c4-bg)" filter="url(#c4-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#c4-border)" stroke-width="1.5"/>

  <!-- Ambient Glow Center -->
  <circle cx="256" cy="248" r="150" fill="url(#c4-glow)" opacity="0.18"/>

  <!-- Multi-Agent Interlocking Neural Loop Silhouette -->
  <g transform="translate(0, 0)">
    <!-- Loop 1: Left Ear Loop (GPT/Cyan Stream) -->
    <path d="M 140 330
             C 110 250 120 150 180 140
             C 230 130 240 220 256 260"
          fill="none"
          stroke="url(#c4-stream-gpt)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#c4-blur)"/>

    <!-- Loop 2: Right Ear Loop (Claude/Rose Stream) -->
    <path d="M 372 330
             C 402 250 392 150 332 140
             C 282 130 272 220 256 260"
          fill="none"
          stroke="url(#c4-stream-claude)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#c4-blur)"/>

    <!-- Loop 3: Center M Bridge & Snout (Gemini/Violet Stream) -->
    <path d="M 180 340
             C 210 380 256 380 256 340
             C 256 300 256 300 256 340
             C 256 380 302 380 332 340"
          fill="none"
          stroke="url(#c4-stream-gemini)"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Dynamic AI 4-Point Sparkle ✦ in the forehead/center -->
    <g transform="translate(256, 220)">
      <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" 
            fill="#ffffff" 
            filter="url(#c4-blur)"/>
      <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    </g>

    <!-- Snout Point / Code Prompt Chevron -->
    <path d="M 224 300 L 256 332 L 288 300" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>