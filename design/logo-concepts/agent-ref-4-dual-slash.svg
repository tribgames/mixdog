<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background -->
    <linearGradient id="slash-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15161d"/>
      <stop offset="50%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <linearGradient id="slash-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Spectrum: Cyber Cyan to Rose Orange -->
    <linearGradient id="slash-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="slash-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="slash-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- App Tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#slash-bg)" filter="url(#slash-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#slash-border)" stroke-width="1.5"/>

  <!-- Dual-Slash & Precision Execution Chevron -->
  <g transform="translate(0, 0)">
    <!-- Left Ear / Left Code Slash -->
    <path d="M 148 348 L 148 212 L 216 144 L 256 184"
          fill="none"
          stroke="url(#slash-grad-1)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Right Ear / Right Code Slash -->
    <path d="M 364 348 L 364 212 L 296 144 L 256 184"
          fill="none"
          stroke="url(#slash-grad-2)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Center Terminal Prompt Chevron (White Hot Execution Vector) -->
    <path d="M 194 280 L 256 342 L 318 280"
          fill="none"
          stroke="#ffffff"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Prompt AI Center Point -->
    <circle cx="256" cy="242" r="8" fill="#38bdf8"/>
  </g>
</svg>