  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#t5-bg)" filter="url(#t5-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#t5-border)" stroke-width="1.5"/>
  
