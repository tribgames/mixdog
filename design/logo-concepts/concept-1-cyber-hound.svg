<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="c1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="50%" stop-color="#090d13"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="c1-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Terminal Neon Gradients -->
    <linearGradient id="c1-neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="c1-neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Visor Glass Gradient -->
    <linearGradient id="c1-visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="c1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="c1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#c1-bg)" filter="url(#c1-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#c1-border)" stroke-width="1.5"/>

  <!-- Subtle Matrix grid dots background -->
  <g opacity="0.08" fill="#10b981">
    <circle cx="120" cy="120" r="3"/><circle cx="160" cy="120" r="3"/><circle cx="200" cy="120" r="3"/><circle cx="312" cy="120" r="3"/><circle cx="352" cy="120" r="3"/><circle cx="392" cy="120" r="3"/>
    <circle cx="120" cy="160" r="3"/><circle cx="160" cy="160" r="3"/><circle cx="352" cy="160" r="3"/><circle cx="392" cy="160" r="3"/>
    <circle cx="120" cy="380" r="3"/><circle cx="160" cy="380" r="3"/><circle cx="200" cy="380" r="3"/><circle cx="256" cy="380" r="3"/><circle cx="312" cy="380" r="3"/><circle cx="352" cy="380" r="3"/><circle cx="392" cy="380" r="3"/>
  </g>

  <!-- Cyber Hound Head Base (Geometric M-Structure & Ears) -->
  <!-- Outer Ear Antennae / Head Contour -->
  <path d="M 144 140
           L 184 210
           L 224 168
           L 256 196
           L 288 168
           L 328 210
           L 368 140
           L 396 230
           C 396 320 330 368 256 368
           C 182 368 116 320 116 230
           Z"
        fill="#131b26"
        stroke="#1e293b"
        stroke-width="4"/>

  <!-- Left Cyber Ear (Bracket Shape <) -->
  <path d="M 144 136 L 192 216 L 140 256"
        fill="none"
        stroke="url(#c1-neon-cyan)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#c1-glow)"/>

  <!-- Right Cyber Ear (Bracket Shape >) -->
  <path d="M 368 136 L 320 216 L 372 256"
        fill="none"
        stroke="url(#c1-neon-cyan)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#c1-glow)"/>

  <!-- Cyber Visor (HUD Screen) -->
  <path d="M 164 240
           C 164 230 174 220 186 220
           L 326 220
           C 338 220 348 230 348 240
           L 340 286
           C 336 304 316 316 296 316
           L 216 316
           C 196 316 176 304 172 286
           Z"
        fill="url(#c1-visor)"
        stroke="url(#c1-neon-cyan)"
        stroke-width="3"/>

  <!-- Terminal Prompt inside Visor (>_ Prompt Eye) -->
  <!-- Prompt Chevron > -->
  <path d="M 212 254 L 236 268 L 212 282"
        fill="none"
        stroke="url(#c1-neon-green)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#c1-glow)"/>

  <!-- Terminal Blinking Cursor _ -->
  <line x1="252" y1="282" x2="284" y2="282"
        stroke="#ffffff"
        stroke-width="8"
        stroke-linecap="round"
        filter="url(#c1-glow)"/>

  <!-- Cyber Snout & AI Processing Core -->
  <polygon points="244,332 268,332 256,346" fill="#38bdf8"/>
  <circle cx="256" cy="336" r="3" fill="#ffffff"/>
</svg>