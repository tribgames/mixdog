<!doctype html>
<html><head><meta charset="utf-8"><title>Mixdog logo concepts</title>
<style>
  body { margin: 0; padding: 40px; background: #1b1b1b; color: #e9e9e9;
    font: 14px/1.5 "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 28px; }
  .card { background: #232323; border-radius: 14px; padding: 22px; display: grid; gap: 14px; }
  .row { display: flex; align-items: center; gap: 18px; }
  img.lg { width: 128px; height: 128px; }
  img.md { width: 40px; height: 40px; }
  img.sm { width: 20px; height: 20px; }
  .name { color: #bdbdbd; font-size: 12.5px; }
  .bar { display: flex; align-items: center; gap: 10px; background: #131313;
    border-radius: 8px; padding: 8px 12px; }
</style></head><body>
<h1>Mixdog logo concepts — tile 128 / rail 40 / tab 20</h1>
<div class="grid">
  <div class="card"><div class="row"><img class="lg" src="01-m-round-current.svg"><div class="bar"><img class="md" src="01-m-round-current.svg"><img class="sm" src="01-m-round-current.svg"></div></div><span class="name">01 · Round M (현행 정제 — Orca 타일)</span></div>
  <div class="card"><div class="row"><img class="lg" src="02-m-sharp-vscode.svg"><div class="bar"><img class="md" src="02-m-sharp-vscode.svg"><img class="sm" src="02-m-sharp-vscode.svg"></div></div><span class="name">02 · Sharp M (VS Code 각형 솔리드)</span></div>
  <div class="card"><div class="row"><img class="lg" src="03-m-ribbon-fold.svg"><div class="bar"><img class="md" src="03-m-ribbon-fold.svg"><img class="sm" src="03-m-ribbon-fold.svg"></div></div><span class="name">03 · Ribbon M (VS Code 리본 폴드)</span></div>
  <div class="card"><div class="row"><img class="lg" src="04-m-wave-orca.svg"><div class="bar"><img class="md" src="04-m-wave-orca.svg"><img class="sm" src="04-m-wave-orca.svg"></div></div><span class="name">04 · Wave M (Orca 꼬리 곡선)</span></div>
  <div class="card"><div class="row"><img class="lg" src="05-m-inverted.svg"><div class="bar"><img class="md" src="05-m-inverted.svg"><img class="sm" src="05-m-inverted.svg"></div></div><span class="name">05 · Inverted (라이트 타일)</span></div>
  <div class="card"><div class="row"><img class="lg" src="06-m-dot-accent.svg"><div class="bar"><img class="md" src="06-m-dot-accent.svg"><img class="sm" src="06-m-dot-accent.svg"></div></div><span class="name">06 · Dot accent (시그널 도트)</span></div>
</div>
</body></html>
