<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="s5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="50%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="s5-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="s5-mono-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="s5-mono-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="s5-amber-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="s5-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#s5-bg)" filter="url(#s5-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#s5-rim)" stroke-width="1.5"/>

  <!-- Monolith Solid Titanium Slabs with Laser Chasm -->
  <g id="monolith-laser">
    <!-- Left Titanium Slab with 45° Chamfer Apex -->
    <polygon points="120,356 120,204 176,140 236,204 186,254 186,356" fill="url(#s5-mono-left)"/>
    
    <!-- Right Titanium Slab with 45° Chamfer Apex -->
    <polygon points="392,356 392,204 336,140 276,204 326,254 326,356" fill="url(#s5-mono-right)"/>

    <!-- Specular Machined Chamfer Lines -->
    <line x1="120" y1="204" x2="176" y2="140" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="176" y1="140" x2="236" y2="204" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="392" y1="204" x2="336" y2="140" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="336" y1="140" x2="276" y2="204" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Center Floating High-Voltage Terminal Execution Dart (Amber Flare) -->
    <polygon points="208,284 256,236 304,284 256,342" fill="url(#s5-amber-laser)"/>
    <line x1="256" y1="240" x2="256" y2="338" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>