<!doctype html>
<html><head><meta charset="utf-8"><title>Mixdog logo v3</title>
<style>
  body { margin: 0; padding: 40px; background: #1b1b1b; color: #e9e9e9; font: 14px/1.5 "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 26px; }
  .card { background: #232323; border-radius: 14px; padding: 20px; display: grid; gap: 13px; }
  .row { display: flex; align-items: center; gap: 16px; }
  img.lg { width: 120px; height: 120px; }
  img.md { width: 40px; height: 40px; }
  img.sm { width: 20px; height: 20px; }
  .name { color: #bdbdbd; font-size: 12.5px; }
  .bar { display: flex; align-items: center; gap: 10px; background: #131313; border-radius: 8px; padding: 8px 12px; }
</style></head><body>
<h1>Mixdog logo v3 — 스타일 다변화 (120 / 40 / 20)</h1>
<div class="grid">
<div class="card"><div class="row"><img class="lg" src="21-pixel-dog.svg"><div class="bar"><img class="md" src="21-pixel-dog.svg"><img class="sm" src="21-pixel-dog.svg"></div></div><span class="name">21 · Pixel dog — 8비트 레트로</span></div>
<div class="card"><div class="row"><img class="lg" src="22-one-line-dog.svg"><div class="bar"><img class="md" src="22-one-line-dog.svg"><img class="sm" src="22-one-line-dog.svg"></div></div><span class="name">22 · One-line — 한 획 강아지 프로필</span></div>
<div class="card"><div class="row"><img class="lg" src="23-terminal-dog.svg"><div class="bar"><img class="md" src="23-terminal-dog.svg"><img class="sm" src="23-terminal-dog.svg"></div></div><span class="name">23 · Terminal dog — 귀 달린 터미널 창</span></div>
<div class="card"><div class="row"><img class="lg" src="24-lowpoly-dog.svg"><div class="bar"><img class="md" src="24-lowpoly-dog.svg"><img class="sm" src="24-lowpoly-dog.svg"></div></div><span class="name">24 · Low-poly — 파셋 강아지 얼굴</span></div>
<div class="card"><div class="row"><img class="lg" src="25-bubble-dog.svg"><div class="bar"><img class="md" src="25-bubble-dog.svg"><img class="sm" src="25-bubble-dog.svg"></div></div><span class="name">25 · Bubble dog — 말풍선 + 귀 (에이전트 챗)</span></div>
<div class="card"><div class="row"><img class="lg" src="26-neon-ears-m.svg"><div class="bar"><img class="md" src="26-neon-ears-m.svg"><img class="sm" src="26-neon-ears-m.svg"></div></div><span class="name">26 · Neon M — 네온 아웃라인 귀 M</span></div>
<div class="card"><div class="row"><img class="lg" src="27-badge-dog.svg"><div class="bar"><img class="md" src="27-badge-dog.svg"><img class="sm" src="27-badge-dog.svg"></div></div><span class="name">27 · Badge — 원형 배지 강아지</span></div>
<div class="card"><div class="row"><img class="lg" src="28-light-line-dog.svg"><div class="bar"><img class="md" src="28-light-line-dog.svg"><img class="sm" src="28-light-line-dog.svg"></div></div><span class="name">28 · Light line — 라이트 라인아트</span></div>
</div>
</body></html>
