<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background -->
    <linearGradient id="s4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="50%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="s4-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Linear / Titanium spec -->
    <linearGradient id="s4-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Electric Amber / Flame Orange Accent (Raycast / Claude Prompt Vibe) -->
    <linearGradient id="s4-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="s4-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- App Tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#s4-bg)" filter="url(#s4-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#s4-border)" stroke-width="1.5"/>

  <!-- Concept 4: Precision Monolith M + Negative Terminal Cut -->
  <g id="monolith-mark">
    <!-- Solid Left Column with 45-degree Ear Peak -->
    <polygon points="120,356 120,210 176,144 232,210 184,260 184,356" fill="url(#s4-metal)"/>

    <!-- Solid Right Column with 45-degree Ear Peak -->
    <polygon points="392,356 392,210 336,144 280,210 328,260 328,356" fill="url(#s4-metal)"/>

    <!-- Center Floating Terminal Forward Vector / Execution Snout -->
    <polygon points="208,284 256,236 304,284 256,340" fill="url(#s4-accent)"/>
  </g>
</svg>