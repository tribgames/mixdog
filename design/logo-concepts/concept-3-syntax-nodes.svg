<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="c3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="50%" stop-color="#0f1016"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="c3-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Syntax Colors (Code Editor Syntax Highlighting) -->
    <!-- Left Ear / Purple Bracket -->
    <linearGradient id="c3-bracket-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Right Ear / Violet Bracket -->
    <linearGradient id="c3-bracket-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Git Branch Coral / Orange -->
    <linearGradient id="c3-git-branch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Cyan Terminal -->
    <linearGradient id="c3-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="c3-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="c3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Tile Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#c3-bg)" filter="url(#c3-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#c3-border)" stroke-width="1.5"/>

  <!-- Developer Code Bracket Dog Shape -->
  <g transform="translate(0, 0)">
    <!-- 1. Left Curly Bracket { (Left Ear & Side Face) -->
    <path d="M 180 144
             C 140 144 140 190 140 216
             C 140 236 120 256 104 256
             C 120 256 140 276 140 296
             C 140 322 140 368 180 368"
          fill="none"
          stroke="url(#c3-bracket-left)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#c3-glow)"/>

    <!-- 2. Right Curly Bracket } (Right Ear & Side Face) -->
    <path d="M 332 144
             C 372 144 372 190 372 216
             C 372 236 392 256 408 256
             C 392 256 372 276 372 296
             C 372 322 372 368 332 368"
          fill="none"
          stroke="url(#c3-bracket-right)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#c3-glow)"/>

    <!-- 3. Git Branch Tree / Snout & Forehead (Nodes & Edges) -->
    <!-- Top Main Root Commit Node -->
    <circle cx="256" cy="180" r="14" fill="#ffffff" filter="url(#c3-glow)"/>
    
    <!-- Left Branch Line -->
    <path d="M 256 180 Q 200 230 206 280" fill="none" stroke="url(#c3-cyan)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="206" cy="280" r="10" fill="#38bdf8"/>

    <!-- Right Branch Line -->
    <path d="M 256 180 Q 312 230 306 280" fill="none" stroke="url(#c3-git-branch)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="306" cy="280" r="10" fill="#fb7185"/>

    <!-- Center Merge Stream to Snout -->
    <path d="M 256 180 V 310" fill="none" stroke="#64748b" stroke-width="8" stroke-dasharray="10 8" stroke-linecap="round"/>

    <!-- 4. Terminal Prompt Chevron Nose / Snout (< > / /> Tag) -->
    <!-- Closing Tag Slash & Chevron </ > -->
    <path d="M 206 336 L 256 376 L 306 336"
          fill="none"
          stroke="#ffffff"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Dog Nose / Golden Commit Merge Point -->
    <circle cx="256" cy="342" r="12" fill="#fbbf24"/>
    <circle cx="256" cy="342" r="5" fill="#ffffff"/>
  </g>
</svg>