<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background -->
    <linearGradient id="cursor-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>

    <linearGradient id="cursor-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Isometric Face Gradients -->
    <!-- Left Ear Facet (Cyan Specular) -->
    <linearGradient id="cur-facet-left-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Left Outer Wall (Dark Shadow) -->
    <linearGradient id="cur-facet-left-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Right Ear Facet (Violet Specular) -->
    <linearGradient id="cur-facet-right-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Right Outer Wall (Dark Shadow) -->
    <linearGradient id="cur-facet-right-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Center Forward Terminal Arrow / Snout Vector (Pure White-Silver Specular) -->
    <linearGradient id="cur-center-arrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="cur-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- App Tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#cursor-bg)" filter="url(#cur-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#cursor-border)" stroke-width="1.5"/>

  <!-- Cursor-style Isometric 3D Geometric Facets -->
  <g id="cursor-prism-mark">
    <!-- 1. Left Vertical Base -->
    <polygon points="128,348 128,208 178,148 178,288" fill="url(#cur-facet-left-wall)"/>

    <!-- 2. Left Dog Ear (Isometric Top Surface) -->
    <polygon points="178,148 244,208 178,236" fill="url(#cur-facet-left-top)"/>

    <!-- 3. Left Inner Drop -->
    <polygon points="178,236 244,208 256,264 190,292" fill="#0369a1"/>

    <!-- 4. Right Vertical Base -->
    <polygon points="384,348 384,208 334,148 334,288" fill="url(#cur-facet-right-wall)"/>

    <!-- 5. Right Dog Ear (Isometric Top Surface) -->
    <polygon points="334,148 268,208 334,236" fill="url(#cur-facet-right-top)"/>

    <!-- 6. Right Inner Drop -->
    <polygon points="334,236 268,208 256,264 322,292" fill="#4338ca"/>

    <!-- 7. Center Executing Dart (Forward Terminal Vector / Snout) -->
    <polygon points="190,292 256,264 322,292 256,364" fill="url(#cur-center-arrow)"/>

    <!-- Center Precision Chamfer Lines -->
    <line x1="256" y1="264" x2="256" y2="364" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="178" y1="148" x2="244" y2="208" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="334" y1="148" x2="268" y2="208" stroke="#f5d0fe" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>