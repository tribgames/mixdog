<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="s6-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="50%" stop-color="#08090d"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="s6-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="s6-cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="s6-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#s6-bg)" filter="url(#s6-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#s6-rim)" stroke-width="1.5"/>

  <!-- Minimalist Geometric 'mx' Ligature with Generative Code Spark ✦ -->
  <g transform="translate(0, 0)">
    <!-- 'm' arches with razor precision -->
    <path d="M 120 344 V 212 C 120 178 144 160 174 160 C 204 160 224 178 224 212 V 344"
          fill="none"
          stroke="#ffffff"
          stroke-width="32"
          stroke-linecap="round"/>
          
    <path d="M 224 240 C 236 182 268 160 300 160 C 334 160 356 182 356 220 V 344"
          fill="none"
          stroke="#ffffff"
          stroke-width="32"
          stroke-linecap="round"/>

    <!-- 'x' Intersecting Generative 4-Ray Laser Spark ✦ -->
    <g transform="translate(396, 252)">
      <path d="M 0 -44 Q 0 0 44 0 Q 0 0 0 44 Q 0 0 -44 0 Q 0 0 0 -44 Z" fill="url(#s6-cyan-glow)"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    </g>

    <!-- Terminal Prompt Underline -->
    <line x1="120" y1="368" x2="160" y2="368" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>