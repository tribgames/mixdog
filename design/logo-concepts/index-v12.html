<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mixdog logo v12 — style territories</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 34px 40px 44px; background: #17181b; color: #f2f2f2; font: 13px/1.45 "Segoe UI", sans-serif; }
    header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 22px; }
    h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.2px; }
    header p { margin: 0; color: #8d8d94; font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 16px; }
    .card { min-width: 0; padding: 16px; border: 1px solid #2f2f34; border-radius: 10px; background: #202024; }
    .preview { display: grid; grid-template-columns: 116px 1fr; gap: 14px; align-items: center; }
    .hero { width: 116px; height: 116px; display: block; border-radius: 10px; }
    .scales { display: grid; gap: 8px; }
    .rail { height: 48px; padding: 0 11px; border-radius: 7px; display: flex; align-items: center; gap: 12px; }
    .rail.dark { background: #0f0f11; border: 1px solid #2b2b2f; }
    .rail.light { background: #f1f1f3; border: 1px solid #d7d7db; }
    .rail img:first-child { width: 40px; height: 40px; }
    .rail img:last-child { width: 20px; height: 20px; }
    .meta { margin-top: 11px; display: flex; justify-content: space-between; gap: 10px; }
    .name { color: #e7e7e9; font-weight: 600; }
    .family { color: #85858d; font-size: 11px; text-align: right; }
  </style>
</head>
<body>
  <header><h1>Mixdog logo v12 — style territories</h1><p>바우하우스 · 스위스 · 크레스트 · 네온 · 신스웨이브 · 먹선 · 오리가미 · 회로 · 노트 · 하프톤 · ASCII / 116 · 40 · 20px</p></header>
  <main class="grid" id="g"></main>
  <script>
    const items = [
      ['171-bauhaus-primitive.svg', '171 · Bauhaus Primitive', 'geometric poster'],
      ['172-swiss-grid.svg', '172 · Swiss Grid', 'editorial'],
      ['173-kamon-crest.svg', '173 · Kamon Crest', 'emblem'],
      ['174-emblem-seal.svg', '174 · Emblem Seal', 'emblem'],
      ['175-neon-tube.svg', '175 · Neon Tube', 'light'],
      ['176-synthwave.svg', '176 · Synthwave', 'scene'],
      ['177-ink-brush-m.svg', '177 · Ink Brush M', 'hand'],
      ['178-origami-dog.svg', '178 · Origami Dog', 'facet'],
      ['179-circuit-node.svg', '179 · Circuit Node', 'tech'],
      ['180-knot-m.svg', '180 · Knot M', 'interlace'],
      ['181-halftone-orb.svg', '181 · Halftone Orb', 'texture'],
      ['182-ascii-terminal.svg', '182 · ASCII Terminal', 'type'],
    ];
    document.getElementById('g').innerHTML = items.map(([f, n, k]) => `
      <article class="card">
        <div class="preview">
          <img class="hero" src="${f}">
          <div class="scales">
            <div class="rail dark"><img src="${f}"><img src="${f}"></div>
            <div class="rail light"><img src="${f}"><img src="${f}"></div>
          </div>
        </div>
        <div class="meta"><span class="name">${n}</span><span class="family">${k}</span></div>
      </article>`).join('');
  </script>
</body>
</html>
