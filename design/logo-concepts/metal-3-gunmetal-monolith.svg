<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Matte Gunmetal Plate Substrate -->
    <linearGradient id="m3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16171d"/>
      <stop offset="50%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#020304"/>
    </linearGradient>

    <!-- Industrial Metal Bevel Rim -->
    <linearGradient id="m3-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Bead-Blasted Gunmetal Extrusion (Pillars) -->
    <linearGradient id="m3-gunmetal-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="m3-gunmetal-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Amber Laser Plasma Core (Teenage Engineering Punch) -->
    <linearGradient id="m3-laser-flare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="m3-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="m3-flare-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#m3-bg)" filter="url(#m3-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#m3-rim)" stroke-width="1.5"/>

  <!-- Gunmetal Monolith & Negative Terminal Prompt Cut -->
  <g id="gunmetal-monolith">
    <!-- Left Solid Monolith Column with 45° Ear Apex -->
    <polygon points="120,356 120,208 176,144 232,208 184,258 184,356" fill="url(#m3-gunmetal-left)"/>

    <!-- Right Solid Monolith Column with 45° Ear Apex -->
    <polygon points="392,356 392,208 336,144 280,208 328,258 328,356" fill="url(#m3-gunmetal-right)"/>

    <!-- Specular CNC Chamfer Lines on Top Ear Edges -->
    <line x1="120" y1="208" x2="176" y2="144" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="176" y1="144" x2="232" y2="208" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="392" y1="208" x2="336" y2="144" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="336" y1="144" x2="280" y2="208" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Center Floating High-Tech Laser Prompt Vector (Execution Flare) -->
    <polygon points="208,284 256,236 304,284 256,340" fill="url(#m3-laser-flare)" filter="url(#m3-flare-glow)"/>

    <!-- Laser Specular White-Hot Core Line -->
    <line x1="256" y1="240" x2="256" y2="336" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>