<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="s2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="50%" stop-color="#08090c"/>
      <stop offset="100%" stop-color="#010203"/>
    </linearGradient>
    <linearGradient id="s2-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="s2-beam-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="s2-beam-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="s2-center-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="s2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#s2-bg)" filter="url(#s2-shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" fill="none" stroke="url(#s2-rim)" stroke-width="1.5"/>

  <!-- Intersecting G2 Parabolic Arcs & Autonomous Nexus Core -->
  <g id="parabolic-nexus">
    <!-- Left Parabolic Arc (Code Bracket Left < forming Left Stride & Arch) -->
    <path d="M 136 348 C 136 200 180 148 232 188 C 256 206 256 244 256 244"
          fill="none"
          stroke="url(#s2-beam-1)"
          stroke-width="32"
          stroke-linecap="round"/>

    <!-- Right Parabolic Arc (Code Bracket Right > forming Right Stride & Arch) -->
    <path d="M 376 348 C 376 200 332 148 280 188 C 256 206 256 244 256 244"
          fill="none"
          stroke="url(#s2-beam-2)"
          stroke-width="32"
          stroke-linecap="round"/>

    <!-- Center Forward Execution Dart (Apex Vector) -->
    <path d="M 204 286 L 256 344 L 308 286"
          fill="none"
          stroke="#ffffff"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Central Singularity Core -->
    <circle cx="256" cy="236" r="10" fill="url(#s2-center-core)"/>
    <circle cx="256" cy="236" r="3.5" fill="#ffffff"/>
  </g>
</svg>