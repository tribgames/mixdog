<!doctype html>
<html><head><meta charset="utf-8"><title>Mixdog logo v4 — modern</title>
<style>
  body { margin: 0; padding: 40px; background: #1b1b1b; color: #e9e9e9; font: 14px/1.5 "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 26px; }
  .card { background: #232323; border-radius: 14px; padding: 20px; display: grid; gap: 13px; }
  .row { display: flex; align-items: center; gap: 16px; }
  img.lg { width: 120px; height: 120px; }
  img.md { width: 40px; height: 40px; }
  img.sm { width: 20px; height: 20px; }
  .name { color: #bdbdbd; font-size: 12.5px; }
  .bar { display: flex; align-items: center; gap: 10px; background: #131313; border-radius: 8px; padding: 8px 12px; }
</style></head><body>
<h1>Mixdog logo v4 — 모던 앱아이콘 계열 (120 / 40 / 20)</h1>
<div class="grid">
<div class="card"><div class="row"><img class="lg" src="31-mesh-blue.svg"><div class="bar"><img class="md" src="31-mesh-blue.svg"><img class="sm" src="31-mesh-blue.svg"></div></div><span class="name">31 · Mesh — 블루/바이올렛 그라디언트 + 소프트 섀도</span></div>
<div class="card"><div class="row"><img class="lg" src="32-glass.svg"><div class="bar"><img class="md" src="32-glass.svg"><img class="sm" src="32-glass.svg"></div></div><span class="name">32 · Glass — 프로스트 글래스 레이어</span></div>
<div class="card"><div class="row"><img class="lg" src="33-raycast-red.svg"><div class="bar"><img class="md" src="33-raycast-red.svg"><img class="sm" src="33-raycast-red.svg"></div></div><span class="name">33 · Radial — Raycast풍 레드 라디얼 + 시엔</span></div>
<div class="card"><div class="row"><img class="lg" src="34-mono-minimal.svg"><div class="bar"><img class="md" src="34-mono-minimal.svg"><img class="sm" src="34-mono-minimal.svg"></div></div><span class="name">34 · Mono minimal — Vercel풍 초미니멀</span></div>
<div class="card"><div class="row"><img class="lg" src="35-aurora.svg"><div class="bar"><img class="md" src="35-aurora.svg"><img class="sm" src="35-aurora.svg"></div></div><span class="name">35 · Aurora — 블러 컬러 블롭 배경</span></div>
<div class="card"><div class="row"><img class="lg" src="36-metal.svg"><div class="bar"><img class="md" src="36-metal.svg"><img class="sm" src="36-metal.svg"></div></div><span class="name">36 · Metal — 메탈릭 글리프</span></div>
<div class="card"><div class="row"><img class="lg" src="37-duotone.svg"><div class="bar"><img class="md" src="37-duotone.svg"><img class="sm" src="37-duotone.svg"></div></div><span class="name">37 · Duotone — 하프 액센트 스플릿</span></div>
</div>
</body></html>
