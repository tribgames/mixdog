name: Stage mixdogd for every target
description: >-
  Downloads the mixdogd-<target> artifacts of mixdogd-build.yml and lays them out as
  native/core/target/<target>/release/mixdogd[.exe], where apps/desktop/scripts/stage-core.mjs
  takes them (it stages the app's own core and the four server cores, and fails naming
  any target that is missing).
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: mixdogd-*
        path: mixdogd-in
    - shell: bash
      run: |
        set -euo pipefail
        for dir in mixdogd-in/mixdogd-*; do
          target=${dir##*/mixdogd-}
          mkdir -p "native/core/target/$target/release"
          cp "$dir"/mixdogd* "native/core/target/$target/release/"
          chmod +x "native/core/target/$target/release"/mixdogd*
          echo "staged $target"
        done