name: desktop-runtime

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: prepare-runtime-${{ inputs.platform }}-${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    env:
      MIXDOG_RUNTIME_DEPENDENCY_CACHE: >-
        ${{ github.workspace }}/.cache/runtime-dependencies/${{ inputs.platform }}-${{ inputs.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Resolve runtime dependency cache key
        id: runtime-dependencies
        shell: bash
        run: |
          echo "key=$(node scripts/runtime-dependency-cache-key.mjs \
            --platform=${{ inputs.platform }} --arch=${{ inputs.arch }})" >> "$GITHUB_OUTPUT"
          echo "npm_key=$(node scripts/dependency-lock-cache-key.mjs \
            apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"
          # The three manifests leave hashFiles below and arrive as a
          # version-neutral digest: Deploy rewrites their version field before
          # this job runs, so keying on their raw bytes retired the prepared
          # runtime of all five platforms on every release.
          echo "manifest_key=$(node scripts/manifest-cache-key.mjs \
            package.json package-lock.json apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"
          echo "npm_cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore prepared runtime archive
        id: prepared-runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.runtime
          # Test sources never ship in the prepared runtime (package.json
          # `files` excludes them), so hashing them retired all five prepared
          # runtimes on every test-only change and paid the full 7-minute
          # rebuild for output that was byte-identical.
          key: desktop-prepared-runtime-v3-${{ steps.runtime-dependencies.outputs.key }}-${{ steps.runtime-dependencies.outputs.manifest_key }}-${{ hashFiles('README.md', 'NOTICE.md', 'LICENSES/**', 'scripts/**', '!scripts/*-test.mjs', '!scripts/*.test.mjs', '!scripts/*-bench.mjs', 'src/**', '!src/**/*.test.mjs', '!src/**/*.test.jsx', 'vendor/**', 'apps/desktop/scripts/prepare-runtime.mjs') }}
      - name: Restore stable desktop npm downloads
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.runtime-dependencies.outputs.npm_cache }}
          key: desktop-npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-dependencies.outputs.npm_key }}
      - name: Restore pruned runtime dependencies
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MIXDOG_RUNTIME_DEPENDENCY_CACHE }}
          key: desktop-${{ steps.runtime-dependencies.outputs.key }}
      - name: Install desktop dependencies
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: apps/desktop
      - name: Prepare platform runtime
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        shell: bash
        working-directory: apps/desktop
        run: |
          MIXDOG_RUNTIME_NPM_CACHE="$(npm config get cache)" \
          npm run prepare:runtime -- --platform=${{ inputs.platform }} --arch=${{ inputs.arch }}
      - name: Stage prepared platform runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-runtime-${{ inputs.platform }}-${{ inputs.arch }}
          path: apps/desktop/.runtime
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
