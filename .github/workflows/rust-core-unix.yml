name: Rust Core Unix

# WP-OWN's Unix job for native/core: the ownership/barrier/verdict/discovery unit tests, the
# composed-core tests over Postgres, and clippy, on Linux and macOS as a non-root user. Manual only until the schedule is decided (native/core/RELEASE.md).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-core-unix-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "3"
  RUST_TOOLCHAIN: "1.99.1"
  # Satisfies `^22.19.0 || >=24.0.0`; the same pin as apps/desktop/scripts/node-pin.json.
  NODE_VERSION: "22.19.0"

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: native/core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Run as a non-root user, with a job-unique TMPDIR
        run: |
          test "$(id -u)" != 0
          tmp="$RUNNER_TEMP/tmp-$GITHUB_JOB-${{ matrix.os }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$tmp"
          echo "TMPDIR=$tmp" >> "$GITHUB_ENV"

      - name: Unit tests
        run: "cargo test -p mixdog-app-server-daemon --lib -- ownership:: barrier:: verdict:: discovery::"

      # A text search's read of a FIFO, a socket or a terminal waits with poll beside its thread's interrupt, which its
      # cancel fires (no signal); reads that ignore the cancel are given up, a volume's within a stated bound, charged to
      # the mount they read on (mixdog-workspace localfs).
      - name: Search read cancel
        run: "cargo test -p mixdog-workspace --lib -- localfs::unix_io:: localfs::tests::a_producer_in_a_blocked_pipe_read localfs::tests::ten_thousand_reads localfs::tests::ten_thousand_searches_queued localfs::tests::nine_running_searches localfs::tests::a_search_past_the_queue_capacity"

      # The bundled Postgres runtime, from the release the manifest names (the same asset `ensure_runtime` would download), checked against the manifest's hash.
      - name: Postgres runtime
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *) echo "no runtime asset for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          manifest=../../src/runtime/memory/data/runtime-manifest.json
          url=$(node -p "require('./$manifest').assets['$platform'].url")
          sha=$(node -p "require('./$manifest').assets['$platform'].sha256")
          archive="$RUNNER_TEMP/pg-runtime.tar.gz"
          curl -fsSL "$url" -o "$archive"
          echo "$sha  $archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/pg-runtime"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pg-runtime"
          echo "MIXDOG_PG_RUNTIME=$RUNNER_TEMP/pg-runtime" >> "$GITHUB_ENV"

      # The nextest release the local runs use (`.config/nextest.toml` profiles), as its prebuilt binary.
      - name: cargo-nextest
        run: |
          case "$RUNNER_OS" in
            Linux) target=linux ;;
            macOS) target=mac ;;
          esac
          curl -fsSL "https://get.nexte.st/0.9.151/$target" | tar -xzf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # The core composed as the daemon composes it, stopped and composed again over one data directory:
      # the `pg` profile (the same command the merge check runs).
      - name: Composed core over Postgres
        timeout-minutes: 20
        run: cargo nextest run --profile pg --run-ignored only -p mixdog-app-server-daemon

      - name: Clippy
        run: cargo clippy -p mixdog-app-server-daemon --all-targets -- -D warnings

      # WP-INSTALL's slow test: the real trimmed staging and `npm ci`, then the pptxgenjs authoring entry and the skill scripts from
      # the payload under the pinned node.
      - name: Trimmed remote bundle (linux-x64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        working-directory: .
        timeout-minutes: 45
        env:
          MIXDOG_BUILD_SCRATCH: ${{ runner.temp }}/trimmed-bundle
        run: |
          npm ci
          cd apps/desktop
          npm run test:slow -- remote-trimmed-bundle.slow
