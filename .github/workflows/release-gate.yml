name: Release Gate

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "!.github/workflows/mobile-*.yml"
      - "!.github/workflows/*-health.yml"
      - "!.github/workflows/tidy-engines-mirror.yml"
      # Re-included after the exclusion above: the mobile workflows and their
      # Python scripts select only the mobile-scripts job (see `changes`).
      - ".github/workflows/mobile-*.yml"
      - "apps/mobile/scripts/**"
      - ".github/actions/**"
      - "apps/desktop/**"
      - "apps/relay/**"
      - "native/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "!.github/workflows/mobile-*.yml"
      - "!.github/workflows/*-health.yml"
      - "!.github/workflows/tidy-engines-mirror.yml"
      - ".github/workflows/mobile-*.yml"
      - "apps/mobile/scripts/**"
      - ".github/actions/**"
      - "apps/desktop/**"
      - "apps/relay/**"
      - "native/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node's postinstall only fetches the CUDA execution-provider
  # libraries from NuGet on linux/x64; the suites run the CPU provider, and a
  # connect timeout there failed `npm ci`. Other platforms ignore it.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    outputs:
      computer: ${{ steps.paths.outputs.computer }}
      desktop: ${{ steps.paths.outputs.desktop }}
      desktop_css_only: ${{ steps.paths.outputs.desktop_css_only }}
      graph: ${{ steps.paths.outputs.graph }}
      history: ${{ steps.paths.outputs.history }}
      mobile: ${{ steps.paths.outputs.mobile }}
      patch: ${{ steps.paths.outputs.patch }}
      relay: ${{ steps.paths.outputs.relay }}
      runtime: ${{ steps.paths.outputs.runtime }}
    steps:
      # Shallow: the selection below diffs two commits' trees, which needs the
      # base commit itself and no ancestry; it is fetched by SHA in the step.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select incremental gates
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push && "$ACTOR" == github-actions\[bot\] && "$HEAD_MESSAGE" =~ ^mixdog\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release workflow owns validation for this generated version commit."
            echo "computer=false" >> "$GITHUB_OUTPUT"
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "desktop_css_only=false" >> "$GITHUB_OUTPUT"
            echo "graph=false" >> "$GITHUB_OUTPUT"
            echo "history=false" >> "$GITHUB_OUTPUT"
            echo "mobile=false" >> "$GITHUB_OUTPUT"
            echo "patch=false" >> "$GITHUB_OUTPUT"
            echo "relay=false" >> "$GITHUB_OUTPUT"
            echo "runtime=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$PUSH_BASE
          if [[ "$EVENT_NAME" == pull_request ]]; then BASE=$PR_BASE; fi
          # A base that cannot be fetched (force-pushed away) falls through to
          # the full file list below, exactly as a missing base always has.
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then git fetch --no-tags --depth=1 origin "$BASE" || true; fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git ls-files > /tmp/changed
          else
            git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/changed
          fi
          # Gate selection patterns live in scripts/release-paths.mjs — the
          # single source shared with deploy.yml's criticalChanged list.
          DESKTOP_RE=$(node scripts/release-paths.mjs desktop-regex)
          RUNTIME_RE=$(node scripts/release-paths.mjs runtime-regex)
          PATCH_RE=$(node scripts/release-paths.mjs patch-regex)
          HISTORY_RE=$(node scripts/release-paths.mjs history-regex)
          MOBILE_RE=$(node scripts/release-paths.mjs mobile-regex)
          # A mobile workflow change selects the mobile gate only, never the
          # runtime lanes the `.github/workflows/` prefix would otherwise pull in.
          grep -Ev '^\.github/workflows/mobile-[^/]*\.yml$' /tmp/changed > /tmp/changed-runtime || true
          if grep -Eq "$DESKTOP_RE" /tmp/changed; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -s /tmp/changed ]] && ! grep -qvE '^apps/desktop/src/renderer/.*\.css$' /tmp/changed; then
            echo "desktop_css_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop_css_only=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^native/mixdog-graph/' /tmp/changed; then
            echo "graph=true" >> "$GITHUB_OUTPUT"
          else
            echo "graph=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq "$PATCH_RE" /tmp/changed; then
            echo "patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "patch=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^native/mixdog-computer/|^scripts/computer-backend-smoke\.mjs$|^src/runtime/computer-bridge/actions\.mjs$' /tmp/changed; then
            echo "computer=true" >> "$GITHUB_OUTPUT"
          else
            echo "computer=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^apps/relay/' /tmp/changed; then
            echo "relay=true" >> "$GITHUB_OUTPUT"
          else
            echo "relay=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq "$RUNTIME_RE" /tmp/changed-runtime; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq "$HISTORY_RE" /tmp/changed; then
            echo "history=true" >> "$GITHUB_OUTPUT"
          else
            echo "history=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq "$MOBILE_RE" /tmp/changed; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # The default lane is split across three legs (node --test --test-shard), so
  # its minutes of test time run side by side instead of in one job; each leg
  # repeats only the setup.
  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    # Job ceilings cut a hung step (a stalled apt mirror once held a job for
    # 30+ minutes) while leaving room for slow-but-progressing runs: a shard
    # has taken 460s and runtime-slow 794s on a slow LibreOffice install.
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Install fonts and LibreOffice for the Office suites
        uses: ./.github/actions/office-runtime
      # The tool-contract and shell-hardening suites drive the debug native
      # spawn binary; the build reuses the runner's preinstalled Rust toolchain.
      # An exact hit restores the compiled binary itself, so cargo (13-18s
      # even when its own cache was warm) does not run at all.
      - name: Cache the native spawn test binary
        id: spawn-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/mixdog-spawn/target/debug/mixdog-spawn
          key: spawn-test-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/mixdog-spawn/Cargo.lock', 'native/mixdog-spawn/Cargo.toml', 'native/mixdog-spawn/build.rs', 'native/mixdog-spawn/src/**') }}
      - name: Cache the native spawn test build
        if: steps.spawn-bin.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-spawn/target
          key: spawn-test-cargo-${{ runner.os }}-${{ hashFiles('native/mixdog-spawn/Cargo.lock', 'native/mixdog-spawn/src/**') }}
          restore-keys: spawn-test-cargo-${{ runner.os }}-
      - name: Build the native spawn test binary
        if: steps.spawn-bin.outputs.cache-hit != 'true'
        run: npm run build:spawn:test
      # Every *.test.mjs under src/ and scripts/ runs here by existing
      # (scripts/test.mjs); a suite that guards a contract cannot stay local.
      - name: Run the default test lane (shard ${{ matrix.shard }}/3)
        run: npm test -- --test-shard=${{ matrix.shard }}/3
      - name: Smoke apply_patch edits
        if: matrix.shard == 1
        run: npm run smoke:patch

  # Files over ~10s (*.slow.test.mjs) run beside the default lane, not inside
  # it, so the gate finishes at the longer of the two instead of their sum.
  # Split in two like the default lane: the slow files were the longest leg.
  runtime-slow:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Install fonts and LibreOffice for the Office suites
        uses: ./.github/actions/office-runtime
      # An exact hit restores the compiled binary itself, so cargo (13-18s
      # even when its own cache was warm) does not run at all.
      - name: Cache the native spawn test binary
        id: spawn-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/mixdog-spawn/target/debug/mixdog-spawn
          key: spawn-test-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/mixdog-spawn/Cargo.lock', 'native/mixdog-spawn/Cargo.toml', 'native/mixdog-spawn/build.rs', 'native/mixdog-spawn/src/**') }}
      - name: Cache the native spawn test build
        if: steps.spawn-bin.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-spawn/target
          key: spawn-test-cargo-${{ runner.os }}-${{ hashFiles('native/mixdog-spawn/Cargo.lock', 'native/mixdog-spawn/src/**') }}
          restore-keys: spawn-test-cargo-${{ runner.os }}-
      - name: Build the native spawn test binary
        if: steps.spawn-bin.outputs.cache-hit != 'true'
        run: npm run build:spawn:test
      - name: Run the slow test lane (shard ${{ matrix.shard }}/2)
        run: npm run test:slow -- --test-shard=${{ matrix.shard }}/2

  # The same default lane on macOS, where the CLI and desktop runtime ship as
  # well: platform branches (paths, shells, keychain, native assets) are only
  # exercised on the system they were written for.
  runtime-macos:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 20
    runs-on: macos-15
    # Sharded like the Linux runtime job: the unsharded lane was the gate's
    # critical path.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Install fonts and LibreOffice for the Office suites
        uses: ./.github/actions/office-runtime
      # An exact hit restores the compiled binary itself, so cargo (13-18s
      # even when its own cache was warm) does not run at all.
      - name: Cache the native spawn test binary
        id: spawn-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/mixdog-spawn/target/debug/mixdog-spawn
          key: spawn-test-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/mixdog-spawn/Cargo.lock', 'native/mixdog-spawn/Cargo.toml', 'native/mixdog-spawn/build.rs', 'native/mixdog-spawn/src/**') }}
      - name: Cache the native spawn test build
        if: steps.spawn-bin.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-spawn/target
          key: spawn-test-cargo-${{ runner.os }}-${{ hashFiles('native/mixdog-spawn/Cargo.lock', 'native/mixdog-spawn/src/**') }}
          restore-keys: spawn-test-cargo-${{ runner.os }}-
      - name: Build the native spawn test binary
        if: steps.spawn-bin.outputs.cache-hit != 'true'
        run: npm run build:spawn:test
      - name: Run the default test lane (shard ${{ matrix.shard }}/3)
        run: npm test -- --test-shard=${{ matrix.shard }}/3

  # The macOS/Linux Computer Use backend: unit tests on both systems, and on
  # Linux a real X11 session (Xvfb with a window manager) in which a GTK
  # dialog is driven end to end through the backend's line protocol.
  computer-backend:
    needs: changes
    if: needs.changes.outputs.computer == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.95.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-computer/target
          key: computer-cargo-${{ runner.os }}-${{ hashFiles('native/mixdog-computer/Cargo.lock', 'native/mixdog-computer/src/**') }}
          restore-keys: computer-cargo-${{ runner.os }}-
      - name: Unit tests
        run: cargo test --locked --manifest-path native/mixdog-computer/Cargo.toml
      - name: Install an X11 session with accessibility
        if: runner.os == 'Linux'
        run: |
          # Bounded and retried like the office-runtime action: a stuck mirror
          # must fail over, not hold the job.
          apt_retry() {
            local limit="$1" attempt
            shift
            for attempt in 1 2 3; do
              if sudo timeout -k 10 "$limit" apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; then
                return 0
              fi
              echo "apt-get $1 failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 5))
            done
            return 1
          }
          apt_retry 120 update -qq
          apt_retry 300 install -y -qq --no-install-recommends xvfb openbox zenity at-spi2-core libatk-adaptor dbus-x11 xinput
      - name: Drive a real X11 desktop through the backend
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --manifest-path native/mixdog-computer/Cargo.toml
          dbus-run-session -- bash -euc '
            Xvfb :99 -screen 0 1280x800x24 &
            export DISPLAY=:99
            sleep 1
            openbox &
            sleep 1
            node scripts/computer-backend-smoke.mjs native/mixdog-computer/target/release/mixdog-computer
          '

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      # This gate is selected by a broad path list, but the bundle's real inputs
      # are the desktop sources, its config, and the shared runtime. A change
      # anywhere else under src/ rebuilt a byte-identical bundle — Vite, daemon
      # bundle, and typecheck — on every push. Keying that work turns the repeat
      # into a lookup, and the release job restores whatever this run leaves
      # behind instead of building it a second time minutes later.
      #
      # A hit means these exact inputs already built and typechecked, which is
      # the same reasoning release.yml applies to its own copy of this key. The
      # CSS-only path never participates: it emits the renderer alone and would
      # publish a partial bundle under a full-build key.
      - name: Resolve version-neutral desktop cache key
        id: desktop-key
        if: needs.changes.outputs.desktop_css_only != 'true'
        shell: bash
        run: |
          echo "manifest=$(node scripts/manifest-cache-key.mjs \
            apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"
      - name: Reuse or warm the release desktop output cache
        id: desktop-out
        if: needs.changes.outputs.desktop_css_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/out
          key: >-
            desktop-out-v4-${{ steps.desktop-key.outputs.manifest }}-${{ hashFiles(
              'CHANGELOG.md',
              'changelog/*.md',
              'apps/desktop/package.json',
              'apps/desktop/src/**',
              '!apps/desktop/src/**/*.test.mjs',
              '!apps/desktop/src/**/*.test.jsx',
              'apps/desktop/electron.vite.config.ts',
              'apps/desktop/tsconfig*.json',
              'src/runtime/shared/**',
              '!src/runtime/shared/**/*.test.mjs'
            ) }}
      # The electron postinstall downloads its zip into this cache.
      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package-lock.json') }}
      # The two installs are independent trees (the desktop package has no
      # install scripts that read the root tree), so they run side by side; each
      # is waited on by its own PID so either failure fails the step. The CSS-only
      # path needs the desktop tree alone.
      - name: Install dependencies
        if: >-
          needs.changes.outputs.desktop_css_only == 'true'
          || steps.desktop-out.outputs.cache-hit != 'true'
        env:
          CSS_ONLY: ${{ needs.changes.outputs.desktop_css_only }}
        shell: bash
        run: |
          npm_ci() {
            local attempt
            for attempt in 1 2 3; do
              npm ci "$@" --prefer-offline --no-audit --no-fund && return 0
              echo "npm ci $* failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          npm_ci --prefix apps/desktop &
          desktop_pid=$!
          root_pid=
          if [[ "$CSS_ONLY" != true ]]; then
            npm_ci &
            root_pid=$!
          fi
          status=0
          wait "$desktop_pid" || status=1
          if [[ -n "$root_pid" ]]; then wait "$root_pid" || status=1; fi
          exit "$status"
      - name: Build CSS-only renderer
        if: needs.changes.outputs.desktop_css_only == 'true'
        run: npm run build:fast --prefix apps/desktop
        env:
          MIXDOG_ELECTRON_BUILD_TARGETS: renderer
      - name: Build desktop
        if: >-
          needs.changes.outputs.desktop_css_only != 'true'
          && steps.desktop-out.outputs.cache-hit != 'true'
        run: npm run build --prefix apps/desktop
      # The daemon end-to-end test boots the bundle this job just emitted; a
      # cache hit means the same bundle already passed it when it was built.
      - name: Verify the built daemon end to end
        if: >-
          needs.changes.outputs.desktop_css_only != 'true'
          && steps.desktop-out.outputs.cache-hit != 'true'
        run: npm run test:daemon:e2e --prefix apps/desktop

  # Every *.test.mjs under apps/desktop runs here by existing. git-cli owns
  # minutes of real git process work while the rest finishes in seconds, so
  # the slow lane (*.slow.test.mjs) is its own leg and the gate finishes at
  # the longer of the two instead of their sum.
  desktop-tests:
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true'
      && needs.changes.outputs.desktop_css_only != 'true'
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The fast lane is split in three (node --test --test-shard, forwarded
          # by scripts/test.mjs). Every leg is its own machine, so the
          # electron-lane files never overlap on one.
          - runner: ubuntu-22.04
            lane: fast
            shard: 1
          - runner: ubuntu-22.04
            lane: fast
            shard: 2
          - runner: ubuntu-22.04
            lane: fast
            shard: 3
          - runner: ubuntu-22.04
            lane: slow
          # Computer Use compiles and executes a generated PowerShell input
          # host, so its only real assertions skip on Linux. Without a Windows
          # leg the capability ships unverified.
          - runner: windows-latest
            lane: computer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Verify advisory file locks on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/test-direct.mjs \
            src/runtime/agent/orchestrator/tools/builtin/advisory-lock.test.mjs \
            src/runtime/agent/orchestrator/tools/builtin/advisory-lock.slow.test.mjs
      # The electron postinstall downloads its zip into this cache (the
      # Windows leg's lives under AppData).
      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package-lock.json') }}
      # The Computer Use suites import only node builtins and local .ts
      # modules, so the Windows leg skips the heavy root install
      # (sharp/onnxruntime/tesseract) — the slowest step on the slowest runner.
      # test-env.mjs treats a missing root tree as "nothing to compare".
      # The two installs are independent trees, so they run side by side; each
      # is waited on by its own PID so either failure fails the step.
      - name: Install dependencies
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          npm_ci() {
            local attempt
            for attempt in 1 2 3; do
              npm ci "$@" --prefer-offline --no-audit --no-fund && return 0
              echo "npm ci $* failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          npm_ci --prefix apps/desktop &
          desktop_pid=$!
          root_pid=
          if [[ "$LANE" != computer ]]; then
            npm_ci &
            root_pid=$!
          fi
          status=0
          wait "$desktop_pid" || status=1
          if [[ -n "$root_pid" ]]; then wait "$root_pid" || status=1; fi
          exit "$status"
      - name: Run the desktop fast lane (shard ${{ matrix.shard }}/3)
        if: matrix.lane == 'fast'
        shell: bash
        run: npm test --prefix apps/desktop -- --test-shard=${{ matrix.shard }}/3
      - name: Run the desktop slow lane
        if: matrix.lane == 'slow'
        shell: bash
        run: npm run test:slow --prefix apps/desktop
      # Locale catalogs are checked once, here, not during feature work.
      - name: Check locale catalogs
        if: matrix.lane == 'slow'
        run: npm run i18n:check --prefix apps/desktop
      - name: Run the Computer Use suites on Windows
        if: matrix.lane == 'computer'
        shell: bash
        run: |
          npm test --prefix apps/desktop -- src/main/computer/
          npm run test:slow --prefix apps/desktop -- src/main/computer/
          # Headless Linux Chrome has no hover pointer, so the hover-gated
          # reveal in this suite is only asserted here.
          npm run test:slow --prefix apps/desktop -- src/renderer/compact-chrome-layout.slow.test.mjs

  # Every *.test.mjs in the relay package runs here by existing
  # (scripts/test.mjs). These suites guard pairing, transport, static serving
  # and release verification, so they cannot stay a local-only run.
  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/relay/package-lock.json
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefix apps/relay --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Run the relay test lane
        run: npm test --prefix apps/relay

  patch:
    needs: changes
    if: needs.changes.outputs.patch == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.95.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-patch/target
          key: patch-test-cargo-1.95.0-${{ hashFiles('native/mixdog-patch/Cargo.lock', 'native/mixdog-patch/src/**') }}
          restore-keys: patch-test-cargo-1.95.0-
      - name: Install root dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Test and build the checked-out patch engine
        run: |
          cargo test --locked --manifest-path native/mixdog-patch/Cargo.toml
          cargo build --locked --manifest-path native/mixdog-patch/Cargo.toml
      - name: Verify the checked-out patch protocol and edits
        env:
          MIXDOG_PATCH_NATIVE_BIN: ${{ github.workspace }}/native/mixdog-patch/target/debug/mixdog-patch
        run: |
          npm test -- src/runtime/agent/orchestrator/tools/patch/
          npm run test:slow -- src/runtime/agent/orchestrator/tools/patch/patch-large-delete
          npm run test:native-edit-wire
          npm run smoke:patch

  graph:
    needs: changes
    if: needs.changes.outputs.graph == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.95.0"
      # The graph gate runs only when its sources changed, so the exact key
      # rarely hits; the prefix still restores the compiled dependency tree.
      - name: Cache the graph test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-graph/target
          key: graph-test-cargo-1.95.0-${{ hashFiles('native/mixdog-graph/Cargo.lock', 'native/mixdog-graph/src/**') }}
          restore-keys: graph-test-cargo-1.95.0-
      - run: cargo test --locked --manifest-path native/mixdog-graph/Cargo.toml

  # release.yml re-checks the committed shipped-definition history against the
  # git history of the definitions; a stale file used to surface only after the
  # whole deploy had started. build-shipped-history keeps the committed file
  # when the clone is shallow, so this job needs the full history (and no npm
  # install: the script imports node builtins and repo files only). Pull
  # requests are left out: the history holds one entry per commit that touched
  # a definition, so a PR that is squash-merged later would be checked against
  # intermediate commits that never reach main. The push to main is the final
  # history, and Deploy requires that run to be green.
  shipped-history:
    needs: changes
    if: needs.changes.outputs.history == 'true' && github.event_name != 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify shipped definition history is current
        run: node scripts/build-shipped-history.mjs --check

  # The mobile release scripts are Python with their own unittest suites,
  # which no Node lane discovers. They need the same packages the iOS
  # workflow installs (the certificate tests build real keys and .p12s).
  mobile-scripts:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the script dependencies
        run: python3 -m pip install --quiet --upgrade pyjwt "cryptography>=42"
      - name: Run the mobile script unit tests
        run: python3 -m unittest discover -s apps/mobile/scripts -p "test_*.py" -v

  complete:
    if: always()
    needs: [changes, runtime, runtime-slow, runtime-macos, computer-backend, desktop, desktop-tests, relay, patch, graph, shipped-history, mobile-scripts]
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
      - name: Require every selected gate
        env:
          CHANGES: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.runtime.result }}
          RUNTIME_SLOW: ${{ needs.runtime-slow.result }}
          RUNTIME_MACOS: ${{ needs.runtime-macos.result }}
          COMPUTER_BACKEND: ${{ needs.computer-backend.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DESKTOP_TESTS: ${{ needs.desktop-tests.result }}
          RELAY: ${{ needs.relay.result }}
          PATCH: ${{ needs.patch.result }}
          GRAPH: ${{ needs.graph.result }}
          SHIPPED_HISTORY: ${{ needs.shipped-history.result }}
          MOBILE_SCRIPTS: ${{ needs.mobile-scripts.result }}
        run: |
          [[ "$CHANGES" == success ]]
          [[ "$RUNTIME" == success || "$RUNTIME" == skipped ]]
          [[ "$RUNTIME_SLOW" == success || "$RUNTIME_SLOW" == skipped ]]
          [[ "$RUNTIME_MACOS" == success || "$RUNTIME_MACOS" == skipped ]]
          [[ "$COMPUTER_BACKEND" == success || "$COMPUTER_BACKEND" == skipped ]]
          [[ "$DESKTOP" == success || "$DESKTOP" == skipped ]]
          [[ "$DESKTOP_TESTS" == success || "$DESKTOP_TESTS" == skipped ]]
          [[ "$RELAY" == success || "$RELAY" == skipped ]]
          [[ "$PATCH" == success || "$PATCH" == skipped ]]
          [[ "$GRAPH" == success || "$GRAPH" == skipped ]]
          [[ "$SHIPPED_HISTORY" == success || "$SHIPPED_HISTORY" == skipped ]]
          [[ "$MOBILE_SCRIPTS" == success || "$MOBILE_SCRIPTS" == skipped ]]
