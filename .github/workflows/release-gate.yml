name: Release Gate

on:
  pull_request:
  push:
    branches: [main]
  # The full gate on main every night: the Rust core on the three systems, every lane, the reconciliation. A push and a pull request
  # run the core on Linux only (docs/testing.md, "Which run proves what").
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full_gate:
        description: "Run the full gate: the Rust core on Linux, macOS and Windows, every lane, and the reconciliation"
        required: false
        default: false
        type: boolean
  # The full-release gate. Every publication path calls this with the immutable commit it publishes (release.yml `coverage-gate`,
  # deploy.yml `coverage-gate`, tidy-engines-mirror.yml `coverage-gate`) and lists the call in its `needs`: a call is never made
  # for a branch name, and a run that is not for that commit proves nothing about it. A call runs every lane (the path selection
  # below is for pull requests) and ends in the reconciliation of what the lanes executed with what the tracked source defines
  # (scripts/ci/coverage/reconcile.mjs, job `complete`). docs/testing.md, "Release coverage".
  workflow_call:
    inputs:
      ref:
        description: "Immutable commit SHA to test; every checkout of this run is that commit"
        required: true
        type: string
      joins:
        description: "True only for a caller that checks, before any outward effect, the evidence of the prepared environments the gate's exceptions send cases to (release.yml prepared-runtime-join); any other caller's gate accepts no such promise"
        required: false
        default: false
        type: boolean
      gate:
        description: "The caller's name for this invocation; with the SHA it names every artifact of the gate, so two calls in one run never share one"
        required: true
        type: string

permissions:
  contents: read

# A pull request and a push supersede their own earlier runs; a manual run and a call are never cancelled by another run, whatever
# ref the caller is on.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-gate-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('release-gate-{0}', github.ref) || format('release-gate-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  GATE_KEY: ${{ inputs.gate }}-${{ inputs.ref || github.sha }}
  GATE_JOINS: ${{ inputs.joins && 'true' || 'false' }}
  GATE_NAME: ${{ inputs.gate }}
  # onnxruntime-node's postinstall only fetches the CUDA execution-provider
  # libraries from NuGet on linux/x64; the suites run the CPU provider, and a
  # connect timeout there failed `npm ci`. Other platforms ignore it.
  ONNXRUNTIME_NODE_INSTALL: skip

# The shape of this gate. The Rust core (native/core, 86 crates, ~15,900 tests) is the
# longest part, so it is built once per system and its tests run from that build in
# parallel legs:
#
#   changes ---> core-build-linux ---> core-tests-linux (N legs), core-list-linux, core-pg (a leg per profile), core-entry
#      +-------> core-build-macos ---> core-tests-macos (at most 3 legs), core-list-macos, core-pg-macos (both profiles)
#      +-------> core-build-windows -> core-tests-windows (N legs), core-list-windows
#      +-------> mixdogd-linux ---> core-entry, runtime-slow;  mixdogd-windows ---> desktop-computer
#      +--> core-lint (clippy, plain stable compile)   rustfmt   core-doctests   core-real (release mixdogd, node real-core tests)
#      +--> runtime, runtime-macos, desktop*, relay*, spawn, packages, patch, graph, ... (independent)
#
# A push and a pull request build and test on Linux only the crates the change can affect and the
# crates that depend on them (scripts/ci/core-select.mjs), a push against the last commit the core's
# jobs passed on (scripts/ci/core-base.mjs); the full gate (every gate call, the
# nightly run, a manual full_gate run) runs every crate on the three systems. The Rust jobs restore
# the compiled third-party dependencies from a cache that a build of every crate on main refreshes. The dev mixdogd is built on a
# runner of its own beside the archive, not after it: its feature set recompiles most of the
# workspace's crates anyway (12 of the 47 minutes of the Windows build when it ran after the
# archive). Each system's tests need only its own archive: a `needs` waits for every entry of a
# matrix, so one build matrix held every leg until the slowest system's archive was done.

jobs:
  changes:
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    # actions: read for the runs of this workflow a push selects against (the last commit the gate passed on).
    permissions:
      contents: read
      actions: read
    outputs:
      # A call (the full-release gate: `inputs.ref` is required there and empty for every other event) is a full run whatever the
      # selection step says, so no change to that step can turn the call's inventory and reconciliation off
      # (scripts/ci/coverage/wiring.mjs pins this expression).
      full: ${{ inputs.ref != '' && 'true' || steps.paths.outputs.full }}
      computer: ${{ steps.paths.outputs.computer }}
      desktop: ${{ steps.paths.outputs.desktop }}
      desktop_computer: ${{ steps.paths.outputs.desktop_computer }}
      desktop_css_only: ${{ steps.paths.outputs.desktop_css_only }}
      desktop_tests: ${{ steps.paths.outputs.desktop_tests }}
      browser_import: ${{ steps.paths.outputs.browser_import }}
      graph: ${{ steps.paths.outputs.graph }}
      mobile: ${{ steps.paths.outputs.mobile }}
      packages: ${{ steps.paths.outputs.packages }}
      patch: ${{ steps.paths.outputs.patch }}
      relay: ${{ steps.paths.outputs.relay }}
      runtime: ${{ steps.paths.outputs.runtime }}
      secure_desktop: ${{ steps.paths.outputs.secure_desktop }}
      window: ${{ steps.paths.outputs.window }}
      spawn: ${{ steps.paths.outputs.spawn }}
      core_scripts: ${{ steps.paths.outputs.core_scripts }}
      # The format check follows its files on every event; a full run (which requires every job) runs it whatever changed.
      rustfmt: ${{ (inputs.ref != '' || steps.paths.outputs.full == 'true') && 'true' || steps.paths.outputs.rustfmt }}
      # The source inventory runs on every run but the generated release commit's, whose validation the release owns.
      source_inventory: ${{ steps.paths.outputs.release_commit != 'true' }}
      lint_matrix: ${{ steps.core.outputs.lint_matrix || '{"include":[]}' }}
      core_doctests: ${{ steps.core.outputs.core_doctests || '[]' }}
      core_daemon: ${{ steps.core.outputs.core_daemon || 'false' }}
      core: ${{ steps.core.outputs.core || 'false' }}
      core_build: ${{ steps.core.outputs.core_build || 'false' }}
      core_scope: ${{ steps.core.outputs.core_scope }}
      core_archive_args: ${{ steps.core.outputs.core_archive_args }}
      core_features: ${{ steps.core.outputs.core_features }}
      # The selection resolved against the whole build (step `align`): what core-build archives and core-lint compiles.
      core_build_args: ${{ steps.align.outputs.packages }}
      core_build_features: ${{ steps.align.outputs.features }}
      core_filter: ${{ steps.core.outputs.core_filter }}
      core_pg: ${{ steps.core.outputs.core_pg || 'false' }}
      core_entry: ${{ steps.core.outputs.core_entry || 'false' }}
      core_pg_matrix: ${{ steps.core.outputs.core_pg_matrix || '{"include":[]}' }}
      core_pg_macos: ${{ steps.core.outputs.core_pg_macos || 'false' }}
      core_pg_macos_profiles: ${{ steps.core.outputs.core_pg_macos_profiles || '[]' }}
      # Empty only when the step did not run (a generated release commit, where no lane is selected): a discovery that fails fails `changes`.
      runtime_matrix: ${{ steps.shards.outputs.runtime_matrix || '{"include":[]}' }}
      runtime_excluded_path: ${{ steps.shards.outputs.runtime_excluded_path }}
      mixdogd_linux: ${{ steps.core.outputs.mixdogd_linux || 'false' }}
      mixdogd_windows: ${{ steps.core.outputs.mixdogd_windows || 'false' }}
      test_matrix_linux: ${{ steps.core.outputs.test_matrix_linux || '{"include":[]}' }}
      test_matrix_macos: ${{ steps.core.outputs.test_matrix_macos || '{"include":[]}' }}
      test_matrix_windows: ${{ steps.core.outputs.test_matrix_windows || '{"include":[]}' }}
      core_macos: ${{ steps.core.outputs.core_macos || 'false' }}
      core_windows: ${{ steps.core.outputs.core_windows || 'false' }}
      build_matrix_linux: ${{ steps.core.outputs.build_matrix_linux || '{"include":[]}' }}
      build_matrix_macos: ${{ steps.core.outputs.build_matrix_macos || '{"include":[]}' }}
      build_matrix_windows: ${{ steps.core.outputs.build_matrix_windows || '{"include":[]}' }}
      core_real_matrix: ${{ steps.core.outputs.core_real_matrix || '{"include":[]}' }}
      store_key_mixdogd_dev: ${{ steps.core.outputs.store_key_mixdogd_dev }}
      store_key_mixdogd: ${{ steps.core.outputs.store_key_mixdogd }}
      store_key_relay: ${{ steps.core.outputs.store_key_relay }}
    steps:
      # Shallow: the selection below diffs two commits' trees, which needs the
      # base commit itself and no ancestry; it is fetched by SHA in the step.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select incremental gates
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_GATE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_gate) }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push && "$ACTOR" == github-actions\[bot\] && "$HEAD_MESSAGE" =~ ^mixdog\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release workflow owns validation for this generated version commit."
            echo "release_commit=true" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
            for name in browser_import computer core_scripts desktop desktop_computer desktop_css_only desktop_tests graph mobile packages patch relay runtime rustfmt secure_desktop spawn window; do
              echo "${name}=false" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          # The full gate (a call, the nightly run, a manual run that asks for it) runs every lane on every system it is declared for,
          # and the reconciliation in `complete` then requires the evidence of all of them. A push runs every lane but the Rust core,
          # whose crates it selects as a pull request does, on Linux; a pull request runs the lanes its change can affect.
          if [[ "$FULL_GATE" == true ]]; then echo "full=true" >> "$GITHUB_OUTPUT"; else echo "full=false" >> "$GITHUB_OUTPUT"; fi
          BASE=$PUSH_BASE
          if [[ "$EVENT_NAME" == pull_request ]]; then BASE=$PR_BASE; fi
          # A push selects against the last commit the gate passed on for this branch, not the push's own parent: a newer push
          # cancels the run of an older one (concurrency above), and the older one's change would otherwise reach no run. No such
          # commit, or no answer, selects every file below.
          if [[ "$EVENT_NAME" == push ]]; then
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-gate.yml/runs?branch=$BRANCH&status=success&per_page=50" \
              --jq "[.workflow_runs[] | select(.event != \"pull_request\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\")][0].head_sha // \"\"") || BASE=""
            echo "Selecting against the last passed commit: ${BASE:-none}"
          fi
          # A base that cannot be fetched (force-pushed away) falls through to
          # the full file list below, exactly as a missing base always has.
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then git fetch --no-tags --depth=1 origin "$BASE" || true; fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git ls-files > /tmp/changed
          else
            # Both sides of a rename: a module moved out of a crate leaves that crate's #[path] or mod line behind.
            git diff --no-renames --name-only "$BASE" "$GITHUB_SHA" > /tmp/changed
          fi
          # A push selects the Rust core's crates against the last commit the core's jobs passed on (scripts/ci/core-base.mjs), which
          # a run that failed in another lane also is; no such commit, no answer, or one that cannot be fetched leaves the list above.
          cp /tmp/changed /tmp/changed-core
          if [[ "$EVENT_NAME" == push ]]; then
            CORE_BASE=$(node scripts/ci/core-base.mjs --repository "$GITHUB_REPOSITORY" --branch "$BRANCH") || CORE_BASE=""
            echo "Selecting the Rust core against the last commit its jobs passed on: ${CORE_BASE:-none}"
            if [[ -n "$CORE_BASE" && "$CORE_BASE" != "$BASE" ]] && git fetch --no-tags --depth=1 origin "$CORE_BASE" && git cat-file -e "${CORE_BASE}^{commit}" 2>/dev/null; then
              git diff --no-renames --name-only "$CORE_BASE" "$GITHUB_SHA" > /tmp/changed-core
            fi
          fi
          # Gate selection patterns (grep -E). deploy.yml's RELEASE_CRITICAL_PATHS
          # (native, scripts, src, packages, bin and the package manifests) is the
          # set of roots RUNTIME_RE selects from; keep the two in step.
          MANIFESTS='package\.json$|package-lock\.json$'
          # What every job that compiles or runs through this workflow consumes: the workflow itself and, for the jobs that build
          # Rust, the toolchain pin. The core's own jobs take both from core-select.mjs (WHOLE). A change to either selects each
          # such job (scripts/ci/release-gate-wiring.test.mjs runs this script over a table of paths).
          WORKFLOW='\.github/workflows/release-gate\.yml$'
          TOOLCHAIN='rust-toolchain\.toml$'
          CORE_WORKSPACE='native/core/Cargo\.(toml|lock)$'
          COMPUTER_HELPER='native/mixdog-computer/'
          STANDALONE_NEXTEST_CONFIG='native/\.config/nextest-standalone\.toml$'
          STANDALONE_NEXTEST_INPUTS="${TOOLCHAIN}|${WORKFLOW}|\.github/actions/install-nextest/action\.yml$|${STANDALONE_NEXTEST_CONFIG}"
          DESKTOP_RE="^(${WORKFLOW}|apps/desktop/|apps/mobile/src/|apps/relay/lib/(feedback-attachments|media-http|relay-close-codes)\.mjs$|native/core/|packages/|src/|vendor/|LICENSES/|README\.md$|NOTICE\.md$|CHANGELOG\.md$|changelog/[^/]*\.md$|${MANIFESTS}|scripts/(prune-desktop-runtime|prune-embedding-runtime|native-binary-arch|native-tool-download|runtime-dependency-cache-key)(\.test)?\.mjs$)"
          # The Rust toolchain pin is not here: it selects the Rust core's jobs (core-select.mjs), the only ones that
          # compile. bin/ is the npm launcher; its test is in the root lane.
          RUNTIME_RE="^(\.github/workflows/|native/|scripts/|src/|packages/|apps/mixdogd-npm/|bin/|benchmarks/terminal-bench-2\.1/analysis/|apps/mobile/fixtures/|${MANIFESTS})"
          # Native patch changes are tested from the checkout, not the published binary.
          PATCH_RE="^(native/mixdog-patch/|${STANDALONE_NEXTEST_INPUTS}|${MANIFESTS})"
          MOBILE_RE="^(apps/mobile/|\.github/workflows/release-gate\.yml$|\.github/workflows/mobile-[^/]*\.yml$)"
          # The protocol packages the desktop, the phone and the smokes import, and their own suites.
          PACKAGES_RE='^(packages/|apps/mixdogd-npm/|scripts/test-tsx\.mjs$|package(-lock)?\.json$|\.github/workflows/release-gate\.yml$)'
          # The core's process manager is the library of native/mixdog-spawn built through crates/mixdog-spawn; its
          # integration tests (the core-test feature) are in no other job. The core crates it compiles are listed: the
          # path dependencies of its manifest and their workspace dependencies (native/mixdog-spawn/Cargo.lock), the patched
          # vendor crates and the build script's dev_only.rs.
          SPAWN_CORE_CRATES='mixdog-(app-protocol|core-api|image-egress|js|protocol|rt|workspace-hack)'
          SPAWN_RE="^(native/mixdog-spawn/|${CORE_WORKSPACE}|native/core/crates/${SPAWN_CORE_CRATES}/|native/core/vendor/(icu_collator|regress)/|native/core/build-support/|apps/desktop/build/mixdog\.ico$|${STANDALONE_NEXTEST_INPUTS})"
          # What scripts/rust-core, benchmarks/token-lang and the terminal-bench harness's Rust-core suites test beyond the
          # crates' own suites (core-real runs them).
          # core-real also builds with the toolchain pin and the core's lockfile, and runs through this workflow.
          CORE_SCRIPTS_RE="^(scripts/rust-core/|benchmarks/token-lang/|benchmarks/terminal-bench-2\.1/harness/(anthropic_oauth_preflight_rust|prebake-rust)\.|${CORE_WORKSPACE}|${STANDALONE_NEXTEST_INPUTS})"
          # The relay jobs also follow the protocol packages the phone suite and the relay's clients import; relay-rust builds the
          # relay from the core's workspace with the toolchain pin.
          RELAY_RE="^(apps/relay/|apps/mobile/|apps/desktop/src/(renderer/remote-|shared/remote-)|packages/protocol(-client)?/|native/core/crates/(mixdog-relay|mixdog-remote)/|${TOOLCHAIN}|${CORE_WORKSPACE}|${WORKFLOW})"
          # Neither mobile workflows nor standalone nextest config are root runtime inputs.
          grep -Ev "^(\.github/workflows/mobile-[^/]*\.yml$|${STANDALONE_NEXTEST_CONFIG})" /tmp/changed > /tmp/changed-runtime || true
          flag() {
            if [[ "$EVENT_NAME" != pull_request ]]; then echo "$1=true" >> "$GITHUB_OUTPUT"; return; fi
            if grep -Eq "$2" "${3:-/tmp/changed}"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi
          }
          flag desktop "$DESKTOP_RE"
          flag desktop_computer "^(${COMPUTER_HELPER}|${TOOLCHAIN})"
          if [[ "$EVENT_NAME" == pull_request && -s /tmp/changed ]] && ! grep -qvE '^apps/desktop/src/renderer/.*\.css$' /tmp/changed; then
            echo "desktop_css_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop_css_only=false" >> "$GITHUB_OUTPUT"
          fi
          # The desktop's test legs run unless the change is renderer CSS alone.
          if [[ "$EVENT_NAME" != pull_request ]] || { grep -Eq "$DESKTOP_RE" /tmp/changed && { [[ ! -s /tmp/changed ]] || grep -qvE '^apps/desktop/src/renderer/.*\.css$' /tmp/changed; }; }; then
            echo "desktop_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop_tests=false" >> "$GITHUB_OUTPUT"
          fi
          flag graph "^(native/mixdog-graph/|${STANDALONE_NEXTEST_INPUTS})"
          flag browser_import "^(native/mixdog-browser-import/|${STANDALONE_NEXTEST_INPUTS})"
          flag secure_desktop "^(native/mixdog-secure-desktop/|${STANDALONE_NEXTEST_INPUTS})"
          flag window "^(native/mixdog-window/|${STANDALONE_NEXTEST_INPUTS})"
          flag patch "$PATCH_RE"
          flag computer "^(${COMPUTER_HELPER}|scripts/computer-backend-smoke\.mjs$|src/runtime/computer-bridge/actions\.mjs$|${STANDALONE_NEXTEST_INPUTS})"
          flag relay "$RELAY_RE"
          flag runtime "$RUNTIME_RE" /tmp/changed-runtime
          flag mobile "$MOBILE_RE"
          flag packages "$PACKAGES_RE"
          flag spawn "$SPAWN_RE"
          flag core_scripts "$CORE_SCRIPTS_RE"
          # What the format check formats or is configured by: every Rust source and manifest under native/ (the core, each
          # standalone tool, mixdog-browser-import's main.rs), the tree helper's workspace, the rustfmt the toolchain pins. Unlike
          # `flag`, on a push too: the format check follows its files on every event (a full run selects it in `changes.outputs`).
          RUSTFMT_RE="^(native/.*\.rs$|native/(.*/)?\.?rustfmt\.toml$|native/.*/Cargo\.toml$|native/[^/]+/Cargo\.lock$|scripts/rust-core/tree-helper/|${TOOLCHAIN}|${WORKFLOW})"
          if grep -Eq "$RUSTFMT_RE" /tmp/changed; then echo "rustfmt=true" >> "$GITHUB_OUTPUT"; else echo "rustfmt=false" >> "$GITHUB_OUTPUT"; fi

      # Which crates of the Rust core a change can affect, and the build and test
      # legs that follow (scripts/ci/core-select.mjs, with its own test). A push
      # and a pull request get the changed crates and everything that depends on
      # them; the full gate gets every crate. The metadata read is
      # `cargo metadata --no-deps`: no compilation; Cargo may populate its registry index.
      - name: Read the repository Rust toolchain
        id: rust-pin
        if: steps.paths.outputs.release_commit != 'true'
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.paths.outputs.release_commit != 'true'
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Select the Rust core's builds and tests
        id: core
        if: steps.paths.outputs.release_commit != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.ref != '' || steps.paths.outputs.full == 'true' }}
          # The runtime slow lane needs the dev programs; core-select adds them independently for the entry tests.
          MIXDOGD_DEV: ${{ steps.paths.outputs.runtime == 'true' }}
          # The Windows leg (desktop-computer) boots the built app against this run's Windows dev daemon.
          MIXDOGD_WINDOWS: ${{ steps.paths.outputs.desktop_tests == 'true' || steps.paths.outputs.desktop_computer == 'true' }}
          RUSTUP_TOOLCHAIN: ${{ steps.rust-pin.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--changed /tmp/changed-core --mixdogd-dev "$MIXDOGD_DEV" --mixdogd-windows "$MIXDOGD_WINDOWS")
          if [[ "$FULL" == true ]]; then args+=(--all); fi
          node scripts/ci/core-select.mjs "${args[@]}" | tee -a "$GITHUB_OUTPUT"
      # A partial selection (a push's or a pull request's crates) is resolved here, once, against the whole build: each round of
      # scripts/ci/core-align.mjs selects the workspace crates the last tree resolved otherwise, in either role (built for the host
      # or the target), with the features the whole gives them, until none is left; a round that changes nothing fails (a
      # third-party difference, the workspace hack's to close), so there is at most one round per workspace crate. Every job that
      # compiles the selection takes this result: core-build's archive and core-lint's plain stable compile. A whole one passes.
      - name: Resolve the selection against the whole build
        id: align
        if: steps.paths.outputs.release_commit != 'true' && steps.core.outputs.core_build == 'true'
        env:
          SCOPE: ${{ steps.core.outputs.core_scope }}
          SELECTION: ${{ steps.core.outputs.core_archive_args }}
          FEATURES: ${{ steps.core.outputs.core_features }}
          RUSTUP_TOOLCHAIN: ${{ steps.rust-pin.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SCOPE" != packages ]]; then
            printf 'packages=%s\nfeatures=%s\n' "$SELECTION" "$FEATURES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          features=()
          if [[ -n "$FEATURES" ]]; then features=(--features "$FEATURES"); fi
          cd native/core
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/members.json"
          cargo tree --locked --color never --charset utf8 -f '{p} {f}' --workspace "${features[@]}" > "$RUNNER_TEMP/tree-whole.txt"
          select=$SELECTION
          tree=()
          selection_features=$FEATURES
          last=""
          while true; do
            node ../../scripts/ci/core-align.mjs args --packages "$select" "${tree[@]}" --metadata "$RUNNER_TEMP/members.json" --whole "$RUNNER_TEMP/tree-whole.txt" --features "$selection_features" > "$RUNNER_TEMP/align.txt"
            packages=$(sed -n 's/^packages=//p' "$RUNNER_TEMP/align.txt")
            selection_features=$(sed -n 's/^features=//p' "$RUNNER_TEMP/align.txt")
            if [[ "$packages|$selection_features" == "$last" ]]; then
              node ../../scripts/ci/core-align.mjs check --whole "$RUNNER_TEMP/tree-whole.txt" --tree "$RUNNER_TEMP/tree-selection.txt" || true
              echo "::error::the selection resolves the crates above otherwise and no workspace crate is left to select"
              exit 1
            fi
            last="$packages|$selection_features"
            # shellcheck disable=SC2086
            cargo tree --locked --color never --charset utf8 -f '{p} {f}' $packages --features "$selection_features" > "$RUNNER_TEMP/tree-selection.txt"
            if node ../../scripts/ci/core-align.mjs check --whole "$RUNNER_TEMP/tree-whole.txt" --tree "$RUNNER_TEMP/tree-selection.txt"; then break; fi
            select=$packages
            tree=(--tree "$RUNNER_TEMP/tree-selection.txt")
          done
          cat "$RUNNER_TEMP/align.txt" >> "$GITHUB_OUTPUT"

      # The shards of the root default Node lane (scripts/ci/node-shards.mjs, sized by the number of test files the lane
      # discovers). Discovery needs no install: this checkout has no node_modules to walk.
      # scripts/test.mjs globs with node:fs/promises `glob` (Node 22): the runner image's own node is older.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.paths.outputs.release_commit != 'true'
        with:
          node-version: "22"
      - name: Size the runtime lane's shards
        id: shards
        if: steps.paths.outputs.release_commit != 'true'
        env:
          FULL_COVERAGE: ${{ inputs.ref != '' || steps.paths.outputs.full == 'true' }}
          PROTOCOL_IN_PACKAGES: ${{ steps.paths.outputs.packages == 'true' || steps.paths.outputs.relay == 'true' || steps.paths.outputs.desktop_tests == 'true' }}
        # An explicit bash runs with pipefail: a discovery that dies must not be hidden by the tee.
        shell: bash
        run: node scripts/ci/node-shards.mjs | tee -a "$GITHUB_OUTPUT"

      # Deploy refuses to reuse the published voice runtime once its build
      # inputs changed without a runtimeVersion bump; catch that on push.
      - name: Verify the voice runtime build inputs match the published runtime
        run: node scripts/check-voice-runtime-inputs.mjs

      # A tracked file that carries a developer-machine path (a build checkout, a project checkout, a user profile)
      # leaks the author's layout into the public repository and the npm package. Reads the tracked files, so it
      # needs no install; it runs on every event, release commits included.
      - name: Check the tracked files for developer-machine paths
        run: node scripts/check-machine-paths.mjs

      # The gate runs on this clean checkout. A tracked file that .gitignore also covers is not in a clean checkout of the change,
      # so a tracked Node test that reads one passes in the working tree that has it and fails here, or, when it skips a missing
      # file, passes without testing: this names it before any lane runs. Every event.
      #
      # Advisory, like the scan below: it reads source text, so a path built at run time is invisible to it and a read it flags may
      # be harmless. The guarantee is the clean-checkout run of every lane plus the skip enforcement (check-skips.mjs): a test that
      # needs an absent file fails there or is a reviewed skip. Hits become warnings and never fail the job (docs/testing.md, "What
      # each layer guarantees"). `--build` in core-build and core-lint is not a scan of source: it fails on the files themselves.
      - name: Point at tracked scripts that read files a clean checkout lacks
        continue-on-error: true
        run: node scripts/ci/check-clean-checkout.mjs --readers

      # Advisory: a test that returns early passes without testing and no runner reports it (docs/testing.md, "What each layer
      # guarantees"). Hits become warnings; the step never fails the job.
      - name: Point at tests that return early without reporting a skip
        continue-on-error: true
        run: node scripts/ci/scan-silent-returns.mjs

  # The denominator of the release proof: every case the tracked source of the exact commit defines (scripts/ci/coverage/inventory.mjs),
  # from `git ls-files` and the syntax of the files, never from a lane's arguments or a run. HEAD must equal the commit this run is for
  # and the tree must be clean. Any unassigned test file, unrouted case, or registration that cannot be named exactly fails the job:
  # the manifest is written only when there is none. Runs on every run, a pull request and a push included (an orphan test source,
  # a `tests/x.rs` no `mod` line reaches under `autotests = false`, fails here at once); only a full run reconciles against it.
  inventory:
    needs: changes
    if: needs.changes.outputs.source_inventory == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    env:
      EXPECTED_SHA: ${{ inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: package-lock.json
      # The scanners parse the sources with acorn and esbuild (the root package's own installed packages); nothing runs a test.
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Build the inventory of the commit
        run: node scripts/ci/coverage/cli.mjs inventory --root . --sha "$EXPECTED_SHA" --out "$RUNNER_TEMP/coverage/manifest.json" --report "$RUNNER_TEMP/coverage/errors.json"
      - name: Upload the manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-manifest-${{ env.GATE_KEY }}
          overwrite: true
          path: ${{ runner.temp }}/coverage/manifest.json
          if-no-files-found: error
          retention-days: 14
      # Diagnostics only: the verdict is the step above.
      - name: Upload the inventory report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-inventory-errors-${{ env.GATE_KEY }}
          overwrite: true
          path: ${{ runner.temp }}/coverage/errors.json
          if-no-files-found: ignore
          retention-days: 14

  # The default Node lane (about 160 files, a few minutes on one runner). One job per system:
  # the lane is short beside the Rust core's build, which is the gate's critical path, and each
  # shard pays its own install and font setup (on macOS, ten times the Linux rate for it). The
  # Incremental Linux runs may shard by file count; full runs keep the one
  # stable Linux leg named by the coverage plan. macOS stays whole.
  runtime:
    name: runtime (shard ${{ matrix.shard }}/${{ matrix.of }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    # Job ceilings cut a hung step while leaving room for slow-but-progressing runs.
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/root-fast/${{ matrix.shard }}of${{ matrix.of }}
      MIXDOG_LEG_OS: linux
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.runtime_matrix) }}
    steps:
      # Full history: the usage ledger's compatibility tests load older
      # builds' sources from pinned commits with `git show`. blob:none keeps
      # the download to commits and trees; `git show` fetches the few blobs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: package-lock.json
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      # scripts/verify-runtime-dependency-versions.test.mjs reads @electron/asar from apps/desktop and skips without it: install that
      # package alone (its 16-package closure from apps/desktop/package-lock.json), not the desktop tree.
      - name: Install @electron/asar for the runtime dependency version suite
        shell: bash
        run: |
          node scripts/ci/lock-subset.mjs ci-asar-subset --from apps/desktop @electron/asar
          for attempt in 1 2 3; do
            npm ci --prefix ci-asar-subset --ignore-scripts --prefer-offline --no-audit --no-fund && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          mkdir -p apps/desktop
          cp -R ci-asar-subset/node_modules apps/desktop/node_modules
          test -f apps/desktop/node_modules/@electron/asar/package.json      # Only the fonts: src/runtime/office/pptx-chart-styling.test.mjs measures text in
      # the deck's own faces through the system's fonts (Liberation for Arial, Carlito for
      # Calibri, NanumGothic for Hangul), and the Noto faces come from the runtime's own
      # provisioner. No root test renders through LibreOffice (the Office engine is Rust
      # now), so it is not installed.
      - name: Install the fonts the Office text-metrics suites measure in
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sudo timeout -k 10 300 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends fonts-liberation fonts-crosextra-carlito fonts-nanum; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "font install failed (attempt ${attempt}/3)" >&2
            sudo timeout -k 10 120 apt-get -o Acquire::Retries=2 update -qq || true
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            node --input-type=module <<'NODE' && exit 0
          import { NOTO_FONT_DEFINITIONS, prepareOfficeFonts } from './src/runtime/office/portable/font-provisioner.mjs';
          const ids = new Set(['noto-sans-latin', 'noto-sans-kr', 'noto-sans-jp']);
          const results = await prepareOfficeFonts({ targets: NOTO_FONT_DEFINITIONS.filter((font) => ids.has(font.id)) });
          console.log(JSON.stringify(results, null, 2));
          if (!Object.values(results).every((font) => font.installed)) process.exit(1);
          NODE
            echo "Noto font provisioning failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      # Every *.test.mjs under src/ and scripts/ runs here by existing
      # (scripts/test.mjs), except scripts/rust-core (EXCLUDED_PATHS there, in every
      # lane, the slow one too): those need a built mixdogd, the process-tree helper
      # or cargo, and run in core-real.
      - name: Run the default test lane (shard ${{ matrix.shard }}/${{ matrix.of }})
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/runtime.json
          # When packages is skipped on a PR, this lane still owns these tests.
          EXCLUDED_PATH: ${{ needs.changes.outputs.runtime_excluded_path }}
        run: |
          args=(--test-shard=${{ matrix.shard }}/${{ matrix.of }})
          if [[ -n "$EXCLUDED_PATH" ]]; then
            args+=(--exclude-path "$EXCLUDED_PATH")
          fi
          npm test -- "${args[@]}"
      # The page script tests of the Office author crate sit outside every discovery root of scripts/test.mjs, so they are named.
      - name: Run the Office page script tests
        if: matrix.shard == 1
        env:
          MIXDOG_SLOT: office-page
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/office-page.json
        run: node scripts/ci/node-runner.mjs native/core/crates/mixdog-office-author/assets/page/*.test.mjs
      # A skipped or todo test outside scripts/ci/coverage/exceptions.json fails the job (check-skips.mjs): on a clean checkout a test that
      # skips because its material is absent would otherwise be green and test nothing.
      - name: Check that no test of the root default lane skipped outside the reviewed list
        env:
          RECEIPTS: ${{ runner.temp }}/receipts
          SHARD: ${{ matrix.shard }}
        run: |
          receipts=("$RECEIPTS/runtime.json")
          if [[ "$SHARD" == 1 ]]; then receipts+=("$RECEIPTS/office-page.json"); fi
          node scripts/ci/check-skips.mjs receipts "${receipts[@]}"
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-root-fast-${{ matrix.shard }}of${{ matrix.of }}

  # Files over ~10s (*.slow.test.mjs) run beside the default lane, not inside
  # it, so the gate finishes at the longer of the two instead of their sum.
  runtime-slow:
    # The mixdogd-linux job leaves the three programs scripts/check-npm-packages.slow.test.mjs starts.
    needs: [changes, mixdogd-linux]
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/root-slow/1of1
      MIXDOG_LEG_OS: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: package-lock.json
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mixdogd-dev-${{ env.GATE_KEY }}
          path: native-dev
      - name: Run the slow test lane
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/runtime-slow.json
          MIXDOG_TEST_NATIVE_DIR: ${{ github.workspace }}/native-dev
        run: |
          chmod +x native-dev/mixdog native-dev/mixdogd native-dev/mixdog-askpass
          npm run test:slow
      # A skipped or todo test outside scripts/ci/coverage/exceptions.json fails the job (check-skips.mjs): on a clean checkout a test that
      # skips because its material is absent would otherwise be green and test nothing.
      - name: Check that no test of the root slow lane skipped outside the reviewed list
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/runtime-slow.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-root-slow-1of1

  # The same default lane on macOS, where the CLI and desktop runtime ship as
  # well: platform branches (paths, shells, keychain, native assets) are only
  # exercised on the system they were written for.
  runtime-macos:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 20
    runs-on: macos-15
    env:
      MIXDOG_LEG: macos/root-fast/1of1
      MIXDOG_LEG_OS: macos
    steps:
      # Full history, as in the Linux runtime job.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: package-lock.json
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      # scripts/verify-runtime-dependency-versions.test.mjs reads @electron/asar from apps/desktop and skips without it: install that
      # package alone (its 16-package closure from apps/desktop/package-lock.json), not the desktop tree.
      - name: Install @electron/asar for the runtime dependency version suite
        shell: bash
        run: |
          node scripts/ci/lock-subset.mjs ci-asar-subset --from apps/desktop @electron/asar
          for attempt in 1 2 3; do
            npm ci --prefix ci-asar-subset --ignore-scripts --prefer-offline --no-audit --no-fund && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          mkdir -p apps/desktop
          cp -R ci-asar-subset/node_modules apps/desktop/node_modules
          test -f apps/desktop/node_modules/@electron/asar/package.json      # Calibri's metric-compatible face; macOS ships Arial and the others itself.
      - name: Install the fonts the Office text-metrics suites measure in
        shell: bash
        run: |
          for attempt in 1 2 3; do
            brew install --cask font-carlito && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "font-carlito install failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            node --input-type=module <<'NODE' && exit 0
          import { NOTO_FONT_DEFINITIONS, prepareOfficeFonts } from './src/runtime/office/portable/font-provisioner.mjs';
          const ids = new Set(['noto-sans-latin', 'noto-sans-kr', 'noto-sans-jp']);
          const results = await prepareOfficeFonts({ targets: NOTO_FONT_DEFINITIONS.filter((font) => ids.has(font.id)) });
          console.log(JSON.stringify(results, null, 2));
          if (!Object.values(results).every((font) => font.installed)) process.exit(1);
          NODE
            echo "Noto font provisioning failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Run the default test lane
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/runtime-macos.json
        run: npm test
      # A skipped or todo test outside scripts/ci/coverage/exceptions.json fails the job (check-skips.mjs): on a clean checkout a test that
      # skips because its material is absent would otherwise be green and test nothing.
      - name: Check that no test of the root default lane (macOS) skipped outside the reviewed list
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/runtime-macos.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: macos-root-fast-1of1

  # The macOS/Linux Computer Use backend: unit tests on both systems, and on
  # Linux a real X11 session (Xvfb with a window manager) in which a GTK
  # dialog is driven end to end through the backend's line protocol.
  computer-backend:
    needs: changes
    if: needs.changes.outputs.computer == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    env:
      MIXDOG_LEG: ${{ format('{0}/computer/1of1', startsWith(matrix.runner, 'ubuntu') && 'linux' || startsWith(matrix.runner, 'macos') && 'macos' || 'windows') }}
      MIXDOG_LEG_OS: ${{ startsWith(matrix.runner, 'ubuntu') && 'linux' || startsWith(matrix.runner, 'macos') && 'macos' || 'windows' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      # Restored by every run, saved by a push or a manual run only: a pull request never writes a copy of its own.
      - name: Restore the compiled Computer Use backend
        id: computer-cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-computer/target
          # The lockfile (the dependencies) is in every key; only the crate's own sources may differ in a fallback.
          key: computer-cargo-${{ runner.os }}-${{ hashFiles('native/mixdog-computer/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('native/mixdog-computer/src/**') }}
          restore-keys: computer-cargo-${{ runner.os }}-${{ hashFiles('native/mixdog-computer/Cargo.lock', 'rust-toolchain.toml') }}-
      # Every standalone Rust test step runs through scripts/ci/run-nextest.mjs: its receipt records each terminal testcase of nextest's
      # JUnit report by binary and full test path, plus the ignore dispositions of the unfiltered listing, and the check after it fails a
      # damaged receipt and a skip with no exact reviewed exception (scripts/ci/coverage/exceptions.json).
      - uses: ./.github/actions/install-nextest
      - name: Unit tests
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/computer.json
        run: node scripts/ci/run-nextest.mjs --junit native/mixdog-computer/target/nextest/ci/junit.xml --list -- --manifest-path native/mixdog-computer/Cargo.toml --locked --config-file native/.config/nextest-standalone.toml --profile ci -- --no-tests=fail
      - name: Check that no ignored test of the Computer Use backend is unreviewed
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/computer.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Install an X11 session with accessibility
        if: runner.os == 'Linux'
        run: |
          # Bounded and retried like the office-runtime action: a stuck mirror
          # must fail over, not hold the job.
          apt_retry() {
            local limit="$1" attempt
            shift
            for attempt in 1 2 3; do
              if sudo timeout -k 10 "$limit" apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; then
                return 0
              fi
              echo "apt-get $1 failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 5))
            done
            return 1
          }
          apt_retry 120 update -qq
          apt_retry 300 install -y -qq --no-install-recommends xvfb openbox zenity at-spi2-core libatk-adaptor dbus-x11 xinput
      - name: Drive a real X11 desktop through the backend
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --manifest-path native/mixdog-computer/Cargo.toml
          dbus-run-session -- bash -euc '
            Xvfb :99 -screen 0 1280x800x24 &
            export DISPLAY=:99
            sleep 1
            openbox &
            sleep 1
            node scripts/computer-backend-smoke.mjs native/mixdog-computer/target/release/mixdog-computer
          '
      - name: Save the compiled Computer Use backend
        if: github.event_name != 'pull_request' && steps.computer-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-computer/target
          key: ${{ steps.computer-cargo.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: ${{ format('{0}-computer-1of1', startsWith(matrix.runner, 'ubuntu') && 'linux' || startsWith(matrix.runner, 'macos') && 'macos' || 'windows') }}

  # Also built for a helper-only change: the Windows boot test in desktop-computer runs the bundle this job leaves.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop_computer == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      # This gate is selected by a broad path list, but the bundle's real inputs
      # are the desktop sources, its config, and the shared runtime. A change
      # anywhere else under src/ rebuilt a byte-identical bundle — Vite, daemon
      # bundle, and typecheck — on every push. Keying that work turns the repeat
      # into a lookup, and the release job restores whatever this run leaves
      # behind instead of building it a second time minutes later.
      #
      # A hit means these exact inputs already built and typechecked, which is
      # the same reasoning release.yml applies to its own copy of this key. The
      # CSS-only path never participates: it emits the renderer alone and would
      # publish a partial bundle under a full-build key.
      - name: Resolve version-neutral desktop cache key
        id: desktop-key
        if: needs.changes.outputs.desktop_css_only != 'true'
        shell: bash
        run: |
          manifest=$(node scripts/manifest-cache-key.mjs package-lock.json apps/desktop/package-lock.json)
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      # Restored by every run; saved (below, once the build succeeded) by a push or a manual run only, so a pull
      # request never leaves a copy of its own in the repository's cache budget.
      - name: Reuse the release desktop output cache
        id: desktop-out
        if: needs.changes.outputs.desktop_css_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/out
          key: >-
            desktop-out-v8-${{ steps.desktop-key.outputs.manifest }}-${{ hashFiles(
              'CHANGELOG.md',
              'changelog/*.md',
              'apps/desktop/package.json',
              'apps/desktop/src/**',
              'apps/desktop/scripts/**',
              'apps/desktop/electron.vite.config.ts',
              'apps/desktop/tsconfig*.json',
              'apps/mobile/src/**',
              'apps/relay/lib/feedback-attachments.mjs',
              'apps/relay/lib/media-http.mjs',
              'apps/relay/lib/relay-close-codes.mjs',
              'packages/**',
              'src/**',
              '!**/*.test.mjs',
              '!**/*.test.ts',
              '!**/*.test.tsx',
              '!**/*.test.jsx'
            ) }}
      # The two installs are independent trees (the desktop package has no
      # install scripts that read the root tree), so they run side by side; each
      # is waited on by its own PID so either failure fails the step. CSS-only
      # still bundles the renderer's shared imports, but needs no root install scripts.
      - name: Install dependencies
        if: >-
          needs.changes.outputs.desktop_css_only == 'true'
          || steps.desktop-out.outputs.cache-hit != 'true'
        env:
          CSS_ONLY: ${{ needs.changes.outputs.desktop_css_only }}
        shell: bash
        run: |
          npm_ci() {
            local attempt
            for attempt in 1 2 3; do
              npm ci "$@" --prefer-offline --no-audit --no-fund && return 0
              echo "npm ci $* failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          npm_ci --prefix apps/desktop &
          desktop_pid=$!
          root_args=()
          if [[ "$CSS_ONLY" == true ]]; then root_args+=(--ignore-scripts); fi
          npm_ci "${root_args[@]}" &
          root_pid=$!
          status=0
          wait "$desktop_pid" || status=1
          wait "$root_pid" || status=1
          exit "$status"
      - name: Build CSS-only renderer
        if: needs.changes.outputs.desktop_css_only == 'true'
        run: npm run build:fast --prefix apps/desktop
        env:
          MIXDOG_ELECTRON_BUILD_TARGETS: renderer
      - name: Select regressions that read changed renderer CSS
        id: css-tests
        if: needs.changes.outputs.desktop_css_only == 'true'
        shell: bash
        working-directory: apps/desktop
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CSS_TEST_FILES: ${{ runner.temp }}/css-test-files.txt
        run: |
          git fetch --no-tags --depth=1 origin "$PR_BASE"
          git diff --no-renames --name-only -z --relative "$PR_BASE" HEAD -- src/renderer |
            node ../../scripts/ci/renderer-css-tests.mjs > "$CSS_TEST_FILES"
          if [[ -s "$CSS_TEST_FILES" ]]; then
            printf 'files=%s\n' "$CSS_TEST_FILES" >> "$GITHUB_OUTPUT"
          fi
      - name: Run selected CSS regressions
        if: steps.css-tests.outputs.files != ''
        shell: bash
        working-directory: apps/desktop
        env:
          CSS_TEST_FILES: ${{ steps.css-tests.outputs.files }}
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/css-regressions.json
        run: |
          mapfile -t files < "$CSS_TEST_FILES"
          node ../../scripts/test.mjs --import ./scripts/test-env.mjs --import ./scripts/test-tsx.mjs \
            --lane all --exclude-lane live --exclude-lane electron --expose-gc "${files[@]}"
      - name: Require the CSS regression receipt
        if: steps.css-tests.outputs.files != ''
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/css-regressions.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Build desktop
        if: >-
          needs.changes.outputs.desktop_css_only != 'true'
          && steps.desktop-out.outputs.cache-hit != 'true'
        run: npm run build --prefix apps/desktop
      - name: Save the release desktop output
        if: >-
          github.event_name != 'pull_request'
          && needs.changes.outputs.desktop_css_only != 'true'
          && steps.desktop-out.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/out
          key: ${{ steps.desktop-out.outputs.cache-primary-key }}
      # The Windows app-start boot (desktop-computer) runs this exact bundle rather than building it again.
      - name: Hand the desktop output to the Windows boot
        if: needs.changes.outputs.desktop_css_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-out-${{ env.GATE_KEY }}
          overwrite: true
          path: apps/desktop/out
          retention-days: 1
          if-no-files-found: error

  # Every *.test.mjs under apps/desktop runs here by existing. The fast lane is
  # split in three; the slow lane (*.slow.test.mjs, git-cli owns minutes of real
  # git process work) is its own job (desktop-slow), also in three shards; the gate finishes at the longest of them.
  # Depends on nothing a producer builds, so its receipts do not wait on or die with the Windows boot's inputs (desktop-computer).
  desktop-tests:
    needs: changes
    if: needs.changes.outputs.desktop_tests == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/desktop-fast/${{ matrix.shard }}of3
      MIXDOG_LEG_OS: linux
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      # `npm test` of the desktop runs a `pretest` that builds mixdog_main_native.node with cargo (native/mixdog-main-native, the
      # Browser Use URL and redaction rules); redaction.test.mjs and url-policy.test.mjs skip without it. The repository's pinned
      # toolchain builds it, the same as every other job.
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      # The install step downloads the Electron zip into this cache (the
      # Windows leg's lives under AppData). Every run restores it; a push or a manual run saves it (last step).
      - name: Resolve Electron download key
        id: electron-key
        shell: bash
        run: |
          key=$(node scripts/dependency-lock-cache-key.mjs apps/desktop/package-lock.json)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the Electron download
        id: electron
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron-key.outputs.key }}
      # The two installs are independent trees, so they run side by side; each
      # is waited on by its own PID so either failure fails the step.
      - name: Install dependencies
        shell: bash
        run: |
          npm_ci() {
            local attempt
            for attempt in 1 2 3; do
              npm ci "$@" --prefer-offline --no-audit --no-fund && return 0
              echo "npm ci $* failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          # Electron 42+ has no install script: fetch its binary once here so
          # parallel test files never race to download it on first use.
          { npm_ci --prefix apps/desktop && node apps/desktop/node_modules/electron/install.js; } &
          desktop_pid=$!
          npm_ci &
          root_pid=$!
          status=0
          wait "$desktop_pid" || status=1
          wait "$root_pid" || status=1
          exit "$status"
      - name: Restore the compiled main native module
        id: main-native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-main-native/target
          key: main-native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-main-native/Cargo.lock', 'native/mixdog-main-native/Cargo.toml', 'native/mixdog-main-native/.cargo/config.toml') }}-${{ hashFiles('native/mixdog-main-native/src/**', 'native/core/crates/mixdog-browser-rules/**', 'native/core/crates/mixdog-js/**', 'native/core/vendor/icu_collator/**', 'native/core/Cargo.toml') }}
          restore-keys: main-native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-main-native/Cargo.lock', 'native/mixdog-main-native/Cargo.toml', 'native/mixdog-main-native/.cargo/config.toml') }}-
      - name: Run the desktop fast lane (shard ${{ matrix.shard }}/3)
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/desktop-fast.json
        # --expose-gc: two session-lane suites measure retention with globalThis.gc and skip without it.
        run: npm test --prefix apps/desktop -- --expose-gc --test-shard=${{ matrix.shard }}/3 --exclude-path src/main/protocol/event-loop-lag.test.mjs
      # The main-loop bound of event-loop-lag.test.mjs is wall time: beside the shard's other test processes, the time the OS gives
      # them reads as a blocked loop (52.6 ms against 50 on run 44959677392), so that file runs by itself once the shard has ended.
      - name: Run the main-loop bound by itself
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/desktop-fast-event-loop.json
          MIXDOG_SLOT: desktop-fast-event-loop
        run: npm test --prefix apps/desktop -- src/main/protocol/event-loop-lag.test.mjs
      # A skipped or todo test outside scripts/ci/coverage/exceptions.json fails the job (check-skips.mjs).
      - name: Check that no test of the desktop fast lane skipped outside the reviewed list
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/desktop-fast.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT" "${{ runner.temp }}/receipts/desktop-fast-event-loop.json"
      - name: Save the Electron download
        if: github.event_name != 'pull_request' && steps.electron.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: ${{ steps.electron.outputs.cache-primary-key }}
      - name: Save the compiled main native module
        if: github.event_name != 'pull_request' && steps.main-native.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-main-native/target
          key: ${{ steps.main-native.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-desktop-fast-${{ matrix.shard }}of3

  # The Windows computer leg, and the real offscreen boot (app-start.electron.test.mjs, in its electron lane): the built app of
  # `desktop` against the Windows mixdogd of `mixdogd`, neither built again here. It is its own job so that producer
  # dependencies gate only this leg and never the independent Linux fast receipts above.
  desktop-computer:
    needs: [changes, desktop, mixdogd-windows]
    if: needs.changes.outputs.desktop_tests == 'true' || needs.changes.outputs.desktop_computer == 'true'
    timeout-minutes: 15
    runs-on: windows-latest
    env:
      MIXDOG_LEG: windows/desktop-computer/1of1
      MIXDOG_LEG_OS: windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Resolve Electron download key
        id: electron-key
        shell: bash
        run: |
          key=$(node scripts/dependency-lock-cache-key.mjs apps/desktop/package-lock.json)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the Electron download
        id: electron
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron-key.outputs.key }}
      # The Computer Use suites import only node builtins and local .ts modules, so this leg skips the heavy root install
      # (sharp/tesseract). The boot's dev core install needs two things from the root tree: onnxruntime-node (its library) and
      # pptxgenjs/jszip, the sources of the four data/pptxgenjs files `writeDevInstall` requires in the package root. test-env.mjs
      # treats a root tree without the rest as "nothing to compare". strip-ansi and unpdf are imported by the renderer
      # sources the tab-motion probe bundles (protocol-client tool-card model, attachment-card). tsx is the loader
      # scripts/test.mjs always imports (scripts/test-tsx.mjs), for the root-tree invocation of the suites below.
      - name: Install dependencies
        shell: bash
        run: |
          npm_ci() {
            local attempt
            for attempt in 1 2 3; do
              npm ci "$@" --prefer-offline --no-audit --no-fund && return 0
              echo "npm ci $* failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          node scripts/ci/lock-subset.mjs ci-boot-subset onnxruntime-node pptxgenjs jszip strip-ansi unpdf tsx
          { npm_ci --prefix apps/desktop && node apps/desktop/node_modules/electron/install.js; } &
          desktop_pid=$!
          npm_ci --prefix ci-boot-subset --ignore-scripts &
          root_pid=$!
          status=0
          wait "$desktop_pid" || status=1
          wait "$root_pid" || status=1
          exit "$status"
      - name: Stage the root packages and the PPTX runtime files the dev core install reads
        shell: bash
        run: |
          cp -R ci-boot-subset/node_modules node_modules
          node --input-type=module -e "import { copyPptxgenjsData } from './apps/desktop/scripts/stage-js-bundle.mjs'; await copyPptxgenjsData({ modulesDir: 'node_modules', packageDir: '.' });"
          test -f node_modules/onnxruntime-node/package.json
          test -f node_modules/tsx/package.json
          for file in pptxgen.cjs.js jszip.min.js LICENSE-pptxgenjs LICENSE-jszip.markdown; do test -f "data/pptxgenjs/$file"; done
      # The entry computer-backend (windows) saves: the same key, so the helper's dependencies are not compiled again here.
      - name: Restore the compiled Computer Use backend
        id: computer-cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-computer/target
          key: computer-cargo-${{ runner.os }}-${{ hashFiles('native/mixdog-computer/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('native/mixdog-computer/src/**') }}
          restore-keys: computer-cargo-${{ runner.os }}-${{ hashFiles('native/mixdog-computer/Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Restore the compiled main native module
        id: main-native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-main-native/target
          key: main-native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-main-native/Cargo.lock', 'native/mixdog-main-native/Cargo.toml', 'native/mixdog-main-native/.cargo/config.toml') }}-${{ hashFiles('native/mixdog-main-native/src/**', 'native/core/crates/mixdog-browser-rules/**', 'native/core/crates/mixdog-js/**', 'native/core/vendor/icu_collator/**', 'native/core/Cargo.toml') }}
          restore-keys: main-native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-main-native/Cargo.lock', 'native/mixdog-main-native/Cargo.toml', 'native/mixdog-main-native/.cargo/config.toml') }}-
      - name: Build the native Computer Use helper
        shell: bash
        run: cargo build --locked --manifest-path native/mixdog-computer/Cargo.toml --bin mixdog-computer --target-dir native/mixdog-computer/target
      - name: Download the Windows mixdogd of this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mixdogd-dev-${{ env.GATE_KEY }}-windows
          path: mixdogd-dev
      - name: Download the built desktop app of this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-out-${{ env.GATE_KEY }}
          path: apps/desktop/out
      - name: Run the Computer Use suites on Windows
        shell: bash
        env:
          MIXDOGD_BIN: ${{ github.workspace }}/mixdogd-dev/mixdogd.exe
          RECEIPTS: ${{ runner.temp }}/receipts
          MIXDOG_COMPUTER_BIN: ${{ github.workspace }}/native/mixdog-computer/target/debug/mixdog-computer.exe
        # One receipt per invocation (scripts/ci/receipt.mjs): each command leaves its own, and the check below names all five.
        run: |
          MIXDOG_SLOT=computer-fast MIXDOG_RECEIPT="$RECEIPTS/computer-fast.json" npm test --prefix apps/desktop -- src/main/computer/
          MIXDOG_SLOT=computer-slow MIXDOG_RECEIPT="$RECEIPTS/computer-slow.json" npm run test:slow --prefix apps/desktop -- src/main/computer/
          # Every *.electron.test.mjs (the default lane excludes them), not
          # only the Computer Use ones: page zoom runs here too.
          MIXDOG_SLOT=computer-electron MIXDOG_RECEIPT="$RECEIPTS/computer-electron.json" npm run test:electron --prefix apps/desktop
          # Headless Linux Chrome has no hover pointer, so the hover-gated
          # reveal in this suite is only asserted here.
          MIXDOG_SLOT=computer-compact-chrome MIXDOG_RECEIPT="$RECEIPTS/computer-compact-chrome.json" npm run test:slow --prefix apps/desktop -- src/renderer/compact-chrome-layout.slow.test.mjs
          # Electron needs a display, which the Linux slow leg lacks: the live
          # status line layout regression (#326) is asserted here.
          MIXDOG_SLOT=computer-live-activity MIXDOG_RECEIPT="$RECEIPTS/computer-live-activity.json" npm run test:slow --prefix apps/desktop -- src/renderer/live-activity-layout.slow.test.mjs src/renderer/workspace-tab-motion.slow.test.mjs
          # Windows-only files (ACLs, Windows PowerShell, the Windows crash handler, the App-Bound key import, the deploy
          # script's junction cleanup): every case of them skips on Linux and macOS.
          MIXDOG_SLOT=windows-only MIXDOG_RECEIPT="$RECEIPTS/windows-only.json" npm test --prefix apps/desktop -- scripts/direct-e2e-isolation.test.mjs src/main/secret-file.test.mjs
          MIXDOG_SLOT=windows-only-slow MIXDOG_RECEIPT="$RECEIPTS/windows-only-slow.json" npm run test:slow --prefix apps/desktop -- src/main/crash-handler-watch.slow.test.mjs src/main/browser/profile-import-saved-key.slow.test.mjs scripts/dev-fast-snapshot.slow.test.mjs
          MIXDOG_SLOT=windows-only-root MIXDOG_RECEIPT="$RECEIPTS/windows-only-root.json" node scripts/test.mjs src/runtime/shared/file-permissions.test.mjs
      # A skipped or todo test outside scripts/ci/coverage/exceptions.json fails the job, and so does a receipt that is missing,
      # incomplete or empty (check-skips.mjs).
      - name: Check that no test of the Windows Computer Use suites skipped outside the reviewed list
        shell: bash
        env:
          RECEIPTS: ${{ runner.temp }}/receipts
        run: |
          node scripts/ci/check-skips.mjs receipts "$RECEIPTS/computer-fast.json" "$RECEIPTS/computer-slow.json" "$RECEIPTS/computer-electron.json" \
            "$RECEIPTS/computer-compact-chrome.json" "$RECEIPTS/computer-live-activity.json" "$RECEIPTS/windows-only.json" \
            "$RECEIPTS/windows-only-slow.json" "$RECEIPTS/windows-only-root.json"
      - name: Save the Electron download
        if: github.event_name != 'pull_request' && steps.electron.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: ${{ steps.electron.outputs.cache-primary-key }}
      - name: Save the compiled Computer Use backend
        if: github.event_name != 'pull_request' && steps.computer-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-computer/target
          key: ${{ steps.computer-cargo.outputs.cache-primary-key }}
      - name: Save the compiled main native module
        if: github.event_name != 'pull_request' && steps.main-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-main-native/target
          key: ${{ steps.main-native.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: windows-desktop-computer-1of1

  # The desktop's slow lane, in three shards like the fast one. No *.slow.test.* file under apps/desktop reads MIXDOGD_BIN or
  # MIXDOG_TEST_NATIVE_DIR (nor imports a module that does), so it takes no daemon and waits for no producer.
  desktop-slow:
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true'
      && needs.changes.outputs.desktop_css_only != 'true'
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/desktop-slow/${{ matrix.shard }}of3
      MIXDOG_LEG_OS: linux
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      # `pretest:slow` builds mixdog_main_native.node with cargo before the lane (see desktop-tests): the pinned toolchain, not the image's.
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Resolve Electron download key
        id: electron-key
        shell: bash
        run: |
          key=$(node scripts/dependency-lock-cache-key.mjs apps/desktop/package-lock.json)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the Electron download
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron-key.outputs.key }}
      - name: Install dependencies
        shell: bash
        run: |
          npm_ci() {
            local attempt
            for attempt in 1 2 3; do
              npm ci "$@" --prefer-offline --no-audit --no-fund && return 0
              echo "npm ci $* failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          # Electron 42+ has no install script: fetch its binary once here so
          # parallel test files never race to download it on first use.
          { npm_ci --prefix apps/desktop && node apps/desktop/node_modules/electron/install.js; } &
          desktop_pid=$!
          npm_ci &
          root_pid=$!
          status=0
          wait "$desktop_pid" || status=1
          wait "$root_pid" || status=1
          exit "$status"
      # `npm ci` no longer stages the native tools (postinstall only prunes the
      # embedding runtime): stage the pinned graph, patch and spawn tools the
      # suites resolve in native-tools/.
      - name: Stage the native tools
        run: node scripts/stage-native-tools.mjs
      - name: Restore the compiled main native module
        id: main-native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-main-native/target
          key: main-native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-main-native/Cargo.lock', 'native/mixdog-main-native/Cargo.toml', 'native/mixdog-main-native/.cargo/config.toml') }}-${{ hashFiles('native/mixdog-main-native/src/**', 'native/core/crates/mixdog-browser-rules/**', 'native/core/crates/mixdog-js/**', 'native/core/vendor/icu_collator/**', 'native/core/Cargo.toml') }}
          restore-keys: main-native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-main-native/Cargo.lock', 'native/mixdog-main-native/Cargo.toml', 'native/mixdog-main-native/.cargo/config.toml') }}-
      - name: Run the desktop slow lane (shard ${{ matrix.shard }}/3)
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/desktop-slow.json
        run: npm run test:slow --prefix apps/desktop -- --test-shard=${{ matrix.shard }}/3
      # A skipped or todo test outside scripts/ci/coverage/exceptions.json fails the job (check-skips.mjs).
      - name: Check that no test of the desktop slow lane skipped outside the reviewed list
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/desktop-slow.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      # Locale catalogs are checked once, here, not during feature work.
      - name: Check locale catalogs
        if: matrix.shard == 1
        run: npm run i18n:check --prefix apps/desktop
      - name: Save the compiled main native module
        if: github.event_name != 'pull_request' && steps.main-native.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-main-native/target
          key: ${{ steps.main-native.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-desktop-slow-${{ matrix.shard }}of3


  # Every *.test.mjs in the relay package runs here by existing
  # (scripts/test.mjs). These suites guard pairing, transport, static serving
  # and release verification, so they cannot stay a local-only run.
  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/relay/1of1
      MIXDOG_LEG_OS: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: apps/relay/package-lock.json
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefix apps/relay --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Run the relay test lane
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/relay.json
        run: npm test --prefix apps/relay
      # A skipped or todo test outside scripts/ci/coverage/exceptions.json fails the job (check-skips.mjs): on a clean checkout a test that
      # skips because its material is absent would otherwise be green and test nothing.
      - name: Check that no test of the relay lane skipped outside the reviewed list
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/relay.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      # The relay's release transaction (real renames, systemctl recorded) is a bash suite whose `ok: <scenario>` lines are its
      # cases (scripts/ci/run-shell-suite.mjs); its own slot of this leg.
      - name: Run the relay release transaction scenarios
        env:
          MIXDOG_SLOT: release-transaction
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/release-transaction.json
        run: node scripts/ci/run-shell-suite.mjs apps/relay/deploy/release-transaction.test.sh
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-relay-1of1

  # The Rust relay beside the Node one. Its own suites and the relay interop tests
  # of mixdog-remote are part of the core's workspace run (core-tests, with the
  # relay's test-support feature built in); what is left here is what only this job
  # can show: the relay as it ships (the release profile compiles), and the phone's
  # own suite and its relay e2e test, which start the relay binary built just before
  # and the Node relay. The release-profile build is for a push to main and a manual
  # run (mixdogd-build.yml builds the same program at a release); a pull request builds
  # the relay in the test profile from the dependency cache core-build keeps, which is
  # what the phone's tests need (relay-process.ts takes the newest build of either profile).
  relay-rust:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/mobile/1of1
      MIXDOG_LEG_OS: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/relay/package-lock.json
            apps/mobile/package-lock.json
            packages/protocol-client/package-lock.json
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      # The relay of one set of inputs is the same program: the shipping build main keeps in a store keyed by those inputs
      # (core-select.mjs store_key_relay), built only when the store has no entry for the key; a pull request reads it too.
      - name: Take the relay of these inputs from the store
        id: store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: relay-store
          key: relay-release-linux-${{ runner.arch }}-${{ needs.changes.outputs.store_key_relay }}
      - name: Place the stored relay
        if: steps.store.outputs.cache-hit == 'true'
        run: mkdir -p native/core/target/release && cp relay-store/mixdog-relay native/core/target/release/mixdog-relay
      - name: Restore the compiled release dependencies
        if: github.event_name != 'pull_request' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/core/target
          # The key core-real (linux) writes for the shipping profile, the tree-helper lockfile included: the same formula; an
          # entry of another lockfile of the same segment is the fallback. The segment keeps the no-LTO entry out of the prefix.
          key: core-release-linux-${{ runner.arch }}-shipping-${{ hashFiles('rust-toolchain.toml', 'native/core/Cargo.lock', 'native/core/Cargo.toml', 'native/core/crates/**/Cargo.toml', 'native/core/.cargo/config.toml', 'src/runtime/**/data/*manifest.json', 'src/runtime/effort-judge/model-manifest.json', 'scripts/rust-core/tree-helper/Cargo.lock') }}
          restore-keys: |
            core-release-linux-${{ runner.arch }}-shipping-
      # The key core-build (linux) writes: the same formula, so a pull request reads the entry main saved, exact or cold.
      - name: Restore the compiled test dependencies
        if: github.event_name == 'pull_request' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/core/target
          key: core-deps-linux-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('rust-toolchain.toml', 'native/core/Cargo.lock', 'native/core/Cargo.toml', 'native/core/crates/**/Cargo.toml', 'native/core/.cargo/config.toml', 'src/runtime/**/data/*manifest.json', 'src/runtime/effort-judge/model-manifest.json') }}
      - name: Install phone verification and Node relay dependencies
        shell: bash
        run: |
          npm_ci() {
            local attempt
            for attempt in 1 2 3; do
              npm ci "$@" --prefer-offline --no-audit --no-fund && return 0
              echo "npm ci $* failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          npm_ci --prefix apps/relay &
          pids=($!)
          npm_ci --prefix packages/protocol-client &
          pids+=($!)
          npm_ci --prefix apps/mobile &
          pids+=($!)
          # Phone source checks follow desktop renderer imports and need React's types, not Electron.
          npm_ci --prefix apps/desktop --ignore-scripts &
          pids+=($!)
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Build the relay as it ships
        if: github.event_name != 'pull_request' && steps.store.outputs.cache-hit != 'true'
        run: |
          cd native/core && cargo build --release --locked --manifest-path Cargo.toml -p mixdog-relay
          mkdir -p ../../relay-store && cp target/release/mixdog-relay ../../relay-store/mixdog-relay
      - name: Keep the relay in the store
        if: github.event_name != 'pull_request' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: relay-store
          key: ${{ steps.store.outputs.cache-primary-key }}
      - name: Build the relay in the test profile (pull request)
        if: github.event_name == 'pull_request' && steps.store.outputs.cache-hit != 'true'
        run: cd native/core && cargo build --locked --manifest-path Cargo.toml -p mixdog-relay
      # relay-process.ts starts the newest native/core/target/{release,debug}/mixdog-relay (built above) and the Node relay
      # (apps/relay/server.mjs): the phone transport must give the same outcomes on both.
      - name: Phone source checks and transport against both relays
        env:
          RECEIPTS: ${{ runner.temp }}/receipts
        # apps/mobile/scripts/run-tests.mjs leaves the receipt of each lane: check:source runs its unit lane, test:e2e the other.
        run: |
          MIXDOG_SLOT=unit MIXDOG_RECEIPT="$RECEIPTS/mobile-unit.json" npm run check:source --prefix apps/mobile
          MIXDOG_SLOT=e2e MIXDOG_RECEIPT="$RECEIPTS/mobile-e2e.json" npm run test:e2e --prefix apps/mobile
      - name: Check that no phone test skipped outside the reviewed list
        env:
          RECEIPTS: ${{ runner.temp }}/receipts
        run: node scripts/ci/check-skips.mjs receipts "$RECEIPTS/mobile-unit.json" "$RECEIPTS/mobile-e2e.json"
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-mobile-1of1

  # native/mixdog-spawn is the process manager every shell and exec call of mixdogd goes through
  # (the core builds its library through crates/mixdog-spawn, which cannot run its tests). Its
  # integration tests are behind the core-test feature: processes, PTYs, survivors, the exit window.
  # The core's toolchain, since the feature compiles core crates.
  spawn:
    needs: changes
    if: needs.changes.outputs.spawn == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    env:
      MIXDOG_LEG: ${{ format('{0}/spawn/1of1', startsWith(matrix.runner, 'ubuntu') && 'linux' || startsWith(matrix.runner, 'macos') && 'macos' || 'windows') }}
      MIXDOG_LEG_OS: ${{ startsWith(matrix.runner, 'ubuntu') && 'linux' || startsWith(matrix.runner, 'macos') && 'macos' || 'windows' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Restore the compiled process manager
        id: spawn-cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-spawn/target
          key: spawn-core-test-cargo-${{ matrix.runner }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-spawn/Cargo.lock', 'native/mixdog-spawn/Cargo.toml', 'native/core/Cargo.lock') }}
          restore-keys: |
            spawn-core-test-cargo-${{ matrix.runner }}-${{ steps.rust-pin.outputs.version }}-
      - uses: ./.github/actions/install-nextest
      - name: Test the process manager with the core's features
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/spawn.json
        run: node scripts/ci/run-nextest.mjs --junit native/mixdog-spawn/target/nextest/ci/junit.xml --list -- --manifest-path native/mixdog-spawn/Cargo.toml --locked --config-file native/.config/nextest-standalone.toml --profile ci --features core-test -- --no-tests=fail
      - name: Check that no ignored test of the process manager is unreviewed
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/spawn.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Save the compiled process manager
        if: github.event_name != 'pull_request' && steps.spawn-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-spawn/target
          key: ${{ steps.spawn-cargo.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: ${{ format('{0}-spawn-1of1', startsWith(matrix.runner, 'ubuntu') && 'linux' || startsWith(matrix.runner, 'macos') && 'macos' || 'windows') }}

  # The protocol packages: the desktop, the phone, the smokes and the TUI tooling import them,
  # and their own suites ran in no job. packages/protocol has no dependencies of its own; its
  # typecheck uses the compiler of the client package that imports it.
  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true' || needs.changes.outputs.relay == 'true' || needs.changes.outputs.desktop_tests == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/packages/1of1
      MIXDOG_LEG_OS: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: |
            package-lock.json
            packages/protocol-client/package-lock.json
            apps/desktop/package-lock.json
            apps/mobile/package-lock.json
      # The client's suite loads TypeScript through the root package's tsx (scripts/test-tsx.mjs).
      - name: Install
        shell: bash
        run: |
          npm_ci() {
            local attempt
            for attempt in 1 2 3; do
              npm ci "$@" --prefer-offline --no-audit --no-fund && return 0
              echo "npm ci $* failed (attempt ${attempt}/3)" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          npm_ci &
          pids=($!)
          npm_ci --prefix packages/protocol-client &
          pids+=($!)
          # The phone typecheck below reads the desktop and phone trees: independent of these two, so installed beside them
          # rather than after the client's suite.
          npm_ci --prefix apps/desktop &
          pids+=($!)
          npm_ci --prefix apps/mobile &
          pids+=($!)
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Typecheck the client and the protocol types
        run: npm run typecheck:packages
      - name: Run the client's suite
        # Same discovery and lane as the Linux root fallback, so delegating
        # the subtree cannot drop a test file the root would have run.
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/packages.json
        run: npm test -- packages/protocol-client/test/
      - name: Check that no test of the protocol client skipped outside the reviewed list
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/packages.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"

      - name: Full phone typecheck including phone-boot and imported React shell
        run: npm run typecheck --prefix apps/mobile
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-packages-1of1

  patch:
    needs: changes
    if: needs.changes.outputs.patch == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/patch/1of1
      MIXDOG_LEG_OS: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Restore the compiled patch engine
        id: patch-cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-patch/target
          key: patch-test-cargo-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-patch/Cargo.lock') }}-${{ hashFiles('native/mixdog-patch/src/**') }}
          restore-keys: patch-test-cargo-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-patch/Cargo.lock') }}-
      # The Node protocol and edit suites of this gate are gone with the Node
      # patch tool; the Rust core's patch and edit bytes are the rust-core job's
      # `patch-bytes` lane.
      - uses: ./.github/actions/install-nextest
      - name: Test the checked-out patch engine
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/patch.json
        run: node scripts/ci/run-nextest.mjs --junit native/mixdog-patch/target/nextest/ci/junit.xml --list -- --manifest-path native/mixdog-patch/Cargo.toml --locked --config-file native/.config/nextest-standalone.toml --profile ci -- --no-tests=fail
      - name: Check that no ignored test of the patch engine is unreviewed
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/patch.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Build the checked-out patch engine
        run: cargo build --locked --manifest-path native/mixdog-patch/Cargo.toml
      - name: Save the compiled patch engine
        if: github.event_name != 'pull_request' && steps.patch-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-patch/target
          key: ${{ steps.patch-cargo.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-patch-1of1

  graph:
    needs: changes
    if: needs.changes.outputs.graph == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/graph/1of1
      MIXDOG_LEG_OS: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      # The graph gate runs only when its sources changed, so the exact key
      # rarely hits; the prefix still restores the compiled dependency tree.
      - name: Restore the graph test build
        id: graph-cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-graph/target
          key: graph-test-cargo-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-graph/Cargo.lock') }}-${{ hashFiles('native/mixdog-graph/src/**') }}
          restore-keys: graph-test-cargo-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-graph/Cargo.lock') }}-
      - uses: ./.github/actions/install-nextest
      - name: Test the graph engine
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/graph.json
        run: node scripts/ci/run-nextest.mjs --junit native/mixdog-graph/target/nextest/ci/junit.xml --list -- --manifest-path native/mixdog-graph/Cargo.toml --locked --config-file native/.config/nextest-standalone.toml --profile ci -- --no-tests=fail
      - name: Check that no ignored test of the graph engine is unreviewed
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/graph.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Save the graph test build
        if: github.event_name != 'pull_request' && steps.graph-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-graph/target
          key: ${{ steps.graph-cargo.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-graph-1of1

  # The Chrome login importer's Rust tests (cookie decryption and schema
  # binding, App-Bound key handling, snapshots, failure classification) guard
  # the credential path and ran in no job. The crate links the pinned upstream
  # chromium_importer and Windows-only APIs, so it runs here, on Windows, after
  # fetching only the sparse upstream source build.ps1 itself would check out.
  # native/mixdog-browser-import/test.mjs stages the wrapper against that
  # checkout (and seeds its lockfile) before it runs cargo test.
  browser-import:
    needs: changes
    if: needs.changes.outputs.browser_import == 'true'
    timeout-minutes: 20
    runs-on: windows-latest
    env:
      MIXDOG_LEG: windows/browser-import/1of1
      MIXDOG_LEG_OS: windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      # The commit is read from build.ps1 so the tests and the shipped binary
      # can never be built from different upstream sources.
      - name: Fetch the pinned upstream importer source
        shell: bash
        run: |
          commit=$(grep -oE "UpstreamCommit = '[0-9a-f]{40}'" native/mixdog-browser-import/build.ps1 | grep -oE '[0-9a-f]{40}')
          [[ -n "$commit" ]]
          dir="$RUNNER_TEMP/bitwarden-clients"
          git clone --filter=blob:none --no-checkout https://github.com/bitwarden/clients.git "$dir"
          # Cone mode on purpose: a leading-slash no-cone pattern is rewritten
          # to a Windows path by Git Bash's argument conversion.
          git -C "$dir" sparse-checkout set apps/desktop/desktop_native
          git -C "$dir" fetch --depth 1 origin "$commit"
          git -C "$dir" checkout --detach --force "$commit"
      # The upstream lockfile is seeded from the pinned commit (build.ps1), so the commit is in the key with the wrapper's own files.
      - name: Restore the compiled importer
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/browser-import/target
          key: browser-import-cargo-${{ runner.os }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-browser-import/build.ps1', 'native/mixdog-browser-import/Cargo.toml') }}-${{ hashFiles('native/mixdog-browser-import/src/**') }}
          restore-keys: browser-import-cargo-${{ runner.os }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-browser-import/build.ps1', 'native/mixdog-browser-import/Cargo.toml') }}-
      # The crate is staged as native/mixdog-browser-import/test.mjs stages it (its sources and manifest in a folder of their own, the
      # path dependency pointed at the upstream checkout, the upstream lockfile seeded) and run through nextest, so the job leaves the
      # structured report of every test: the package name is the tracked manifest's, so each case keeps its tracked identity.
      - uses: ./.github/actions/install-nextest
      - name: Stage the importer against the upstream checkout
        shell: bash
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/bitwarden-clients/apps/desktop/desktop_native"
          stage="$RUNNER_TEMP/browser-import"
          mkdir -p "$stage"
          cp -R native/mixdog-browser-import/src "$stage/src"
          NATIVE="$native" node -e "const fs=require('fs');const p=require('path');const text=fs.readFileSync('native/mixdog-browser-import/Cargo.toml','utf8');const dep='path = \"../chromium_importer\"';if(!text.includes(dep))throw new Error('the manifest no longer names '+dep);fs.writeFileSync(p.join(process.argv[1],'Cargo.toml'),text.replace(dep,'path = '+JSON.stringify(p.join(process.env.NATIVE,'chromium_importer').split(p.sep).join('/'))))" "$stage"
          cp "$native/Cargo.lock" "$stage/Cargo.lock"
      - name: Run the importer's Rust tests
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/browser-import.json
        run: node scripts/ci/run-nextest.mjs --junit "$RUNNER_TEMP/browser-import/target/nextest/ci/junit.xml" --list -- --manifest-path "$RUNNER_TEMP/browser-import/Cargo.toml" --config-file native/.config/nextest-standalone.toml --profile ci -- --no-tests=fail
      - name: Check that no ignored test of the importer is unreviewed
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/browser-import.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Save the compiled importer
        if: github.event_name != 'pull_request' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/browser-import/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: windows-browser-import-1of1

  # The secure-desktop helper (a LocalSystem service once installed on the
  # phone's request) ships in every Windows build; its unit tests (framing,
  # deadlines, SDDL/trust rules, handshake, install check) are Windows-only.
  secure-desktop:
    needs: changes
    if: needs.changes.outputs.secure_desktop == 'true'
    timeout-minutes: 20
    runs-on: windows-latest
    env:
      MIXDOG_LEG: windows/secure-desktop/1of1
      MIXDOG_LEG_OS: windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Restore the compiled helper
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-secure-desktop/target
          key: secure-desktop-cargo-${{ runner.os }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-secure-desktop/Cargo.lock', 'native/mixdog-secure-desktop/Cargo.toml') }}-${{ hashFiles('native/mixdog-secure-desktop/src/**', 'native/mixdog-secure-desktop/build.rs') }}
          restore-keys: secure-desktop-cargo-${{ runner.os }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-secure-desktop/Cargo.lock', 'native/mixdog-secure-desktop/Cargo.toml') }}-
      - uses: ./.github/actions/install-nextest
      - name: Run the secure-desktop helper's Rust tests
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/secure-desktop.json
        run: node scripts/ci/run-nextest.mjs --junit native/mixdog-secure-desktop/target/nextest/ci/junit.xml --list -- --manifest-path native/mixdog-secure-desktop/Cargo.toml --locked --config-file native/.config/nextest-standalone.toml --profile ci -- --no-tests=fail
      - name: Check that no ignored test of the secure-desktop helper is unreviewed
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/secure-desktop.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Save the compiled helper
        if: github.event_name != 'pull_request' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-secure-desktop/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: windows-secure-desktop-1of1

  # The Mica window library (a Node-API module the desktop's main process loads on Windows; Win32 window-procedure and
  # foreground-lease code) is built for packaging by prepare-runtime and was tested by no job. A standalone crate with
  # its own lockfile and its own .cargo/config.toml (rust-lld, static CRT), so it runs from its manifest, on Windows.
  window:
    needs: changes
    if: needs.changes.outputs.window == 'true'
    timeout-minutes: 20
    runs-on: windows-latest
    env:
      MIXDOG_LEG: windows/window/1of1
      MIXDOG_LEG_OS: windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Restore the compiled window library
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-window/target
          key: window-cargo-${{ runner.os }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-window/Cargo.lock', 'native/mixdog-window/Cargo.toml', 'native/mixdog-window/.cargo/config.toml') }}-${{ hashFiles('native/mixdog-window/src/**', 'native/mixdog-window/build.rs') }}
          restore-keys: window-cargo-${{ runner.os }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('native/mixdog-window/Cargo.lock', 'native/mixdog-window/Cargo.toml', 'native/mixdog-window/.cargo/config.toml') }}-
      - uses: ./.github/actions/install-nextest
      - name: Run the window library's Rust tests
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/window.json
        run: node scripts/ci/run-nextest.mjs --junit native/mixdog-window/target/nextest/ci/junit.xml --list -- --manifest-path native/mixdog-window/Cargo.toml --locked --config-file native/.config/nextest-standalone.toml --profile ci -- --no-tests=fail
      - name: Check that no ignored test of the window library is unreviewed
        shell: bash
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/window.json
        run: node scripts/ci/check-skips.mjs receipts "$MIXDOG_RECEIPT"
      - name: Save the compiled window library
        if: github.event_name != 'pull_request' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-window/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: windows-window-1of1

  # The mobile release scripts are Python with their own unittest suites,
  # which no Node lane discovers. They need the same packages the iOS
  # workflow installs (the certificate tests build real keys and .p12s).
  mobile-scripts:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    env:
      MIXDOG_LEG: linux/mobile-scripts/1of1
      MIXDOG_LEG_OS: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The harness imports tomllib (Python 3.11+); the image's own python3 is 3.10.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the script dependencies
        run: python3 -m pip install --quiet --upgrade pyjwt "cryptography>=42"
      # unittest runs through a structured result (scripts/ci/coverage/py-runner.py): each case is final after its teardown, and a skip's
      # reason is data, not output text. A skip is reviewed like any other (scripts/ci/coverage/exceptions.json).
      - name: Run the mobile script unit tests
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/mobile-scripts.json
        run: node scripts/ci/run-receipt.mjs unittest apps/mobile/scripts "test_*.py"
      # The benchmark harness's own unit tests that need nothing of the Terminal-Bench environment (the rest, per file, are classified
      # in scripts/ci/coverage/plan.json with the reason each cannot run here).
      - name: Run the benchmark harness unit tests
        env:
          MIXDOG_SLOT: benchmark-harness
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/benchmark-harness.json
        run: node scripts/ci/run-receipt.mjs unittest benchmarks/terminal-bench-2.1/harness/tests "test_[pstu]*.py"
      - name: Check that no skipped test of the mobile scripts and the harness is unreviewed
        run: node scripts/ci/check-skips.mjs receipts "$RUNNER_TEMP/receipts/mobile-scripts.json" "$RUNNER_TEMP/receipts/benchmark-harness.json"
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-mobile-scripts-1of1

  # ---------------------------------------------------------------------------------------------
  # The Rust core (native/core). Where each test runs is listed in one place: the header of
  # native/core/.config/nextest.toml.
  #
  # core-build compiles the test binaries ONCE per system (cargo nextest archive) and uploads them;
  # core-tests runs that archive in parallel legs (nextest --partition count:k/N), so no leg
  # compiles anything. The systems are the ones the product ships on and runs natively
  # here: Linux x64, macOS arm64 and Windows x64 (Linux arm64 and macOS x64 are built, not
  # tested natively, by mixdogd-build.yml: the code that depends on the architecture is seven
  # files). A push and a pull request get the crates the change can affect (scripts/ci/core-select.mjs);
  # the full gate gets every crate.
  #
  # Compiled third-party dependencies (the part that costs: 941 packages built with optimisation)
  # come from actions/cache, keyed by system, toolchain and exactly the files that decide them
  # (Cargo.lock, the manifests with their features, the cargo config, the toolchain file). Only a
  # build of every crate on main (a push that reaches all, the nightly run) saves it, and only after the workspace's own crates, the test binaries and the
  # build state are removed from it (scripts/ci/prune-core-target.mjs): an entry is the size of the
  # dependencies, one per system, and a pull request reads the main entry without writing one.
  #
  # One build job per system, and test jobs per system that need only that build: the legs of a system start when its own
  # archive is uploaded, not when the slowest system's is (run 44943772315: Linux's archive was ready at 19.5 minutes,
  # Windows' at 27.1, and every leg waited for macOS's at 28.4). The jobs of a kind share their steps (YAML anchors). The
  # archive is one build of the whole selection on one runner, never one build per leg. A partial selection (a push's or a pull
  # request's crates) is the one `changes` resolved (scripts/ci/core-align.mjs: widened by the workspace crates and features its
  # tree resolves otherwise than the whole build's), the same one core-lint compiles on plain stable. cargo runs as many jobs as the runner has cores (four on the hosted
  # Linux and Windows runners, three on macOS); the `CARGO_BUILD_JOBS: 3` the Rust jobs carried came with the first Unix job
  # (rust-core-unix.yml, for macos-latest's three cores) and left a core of the four-core runners idle.
  # ---------------------------------------------------------------------------------------------
  core-build-linux:
    name: core-build (linux)
    needs: changes
    if: needs.changes.outputs.core_build == 'true'
    timeout-minutes: 90
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix_linux) }}
    defaults:
      run:
        shell: bash
    steps: &core-build-steps
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The archive below is what every test leg and the Postgres job run, so it must be built from a clean checkout: no
      # Cargo test target git does not track (cargo would build an untracked `tests/*.rs` it finds into the archive). A
      # checkout step gives that by construction; the check keeps it so if a self-hosted or cached workspace ever stands in
      # for it.
      - name: Check that the build is a clean checkout
        run: node scripts/ci/check-clean-checkout.mjs --build
      # Windows: the checkout, and with it the target folder, is on D:, the runner's local disk; the Rust homes (the registry the
      # build reads, the toolchain) move there from C:, the slower system disk. A ReFS Dev Drive needs Windows build 22621
      # (`Format-Volume -DevDrive`), which windows-2022 is not; uv measured a plain ReFS volume no faster than D:.
      - &rust-homes-on-d
        name: Put the Rust homes on drive D (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          printf 'CARGO_HOME=D:\\.cargo\nRUSTUP_HOME=D:\\.rustup\n' >> "$GITHUB_ENV"
          printf 'D:\\.cargo\\bin\n' >> "$GITHUB_PATH"
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Restore the compiled dependencies
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/registry
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/git
            native/core/target
          key: core-deps-${{ matrix.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('rust-toolchain.toml', 'native/core/Cargo.lock', 'native/core/Cargo.toml', 'native/core/crates/**/Cargo.toml', 'native/core/.cargo/config.toml', 'src/runtime/**/data/*manifest.json', 'src/runtime/effort-judge/model-manifest.json') }}
          restore-keys: |
            core-deps-${{ matrix.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('rust-toolchain.toml', 'native/core/Cargo.lock', 'native/core/Cargo.toml', 'native/core/crates/**/Cargo.toml', 'native/core/.cargo/config.toml', 'src/runtime/**/data/*manifest.json', 'src/runtime/effort-judge/model-manifest.json') }}
            core-deps-${{ matrix.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-
      - uses: ./.github/actions/install-nextest
      # The parallel front end for the workspace crates, whose chain (mixdog-core-session, mixdog-core, its test build) is the
      # floor of the build while the other cores wait (scripts/ci/rustc-threads.rs). The test archive only: nothing a release
      # ships, nor core-real's or the dev daemon's mixdogd, is built through it, and core-lint compiles the same selection on
      # plain stable on each system the archive is for.
      - uses: ./.github/actions/rustc-threads
      - name: Build the test binaries once (nextest archive)
        env:
          # The selection `changes` resolved against the whole build (core_build_args, core_build_features), which core-lint also
          # compiles on plain stable.
          ARCHIVE_ARGS: ${{ needs.changes.outputs.core_build_args }}
          FEATURES: ${{ needs.changes.outputs.core_build_features }}
        run: |
          features=()
          if [[ -n "$FEATURES" ]]; then features=(--features "$FEATURES"); fi
          # shellcheck disable=SC2086
          cd native/core
          cargo nextest archive --manifest-path Cargo.toml --locked --timings $ARCHIVE_ARGS "${features[@]}" --archive-file ../../core-tests.tar.zst
      # When each unit compiled and how many ran at once (cargo --timings): the split of this build between the libraries, the
      # test binaries and their links, which the log does not give.
      - name: Upload the build timings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-timings-${{ env.GATE_KEY }}-${{ matrix.os }}
          overwrite: true
          path: native/core/target/cargo-timings/cargo-timing.html
          retention-days: 14
          if-no-files-found: error
      # The build writes a report per run beside the latest; none belongs in the dependency cache saved below.
      - name: Remove the timing reports from the build folder
        run: rm -rf native/core/target/cargo-timings
      - name: Upload the test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-tests-${{ env.GATE_KEY }}-${{ matrix.os }}
          overwrite: true
          path: core-tests.tar.zst
          # Already zstd-compressed.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # Only a build of every crate writes the entry: a push's selection compiles the dependencies of its crates alone, and an
      # entry of those would be an exact hit that every later build compiles the rest after.
      - name: Keep only the third-party dependencies in the cache
        if: github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true' && needs.changes.outputs.core_scope == 'all'
        run: node scripts/ci/prune-core-target.mjs --target native/core/target --profile debug --manifest-path native/core/Cargo.toml
      - name: Save the compiled dependencies
        if: github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true' && needs.changes.outputs.core_scope == 'all'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/registry
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/git
            native/core/target
          key: ${{ steps.deps.outputs.cache-primary-key }}

  # The full gate's macOS and Windows archives, each one build on its own runner as Linux's is (core-select.mjs build_matrix_<os>);
  # a push and a pull request build neither.
  core-build-macos:
    name: core-build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core_build == 'true' && needs.changes.outputs.core_macos == 'true'
    timeout-minutes: 90
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix_macos) }}
    defaults:
      run:
        shell: bash
    steps: *core-build-steps

  core-build-windows:
    name: core-build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core_build == 'true' && needs.changes.outputs.core_windows == 'true'
    timeout-minutes: 90
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix_windows) }}
    defaults:
      run:
        shell: bash
    steps: *core-build-steps

  # The development mixdogd with every replay control (mixdog-cli/dev-controls): desktop replays, the Windows app boot and the
  # ignored core entry tests (core-entry) drive it. The terminal program and the ssh helper are built in the same invocation, with the
  # feature on mixdog-cli only: scripts/check-npm-packages.slow.test.mjs packs the three programs into the npm packages and
  # starts them through the launcher, and skips without them (runtime-slow downloads this artifact). Its own runner, beside
  # core-build rather than after the archive in the same job: that order held every consumer of the archive and of the daemon
  # behind both builds (run 44930949033: 7.8 min Linux, 12.3 min Windows after the archive). It reads the dependency cache
  # core-build keeps and saves none.
  #
  # The three programs of one set of inputs are the same programs: they are kept in a store keyed by those inputs
  # (core-select.mjs store_key_mixdogd_dev: every tracked core input but the crates this build does not compile) and built only
  # when the store has no entry for the key. A pull request reads the entries main writes and writes none.
  #
  # A job per system, so that a consumer waits for the daemon it runs and not for the other system's build: runtime-slow
  # and core-entry for the Linux one, desktop-computer for the Windows one (run 44959677392: the Linux daemon was
  # ready at 7.5 minutes, and its consumers started at 14.3, when the Windows one was).
  mixdogd-linux:
    name: mixdogd (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.mixdogd_linux == 'true'
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { os: linux, runner: ubuntu-22.04, exe: "" }
    defaults:
      run:
        shell: bash
    steps: &mixdogd-steps
      - name: Take the programs of these inputs from the store
        id: store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mixdogd-store
          key: mixdogd-dev-${{ matrix.os }}-${{ runner.arch }}-${{ needs.changes.outputs.store_key_mixdogd_dev }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.store.outputs.cache-hit != 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The daemon the replays and the entry scenarios drive is built from a clean checkout, as the archive is (core-build).
      - name: Check that the build is a clean checkout
        if: steps.store.outputs.cache-hit != 'true'
        run: node scripts/ci/check-clean-checkout.mjs --build
      # The entries core-build saves hold the Windows registry from D: (the cache's paths are part of its key).
      - name: Put the Rust homes on drive D (Windows)
        if: runner.os == 'Windows' && steps.store.outputs.cache-hit != 'true'
        shell: bash
        run: |
          printf 'CARGO_HOME=D:\\.cargo\nRUSTUP_HOME=D:\\.rustup\n' >> "$GITHUB_ENV"
          printf 'D:\\.cargo\\bin\n' >> "$GITHUB_PATH"
      - name: Read the repository Rust toolchain
        id: rust-pin
        if: steps.store.outputs.cache-hit != 'true'
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.store.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Restore the compiled dependencies
        id: deps
        if: steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/registry
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/git
            native/core/target
          key: core-deps-${{ matrix.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('rust-toolchain.toml', 'native/core/Cargo.lock', 'native/core/Cargo.toml', 'native/core/crates/**/Cargo.toml', 'native/core/.cargo/config.toml', 'src/runtime/**/data/*manifest.json', 'src/runtime/effort-judge/model-manifest.json') }}
          restore-keys: |
            core-deps-${{ matrix.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-
      # The parallel front end for the workspace crates: these programs only drive tests, none is shipped.
      - uses: ./.github/actions/rustc-threads
        if: steps.store.outputs.cache-hit != 'true'
      - name: Build the mixdogd the desktop replays drive, and the programs the npm package check starts
        if: steps.store.outputs.cache-hit != 'true'
        run: |
          cd native/core && cargo build --locked --manifest-path Cargo.toml -p mixdog-cli --bin mixdogd -p mixdog-entry --bin mixdog -p mixdog-askpass --bin mixdog-askpass --features mixdog-cli/dev-controls
          mkdir -p ../../mixdogd-store
          cp target/debug/mixdogd${{ matrix.exe }} target/debug/mixdog${{ matrix.exe }} target/debug/mixdog-askpass${{ matrix.exe }} ../../mixdogd-store/
      - name: Keep the programs in the store
        if: steps.store.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mixdogd-store
          key: ${{ steps.store.outputs.cache-primary-key }}
      - name: Upload mixdogd
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mixdogd-dev-${{ env.GATE_KEY }}${{ matrix.os == 'windows' && '-windows' || '' }}
          overwrite: true
          # One folder of the three programs: runtime-slow points MIXDOG_TEST_NATIVE_DIR at it.
          path: |
            mixdogd-store/mixdogd${{ matrix.exe }}
            mixdogd-store/mixdog${{ matrix.exe }}
            mixdogd-store/mixdog-askpass${{ matrix.exe }}
          retention-days: 1
          if-no-files-found: error

  mixdogd-windows:
    name: mixdogd (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.mixdogd_windows == 'true'
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { os: windows, runner: windows-2022, exe: .exe }
    defaults:
      run:
        shell: bash
    steps: *mixdogd-steps

  # The legs. Each downloads its system's archive and runs one partition of it: `count` deals the
  # tests (in binary and name order) out one by one, so the neighbouring tests of a heavy module
  # (a matrix of crash points, a set of real-git replays) land in different legs. N legs per system
  # is the test count over the tests a leg takes (core-select.mjs SYSTEMS): on Linux one per 3,000 and at most six, since a
  # leg's setup (checkout, toolchain, font, archive download, package install) is about a minute and four legs left the
  # slowest partition at 173-199 s of the 656 s that run 45068609184 summed over 19,085 tests; macOS has at most three
  # legs; Windows, whose tests run about twice as long, one per 3,000 tests and at most six. The listings are a job of
  # their own (core-list-<os>), so no leg waits for them.
  core-tests-linux:
    name: core-tests (${{ matrix.os }} ${{ matrix.part }}/${{ matrix.of }})
    needs: [changes, core-build-linux]
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 40
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix_linux) }}
    defaults:
      run:
        shell: bash
    env: &core-tests-env
      MIXDOG_LEG: ${{ matrix.os }}/core-tests/${{ matrix.part }}of${{ matrix.of }}
      MIXDOG_LEG_OS: ${{ matrix.os }}
      # Tests that commit to a real git repository need an identity (the local merge check sets the same).
      GIT_AUTHOR_NAME: mixdog-test
      GIT_AUTHOR_EMAIL: mixdog-test@example.invalid
      GIT_COMMITTER_NAME: mixdog-test
      GIT_COMMITTER_EMAIL: mixdog-test@example.invalid
      # The tests run against a throwaway data directory; no user backup is taken (what k1-lanes.mjs set for its children).
      MIXDOG_SKIP_USER_DATA_BACKUP: "1"
    steps: &core-tests-steps
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Windows: nextest unpacks the archive into the temporary folder (1m11s a time to C:, the system disk, in run 44959677392),
      # and the tests make their folders there; both move to D:, the runner's local disk, where the checkout is. The workflow
      # retire replays need a folder on another volume than the temporary folder: on C: then (MIXDOG_TEST_OTHER_VOLUME below).
      - &tmp-on-d
        name: Put the temporary folder on drive D (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/tmp" /c/mixdog-other-volume
          tmp=$(cygpath -w "$RUNNER_TEMP/tmp")
          printf 'TMP=%s\nTEMP=%s\n' "$tmp" "$tmp" >> "$GITHUB_ENV"
      # The tracked tests that run `node` need the binary on the search path (the daemon's discovery tests, the Office
      # authoring script runtime), and one reads the checkout's node_modules: mixdog-office tests/pptx_script.rs, for
      # pptxgenjs, jszip and @napi-rs/canvas (the script's text metrics, src/runtime/office/portable/text-metrics.mjs). No other
      # tracked test reads a package (the relay interop, the skill validators and the package-reading comparisons were
      # Node-comparison tests, now removed). So the legs install those three packages (below) and need no npm download cache: a restore of the root tree's 250-470 MB cache entry would cost more than
      # the install it serves.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      # The Office engine measures a deck's text in the system's own fonts, and a deck that names none is in Calibri: without
      # Calibri or its metric-compatible Carlito every text box is reported as unmeasurable (mixdog-exthost-worker
      # tests/skill_office_engine.rs, the qc-pages scenario). Windows has Calibri; the Linux and macOS images have neither.
      - name: Install Calibri's metric-compatible face (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sudo timeout -k 10 300 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends fonts-crosextra-carlito; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "font install failed (attempt ${attempt}/3)" >&2
            sudo timeout -k 10 120 apt-get -o Acquire::Retries=2 update -qq || true
            sleep $((attempt * 5))
          done
      - name: Install Calibri's metric-compatible face (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            brew install --cask font-carlito && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "font-carlito install failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-tests-${{ env.GATE_KEY }}-${{ matrix.os }}
      # Without the install scripts, as the full install was: the tests read no postinstall output (prune-embedding-runtime,
      # native-layout's js-runtime.json) and no addon build (sharp, onnxruntime-node, esbuild, fsevents, protobufjs); every
      # test that needs a js-runtime.json writes its own beside the binary it starts. apps/relay is not installed: its
      # dependencies served only the relay twin host, which no tracked test builds. The folder is inside the
      # workspace so the copy needs no path conversion on Windows.
      #
      # The check after the install is not a formality: pptx_script.rs returns early, as a pass, when node_modules/pptxgenjs
      # is missing, so a leg without the package would be green and test nothing.
      - name: Install the packages the tests read (pptxgenjs, jszip and @napi-rs/canvas, without scripts)
        run: |
          node scripts/ci/lock-subset.mjs ci-node-subset pptxgenjs jszip @napi-rs/canvas
          for attempt in 1 2 3; do
            npm ci --prefix ci-node-subset --ignore-scripts --prefer-offline --no-audit --no-fund && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          cp -R ci-node-subset/node_modules node_modules
          test -f node_modules/pptxgenjs/package.json
          test -f node_modules/jszip/package.json
          test -f node_modules/@napi-rs/canvas/package.json
      - name: Run partition ${{ matrix.part }} of ${{ matrix.of }}
        env:
          FILTER: ${{ needs.changes.outputs.core_filter }}
          PART: ${{ matrix.part }}
          OF: ${{ matrix.of }}
          # A folder on another volume than the tests' temp dir (Windows: the temp dir is on D:, this folder on C:): the workflow
          # retire replays rename across two volumes (mixdog-core-config workflow::retire::tests).
          MIXDOG_TEST_OTHER_VOLUME: ${{ runner.os == 'Windows' && 'C:\mixdog-other-volume' || runner.temp }}
          MIXDOG_SLOT: ci
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/ci.json
        # Every partition records what its own run reported, from nextest's JUnit, the #[ignore]d tests it selected included (the `ci`
        # profile's junit.report-skipped = "ignored"): the only place a #[ignore] test that no profile runs is observed as skipped.
        run: |
          node scripts/ci/run-nextest.mjs --junit native/core/target/nextest/ci/junit.xml -- \
            --archive-file core-tests.tar.zst --workspace-remap native/core \
            --config-file native/core/.config/nextest.toml --profile ci -E "$FILTER" \
            -- --partition "count:${PART}/${OF}" --no-tests=fail
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: ${{ matrix.os }}-core-tests-${{ matrix.part }}of${{ matrix.of }}

  core-tests-macos:
    name: core-tests (${{ matrix.os }} ${{ matrix.part }}/${{ matrix.of }})
    needs: [changes, core-build-macos]
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.core_macos == 'true'
    timeout-minutes: 40
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix_macos) }}
    defaults:
      run:
        shell: bash
    env: *core-tests-env
    steps: *core-tests-steps

  core-tests-windows:
    name: core-tests (${{ matrix.os }} ${{ matrix.part }}/${{ matrix.of }})
    needs: [changes, core-build-windows]
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.core_windows == 'true'
    timeout-minutes: 40
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix_windows) }}
    defaults:
      run:
        shell: bash
    env: *core-tests-env
    steps: *core-tests-steps

  # The listings of each system's archive, beside its test legs rather than on the first of them, where they held the leg that
  # ended the run (run 45068609184: 135 s of listing on top of its partition). The listing reads the archive alone and runs
  # no test. Selected as the system's test legs are, and named in plan.json `listLegs`, whose list leg each binding names.
  core-list-linux:
    name: core-list (${{ matrix.os }})
    needs: [changes, core-build-linux]
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { os: linux, runner: ubuntu-22.04 }
    defaults:
      run:
        shell: bash
    steps: &core-list-steps
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - *tmp-on-d
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-tests-${{ env.GATE_KEY }}-${{ matrix.os }}
      # An ignored test proves nothing in this run, and a listing that matches a profile's filter proves nothing either: the reconciliation
      # (job `complete`, scripts/ci/coverage/reconcile.mjs) needs the profile run to have PASSED the test (core-pg, core-entry) or
      # an exact reviewed exception for it (scripts/ci/coverage/exceptions.json) with the ignore disposition this listing states. The
      # listings made here are the build variant's inventory fragments: the unfiltered list of every test the archive compiled, and for each
      # profile that runs ignored tests on this system the tests its filter schedules (routing only, never evidence). They are uploaded
      # once per system as rust-lists-<os>. Windows has no Postgres leg, so it has no profile lists; macOS has its Postgres legs.
      #
      # The interactive scenarios of mixdog-entry (tests/node_free.rs) are ignored because they need the development mixdogd this
      # run's `mixdogd` job makes (mixdog-cli/dev-controls includes mixdog-ai/test-support): job core-entry runs them against that
      # artifact, so no partition waits for a daemon.
      - name: List the archive (unfiltered, and per profile that runs ignored tests)
        id: ignored-audit
        env:
          OS: ${{ matrix.os }}
          # Listing runs the archived binaries and builds nothing: the runner image's own toolchain is enough, and the pin in
          # rust-toolchain.toml is not installed here.
          RUSTUP_TOOLCHAIN: stable
        run: |
          # nextest canonicalizes the destination of --extract-to, so the folder exists first
          mkdir -p rust-lists core-extract
          # which invocation made the listing: this job, at this commit (cli.mjs reconcile checks it against the plan's list leg)
          printf '{"leg":"%s","sha":"%s"}\n' "${OS}/core-list/1of1" "$(git rev-parse HEAD)" > rust-lists/binding.json
          # The archive (1.6 GB) is unpacked by the first listing alone; the others read the unpacked tree it leaves.
          cargo nextest list --archive-file core-tests.tar.zst --extract-to core-extract --workspace-remap native/core --config-file native/core/.config/nextest.toml --message-format json > rust-lists/all.json
          reuse=(--binaries-metadata core-extract/target/nextest/binaries-metadata.json --cargo-metadata core-extract/target/nextest/cargo-metadata.json --target-dir-remap core-extract/target --workspace-remap native/core)
          if [[ "$OS" != windows ]]; then
            for profile in pg services-pg; do
              cargo nextest list "${reuse[@]}" --config-file native/core/.config/nextest.toml \
                --profile "$profile" --run-ignored only --message-format json > "rust-lists/$profile.json"
            done
          fi
          if [[ "$OS" == linux ]]; then
            cargo nextest list "${reuse[@]}" --config-file native/core/.config/nextest.toml \
              --run-ignored only -E 'package(mixdog-entry) & binary(node_free)' --message-format json > rust-lists/entry.json
          fi
      # The lanes of release.yml `rust-lanes` (scripts/rust-core/k1-lanes.mjs) run `cargo test -p <package> <filter>`, and
      # a filter that selects no test fails that job after the packagers have started. Here, on Linux, each lane's package
      # and filter are checked against the unfiltered list of the archive core-build compiled (module declarations, #[path],
      # renamed modules and inherited gating already resolved): the gate fails first. A libtest filter is a substring of the
      # test's full name and nextest lists the same names, so the check is `contains` over the un-ignored tests of the
      # package (scripts/ci/check-lane-filters.mjs); the names and the #[ignore]s it reads are the same in every profile's
      # listing. A pull request's archive holds only the changed crates and their dependents, so a lane whose package is not
      # in it is skipped there.
      - name: Check that every lane filter selects a compiled test
        if: matrix.os == 'linux'
        env:
          CORE_SCOPE: ${{ needs.changes.outputs.core_scope }}
        run: |
          flags=()
          if [[ "$CORE_SCOPE" != all ]]; then flags+=(--allow-missing-packages); fi
          node scripts/ci/check-lane-filters.mjs rust-lists/all.json "${flags[@]}"
      - name: Upload the unfiltered nextest listings of this build variant
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-lists-${{ env.GATE_KEY }}-${{ matrix.os }}
          overwrite: true
          path: rust-lists
          if-no-files-found: error
          retention-days: 14

  core-list-macos:
    name: core-list (${{ matrix.os }})
    needs: [changes, core-build-macos]
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.core_macos == 'true'
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { os: macos, runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps: *core-list-steps

  core-list-windows:
    name: core-list (${{ matrix.os }})
    needs: [changes, core-build-windows]
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.core_windows == 'true'
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { os: windows, runner: windows-2022 }
    defaults:
      run:
        shell: bash
    steps: *core-list-steps

  # nextest does not run doctests: the rustdoc blocks of mixdog-core-api and mixdog-image-egress (scripts/ci/run-doctest.mjs, a slot
  # each), compiled by `cargo test --doc` on the dependencies core-build keeps. Its own job beside core-build, not a step of the first
  # Linux leg: there they added about four minutes to the leg that ends the run. Each package when the selection holds it
  # (core-select.mjs `core_doctests`): both in the full gate.
  core-doctests:
    needs: changes
    if: needs.changes.outputs.core_doctests != '[]'
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      MIXDOG_LEG: linux/core-doctests/1of1
      MIXDOG_LEG_OS: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Read the repository Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Restore the compiled dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/core/target
          key: core-deps-linux-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('rust-toolchain.toml', 'native/core/Cargo.lock', 'native/core/Cargo.toml', 'native/core/crates/**/Cargo.toml', 'native/core/.cargo/config.toml', 'src/runtime/**/data/*manifest.json', 'src/runtime/effort-judge/model-manifest.json') }}
          restore-keys: |
            core-deps-linux-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-
      - name: Run the doctests of mixdog-core-api
        if: contains(fromJSON(needs.changes.outputs.core_doctests), 'mixdog-core-api')
        env:
          MIXDOG_SLOT: doc
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/doc.json
        run: node scripts/ci/run-doctest.mjs -p mixdog-core-api --manifest-path native/core/Cargo.toml --locked
      - name: Run the doctests of mixdog-image-egress
        if: contains(fromJSON(needs.changes.outputs.core_doctests), 'mixdog-image-egress')
        env:
          MIXDOG_SLOT: doc-image-egress
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/doc-image-egress.json
        run: node scripts/ci/run-doctest.mjs -p mixdog-image-egress --manifest-path native/core/Cargo.toml --locked
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-core-doctests-1of1

  # The interactive scenarios of mixdog-entry (tests/node_free.rs, the terminal interface and --plain, without Node): ignored in the
  # partitions because they drive the development mixdogd, so they run here, from the Linux archive against the Linux daemon of
  # this run, and the partitions depend on the archives alone. Selected when the archive holds mixdog-entry (core-select.mjs);
  # the reconciliation credits the `entry` profile of the Linux variant to this leg.
  core-entry:
    needs: [changes, core-build-linux, mixdogd-linux]
    if: needs.changes.outputs.core_entry == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      MIXDOG_LEG: linux/core-entry/1of1
      MIXDOG_LEG_OS: linux
      GIT_AUTHOR_NAME: mixdog-test
      GIT_AUTHOR_EMAIL: mixdog-test@example.invalid
      GIT_COMMITTER_NAME: mixdog-test
      GIT_COMMITTER_EMAIL: mixdog-test@example.invalid
      MIXDOG_SKIP_USER_DATA_BACKUP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Read the repository Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-tests-${{ env.GATE_KEY }}-linux
      - name: Download the development mixdogd the interactive entry scenarios drive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mixdogd-dev-${{ env.GATE_KEY }}
          path: native-dev
      - name: Run the interactive entry scenarios (the terminal interface and --plain, without Node)
        env:
          MIXDOG_SLOT: entry
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/entry.json
        run: |
          chmod +x native-dev/mixdogd
          MIXDOGD_BIN="$PWD/native-dev/mixdogd" \
            node scripts/ci/run-nextest.mjs --junit native/core/target/nextest/ci-ignored/junit.xml -- \
            --archive-file core-tests.tar.zst --workspace-remap native/core --config-file native/core/.config/nextest.toml --profile ci-ignored \
            -E 'package(mixdog-entry) & binary(node_free)' -- --run-ignored only --no-tests=fail
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: linux-core-entry-1of1

  # The #[ignore]d tests that need a PostgreSQL runtime, from the archive core-build made (nothing compiles here):
  #   services-pg  mixdog-services' memory tests that need only a Postgres runtime
  #   pg           the daemon's composed-core tests (compose::tests, session_project_flow_tests, server::tests, ...)
  #                and the runner's own cluster proof, ssh_origin_tests among those the profile's filter selects
  # (the filters and their time budgets are in native/core/.config/nextest.toml). The runtime is the one the shipped manifest
  # names for the runner, hash-checked (scripts/ci/provision-pg-runtime.mjs), and the tests read it through MIXDOG_PG_RUNTIME.
  # Each profile's tests share the `pg-cluster` group (one cluster of their own at a time), so a leg is serial by design: the
  # Linux legs are per profile instead. A profile runs only when its crate is in the archive (core-select.mjs); the daemon's
  # composed tests take up to 690 s each. Linux on every run; macOS on a push to main and a manual run, both profiles one after
  # the other in one job (core-pg-macos), so the macOS legs, that job and core-real fit the five macOS jobs an account runs at
  # once. Windows has no leg: the postmaster refuses to start under an elevated user and a hosted Windows runner is one.
  core-pg:
    name: core-pg (${{ matrix.os }} ${{ matrix.profile }})
    needs: [changes, core-build-linux]
    if: needs.changes.outputs.core_pg == 'true'
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.core_pg_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      MIXDOG_LEG: ${{ matrix.os }}/core-pg/${{ matrix.profile }}
      MIXDOG_LEG_OS: ${{ matrix.os }}
      GIT_AUTHOR_NAME: mixdog-test
      GIT_AUTHOR_EMAIL: mixdog-test@example.invalid
      GIT_COMMITTER_NAME: mixdog-test
      GIT_COMMITTER_EMAIL: mixdog-test@example.invalid
      MIXDOG_SKIP_USER_DATA_BACKUP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The composed core starts `node` for the JS runtime when a test reaches it; no package is read (rust-core-unix.yml ran
      # this profile with the binary only).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Read the repository Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-tests-${{ env.GATE_KEY }}-${{ matrix.os }}
      - name: Unpack the PostgreSQL runtime
        run: |
          test "$(id -u)" != 0
          node scripts/ci/provision-pg-runtime.mjs "$RUNNER_TEMP/pg-runtime" | tee -a "$GITHUB_ENV"
      # `--run-ignored only` with the profile's own filter: the ignored tests it names run and fail (not skip) without the
      # runtime; `--no-tests=fail` makes a filter that no longer matches a test fail the job.
      - name: Run the ${{ matrix.profile }} profile
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/profile.json
        run: |
          node scripts/ci/run-nextest.mjs --junit "native/core/target/nextest/${{ matrix.profile }}/junit.xml" -- \
            --archive-file core-tests.tar.zst --workspace-remap native/core \
            --config-file native/core/.config/nextest.toml --profile "${{ matrix.profile }}" \
            -- --run-ignored only \
            --no-tests=fail --status-level slow --final-status-level slow --failure-output immediate-final --success-output never
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: ${{ matrix.os }}-core-pg-${{ matrix.profile }}

  core-pg-macos:
    name: core-pg (macos)
    needs: [changes, core-build-macos]
    if: needs.changes.outputs.core_pg_macos == 'true'
    timeout-minutes: 90
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    env:
      MIXDOG_LEG: macos/core-pg/1of1
      MIXDOG_LEG_OS: macos
      GIT_AUTHOR_NAME: mixdog-test
      GIT_AUTHOR_EMAIL: mixdog-test@example.invalid
      GIT_COMMITTER_NAME: mixdog-test
      GIT_COMMITTER_EMAIL: mixdog-test@example.invalid
      MIXDOG_SKIP_USER_DATA_BACKUP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Read the repository Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-tests-${{ env.GATE_KEY }}-macos
      - name: Unpack the PostgreSQL runtime
        id: pg_runtime
        run: |
          test "$(id -u)" != 0
          node scripts/ci/provision-pg-runtime.mjs "$RUNNER_TEMP/pg-runtime" | tee -a "$GITHUB_ENV"
      # Each profile is its own slot of this leg. The second runs whatever the first's tests ended, as two jobs would, but never
      # after a failed setup; the evidence upload follows either profile that ran, so a passing one keeps its receipt.
      - name: Run the services-pg profile
        id: services_pg
        if: contains(fromJSON(needs.changes.outputs.core_pg_macos_profiles), 'services-pg')
        env:
          MIXDOG_SLOT: services-pg
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/services-pg.json
        run: |
          node scripts/ci/run-nextest.mjs --junit native/core/target/nextest/services-pg/junit.xml -- \
            --archive-file core-tests.tar.zst --workspace-remap native/core \
            --config-file native/core/.config/nextest.toml --profile services-pg \
            -- --run-ignored only \
            --no-tests=fail --status-level slow --final-status-level slow --failure-output immediate-final --success-output never
      - name: Run the pg profile
        id: pg
        if: ${{ !cancelled() && steps.pg_runtime.outcome == 'success' && contains(fromJSON(needs.changes.outputs.core_pg_macos_profiles), 'pg') }}
        env:
          MIXDOG_SLOT: pg
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/pg.json
        run: |
          node scripts/ci/run-nextest.mjs --junit native/core/target/nextest/pg/junit.xml -- \
            --archive-file core-tests.tar.zst --workspace-remap native/core \
            --config-file native/core/.config/nextest.toml --profile pg \
            -- --run-ignored only \
            --no-tests=fail --status-level slow --final-status-level slow --failure-output immediate-final --success-output never
      - name: Upload the evidence of this leg
        if: ${{ !cancelled() && (steps.services_pg.outcome == 'success' || steps.services_pg.outcome == 'failure' || steps.pg.outcome == 'success' || steps.pg.outcome == 'failure') }}
        uses: ./.github/actions/upload-evidence
        with:
          name: macos-core-pg-1of1

  # The format check (native/rustfmt.toml) reads the sources and nothing else, whatever system they are compiled for, so one
  # system runs it, for the core and for the standalone tools beside it, whenever a file it formats changed (changes `rustfmt`).
  rustfmt:
    needs: changes
    if: needs.changes.outputs.rustfmt == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read the repository Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt
      # Every Rust workspace under native/ that resolves from the checkout alone (mixdog-browser-import depends
      # on sources outside it): the core, and each standalone tool with its own binaries and tests.
      - name: Format check
        run: |
          for lock in native/*/Cargo.lock; do
            cargo fmt --all --manifest-path "$(dirname "$lock")/Cargo.toml" -- --check
          done
          # No Cargo.lock and path dependencies outside the repository: cargo cannot load it, rustfmt reads the sources alone.
          rustfmt --check --edition 2021 native/mixdog-browser-import/src/main.rs
          # Its own workspace under scripts/, below no rustfmt.toml: the default layout.
          cargo fmt --all --manifest-path scripts/rust-core/tree-helper/Cargo.toml -- --check

  # Clippy of the daemon, which composes the core (the command the merge check runs). It is a check build: it shares nothing
  # with the test build but the build scripts, so it runs beside it on its own dependency cache, not after it on the same
  # runner. On Linux for a push and a pull request; on each system in the full gate, since each compiles code the others do
  # not (cfg(windows), cfg(target_os = "macos")) (core-select.mjs `lint_matrix`).
  #
  # It is also the plain stable compile of what the archive builds compiled: those compile the workspace crates through
  # rustc-threads (-Zthreads, with RUSTC_BOOTSTRAP for that compiler), which would accept a `#![feature]`; here the same
  # selection, every target, on the plain stable compiler, on each system the archive was built for.
  core-lint:
    name: core-lint (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.lint_matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check that the build is a clean checkout
        run: node scripts/ci/check-clean-checkout.mjs --build
      - *rust-homes-on-d
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: clippy
      - name: Restore the checked dependencies
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/registry
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/git
            native/core/target
          key: core-clippy-${{ matrix.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-${{ hashFiles('rust-toolchain.toml', 'native/core/Cargo.lock', 'native/core/Cargo.toml', 'native/core/crates/**/Cargo.toml', 'native/core/.cargo/config.toml', 'src/runtime/**/data/*manifest.json', 'src/runtime/effort-judge/model-manifest.json') }}
          restore-keys: |
            core-clippy-${{ matrix.os }}-${{ runner.arch }}-${{ steps.rust-pin.outputs.version }}-
      # The drift check's script imports tomllib (Python 3.11+); the image's own python3 is 3.10.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.os == 'linux'
        with:
          python-version: "3.12"
      # The test-only features of the core's manifests are one unified set, so every `-p <crate>` test build shares its
      # compiles (reads `cargo metadata`; once, on Linux).
      - name: Check that the core manifests' test features have not drifted
        if: matrix.os == 'linux'
        run: node scripts/rust-core/check-test-feature-drift.mjs
      # Lints are not denied in the compile itself: a denied lint ends the build at the first crate that has
      # one, and the crates after it wait for the next run. Every crate is linted, then any finding fails.
      # The daemon and what composes it, when the selection holds the daemon (core-select.mjs `core_daemon`; every full run).
      - name: Clippy
        if: needs.changes.outputs.core_daemon == 'true'
        run: |
          cd native/core
          cargo clippy --color never --manifest-path Cargo.toml --locked -p mixdog-app-server-daemon --all-targets 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          if grep -E '^warning: .* generated [0-9]+ warnings?' "$RUNNER_TEMP/clippy.log"; then
            echo "::error::clippy reported the warnings above"
            exit 1
          fi
      # The archive's resolved selection and features (core_build_args, core_build_features: the one result core-build takes),
      # every target, on the plain stable compiler: no RUSTC_WORKSPACE_WRAPPER, no RUSTC_BOOTSTRAP. After clippy, whose compiles
      # of the same crates are plain stable too.
      - name: Compile the archive's crates on plain stable
        env:
          ARCHIVE_ARGS: ${{ needs.changes.outputs.core_build_args }}
          FEATURES: ${{ needs.changes.outputs.core_build_features }}
        run: |
          features=()
          if [[ -n "$FEATURES" ]]; then features=(--features "$FEATURES"); fi
          cd native/core
          # shellcheck disable=SC2086
          cargo check --manifest-path Cargo.toml --locked --all-targets $ARCHIVE_ARGS "${features[@]}"
      # Also after a finding: the compile that found it is what the entry saves, so a failing clippy does not leave every
      # later run to compile the dependencies again (cargo writes CACHEDIR.TAG when it creates the target folder).
      - name: Keep only the third-party dependencies in the cache
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true' && hashFiles('native/core/target/CACHEDIR.TAG') != ''
        run: node scripts/ci/prune-core-target.mjs --target native/core/target --profile debug --manifest-path native/core/Cargo.toml
      - name: Save the checked dependencies
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true' && hashFiles('native/core/target/CACHEDIR.TAG') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/registry
            ${{ runner.os == 'Windows' && 'D:/.cargo' || '~/.cargo' }}/git
            native/core/target
          key: ${{ steps.deps.outputs.cache-primary-key }}

  # What only a built mixdogd and the process-tree helper can show, from scripts/rust-core: the daemon boots
  # in the shipped profile (the build users run; its boot times are printed, not judged) and answers a first call,
  # a stop past its deadline ends the core it started, and the Node client's replays against the real core.
  # The helper starts every cargo and mixdogd child of these scripts and ends its whole tree, whatever
  # exits first; it has a Windows implementation of its own (a job object), tested on Windows.
  # The lanes of k1-lanes.mjs that stood in for Node suites are tests of the core's crates now and run in core-tests.
  # The shipped (release) mixdogd is built and booted on a push to main and on a manual run only: a pull request
  # that changes scripts/rust-core (core_scripts) runs the helper's builds and tests (the pure parts of k1-lanes.mjs are tested here, in the process-tree step; core-tests checks its filters),
  # and one that changes only the core does not run this job at all (mixdogd-build.yml builds the release at a release).
  core-real:
    name: core-real (${{ matrix.os }})
    needs: changes
    if: >-
      (github.event_name != 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.core_scripts == 'true'))
      || (github.event_name == 'pull_request' && needs.changes.outputs.core_scripts == 'true')
    timeout-minutes: 120
    # actions: read for the release's call, which waits for the shipped build of the same run (below).
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # Linux on an ordinary run, the three systems in the full gate (core-select.mjs `core_real_matrix`).
      matrix: ${{ fromJSON(needs.changes.outputs.core_real_matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      MIXDOG_LEG: ${{ matrix.os }}/core-real/1of1
      MIXDOG_LEG_OS: ${{ matrix.os }}
      # A full run (a call of the gate: a release, a deploy's native assets, the mirror; the nightly run; a manual full run) boots
      # mixdogd in the shipping profile; a push and a manual ordinary run build no release mixdogd and boot the development one
      # of this run's mixdogd-linux job.
      SHIPPING: ${{ inputs.ref != '' || needs.changes.outputs.full == 'true' }}
      # The release's call builds nothing here: release.yml `mixdogd` (mixdogd-build.yml) builds the shipping mixdogd of this
      # run for every target, and the smoke below runs on that build.
      SHIPPED_BUILD: ${{ inputs.gate == 'release' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: package-lock.json
      - name: Read the repository Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      # The release mixdogd of one set of inputs and one profile is the same program: kept in a store keyed by those inputs
      # (core-select.mjs store_key_mixdogd), built only when the store has no entry for the key.
      # Only a shipping-profile run builds a release mixdogd here: a push or a manual ordinary run smokes the development
      # mixdogd of this run's `mixdogd-linux` job instead (the boot step below), so it builds none and keeps no store entry.
      - name: Take the release mixdogd of these inputs from the store
        id: store
        if: matrix.unix && github.event_name != 'pull_request' && env.SHIPPING == 'true' && env.SHIPPED_BUILD != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mixdogd-store
          key: mixdogd-release-${{ matrix.os }}-${{ runner.arch }}-shipping-${{ needs.changes.outputs.store_key_mixdogd }}
      - name: Place the stored mixdogd
        if: steps.store.outputs.cache-hit == 'true'
        run: mkdir -p native/core/target/release && cp mixdogd-store/mixdogd native/core/target/release/mixdogd
      # Two entries, each under a segment of its own so that neither is a prefix of the other: the shipping profile's
      # (`core-release-<os>-<arch>-shipping-...`, which relay-rust also reads) and the one of a run without a release build
      # (`core-release-<os>-<arch>-nolto-...`: the tree-helper's build). The release's call restores neither: it builds nothing here.
      - name: Restore the compiled release dependencies
        id: deps
        if: github.event_name != 'pull_request' && steps.store.outputs.cache-hit != 'true' && env.SHIPPED_BUILD != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/core/target
            scripts/rust-core/tree-helper/target
          key: core-release-${{ matrix.os }}-${{ runner.arch }}-${{ env.SHIPPING == 'true' && 'shipping' || 'nolto' }}-${{ hashFiles('rust-toolchain.toml', 'native/core/Cargo.lock', 'native/core/Cargo.toml', 'native/core/crates/**/Cargo.toml', 'native/core/.cargo/config.toml', 'src/runtime/**/data/*manifest.json', 'src/runtime/effort-judge/model-manifest.json', 'scripts/rust-core/tree-helper/Cargo.lock') }}
          restore-keys: |
            core-release-${{ matrix.os }}-${{ runner.arch }}-${{ env.SHIPPING == 'true' && 'shipping' || 'nolto' }}-
      # First, since it is this job's longest step (macOS 23-37 minutes) and the helper and harness suites below do not read it:
      # after them it started 2-3 minutes into the job. The timeline says where the build's time goes.
      - name: Build mixdogd as it ships
        if: matrix.unix && github.event_name != 'pull_request' && env.SHIPPING == 'true' && env.SHIPPED_BUILD != 'true' && steps.store.outputs.cache-hit != 'true'
        run: |
          cd native/core && cargo build --release --locked --timings --manifest-path Cargo.toml -p mixdog-cli --bin mixdogd
          mkdir -p ../../mixdogd-store && cp target/release/mixdogd ../../mixdogd-store/mixdogd
      - name: Keep the release mixdogd in the store
        if: matrix.unix && github.event_name != 'pull_request' && env.SHIPPING == 'true' && env.SHIPPED_BUILD != 'true' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mixdogd-store
          key: ${{ steps.store.outputs.cache-primary-key }}
      - name: Wait for the shipped mixdogd of this release (release.yml mixdogd)
        if: matrix.unix && env.SHIPPED_BUILD == 'true'
        timeout-minutes: 105
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-for-artifact.sh mixdogd-${{ matrix.target }} mixdogd-${{ matrix.target }} 100
      - name: Take the shipped mixdogd of this release
        if: matrix.unix && env.SHIPPED_BUILD == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mixdogd-${{ matrix.target }}
          path: native/core/target/release
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Name the shipped mixdogd executable
        if: matrix.unix && env.SHIPPED_BUILD == 'true'
        run: chmod +x native/core/target/release/mixdogd
      - name: Upload the release build timings
        if: matrix.unix && github.event_name != 'pull_request' && env.SHIPPING == 'true' && env.SHIPPED_BUILD != 'true' && steps.store.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-timings-${{ env.GATE_KEY }}-release-${{ matrix.os }}
          overwrite: true
          path: native/core/target/cargo-timings/cargo-timing.html
          retention-days: 14
          if-no-files-found: error
      # The build writes a report per run beside the latest; none belongs in the release cache saved below.
      - name: Remove the timing reports from the build folder
        if: matrix.unix && github.event_name != 'pull_request'
        run: rm -rf native/core/target/cargo-timings
      # scripts/rust-core/lib/core-session.mjs imports `ws`; a clean runner has no node_modules. (Windows runs only the helper's tests.)
      - name: Install
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Build the process-tree helper
        run: cargo build --release --locked --manifest-path scripts/rust-core/tree-helper/Cargo.toml
      - uses: ./.github/actions/install-nextest
      - name: Unit tests of the process-tree helper
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/tree-helper-unit.json
          MIXDOG_SLOT: tree-helper-unit
        run: node scripts/ci/run-nextest.mjs --junit scripts/rust-core/tree-helper/target/nextest/ci/junit.xml --list -- --manifest-path scripts/rust-core/tree-helper/Cargo.toml --locked --config-file native/.config/nextest-standalone.toml --profile ci --cargo-profile release -- --no-tests=fail
      - name: Process-tree helper (the POSIX process-group and mark sweep, or the Windows job object)
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/process-tree.json
          MIXDOG_SLOT: process-tree
        run: |
          if [[ "${{ matrix.unix }}" == true ]]; then
            node scripts/ci/node-runner.mjs scripts/rust-core/process-tree.test.mjs scripts/rust-core/tree-helper.test.mjs scripts/rust-core/k1-lanes.test.mjs benchmarks/token-lang/measure-exec.test.mjs
          else
            node scripts/ci/node-runner.mjs scripts/rust-core/process-tree.test.mjs scripts/rust-core/tree-helper.test.mjs scripts/rust-core/k1-lanes.test.mjs
          fi
      # The harness's two Rust-core suites no plain Node lane discovers (benchmarks/terminal-bench-2.1/harness is not a test
      # root): the Anthropic OAuth preflight (lease, snapshot without a refresh token, scrubbed errors) and the prebake of the
      # staged mixdogd bundle (digest and version against the server manifest, run through PowerShell and the process-tree
      # helper built above; the prebake cases skip only where no PowerShell exists, and every hosted runner has one).
      - name: Terminal-bench harness suites for the Rust core (OAuth preflight, prebake)
        env:
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/harness.json
          MIXDOG_SLOT: harness
        run: node scripts/ci/node-runner.mjs benchmarks/terminal-bench-2.1/harness/anthropic_oauth_preflight_rust.test.mjs benchmarks/terminal-bench-2.1/harness/prebake-rust.test.mjs
      # A run without a release build smokes the development mixdogd of `mixdogd-linux` (mixdogd (linux)), waited for here, after
      # the helper's suites, instead of building a release one of its own.
      - name: Wait for the development mixdogd of this run (mixdogd-linux)
        if: matrix.unix && github.event_name != 'pull_request' && env.SHIPPING != 'true'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-for-artifact.sh mixdogd-dev-${{ env.GATE_KEY }} 'mixdogd (linux)' 25
      - name: Take the development mixdogd of this run
        if: matrix.unix && github.event_name != 'pull_request' && env.SHIPPING != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mixdogd-dev-${{ env.GATE_KEY }}
          path: native/core/target/release
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Name the development mixdogd executable
        if: matrix.unix && github.event_name != 'pull_request' && env.SHIPPING != 'true'
        run: chmod +x native/core/target/release/mixdogd
      - name: Boot mixdogd and answer a first call
        if: matrix.unix && github.event_name != 'pull_request'
        # Red by design while mixdogd writes no history/tool-failures.jsonl (owner rs-tool-failures): the smoke fails naming it.
        run: node scripts/rust-core/smoke-mixdogd.mjs --mixdogd native/core/target/release/mixdogd
      - name: Check that a stop past its deadline ends the core it started, and the smoke's verdicts
        if: matrix.unix && github.event_name != 'pull_request'
        # One file at a time: a core starts its Postgres at boot and picks the first free port from 55432 by binding and releasing it (memory/pg/cluster.rs free_port), so two cores booting together can pick the same port and one fails in pg_ctl. A core only ever connects to the port in its own data directory's postmaster.pid, never to another Postgres. Re-check the flag once the branch that defers Postgres to first memory use (rs-boot-time) is in. The three files fail, not skip, when MIXDOGD_BIN is unset (MIXDOG_TESTS_WITHOUT_CORE=1 is the only skip, and no lane sets it).
        env:
          MIXDOGD_BIN: native/core/target/release/mixdogd
          MIXDOG_RECEIPT: ${{ runner.temp }}/receipts/core-session.json
          MIXDOG_SLOT: core-session
        run: node scripts/ci/node-runner.mjs --test-concurrency=1 scripts/rust-core/core-session.test.mjs scripts/rust-core/smoke-mixdogd.test.mjs
      # A skipped or todo test outside scripts/ci/coverage/exceptions.json fails the job, and so does a receipt of a step that ran no test
      # (check-skips.mjs). The receipts named are the steps this leg runs: the last needs the shipped mixdogd, which a pull request
      # does not build.
      - name: Check that no test of core-real skipped outside the reviewed list
        env:
          RECEIPTS: ${{ runner.temp }}/receipts
          UNIX: ${{ matrix.unix }}
          EVENT: ${{ github.event_name }}
        run: |
          receipts=("$RECEIPTS/tree-helper-unit.json" "$RECEIPTS/process-tree.json" "$RECEIPTS/harness.json")
          if [[ "$UNIX" == true && "$EVENT" != pull_request ]]; then receipts+=("$RECEIPTS/core-session.json"); fi
          node scripts/ci/check-skips.mjs receipts "${receipts[@]}"
      - name: Keep only the third-party dependencies in the cache
        if: github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true' && matrix.unix && env.SHIPPING == 'true' && env.SHIPPED_BUILD != 'true' && steps.store.outputs.cache-hit != 'true'
        run: node scripts/ci/prune-core-target.mjs --target native/core/target --profile release --manifest-path native/core/Cargo.toml
      # The release's call built no mixdogd, nor a run that took it from the store: the folder holds a program, not dependencies.
      - name: Save the compiled release dependencies
        if: github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true' && env.SHIPPED_BUILD != 'true' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/core/target
            scripts/rust-core/tree-helper/target
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Upload the evidence of this leg
        uses: ./.github/actions/upload-evidence
        with:
          name: ${{ matrix.os }}-core-real-1of1

  # Every job but `changes` is checked here. A job whose own `if` selected it must have succeeded: skipped is a pass only when the job
  # was not selected. SEL_<JOB> repeats that job's `if` verbatim (scripts/ci/release-gate-wiring.test.mjs compares them), so a job
  # added to the graph without its line fails the gate's own test.
  complete:
    if: always()
    needs: [changes, inventory, runtime, runtime-slow, runtime-macos, computer-backend, desktop, desktop-tests, desktop-computer, desktop-slow, relay, relay-rust, spawn, packages, patch, graph, browser-import, secure-desktop, window, mobile-scripts, core-build-linux, core-build-macos, core-build-windows, mixdogd-linux, mixdogd-windows, core-tests-linux, core-tests-macos, core-tests-windows, core-list-linux, core-list-macos, core-list-windows, core-doctests, core-entry, core-pg, core-pg-macos, core-lint, rustfmt, core-real]
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
      - name: Require every selected gate
        env:
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          INVENTORY: ${{ needs.inventory.result }}
          SEL_INVENTORY: ${{ needs.changes.outputs.source_inventory == 'true' }}
          RUNTIME: ${{ needs.runtime.result }}
          RUNTIME_SLOW: ${{ needs.runtime-slow.result }}
          RUNTIME_MACOS: ${{ needs.runtime-macos.result }}
          COMPUTER_BACKEND: ${{ needs.computer-backend.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DESKTOP_TESTS: ${{ needs.desktop-tests.result }}
          DESKTOP_COMPUTER: ${{ needs.desktop-computer.result }}
          DESKTOP_SLOW: ${{ needs.desktop-slow.result }}
          RELAY: ${{ needs.relay.result }}
          RELAY_RUST: ${{ needs.relay-rust.result }}
          SPAWN: ${{ needs.spawn.result }}
          PACKAGES: ${{ needs.packages.result }}
          PATCH: ${{ needs.patch.result }}
          GRAPH: ${{ needs.graph.result }}
          BROWSER_IMPORT: ${{ needs.browser-import.result }}
          SECURE_DESKTOP: ${{ needs.secure-desktop.result }}
          WINDOW: ${{ needs.window.result }}
          MOBILE_SCRIPTS: ${{ needs.mobile-scripts.result }}
          CORE_BUILD_LINUX: ${{ needs.core-build-linux.result }}
          CORE_BUILD_MACOS: ${{ needs.core-build-macos.result }}
          CORE_BUILD_WINDOWS: ${{ needs.core-build-windows.result }}
          MIXDOGD_LINUX: ${{ needs.mixdogd-linux.result }}
          MIXDOGD_WINDOWS: ${{ needs.mixdogd-windows.result }}
          CORE_TESTS_LINUX: ${{ needs.core-tests-linux.result }}
          CORE_TESTS_MACOS: ${{ needs.core-tests-macos.result }}
          CORE_TESTS_WINDOWS: ${{ needs.core-tests-windows.result }}
          CORE_LIST_LINUX: ${{ needs.core-list-linux.result }}
          CORE_LIST_MACOS: ${{ needs.core-list-macos.result }}
          CORE_LIST_WINDOWS: ${{ needs.core-list-windows.result }}
          CORE_DOCTESTS: ${{ needs.core-doctests.result }}
          CORE_ENTRY: ${{ needs.core-entry.result }}
          CORE_PG: ${{ needs.core-pg.result }}
          CORE_PG_MACOS: ${{ needs.core-pg-macos.result }}
          CORE_LINT: ${{ needs.core-lint.result }}
          RUSTFMT: ${{ needs.rustfmt.result }}
          CORE_REAL: ${{ needs.core-real.result }}
          SEL_RUNTIME: ${{ needs.changes.outputs.runtime == 'true' }}
          SEL_RUNTIME_SLOW: ${{ needs.changes.outputs.runtime == 'true' }}
          SEL_RUNTIME_MACOS: ${{ needs.changes.outputs.runtime == 'true' }}
          SEL_COMPUTER_BACKEND: ${{ needs.changes.outputs.computer == 'true' }}
          SEL_DESKTOP: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop_computer == 'true' }}
          SEL_DESKTOP_TESTS: ${{ needs.changes.outputs.desktop_tests == 'true' }}
          SEL_DESKTOP_COMPUTER: ${{ needs.changes.outputs.desktop_tests == 'true' || needs.changes.outputs.desktop_computer == 'true' }}
          SEL_DESKTOP_SLOW: ${{ needs.changes.outputs.desktop == 'true' && needs.changes.outputs.desktop_css_only != 'true' }}
          SEL_RELAY: ${{ needs.changes.outputs.relay == 'true' }}
          SEL_RELAY_RUST: ${{ needs.changes.outputs.relay == 'true' }}
          SEL_SPAWN: ${{ needs.changes.outputs.spawn == 'true' }}
          SEL_PACKAGES: ${{ needs.changes.outputs.packages == 'true' || needs.changes.outputs.relay == 'true' || needs.changes.outputs.desktop_tests == 'true' }}
          SEL_PATCH: ${{ needs.changes.outputs.patch == 'true' }}
          SEL_GRAPH: ${{ needs.changes.outputs.graph == 'true' }}
          SEL_BROWSER_IMPORT: ${{ needs.changes.outputs.browser_import == 'true' }}
          SEL_SECURE_DESKTOP: ${{ needs.changes.outputs.secure_desktop == 'true' }}
          SEL_WINDOW: ${{ needs.changes.outputs.window == 'true' }}
          SEL_MOBILE_SCRIPTS: ${{ needs.changes.outputs.mobile == 'true' }}
          SEL_CORE_BUILD_LINUX: ${{ needs.changes.outputs.core_build == 'true' }}
          SEL_CORE_BUILD_MACOS: ${{ needs.changes.outputs.core_build == 'true' && needs.changes.outputs.core_macos == 'true' }}
          SEL_CORE_BUILD_WINDOWS: ${{ needs.changes.outputs.core_build == 'true' && needs.changes.outputs.core_windows == 'true' }}
          SEL_MIXDOGD_LINUX: ${{ needs.changes.outputs.mixdogd_linux == 'true' }}
          SEL_MIXDOGD_WINDOWS: ${{ needs.changes.outputs.mixdogd_windows == 'true' }}
          SEL_CORE_TESTS_LINUX: ${{ needs.changes.outputs.core == 'true' }}
          SEL_CORE_TESTS_MACOS: ${{ needs.changes.outputs.core == 'true' && needs.changes.outputs.core_macos == 'true' }}
          SEL_CORE_TESTS_WINDOWS: ${{ needs.changes.outputs.core == 'true' && needs.changes.outputs.core_windows == 'true' }}
          SEL_CORE_LIST_LINUX: ${{ needs.changes.outputs.core == 'true' }}
          SEL_CORE_LIST_MACOS: ${{ needs.changes.outputs.core == 'true' && needs.changes.outputs.core_macos == 'true' }}
          SEL_CORE_LIST_WINDOWS: ${{ needs.changes.outputs.core == 'true' && needs.changes.outputs.core_windows == 'true' }}
          SEL_CORE_DOCTESTS: ${{ needs.changes.outputs.core_doctests != '[]' }}
          SEL_CORE_ENTRY: ${{ needs.changes.outputs.core_entry == 'true' }}
          SEL_CORE_PG: ${{ needs.changes.outputs.core_pg == 'true' }}
          SEL_CORE_PG_MACOS: ${{ needs.changes.outputs.core_pg_macos == 'true' }}
          SEL_CORE_LINT: ${{ needs.changes.outputs.core == 'true' }}
          SEL_RUSTFMT: ${{ needs.changes.outputs.rustfmt == 'true' }}
          SEL_CORE_REAL: ${{ (github.event_name != 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.core_scripts == 'true')) || (github.event_name == 'pull_request' && needs.changes.outputs.core_scripts == 'true') }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]]
          # A full run (every event but a pull request) requires every job to have succeeded: a skipped job is a missing leg, whatever
          # selected it. Only a pull request, which runs the lanes its change can affect, may skip a job it did not select.
          gate() {
            if [[ "$FULL" == true || "$2" == true ]]; then
              [[ "$3" == success ]] || { echo "$1 was selected and ended $3" >&2; return 1; }
            else
              [[ "$3" == success || "$3" == skipped ]] || { echo "$1 was not selected and ended $3" >&2; return 1; }
            fi
          }
          gate inventory "$SEL_INVENTORY" "$INVENTORY"
          gate runtime "$SEL_RUNTIME" "$RUNTIME"
          gate runtime-slow "$SEL_RUNTIME_SLOW" "$RUNTIME_SLOW"
          gate runtime-macos "$SEL_RUNTIME_MACOS" "$RUNTIME_MACOS"
          gate computer-backend "$SEL_COMPUTER_BACKEND" "$COMPUTER_BACKEND"
          gate desktop "$SEL_DESKTOP" "$DESKTOP"
          gate desktop-tests "$SEL_DESKTOP_TESTS" "$DESKTOP_TESTS"
          gate desktop-computer "$SEL_DESKTOP_COMPUTER" "$DESKTOP_COMPUTER"
          gate desktop-slow "$SEL_DESKTOP_SLOW" "$DESKTOP_SLOW"
          gate relay "$SEL_RELAY" "$RELAY"
          gate relay-rust "$SEL_RELAY_RUST" "$RELAY_RUST"
          gate spawn "$SEL_SPAWN" "$SPAWN"
          gate packages "$SEL_PACKAGES" "$PACKAGES"
          gate patch "$SEL_PATCH" "$PATCH"
          gate graph "$SEL_GRAPH" "$GRAPH"
          gate browser-import "$SEL_BROWSER_IMPORT" "$BROWSER_IMPORT"
          gate secure-desktop "$SEL_SECURE_DESKTOP" "$SECURE_DESKTOP"
          gate window "$SEL_WINDOW" "$WINDOW"
          gate mobile-scripts "$SEL_MOBILE_SCRIPTS" "$MOBILE_SCRIPTS"
          gate core-build-linux "$SEL_CORE_BUILD_LINUX" "$CORE_BUILD_LINUX"
          gate core-build-macos "$SEL_CORE_BUILD_MACOS" "$CORE_BUILD_MACOS"
          gate core-build-windows "$SEL_CORE_BUILD_WINDOWS" "$CORE_BUILD_WINDOWS"
          gate mixdogd-linux "$SEL_MIXDOGD_LINUX" "$MIXDOGD_LINUX"
          gate mixdogd-windows "$SEL_MIXDOGD_WINDOWS" "$MIXDOGD_WINDOWS"
          gate core-tests-linux "$SEL_CORE_TESTS_LINUX" "$CORE_TESTS_LINUX"
          gate core-tests-macos "$SEL_CORE_TESTS_MACOS" "$CORE_TESTS_MACOS"
          gate core-tests-windows "$SEL_CORE_TESTS_WINDOWS" "$CORE_TESTS_WINDOWS"
          gate core-list-linux "$SEL_CORE_LIST_LINUX" "$CORE_LIST_LINUX"
          gate core-list-macos "$SEL_CORE_LIST_MACOS" "$CORE_LIST_MACOS"
          gate core-list-windows "$SEL_CORE_LIST_WINDOWS" "$CORE_LIST_WINDOWS"
          gate core-doctests "$SEL_CORE_DOCTESTS" "$CORE_DOCTESTS"
          gate core-entry "$SEL_CORE_ENTRY" "$CORE_ENTRY"
          gate core-pg "$SEL_CORE_PG" "$CORE_PG"
          gate core-pg-macos "$SEL_CORE_PG_MACOS" "$CORE_PG_MACOS"
          gate core-lint "$SEL_CORE_LINT" "$CORE_LINT"
          gate rustfmt "$SEL_RUSTFMT" "$RUSTFMT"
          gate core-real "$SEL_CORE_REAL" "$CORE_REAL"
      # The proof. A full run has no way to be green without it: the manifest of the commit (what the source defines) is compared with the
      # evidence every declared leg and slot left (what the lanes executed), per case, platform and slot, against the reviewed plan and
      # the reviewed exceptions (scripts/ci/coverage/reconcile.mjs). Successful jobs not rerun retain their artifacts in this run;
      # rerun producers replace their own artifacts. Every leg's receipts must still come from one attempt of this run and commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: needs.changes.outputs.full == 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node-ci
        if: needs.changes.outputs.full == 'true'
        with:
          cache-dependency-path: package-lock.json
      - name: Install
        if: needs.changes.outputs.full == 'true'
        shell: bash
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Download the manifest
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-manifest-${{ env.GATE_KEY }}
          path: coverage
      - name: Download the evidence of every leg
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-${{ env.GATE_KEY }}-*
          path: evidence
      - name: Download the nextest listings of every build variant
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-lists-${{ env.GATE_KEY }}-*
          path: rust-lists
      - name: Reconcile what the source defines with what the lanes executed
        if: needs.changes.outputs.full == 'true'
        env:
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
          ALLOW_REUSED_EVIDENCE: "true"
        run: |
          node scripts/ci/coverage/cli.mjs reconcile --root . --manifest coverage/manifest.json --evidence evidence --rust-lists rust-lists \
            --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW_REF"
