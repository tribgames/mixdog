name: desktop-package

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      release_id:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      artifact_arch:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: desktop-${{ inputs.platform }}-${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      MIXDOG_RUNTIME_DEPENDENCY_CACHE: >-
        ${{ github.workspace }}/.cache/runtime-dependencies/${{ inputs.platform }}-${{ inputs.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Resolve package and runtime cache keys
        id: runtime-dependencies
        shell: bash
        run: |
          echo "key=$(node scripts/runtime-dependency-cache-key.mjs \
            --platform=${{ inputs.platform }} --arch=${{ inputs.arch }})" >> "$GITHUB_OUTPUT"
          echo "npm_key=$(node scripts/dependency-lock-cache-key.mjs \
            apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"
          echo "manifest_key=$(node scripts/manifest-cache-key.mjs \
            package.json package-lock.json apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"
          echo "npm_cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      # Restore and save are split: actions/cache saves in its post step and
      # skips it when the job fails, so a packaging or verification failure
      # after a five-minute Windows runtime preparation threw that work away
      # and the retry paid it again. The explicit save below runs the moment
      # the runtime is prepared, before anything downstream can fail.
      - name: Restore prepared runtime archive
        id: prepared-runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.runtime
          key: desktop-prepared-runtime-v4-${{ steps.runtime-dependencies.outputs.key }}-${{ steps.runtime-dependencies.outputs.manifest_key }}-${{ hashFiles('README.md', 'NOTICE.md', 'LICENSES/**', 'scripts/**', '!scripts/*-test.mjs', '!scripts/*.test.mjs', '!scripts/*-bench.mjs', 'src/**', '!src/**/*.test.mjs', '!src/**/*.test.jsx', 'vendor/**', 'apps/desktop/scripts/prepare-runtime.mjs', 'apps/desktop/scripts/runtime-package-payload.mjs') }}
      - name: Restore Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package-lock.json') }}
          restore-keys: desktop-electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore stable desktop npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.runtime-dependencies.outputs.npm_cache }}
          key: desktop-npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-dependencies.outputs.npm_key }}
      - name: Restore pruned runtime dependencies
        id: runtime-dependency-cache
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MIXDOG_RUNTIME_DEPENDENCY_CACHE }}
          key: desktop-${{ steps.runtime-dependencies.outputs.key }}
      # The Windows runtime bundles the Chrome password importer, which
      # prepare-runtime builds from the pinned upstream Rust source: a sparse
      # clone plus two release cargo builds, ~230s of the ~280s Windows
      # preparation, repeated on every release because nothing restored its
      # output. prepare-runtime keeps a source-hash marker beside the built
      # files and skips the build when it matches, so restoring that directory
      # under the same hash makes the step free.
      - name: Restore built browser importer
        id: browser-import
        if: >-
          inputs.platform == 'win32'
          && steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.cache/browser-import
          key: desktop-browser-import-v1-${{ inputs.arch }}-${{ hashFiles('native/mixdog-browser-import/**', '!native/mixdog-browser-import/dist/**', '!native/mixdog-browser-import/target/**') }}
      - name: Install desktop dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: apps/desktop
      - name: Prepare platform runtime
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        shell: bash
        working-directory: apps/desktop
        run: |
          MIXDOG_RUNTIME_NPM_CACHE="$(npm config get cache)" \
          npm run prepare:runtime -- --platform=${{ inputs.platform }} --arch=${{ inputs.arch }}
      - name: Save pruned runtime dependencies
        if: >-
          steps.prepared-runtime.outputs.cache-hit != 'true'
          && steps.runtime-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MIXDOG_RUNTIME_DEPENDENCY_CACHE }}
          key: desktop-${{ steps.runtime-dependencies.outputs.key }}
      - name: Save prepared runtime archive
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.runtime
          key: ${{ steps.prepared-runtime.outputs.cache-primary-key }}
      - name: Save built browser importer
        if: >-
          inputs.platform == 'win32'
          && steps.prepared-runtime.outputs.cache-hit != 'true'
          && steps.browser-import.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.cache/browser-import
          key: ${{ steps.browser-import.outputs.cache-primary-key }}
      - name: Download common desktop output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-out
          path: apps/desktop/out
      - name: Build Windows installer
        if: inputs.platform == 'win32'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          npm run brand:win
          npx --no-install electron-builder --win --x64 --publish never
      - name: Build Unix desktop package
        if: inputs.platform != 'win32'
        shell: bash
        working-directory: apps/desktop
        run: npx --no-install electron-builder --${{ inputs.target }} --${{ inputs.arch }} --publish never
      - name: Verify packaged updater metadata
        run: npm run verify:update-metadata
        working-directory: apps/desktop
      # Source-shape packaging invariants (packaging.test.mjs) run in the
      # release gate on every push; only the built artifact is checked here.
      - name: Verify this platform's packaged runtime layout
        run: npm run verify:packaging-artifact
        working-directory: apps/desktop
      - name: Smoke packaged desktop memory runtime
        if: inputs.platform != 'win32'
        run: npm run verify:packaged-runtime
        working-directory: apps/desktop
      # The release is still a hidden draft here. Uploading while the packaged
      # runtime smoke runs is safe: either failure keeps publish blocked, and a
      # recovery run clobbers the unpublished assets.
      - name: Smoke and upload verified Windows assets in parallel
        if: inputs.platform == 'win32'
        timeout-minutes: 8
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -uo pipefail
          assets=(
            apps/desktop/dist/mixdog-desktop-win-x64.exe
            apps/desktop/dist/mixdog-desktop-win-x64.exe.blockmap
            apps/desktop/dist/latest.yml
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          bash .github/scripts/upload-release-assets.sh "${assets[@]}" &
          upload_pid=$!
          smoke_status=0
          npm run verify:packaged-runtime --prefix apps/desktop || smoke_status=$?
          upload_status=0
          wait "$upload_pid" || upload_status=$?
          test "$smoke_status" -eq 0
          test "$upload_status" -eq 0
      - name: Upload verified macOS assets to hidden draft
        if: inputs.platform == 'darwin'
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "apps/desktop/dist/mixdog-desktop-mac-${{ inputs.artifact_arch }}.dmg"
            "apps/desktop/dist/mixdog-desktop-mac-${{ inputs.artifact_arch }}.zip"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          if [[ "${{ inputs.arch }}" == x64 ]]; then
            bash .github/scripts/upload-release-assets.sh "${assets[@]}"
          else
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          fi
      - name: Upload verified Linux asset to hidden draft
        if: inputs.platform == 'linux'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          asset="apps/desktop/dist/mixdog-desktop-linux-${{ inputs.artifact_arch }}.AppImage"
          test -f "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
