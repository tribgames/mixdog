name: desktop-package

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      release_id:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      artifact_arch:
        required: true
        type: string
      target:
        required: true
        type: string
    # Developer ID signing and notarization for the macOS package. Only the
    # darwin caller passes them; without the full set the app stays unsigned.
    secrets:
      MAC_CERTIFICATE_P12_BASE64:
        required: false
      MAC_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      # Azure Artifact Signing service principal for the Windows installer.
      # Only the win32 caller passes them; without the full set it stays unsigned.
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: desktop-${{ inputs.platform }}-${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: write # upload assets to the hidden draft release
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      # Outside the checkout: electron-builder runs CommonJS helpers (icon-tool.js)
      # from this cache, and the repo's "type": "module" would load them as ESM.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../electron-builder-cache
      MIXDOG_RUNTIME_DEPENDENCY_CACHE: >-
        ${{ github.workspace }}/.cache/runtime-dependencies/${{ inputs.platform }}-${{ inputs.arch }}
      # The macOS Computer Use backend's toolchain; its build cache key below
      # names it, so a toolchain bump rebuilds the backend.
      RUST_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Resolve package and runtime cache keys
        id: runtime-dependencies
        shell: bash
        run: |
          echo "key=$(node scripts/runtime-dependency-cache-key.mjs \
            --platform=${{ inputs.platform }} --arch=${{ inputs.arch }})" >> "$GITHUB_OUTPUT"
          echo "npm_key=$(node scripts/dependency-lock-cache-key.mjs \
            apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"
          echo "manifest_key=$(node scripts/manifest-cache-key.mjs \
            package.json package-lock.json apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"
          echo "npm_cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      # Restore and save are split: actions/cache saves in its post step and
      # skips it when the job fails, so a packaging or verification failure
      # after a five-minute Windows runtime preparation threw that work away
      # and the retry paid it again. The explicit save below runs the moment
      # the runtime is prepared, before anything downstream can fail.
      - name: Restore prepared runtime archive
        id: prepared-runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.runtime
          key: desktop-prepared-runtime-v4-${{ steps.runtime-dependencies.outputs.key }}-${{ steps.runtime-dependencies.outputs.manifest_key }}-${{ hashFiles('README.md', 'NOTICE.md', 'LICENSES/**', 'scripts/**', '!scripts/*-test.mjs', '!scripts/*.test.mjs', '!scripts/*-bench.mjs', 'src/**', '!src/**/*.test.mjs', '!src/**/*.test.jsx', 'vendor/**', 'apps/desktop/scripts/prepare-runtime.mjs', 'apps/desktop/scripts/runtime-package-payload.mjs', 'native/mixdog-computer/Cargo.toml', 'native/mixdog-computer/Cargo.lock', 'native/mixdog-computer/src/**') }}${{ inputs.platform == 'linux' && format('-glibc228-{0}', hashFiles('native/mixdog-graph/**', 'native/mixdog-patch/**', 'apps/desktop/scripts/linux-build-native-old-glibc.sh')) || '' }}
      - name: Restore Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package-lock.json') }}
          restore-keys: desktop-electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore stable desktop npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.runtime-dependencies.outputs.npm_cache }}
          key: desktop-npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-dependencies.outputs.npm_key }}
      - name: Restore pruned runtime dependencies
        id: runtime-dependency-cache
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MIXDOG_RUNTIME_DEPENDENCY_CACHE }}
          key: desktop-${{ steps.runtime-dependencies.outputs.key }}
      # The Windows runtime bundles the Chrome password importer, which
      # prepare-runtime builds from the pinned upstream Rust source: a sparse
      # clone plus two release cargo builds, ~230s of the ~280s Windows
      # preparation, repeated on every release because nothing restored its
      # output. prepare-runtime keeps a source-hash marker beside the built
      # files and skips the build when it matches, so restoring that directory
      # under the same hash makes the step free.
      - name: Restore built browser importer
        id: browser-import
        if: >-
          inputs.platform == 'win32'
          && steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.cache/browser-import
          key: desktop-browser-import-v1-${{ inputs.arch }}-${{ hashFiles('native/mixdog-browser-import/**', '!native/mixdog-browser-import/dist/**', '!native/mixdog-browser-import/target/**') }}
      # macOS bundles the native Computer Use backend, which prepare-runtime
      # builds from native/mixdog-computer for the target. Linux packages the
      # glibc 2.28 build instead (MIXDOG_COMPUTER_NATIVE_BIN below), and
      # prepare-runtime returns before any cargo call when that is set, so
      # Linux needs no toolchain.
      - name: Install Rust for the Computer Use backend
        if: >-
          inputs.platform == 'darwin'
          && steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ inputs.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
      # Every source change misses the prepared-runtime key above, and the
      # backend's release build then ran again although its own crate had not
      # changed. prepare-runtime keeps a source-hash marker beside the built
      # binary and skips the build when it matches, as with the Windows
      # browser importer; the restored binary is still checked for the target
      # architecture before it is packaged and signed.
      - name: Restore built Computer Use backend
        id: computer-native
        if: >-
          inputs.platform == 'darwin'
          && steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.cache/computer-native
          key: desktop-computer-native-v1-${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.runner }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('native/mixdog-computer/**', '!native/mixdog-computer/target/**') }}
      # Retried for a transient registry failure; a deterministic one fails
      # all three attempts.
      - name: Install desktop dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
        working-directory: apps/desktop
      # Linux ships mixdog-computer/-graph/-patch built in manylinux_2_28
      # (native tools glibc 2.28; the package floor is 2.31 because of the
      # runtime); graph and patch must come from there, never from the
      # pinned release download, which is built against a newer glibc.
      - name: Download glibc 2.28 Linux native tools
        if: inputs.platform == 'linux'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-tools-glibc228-${{ inputs.arch }}
          path: native-out
      - name: Select glibc 2.28 native tools for packaging
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          chmod +x native-out/mixdog-*
          echo "MIXDOG_COMPUTER_NATIVE_BIN=$PWD/native-out/mixdog-computer" >> "$GITHUB_ENV"
          echo "MIXDOG_NATIVE_TOOLS_OVERRIDE_DIR=$PWD/native-out" >> "$GITHUB_ENV"
          echo "MIXDOG_NATIVE_TOOLS_REQUIRE_OVERRIDE=graph,patch" >> "$GITHUB_ENV"
      # The network-bound parts (the staging npm ci with onnxruntime-node's
      # NuGet download of the CUDA provider libraries the linux-x64 app ships,
      # native tool and importer source downloads) are retried. A failed
      # attempt removes its partial state; a deterministic failure fails all
      # three attempts.
      - name: Prepare platform runtime
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        shell: bash
        working-directory: apps/desktop
        run: |
          for attempt in 1 2 3; do
            MIXDOG_RUNTIME_NPM_CACHE="$(npm config get cache)" \
            npm run prepare:runtime -- --platform=${{ inputs.platform }} --arch=${{ inputs.arch }} && exit 0
            echo "prepare:runtime failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 15))
          done
          exit 1
      - name: Save pruned runtime dependencies
        if: >-
          steps.prepared-runtime.outputs.cache-hit != 'true'
          && steps.runtime-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MIXDOG_RUNTIME_DEPENDENCY_CACHE }}
          key: desktop-${{ steps.runtime-dependencies.outputs.key }}
      - name: Save prepared runtime archive
        if: steps.prepared-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.runtime
          key: ${{ steps.prepared-runtime.outputs.cache-primary-key }}
      - name: Save built browser importer
        if: >-
          inputs.platform == 'win32'
          && steps.prepared-runtime.outputs.cache-hit != 'true'
          && steps.browser-import.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.cache/browser-import
          key: ${{ steps.browser-import.outputs.cache-primary-key }}
      - name: Save built Computer Use backend
        if: >-
          inputs.platform == 'darwin'
          && steps.prepared-runtime.outputs.cache-hit != 'true'
          && steps.computer-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.cache/computer-native
          key: ${{ steps.computer-native.outputs.cache-primary-key }}
      # Runs on a restored cache as well as a fresh preparation: it compares
      # the versions inside runtime.asar, its unpacked sidecar and the shipped
      # node-pty with the lockfiles, so a stale cache or install cannot ship.
      - name: Verify packaged runtime dependency versions match the lockfiles
        shell: bash
        run: node scripts/verify-runtime-dependency-versions.mjs
      - name: Download common desktop output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-out
          path: apps/desktop/out
      - name: Build Windows installer
        id: windows-package
        if: inputs.platform == 'win32'
        shell: pwsh
        working-directory: apps/desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Repository variable: the certificate subject CN, which
          # electron-builder requires as azureSignOptions.publisherName.
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          # Sign through Azure Artifact Signing only with the complete service
          # principal set plus the publisher name; electron-builder's
          # TrustedSigning module reads the credentials from the environment.
          # A partial set fails instead of silently shipping an unsigned
          # installer.
          $names = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_PUBLISHER_NAME'
          $present = @($names | Where-Object { [Environment]::GetEnvironmentVariable($_) }).Count
          $signArgs = @()
          $signed = 'false'
          if ($present -eq $names.Count) {
            $signArgs = @(
              '-c.win.azureSignOptions.endpoint=https://krc.codesigning.azure.net/',
              '-c.win.azureSignOptions.codeSigningAccountName=tribgamessigning',
              '-c.win.azureSignOptions.certificateProfileName=tribgames-public',
              "-c.win.azureSignOptions.publisherName=$env:AZURE_PUBLISHER_NAME"
            )
            $signed = 'true'
            # Install the signing module once, up front: electron-builder's own
            # install runs per file, in parallel and non-interactively, and left
            # Invoke-TrustedSigning missing for every file.
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name TrustedSigning -Scope CurrentUser -Force -Repository PSGallery
            Import-Module TrustedSigning
            if (-not (Get-Command Invoke-TrustedSigning -ErrorAction SilentlyContinue)) {
              Write-Output '::error title=Windows signing unavailable::The TrustedSigning module did not install.'
              exit 1
            }
          } elseif ($present -eq 0) {
            Write-Output '::warning title=Unsigned Windows installer::Artifact Signing is not configured; packaging an unsigned installer.'
          } else {
            Write-Output '::error title=Incomplete Windows signing configuration::Configure the three AZURE_* secrets and the AZURE_PUBLISHER_NAME variable, or none of them.'
            exit 1
          }
          "signed=$signed" >> $env:GITHUB_OUTPUT
          npm run brand:win
          npx --no-install electron-builder --win --x64 --publish never @signArgs
      - name: Verify Windows signatures
        if: inputs.platform == 'win32' && steps.windows-package.outputs.signed == 'true'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          foreach ($file in 'dist/win-unpacked/Mixdog.exe', 'dist/mixdog-desktop-win-x64.exe') {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid') {
              throw "$file signature is $($signature.Status): $($signature.StatusMessage)"
            }
            Write-Output "$file signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Build Unix desktop package
        id: unix-package
        if: inputs.platform != 'win32'
        shell: bash
        working-directory: apps/desktop
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          signed=false
          if [ "${{ inputs.platform }}" = darwin ]; then
            # Sign and notarize only with the complete credential set: a signed
            # but un-notarized app is still blocked by Gatekeeper, so a partial
            # set fails here instead of shipping one.
            present=0
            for name in MAC_CERTIFICATE_P12_BASE64 MAC_CERTIFICATE_PASSWORD \
              APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
              if [ -n "${!name}" ]; then present=$((present + 1)); fi
            done
            if [ "$present" -eq 5 ]; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
              chmod 600 "$key_path"
              # electron-builder imports the base64 .p12 into a temporary
              # keychain and notarizes through notarytool with the API key.
              export CSC_LINK="$MAC_CERTIFICATE_P12_BASE64"
              export CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
              export APPLE_API_KEY="$key_path"
              signed=true
            elif [ "$present" -eq 0 ]; then
              echo "::warning title=Unsigned macOS package::Developer ID signing secrets are not configured; packaging an unsigned app."
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            else
              echo "::error title=Incomplete macOS signing secrets::Configure all five Developer ID secrets or none."
              exit 1
            fi
          fi
          unset MAC_CERTIFICATE_P12_BASE64 MAC_CERTIFICATE_PASSWORD APPLE_API_KEY_P8
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          npx --no-install electron-builder --${{ inputs.target }} --${{ inputs.arch }} --publish never
      - name: Verify macOS signature and notarization
        if: inputs.platform == 'darwin' && steps.unix-package.outputs.signed == 'true'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          app="$(find dist -maxdepth 2 -type d -name 'Mixdog.app' | head -n 1)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # stapler validate looks the ticket up on Apple's CloudKit service;
          # a dropped connection there (NSURLError -1005, exit 68) is retried.
          # An invalid ticket fails every attempt.
          for attempt in 1 2 3 4; do
            if xcrun stapler validate "$app"; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            echo "stapler validate failed (attempt $attempt); retrying in 30s"
            sleep 30
          done
          spctl --assess --type execute --verbose=4 "$app"
      - name: Verify Linux package payloads (native-tool hashes, glibc floor <= 2.31)
        if: inputs.platform == 'linux'
        shell: bash
        run: bash apps/desktop/scripts/linux-verify-package.sh apps/desktop/dist native-out ${{ inputs.arch }} 2.31 extract
      - name: Verify packaged updater metadata
        run: npm run verify:update-metadata
        working-directory: apps/desktop
      # Source-shape packaging invariants (packaging.test.mjs) run in the
      # release gate on every push; only the built artifact is checked here.
      - name: Verify this platform's packaged runtime layout
        run: npm run verify:packaging-artifact
        working-directory: apps/desktop
      - name: Smoke packaged desktop memory runtime
        if: inputs.platform != 'win32'
        run: npm run verify:packaged-runtime
        working-directory: apps/desktop
      # The release is still a hidden draft here. Uploading while the packaged
      # runtime smoke runs is safe: either failure keeps publish blocked, and a
      # recovery run clobbers the unpublished assets.
      - name: Smoke and upload verified Windows assets in parallel
        if: inputs.platform == 'win32'
        timeout-minutes: 8
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -uo pipefail
          assets=(
            apps/desktop/dist/mixdog-desktop-win-x64.exe
            apps/desktop/dist/mixdog-desktop-win-x64.exe.blockmap
            apps/desktop/dist/latest.yml
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          bash .github/scripts/upload-release-assets.sh "${assets[@]}" &
          upload_pid=$!
          smoke_status=0
          npm run verify:packaged-runtime --prefix apps/desktop || smoke_status=$?
          upload_status=0
          wait "$upload_pid" || upload_status=$?
          test "$smoke_status" -eq 0
          test "$upload_status" -eq 0
      - name: Upload verified macOS assets to hidden draft
        if: inputs.platform == 'darwin'
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "apps/desktop/dist/mixdog-desktop-mac-${{ inputs.artifact_arch }}.dmg"
            "apps/desktop/dist/mixdog-desktop-mac-${{ inputs.artifact_arch }}.zip"
            # The differential updater downloads <zip>.blockmap next to the zip.
            "apps/desktop/dist/mixdog-desktop-mac-${{ inputs.artifact_arch }}.zip.blockmap"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          # latest-mac.yml is not uploaded here: each architecture builds its
          # own feed, and the publish job merges both into the one feed that
          # electron-updater reads (scripts/merge-mac-update-feed.mjs).
          test -f apps/desktop/dist/latest-mac.yml
          # A recovery run finds the earlier attempt's assets on the draft;
          # `gh release upload --clobber` then fails with 422 "ReleaseAsset.name
          # already exists". The script deletes the remote asset first and
          # retries once over bounded HTTP/1.1, so both architectures use it.
          bash .github/scripts/upload-release-assets.sh "${assets[@]}"
      - name: Upload macOS update feed artifact for the publish job
        if: inputs.platform == 'darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-mac-feed-${{ inputs.arch }}
          path: apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
          overwrite: true
      - name: Upload verified Linux asset to hidden draft
        if: inputs.platform == 'linux'
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          asset="apps/desktop/dist/mixdog-desktop-linux-${{ inputs.artifact_arch }}.AppImage"
          # electron-updater on Linux reads latest-linux.yml (x64) or latest-linux-arm64.yml (arm64).
          feed=apps/desktop/dist/latest-linux.yml
          [ "${{ inputs.artifact_arch }}" = arm64 ] && feed=apps/desktop/dist/latest-linux-arm64.yml
          # A .deb install updates through DebUpdater, which downloads the .deb
          # named in the feed, so the .deb is a release asset too.
          deb_arch=amd64
          [ "${{ inputs.arch }}" = arm64 ] && deb_arch=arm64
          deb="apps/desktop/dist/mixdog-desktop-linux-${deb_arch}.deb"
          test -f "$asset"
          test -f "$deb"
          test -f "$feed"
          # Every file the feed references must be among the uploaded assets.
          for ref in $(grep -E '^\s*(-\s+)?(url|path):' "$feed" | sed -E "s/^\s*(-\s+)?(url|path):\s*//; s/['\"]//g"); do
            case "$ref" in
              "$(basename "$asset")"|"$(basename "$deb")") ;;
              *) echo "::error::$feed references $ref, which is not uploaded"; exit 1 ;;
            esac
          done
          grep -q "$(basename "$deb")" "$feed"
          # Same bounded uploader as macOS and Windows: `gh release upload
          # --clobber` stalled past the step timeout twice on arm64 (v0.9.170)
          # once the draft already held the earlier attempt's asset.
          bash .github/scripts/upload-release-assets.sh "$asset" "$deb" "$feed"
