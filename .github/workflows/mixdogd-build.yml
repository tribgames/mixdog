# Builds every program of every platform ONCE per run, for the targets a desktop package or the npm package carries:
#   mixdogd and mixdog-askpass  the core and its ssh helper: the mixdogd-<target> artifact. The desktop packages carry the
#                               app's own core (Windows x64, macOS and Linux per arch) and the four server cores the SSH
#                               install uploads (Linux x64/arm64, macOS x64/arm64): apps/desktop/scripts/stage-core.mjs
#                               stages them all into every package from native/core/target/<target>/release (the
#                               .github/actions/stage-mixdogd action lays the artifacts out that way). The npm package
#                               takes both from the same artifact.
#   mixdog                      the terminal program (crate mixdog-entry): the mixdog-entry-<target> artifact, for the npm
#                               platform packages (scripts/stage-npm-native.mjs). Its name does not match mixdogd-*, so the
#                               desktop jobs do not download it.
#   mixdog-relay                the relay server (a program of its own that is not staged into any package), built on the
#                               Linux x64 leg only, in the same container and target directory as the core so the crates they
#                               share compile once, and uploaded as mixdog-relay-x86_64-unknown-linux-gnu after a smoke start.
#                               The production box is x64: no arm64 relay is built, nothing downloads one.
# Windows on Arm has no leg: the x64 programs run there (scripts/npm-platforms.mjs).
# Linux is built inside manylinux_2_28 (glibc 2.28) like the other Linux native tools, so the package's glibc floor does not
# follow the runner's. Mixdog's Google OAuth client is embedded by the crate's build script from the two secrets (both or
# neither). The release profile (native/core/Cargo.toml) strips the symbols and does not LTO link. Compiled crates are not cached:
# sccache on the GitHub cache wrote an entry per crate and target (3.4 GB in the first half hour of run 46008650381, 395
# refused writes on one leg) into the 10 GB the repository shares, which evicted the gate's dependency entries and its own.
# Each program starts once on its own OS before it is uploaded (the x86_64 macOS leg cannot run its own binary).
# Called once per run: the artifact names are unique per run.
name: mixdogd-build

on:
  # A run from any commit produces the programs and the relay binary without a release (artifacts only, nothing is deployed).
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA to build (defaults to the SHA the run was started on)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to build (defaults to the caller's github.sha)"
        required: false
        type: string
        default: ""
    secrets:
      MIXDOG_GOOGLE_OAUTH_CLIENT_ID:
        required: false
      MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET:
        required: false
      # Lists the project's own runners (job `runners`); without it every leg builds on its hosted runner.
      RUNNER_STATUS_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The project's own runners that are online now, read with a token that may list them (the workflow's own may not): a leg
  # that names one (`own`) builds there while it is on, and on its hosted runner otherwise or when the read fails.
  runners:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      online: ${{ steps.read.outputs.online }}
    steps:
      - id: read
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          online=""
          if [ -n "$RUNNER_STATUS_TOKEN" ]; then
            online=$(curl -fsS --max-time 20 -H "Authorization: Bearer $RUNNER_STATUS_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
              | jq -r '[.runners[] | select(.status == "online") | .name] | join(",")') || online=""
          fi
          echo "own machines online: ${online:-none}"
          echo "online=,$online," >> "$GITHUB_OUTPUT"

  build:
    name: mixdogd-${{ matrix.target }}
    needs: runners
    runs-on: ${{ matrix.own && contains(needs.runners.outputs.online, format(',{0},', matrix.own)) && matrix.own || matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows and macOS legs build on the project's own machines while those are on (the PC's twenty cores, the M4's
          # ten): the hosted Intel Mac compiled mixdogd in 71 minutes and every package waited for it, the hosted Windows runner
          # in 39 (run 46008650381).
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, own: mixdog-pc, exe: ".exe", run_version: true }
          # A runner of its own on the M4, so the two macOS legs build side by side.
          - { target: aarch64-apple-darwin, runner: macos-15, own: mixdog-m4-build2, exe: "", run_version: true }
          # libvpx has no prebuilt for this target and is built from its source: on an Intel runner for its host, on the M4
          # for the target ("Build the programs").
          - { target: x86_64-apple-darwin, runner: macos-15-intel, own: mixdog-m4-build, exe: "", run_version: true, nasm: true }
          # The Linux legs build on the PC's Linux while it is on, each on a runner of its own, and keep the container's build
          # folder: a hosted runner compiled each from nothing in 28 minutes (run 46071779966). The arm64 leg cross-builds
          # there (`cross`: the Dockerfile of an x86_64 image whose compiler targets arm64 with the same glibc 2.28): the
          # project's arm64 server, four cores, took 27.3 minutes with its third-party crates already built (run 46079321231),
          # the PC 10 from nothing. The arm64 programs then start in `image` under emulation.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, own: mixdog-pc-linux, exe: "", run_version: true, relay: true, image: "quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae" }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, own: mixdog-pc-linux2, exe: "", run_version: true, image: "quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6", cross: apps/desktop/scripts/linux-cross-arm64.Dockerfile }
    env:
      MIXDOG_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.MIXDOG_GOOGLE_OAUTH_CLIENT_ID }}
      MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      # The project's own machine keeps its build folder (an ignored path, which a clean would remove) between runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: ./.github/actions/assert-sha
        with:
          expected: ${{ inputs.ref || github.sha }}
      - name: Install Rust
        if: ${{ !matrix.image }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      # Deploy rewrites the workspace crates' version in Cargo.lock on every release; the digest ignores it.
      - name: Resolve the version-neutral Cargo.lock key
        id: cargo-lock
        run: echo "key=$(node scripts/cargo-cache-key.mjs native/core/Cargo.lock)" >> "$GITHUB_OUTPUT"
      # The kept build folder holds what one compiler built of one set of third-party packages: a build with another reads none
      # of it, so the folder is emptied then, and the machine holds one build folder's worth.
      - name: Empty the kept build folder when the compiler or the third-party packages changed (the project's own machine)
        if: ${{ !matrix.image && runner.environment == 'self-hosted' }}
        run: |
          stamp="$(rustc +1.99.1 --version) ${{ steps.cargo-lock.outputs.key }}"
          if [[ -d native/core/target && "$(cat native/core/target/.build-stamp 2>/dev/null)" != "$stamp" ]]; then rm -rf native/core/target; fi
          mkdir -p native/core/target
          printf '%s' "$stamp" > native/core/target/.build-stamp
      # A hosted runner's: the project's own machine keeps its registry.
      - name: Cache cargo registry
        if: ${{ !matrix.image && runner.environment == 'github-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mixdogd-cargo-${{ matrix.target }}-${{ steps.cargo-lock.outputs.key }}
          restore-keys: mixdogd-cargo-${{ matrix.target }}-
      # The container's CARGO_HOME registry and git directories live on the runner, so the container can be thrown away.
      # A hosted runner's: the project's own machine keeps them, and the build folder, in its home.
      - name: Cache cargo registry (container)
        if: ${{ matrix.image && runner.environment == 'github-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-registry
            ${{ runner.temp }}/cargo-git
          key: mixdogd-cargo-${{ matrix.target }}-${{ steps.cargo-lock.outputs.key }}
          restore-keys: mixdogd-cargo-${{ matrix.target }}-
      # libvpx's x86 assembly.
      # libvpx built from its source: nasm assembles it, and the crate's build script reads the archive with llvm-nm.
      - name: Install nasm and llvm-tools
        if: ${{ matrix.nasm }}
        run: |
          brew install nasm
          rustup component add llvm-tools
      # One cargo invocation per program, one target directory: the crates they share compile once, and the features
      # each binary is built with stay its own.
      - name: Build the programs
        if: ${{ !matrix.image }}
        env:
          MACOS: ${{ runner.os == 'macOS' }}
          X86_64_ON_ARM: ${{ matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64' }}
        run: |
          if [ "$MACOS" = true ]; then
            # No library of the machine: a crate that finds one through pkg-config (pcre2 in Homebrew) links the program to a
            # file its user does not have, and one of another architecture fails the link. With none found each builds its own.
            mkdir -p "$RUNNER_TEMP/no-pkg-config"
            export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/no-pkg-config"
          fi
          if [ "$X86_64_ON_ARM" = true ]; then
            # libvpx's configure takes its architecture from `uname -m` for every Darwin from 20 on and x86_64 for those
            # before (build/make/configure.sh, process_common_toolchain): named Darwin 19, it builds for the target.
            export CHOST=x86_64-apple-darwin19
          fi
          cargo build --locked --release --manifest-path native/core/Cargo.toml -p mixdog-cli --bin mixdogd -p mixdog-askpass --bin mixdog-askpass --target ${{ matrix.target }}
          cargo build --locked --release --manifest-path native/core/Cargo.toml -p mixdog-entry --bin mixdog --target ${{ matrix.target }}
          cargo build --locked --release --manifest-path scripts/rust-core/tree-helper/Cargo.toml --target ${{ matrix.target }}
          mkdir -p out
          release="native/core/target/${{ matrix.target }}/release"
          cp "$release/mixdogd${{ matrix.exe }}" "$release/mixdog-askpass${{ matrix.exe }}" "$release/mixdog${{ matrix.exe }}" out/
          cp "scripts/rust-core/tree-helper/target/${{ matrix.target }}/release/treerun${{ matrix.exe }}" out/
      # A shipped program runs on a Mac that has only the system: it is of the leg's architecture and loads nothing from
      # outside /usr/lib and /System (a Homebrew or /usr/local library is on the build machine alone).
      - name: The macOS programs are of the target's architecture and load only system libraries
        if: ${{ runner.os == 'macOS' }}
        run: |
          arch=${{ startsWith(matrix.target, 'x86_64') && 'x86_64' || 'arm64' }}
          status=0
          for program in out/mixdogd out/mixdog-askpass out/mixdog out/treerun; do
            found=$(lipo -archs "$program")
            if [ "$found" != "$arch" ]; then echo "::error::$program is $found, not $arch"; status=1; fi
            foreign=$(otool -L "$program" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/)' || true)
            if [ -n "$foreign" ]; then echo "::error::$program loads $foreign"; status=1; fi
          done
          exit "$status"
      # The Linux legs build in one container (the core, the terminal program and the relay): the script
      # runs the cargo invocations and leaves the programs in out/.
      - name: Build the programs (glibc 2.28)
        if: ${{ matrix.image }}
        env:
          OWN_MACHINE: ${{ runner.environment == 'self-hosted' }}
          # The cross image's Dockerfile where the target is not the machine's architecture.
          CROSS: ${{ matrix.cross && runner.arch == 'X64' && matrix.cross || '' }}
        run: |
          IMAGE="${{ matrix.image }}"
          if [ -n "$CROSS" ]; then
            # Built once per Dockerfile and kept by the machine; one of an older Dockerfile is removed.
            IMAGE="mixdog-cross:$(sha256sum "$CROSS" | cut -c1-16)"
            if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
              docker images -q mixdog-cross | xargs -r docker rmi
              docker build -t "$IMAGE" - < "$CROSS"
            fi
          fi
          keep="$RUNNER_TEMP"
          target=()
          if [ "$OWN_MACHINE" = true ]; then
            # The build folder stays for the next run; the script empties it when what it was built of changes.
            keep="$HOME/mixdog-release-build"
            mkdir -p "$keep/target-${{ matrix.target }}"
            stamp="$IMAGE ${{ steps.cargo-lock.outputs.key }} $(sha256sum apps/desktop/scripts/linux-build-core-old-glibc.sh | cut -d' ' -f1)"
            target=(-v "$keep/target-${{ matrix.target }}:/tmp/target" -e "MIXDOG_BUILD_STAMP=$stamp")
          fi
          mkdir -p out "$keep/cargo-registry" "$keep/cargo-git"
          docker run --rm -e MIXDOG_GOOGLE_OAUTH_CLIENT_ID -e MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET \
            -e MIXDOG_BUILD_RELAY=${{ matrix.relay && '1' || '' }} \
            -v "$PWD:/w" -v "$keep/cargo-registry:/root/.cargo/registry" -v "$keep/cargo-git:/root/.cargo/git" "${target[@]}" \
            "$IMAGE" bash /w/apps/desktop/scripts/linux-build-core-old-glibc.sh 2>&1 | tee out/build.log
          test "${PIPESTATUS[0]}" -eq 0
          rm out/build.log
          test -x out/mixdogd && test -x out/mixdog-askpass && test -x out/mixdog && test -x out/treerun
          if [ -n "${{ matrix.relay }}" ]; then test -x out/mixdog-relay; fi
      # Both runners execute their own architecture. No renderer is configured; the port is the one the system picks.
      - name: The relay starts and answers /healthz
        if: ${{ matrix.relay }}
        run: |
          data="$RUNNER_TEMP/relay-data"
          log="$RUNNER_TEMP/relay.log"
          mkdir -p "$data"
          env -u RENDERER_DIR -u RENDERER_RELEASES_DIR PORT=0 DATA_DIR="$data" out/mixdog-relay > "$log" 2>&1 &
          pid=$!
          port=""
          for _ in $(seq 1 100); do
            port=$(sed -n 's/^\[relay\] http listening on :\([0-9][0-9]*\) .*/\1/p' "$log" | head -n 1)
            if [ -n "$port" ] || ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.1
          done
          status=0
          if [ -z "$port" ]; then
            echo "the relay printed no listening line"
            status=1
          else
            body=$(curl -fsS --max-time 10 "http://127.0.0.1:$port/healthz") || status=$?
            echo "healthz: $body"
            test "$body" = '{"status":"ok"}' || status=1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then cat "$log"; fi
          exit "$status"
      # The release workflow stages these into packages whose version is the
      # package.json one; stage-core.mjs checks the same on the host binary. Every
      # program starts here, on its own OS, before it is uploaded: the core reports
      # the version, the terminal program prints its usage (it has no version flag),
      # the ssh helper refuses a start with no endpoint (exit 2).
      - name: Every program starts and the core reports the release version
        if: ${{ matrix.run_version }}
        env:
          # A home of this run's own: on the project's own machine the default is the data of the Mixdog its user runs.
          MIXDOG_HOME: ${{ runner.temp }}/mixdog-home
          MIXDOG_DATA_DIR: ${{ runner.temp }}/mixdog-home/data
          CROSS_BUILT: ${{ matrix.cross && runner.arch == 'X64' }}
        run: |
          run=()
          if [ "$CROSS_BUILT" = true ]; then
            # Programs of another architecture start in the target's own image (its glibc 2.28), emulated; the container
            # has a home of its own.
            docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64 >/dev/null
            run=(docker run --rm --platform linux/arm64 -v "$PWD/out:$PWD/out:ro" -w "$PWD" ${{ matrix.image }})
          fi
          reported=$("${run[@]}" out/mixdogd${{ matrix.exe }} --version | awk '{print $NF}')
          expected=$(node -p "require('./package.json').version")
          echo "mixdogd reports $reported, release $expected"
          test "$reported" = "$expected"
          usage=$("${run[@]}" out/mixdog${{ matrix.exe }} --help)
          usage=${usage%%$'\n'*}
          echo "mixdog --help: $usage"
          case "$usage" in mixdog*) ;; *) echo "mixdog --help does not begin with its name"; exit 1 ;; esac
          status=0
          env -u MIXDOG_ASKPASS_ENDPOINT -u MIXDOG_ASKPASS_TOKEN "${run[@]}" out/mixdog-askpass${{ matrix.exe }} prompt >/dev/null 2>&1 || status=$?
          echo "mixdog-askpass with no endpoint exits $status"
          test "$status" -eq 2
      # The client is compiled into the binary; a release build without it would
      # ship with no built-in Google sign-in. Nothing is printed.
      - name: The core embeds the Google OAuth client
        if: ${{ env.MIXDOG_GOOGLE_OAUTH_CLIENT_ID != '' && env.MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET != '' }}
        run: grep -qaF -- "$MIXDOG_GOOGLE_OAUTH_CLIENT_ID" out/mixdogd${{ matrix.exe }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mixdogd-${{ matrix.target }}
          path: |
            out/mixdogd${{ matrix.exe }}
            out/mixdog-askpass${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mixdog-entry-${{ matrix.target }}
          path: out/mixdog${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 2
      # The process-tree helper every smoke of a shipped mixdogd starts its children through (scripts/rust-core/tree-helper);
      # the desktop packagers take it as MIXDOG_TREE_HELPER.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: treerun-${{ matrix.target }}
          path: out/treerun${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 2
      - name: Record the relay binary's actual source and digest
        if: ${{ matrix.relay }}
        run: node scripts/relay-artifact.mjs record out '${{ matrix.target }}' "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.relay }}
        with:
          name: mixdog-relay-${{ matrix.target }}
          path: |
            out/mixdog-relay
            out/relay-build.json
          if-no-files-found: error
          retention-days: 2
