name: Runtime platform smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: arm64, runner: macos-14 }
          - { platform: darwin, arch: x64, runner: macos-15-intel }
          - { platform: linux, arch: x64, runner: ubuntu-22.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-22.04-arm }
    name: memory-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify embedding and core memory runtime
        run: npm run test:embedding-runtime:core
