name: Runtime platform smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-platform-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Rust core installs the shipped embedding model into an empty cache and embeds the probe string through its
  # own ONNX Runtime (mixdog-services memory::embed), loading the same onnxruntime library the desktop ships
  # (core-layout.mjs `desktopOrtLibraryPath`). macOS x64 has no onnxruntime-node binding, so the core builds no
  # models there and has nothing to verify.
  rust-onnx-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: arm64, runner: macos-15, library: libonnxruntime.1.dylib }
          - { platform: linux, arch: x64, runner: ubuntu-22.04, library: libonnxruntime.so.1 }
          - { platform: linux, arch: arm64, runner: ubuntu-22.04-arm, library: libonnxruntime.so.1 }
    name: rust-onnx-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the onnxruntime library
        run: npm ci --prefer-offline --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
      - name: Embed the probe string with the shipped model
        working-directory: native/core
        env:
          MIXDOG_ORT_LIBRARY: ${{ github.workspace }}/node_modules/onnxruntime-node/bin/napi-v6/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.library }}
        run: cargo test --locked -p mixdog-services the_shipped_model_installs_and_embeds_a_probe_string -- --ignored