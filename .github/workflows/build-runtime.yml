# Build PG 16.4 + pgvector 0.8.2 runtime tarballs per supported OS.
# Call-only worker: Deploy and Refresh Runtime Manifest each run the full gate
# before calling it (scripts/ci/coverage/wiring.mjs).
# Linux job runs in ubuntu:20.04 container so produced binaries link against
# glibc 2.31 — works on every distro from Ubuntu 20.04 / Debian 11 forward.
# The full matrix smokes the exact tarballs before the aggregate job may publish them.

name: Build Runtime

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. runtime-v0.4.1)"
        required: false
        type: string
        default: "runtime-v0.4.1"
      sha:
        description: "The gated commit every job checks out and every release and tag is made at"
        required: true
        type: string
      force_rebuild:
        description: "Force rebuild even if content-hash marker exists"
        required: false
        type: boolean
        default: false
      refresh_manifest:
        description: "Unless forcing a build, regenerate the manifest artifact for a public runtime after re-verifying all five platforms"
        required: false
        type: boolean
        default: false
    outputs:
      # The tag the builds were published under (the gate may move a shipped
      # tag to the next patch tag) and whether anything was built.
      tag:
        description: "Tag the runtime tarballs were published under"
        value: ${{ jobs.gate.outputs.tag }}
      has_builds:
        description: "true when at least one platform was built"
        value: ${{ jobs.gate.outputs.has_builds }}
      manifest_id:
        description: "Immutable manifest artifact from the verified runtime set (empty on a no-op)"
        value: ${{ jobs.aggregate.outputs.manifest_id }}
      mode:
        description: "Worker disposition: build, recover, refresh, or skip"
        value: ${{ jobs.gate.outputs.mode }}
permissions:
  contents: read

concurrency:
  group: runtime-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate-content-hash
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REF: ${{ inputs.sha }}
      FORCE_REBUILD: ${{ inputs.force_rebuild }}
      REFRESH_MANIFEST: ${{ inputs.refresh_manifest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      has_builds: ${{ steps.check.outputs.has_builds }}
      tag: ${{ steps.check.outputs.tag }}
      mode: ${{ steps.check.outputs.mode }}
      refresh_commit: ${{ steps.check.outputs.refresh_commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/assert-sha
        with:
          expected: ${{ inputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Plan a new release, resume a release, or keep the shipped runtime
        id: check
        run: node scripts/generate-runtime-manifest.mjs plan

  build:
    name: build-${{ matrix.os }}-${{ matrix.arch }}
    needs: gate
    if: needs.gate.outputs.mode != 'skip'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ${{ matrix.container }}
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      RUNTIME_RELEASE_REPOSITORY: ${{ github.repository }}
      RUNTIME_SMOKE_INPUT: ${{ needs.gate.outputs.mode == 'build' && 'dist' || '' }}
      RUNTIME_SMOKE_OUTPUT: smoked
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x64, runner: ubuntu-22.04, container: 'ubuntu:20.04', script: scripts/build-runtime-linux.sh }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm, container: 'ubuntu:20.04', script: scripts/build-runtime-linux.sh }
          - { os: darwin, arch: arm64, runner: macos-15, container: '', script: scripts/build-runtime-macos.sh }
          - { os: darwin, arch: x64, runner: macos-15-intel, container: '', script: scripts/build-runtime-macos.sh }
          - { os: win32, arch: x64, runner: windows-2022, container: '', script: scripts/build-runtime-windows.ps1 }

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # Cache the PG + pgvector build directory so unchanged versions skip
      # the 5-8 min source compile on every run. Hash key includes the build
      # script — script changes invalidate the cache and force a fresh build.
      - name: Cache build artifacts
        if: needs.gate.outputs.mode == 'build'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: build-${{ matrix.os }}-${{ matrix.arch }}-pg16.4-pgvector0.8.2-${{ hashFiles(matrix.script) }}

      # Cache the chocolatey-installed PG 16 on Windows runners so we skip
      # the ~3 min `choco install postgresql16` step on subsequent runs.
      # windows-2022 runner image ships PG 14/15 by default — PG 16 must be
      # installed (or restored from this cache) every run.
      - name: Cache Windows PG 16 system install
        if: matrix.os == 'win32' && needs.gate.outputs.mode == 'build'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: 'C:\Program Files\PostgreSQL\16'
          key: pg16-system-win32-x64-16.4.0

      - name: Build (unix)
        if: runner.os != 'Windows' && needs.gate.outputs.mode == 'build'
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x ${{ matrix.script }}
          bash ${{ matrix.script }}
          ls -lh dist/

      - name: Build (windows)
        if: runner.os == 'Windows' && needs.gate.outputs.mode == 'build'
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          .\${{ matrix.script }}
          Get-ChildItem dist/

      - name: Smoke the runtime pair (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke-runtime-negative.sh

      - name: Smoke the runtime pair (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\smoke-runtime-negative.ps1

      - name: Stage only the tarball and sidecar that passed smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-smoked-${{ needs.gate.outputs.tag }}-${{ inputs.sha }}-${{ matrix.os }}-${{ matrix.arch }}
          path: smoked/
          if-no-files-found: error
          overwrite: true

  aggregate:
    name: publish-smoked-runtime
    needs: [gate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      manifest_id: ${{ steps.manifest.outputs.artifact-id }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      RELEASE_REF: ${{ inputs.sha }}
      RUNTIME_MODE: ${{ needs.gate.outputs.mode }}
      REFRESH_COMMIT: ${{ needs.gate.outputs.refresh_commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/assert-sha
        with:
          expected: ${{ inputs.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Download the five smoked runtime pairs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-smoked-${{ needs.gate.outputs.tag }}-${{ inputs.sha }}-*
          digest-mismatch: error
          path: smoke-results

      - name: Verify, stage and publish the complete runtime
        run: node scripts/generate-runtime-manifest.mjs publish

      - name: Transfer the exact verified manifest to the caller
        id: manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/runtime-manifest.json
          if-no-files-found: error
