name: macOS arm64 push check

# The whole core workspace's tests on macOS arm64 after every push to main, on the project's own machine (mixdog-m4, an
# M4 with ten cores). Its build folder stays between runs, so a push compiles what it changed and nothing else; the Release
# Gate's macOS build starts from a restored dependency cache on a three-core runner and compiles the workspace every time
# (39.8 minutes in run 46038819830). Not a required check: the Release Gate stays the proof a release takes.
on:
  push:
    branches: [main]
    paths:
      - native/core/**
      - rust-toolchain.toml
      - .github/workflows/macos-arm-push.yml
  workflow_dispatch:

# The machine runs one build at a time: a newer push replaces the run of an older one.
concurrency:
  group: macos-arm-push
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    # A self-hosted machine runs what the repository's own pushes ask for, never a fork's.
    if: github.repository == 'tribgames/mixdog'
    runs-on: [self-hosted, mixdog-m4]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # Outside the checkout, which every run cleans.
      CARGO_TARGET_DIR: /Users/jyp/mixdog-ci-cache/core-target
      GIT_AUTHOR_NAME: mixdog-test
      GIT_AUTHOR_EMAIL: mixdog-test@example.invalid
      GIT_COMMITTER_NAME: mixdog-test
      GIT_COMMITTER_EMAIL: mixdog-test@example.invalid
      MIXDOG_SKIP_USER_DATA_BACKUP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Read the repository Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\([^" ]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - uses: ./.github/actions/install-nextest
      # As the gate's test legs: mixdog-office's pptx_script.rs passes by returning early without these packages.
      - name: Install the packages the tests read (pptxgenjs, jszip and @napi-rs/canvas, without scripts)
        run: |
          node scripts/ci/lock-subset.mjs ci-node-subset pptxgenjs jszip @napi-rs/canvas
          npm ci --prefix ci-node-subset --ignore-scripts --prefer-offline --no-audit --no-fund
          cp -R ci-node-subset/node_modules node_modules
          test -f node_modules/pptxgenjs/package.json
          test -f node_modules/jszip/package.json
          test -f node_modules/@napi-rs/canvas/package.json
      - name: Build the tests
        working-directory: native/core
        run: cargo nextest run --workspace --locked --no-run
      - name: Run the tests
        working-directory: native/core
        env:
          MIXDOG_TEST_OTHER_VOLUME: ${{ runner.temp }}
        run: cargo nextest run --workspace --locked --config-file .config/nextest.toml --profile ci --no-fail-fast --no-tests=fail
