name: Build Voice Runtime

on:
  workflow_call:
    inputs:
      tag:
        description: "Expected release tag; blank uses the configured tag"
        required: false
        type: string
        default: ""
      sha:
        description: "The gated commit every job checks out and the release and its tag are made at"
        required: true
        type: string
    outputs:
      # The voice runtime manifest this run leaves as the artifact voice-runtime-manifest-<run> for Deploy's prepare-app to
      # merge into the bundled one (scripts/sync-voice-runtime-manifest.mjs): nothing here writes a branch.
      bundled_manifest:
        description: "true when the bundled manifest needs the artifact this run left"
        value: ${{ jobs.plan.outputs.sync_needed }}
permissions:
  contents: write

concurrency:
  group: voice-runtime-release
  cancel-in-progress: false

jobs:
  plan:
    name: plan-immutable-release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      vulkan_sdk_version: ${{ steps.plan.outputs.vulkan_sdk_version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      sync_needed: ${{ steps.plan.outputs.sync_needed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/assert-sha
        with:
          expected: ${{ inputs.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Resolve config and existing release state
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: node scripts/plan-voice-runtime-release.mjs

  prepare-release:
    name: prepare-hidden-release
    needs: plan
    if: ${{ needs.plan.outputs.build_needed == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # The release's tag, when it exists, names the gated commit; a tag is never moved, so a release made at another commit is not
      # extended with assets of this one.
      - name: Require the tag to name the gated commit when it exists
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" | awk 'NR == 1 { print $1 }')
          if [[ -n "$REMOTE" && "$REMOTE" != "$SHA" ]]; then
            echo "::error::${TAG} names ${REMOTE}, not the gated commit ${SHA}"
            exit 1
          fi
      - name: Create or resume hidden draft
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ inputs.sha }}
          name: Voice Runtime ${{ needs.plan.outputs.version }}
          draft: true
          prerelease: false
          make_latest: false

  build:
    name: build-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}
    needs: [plan, prepare-release]
    if: ${{ needs.plan.outputs.build_needed == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}

      - name: Install Vulkan SDK
        if: matrix.os == 'win32'
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: ${{ needs.plan.outputs.vulkan_sdk_version }}
          cache: true
          quiet: true

      - name: Install Windows Vulkan loader
        if: matrix.os == 'win32'
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'vulkan_sdk.exe'
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "cached Vulkan SDK installer was not preserved at $installer"
          }
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installer exited with $LASTEXITCODE"
          }
          $loader = Join-Path $env:SystemRoot 'System32\vulkan-1.dll'
          if (-not (Test-Path -LiteralPath $loader)) {
            throw "Vulkan loader was not installed at $loader"
          }

      - name: Install Linux Vulkan build tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential glslc libvulkan-dev nasm python3 spirv-headers spirv-tools

      - name: Install macOS FFmpeg build tools
        if: matrix.os == 'darwin'
        run: brew install nasm python

      - name: Install Windows FFmpeg build tools
        if: matrix.os == 'win32'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            nasm

      - name: Build Windows runtime
        if: matrix.os == 'win32'
        env:
          WHISPER_VERSION: ${{ needs.plan.outputs.version }}
          WHISPER_COMMIT: ${{ needs.plan.outputs.commit }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: ./scripts/build-voice-runtime-windows.ps1

      - name: Build Unix runtime
        if: matrix.os != 'win32'
        env:
          WHISPER_VERSION: ${{ needs.plan.outputs.version }}
          WHISPER_COMMIT: ${{ needs.plan.outputs.commit }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          BACKEND: ${{ matrix.backend }}
        run: bash scripts/build-voice-runtime-unix.sh

      - name: Build Windows FFmpeg runtime
        if: matrix.os == 'win32'
        shell: msys2 {0}
        env:
          FFMPEG_VERSION: "6.1.1"
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-ffmpeg-runtime.sh

      - name: Build Unix FFmpeg runtime
        if: matrix.os != 'win32'
        env:
          FFMPEG_VERSION: "6.1.1"
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-ffmpeg-runtime.sh

      - name: Upload runtime asset
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ inputs.sha }}
          draft: true
          make_latest: false
          files: |
            dist/whisper-server-*.zip
            dist/whisper-server-*.zip.sha256
            dist/ffmpeg-*.gz
            dist/ffmpeg-*.gz.sha256

  manifest:
    name: generate-and-verify-manifest
    needs: [plan, build]
    if: ${{ needs.plan.outputs.build_needed == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Generate bundled manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: node scripts/generate-voice-runtime-manifest.mjs

      - name: Upload generated manifest
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ inputs.sha }}
          draft: true
          make_latest: false
          files: src/runtime/channels/data/voice-runtime-manifest.json

      - name: Verify complete hidden release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-voice-runtime-release.mjs

      - name: Stage verified manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src/runtime/channels/data/voice-runtime-manifest.json dist/voice-runtime-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-runtime-manifest-${{ github.run_id }}
          overwrite: true
          path: dist/voice-runtime-manifest.json
          if-no-files-found: error

  recover-manifest:
    name: recover-published-manifest
    needs: plan
    if: ${{ needs.plan.outputs.build_needed == 'false' && needs.plan.outputs.sync_needed == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}

      - name: Download published manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern voice-runtime-manifest.json --dir dist --clobber

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-runtime-manifest-${{ github.run_id }}
          overwrite: true
          path: dist/voice-runtime-manifest.json
          if-no-files-found: error

  publish:
    name: publish-verified-release
    needs: [plan, manifest]
    if: ${{ needs.plan.outputs.build_needed == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Publish without replacing the application latest release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ inputs.sha }}
          draft: false
          prerelease: false
          make_latest: false
