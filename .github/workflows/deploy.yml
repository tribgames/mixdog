name: Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Application version increment"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      native:
        description: "Native assets: auto detects changes, force rebuilds, skip reuses manifests"
        required: true
        type: choice
        options: [auto, force, skip]
        default: auto
      mobile:
        description: "Mobile apps (Android APK + iOS TestFlight): auto ships when mobile sources changed since the last mobile-v* tag"
        required: true
        type: choice
        options: [auto, force, skip]
        default: auto
      mobile_bump:
        description: "Mobile version increment from the last mobile-v* tag"
        required: true
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    name: plan-incremental-deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read # gh run list / gh run watch for the Release Gate
    outputs:
      app_version: ${{ steps.plan.outputs.app_version }}
      app_tag: ${{ steps.plan.outputs.app_tag }}
      patch_build: ${{ steps.plan.outputs.patch_build }}
      patch_bump: ${{ steps.plan.outputs.patch_bump }}
      patch_version: ${{ steps.plan.outputs.patch_version }}
      patch_tag: ${{ steps.plan.outputs.patch_tag }}
      graph_build: ${{ steps.plan.outputs.graph_build }}
      graph_bump: ${{ steps.plan.outputs.graph_bump }}
      graph_version: ${{ steps.plan.outputs.graph_version }}
      graph_tag: ${{ steps.plan.outputs.graph_tag }}
      spawn_build: ${{ steps.plan.outputs.spawn_build }}
      spawn_bump: ${{ steps.plan.outputs.spawn_bump }}
      spawn_version: ${{ steps.plan.outputs.spawn_version }}
      spawn_tag: ${{ steps.plan.outputs.spawn_tag }}
      supervisor_build: ${{ steps.plan.outputs.supervisor_build }}
      supervisor_bump: ${{ steps.plan.outputs.supervisor_bump }}
      supervisor_version: ${{ steps.plan.outputs.supervisor_version }}
      supervisor_tag: ${{ steps.plan.outputs.supervisor_tag }}
      runtime_tag: ${{ steps.plan.outputs.runtime_tag }}
      native_changed: ${{ steps.plan.outputs.native_changed }}
      runtime_needed: ${{ steps.plan.outputs.runtime_needed }}
      voice_runtime_needed: ${{ steps.plan.outputs.voice_runtime_needed }}
      critical_changed: ${{ steps.plan.outputs.critical_changed }}
      run_critical: ${{ steps.plan.outputs.run_critical }}
      mobile_release: ${{ steps.mobile.outputs.mobile_release }}
      mobile_version: ${{ steps.mobile.outputs.mobile_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          git fetch --tags --force origin
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          # Retried for a transient registry failure; a deterministic one
          # fails all three attempts.
          for attempt in 1 2 3; do
            npm ci --ignore-scripts --no-audit --no-fund && break
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          node --test scripts/release-gate-test.mjs

      # A release ships only a commit the gate passed. The gate starts on the
      # same push this dispatch usually follows, so wait for its verdict instead
      # of racing it. Strict: a commit with no Release Gate run (a push that
      # touched no gated path, or an infra failure that never started it) is
      # NOT released. Start the gate for it with
      #   gh workflow run release-gate.yml --ref main
      # and re-run Deploy once it is green. A manual gate run counts.
      - name: Require a green Release Gate for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          run_id=""
          for attempt in $(seq 1 12); do
            run_id=$(gh run list --workflow release-gate.yml --commit "$sha" --limit 20 \
              --json databaseId,event --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId // empty')
            if [[ -n "$run_id" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::No Release Gate run exists for ${sha}; refusing to release an ungated commit. Run 'gh workflow run release-gate.yml --ref ${GITHUB_REF_NAME}' and re-run Deploy once it passes."
            exit 1
          fi
          echo "Waiting for Release Gate run ${run_id} on ${sha}"
          if ! gh run watch "$run_id" --exit-status --interval 15 > /dev/null; then
            echo "::error::Release Gate run ${run_id} did not pass for ${sha}; fix or re-run it before releasing."
            exit 1
          fi

      - name: Resolve app version and changed native components
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
          NATIVE_MODE: ${{ inputs.native }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { RELEASE_CRITICAL_PATHS } from './scripts/release-paths.mjs';
          import { checkChangelogLocales } from './scripts/check-changelog-locales.mjs';
          import { nativeReleaseStatuses, unreleasedProblems } from './scripts/native-release-status.mjs';

          const output = process.env.GITHUB_OUTPUT;
          const mode = process.env.NATIVE_MODE;
          const strict = /^\d+\.\d+\.\d+$/;
          const readJson = path => JSON.parse(readFileSync(path, 'utf8'));
          const cargoVersion = path => {
            const value = readFileSync(path, 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            if (!strict.test(value || '')) throw new Error(`Invalid Cargo version in ${path}`);
            return value;
          };
          const increment = (version, bump = 'patch') => {
            const parts = version.split('.').map(Number);
            if (bump === 'major') return `${parts[0] + 1}.0.0`;
            if (bump === 'minor') return `${parts[0]}.${parts[1] + 1}.0`;
            return `${parts[0]}.${parts[1]}.${parts[2] + 1}`;
          };
          const tagExists = tag => spawnSync('git', ['rev-parse', '--verify', '--quiet', `refs/tags/${tag}`]).status === 0;
          const releaseExists = tag => {
            const result = spawnSync(
              'gh', ['release', 'view', tag, '--json', 'isDraft', '--jq', '.isDraft'],
              { encoding: 'utf8', env: process.env },
            );
            return result.status === 0 && result.stdout.trim() === 'false';
          };
          const changedBetween = (base, paths) => {
            const result = spawnSync('git', ['diff', '--quiet', `${base}..HEAD`, '--', ...paths]);
            if (result.status === 0) return false;
            if (result.status === 1) return true;
            throw new Error(`git diff failed for ${base}: ${result.stderr?.toString() || result.status}`);
          };
          const changedSince = (tag, paths) => {
            if (!tagExists(tag)) return true;
            return changedBetween(tag, paths);
          };
          const compare = (a, b) => {
            const left = a.split('.').map(Number);
            const right = b.split('.').map(Number);
            for (let index = 0; index < 3; index++) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };

          const currentApp = readJson('package.json').version;
          if (!strict.test(currentApp)) throw new Error(`Invalid app version ${currentApp}`);
          const currentTag = `v${currentApp}`;
          const currentTagExists = tagExists(currentTag);
          const currentReleaseExists = releaseExists(currentTag);
          const resume = currentTagExists && !currentReleaseExists;
          // Protocol-breaking work is pre-bumped before merge so a checkout can
          // never impersonate the published app version. Release that pending
          // identity as-is instead of incrementing it a second time.
          const preBumped = !currentTagExists && !currentReleaseExists;
          const appVersion = resume || preBumped
            ? currentApp
            : increment(currentApp, process.env.BUMP);

          // Release gate: a fresh release requires changelog entries.
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const unreleasedSection = changelog.split(/^## /m).find(section => section.startsWith('Unreleased'));
          const unreleasedBody = unreleasedSection ? unreleasedSection.replace(/^Unreleased[^\n]*\n?/, '').trim() : '';
          if (!resume && !unreleasedBody) {
            throw new Error('CHANGELOG.md: the Unreleased section is empty - a release requires changelog entries');
          }
          // Every changelog/<lang>.md must carry the same Unreleased entries.
          if (!resume) {
            const localeProblems = checkChangelogLocales({ includeUnreleased: true });
            if (localeProblems.length) {
              throw new Error(`Translated changelogs are out of step with CHANGELOG.md:\n${localeProblems.join('\n')}`);
            }
          }

          function component({ name, manifestPath, cargoPath, tagPrefix, paths }) {
            const manifestVersion = readJson(manifestPath).version;
            const currentCargo = cargoVersion(cargoPath);
            if (!strict.test(manifestVersion)) throw new Error(`Invalid ${name} manifest version`);
            if (compare(currentCargo, manifestVersion) < 0) {
              throw new Error(`${name} Cargo version ${currentCargo} is older than manifest ${manifestVersion}`);
            }
            const pending = currentCargo !== manifestVersion;
            const changed = changedSince(`${tagPrefix}${manifestVersion}`, paths);
            const build = mode === 'force' || (mode === 'auto' && (pending || changed));
            const bump = build && !pending;
            const version = bump ? increment(manifestVersion) : currentCargo;
            return { build, bump, version, tag: `${tagPrefix}${version}` };
          }

          const patch = component({
            name: 'patch',
            manifestPath: 'src/runtime/agent/orchestrator/tools/patch-manifest.json',
            cargoPath: 'native/mixdog-patch/Cargo.toml',
            tagPrefix: 'patch-v',
            paths: ['native/mixdog-patch'],
          });
          const graph = component({
            name: 'graph',
            manifestPath: 'src/runtime/agent/orchestrator/tools/graph-manifest.json',
            cargoPath: 'native/mixdog-graph/Cargo.toml',
            tagPrefix: 'graph-v',
            paths: ['native/mixdog-graph'],
          });
          const spawn = component({
            name: 'spawn',
            manifestPath: 'src/runtime/agent/orchestrator/tools/spawn-manifest.json',
            cargoPath: 'native/mixdog-spawn/Cargo.toml',
            tagPrefix: 'spawn-v',
            paths: ['native/mixdog-spawn'],
          });
          const supervisor = component({
            name: 'supervisor',
            manifestPath: 'src/runtime/agent/orchestrator/tools/supervisor-manifest.json',
            cargoPath: 'native/mixdog-supervisor/Cargo.toml',
            tagPrefix: 'supervisor-v',
            paths: ['native/mixdog-supervisor'],
          });
          // native=skip reuses the pinned manifests. That is only safe while no
          // native source moved since the release each manifest pins; otherwise
          // the app would ship without the committed native fix.
          if (mode === 'skip') {
            const problems = unreleasedProblems(nativeReleaseStatuses());
            if (problems.length) {
              throw new Error(`native=skip would ship stale native tools. Re-run Deploy with native=auto.\n${problems.join('\n')}`);
            }
          }
          const runtimeTag = readJson('src/runtime/memory/data/runtime-manifest.json').release_tag;
          if (!/^runtime-v\d+\.\d+\.\d+$/.test(runtimeTag)) throw new Error(`Invalid runtime tag ${runtimeTag}`);
          const nativeChanged = mode !== 'skip'
            && [patch, graph, spawn, supervisor].some(component => component.build);
          const runtimeNeeded = mode !== 'skip' && (mode === 'force' || changedSince(currentTag, [
            '.github/workflows/build-runtime.yml',
            'scripts/build-runtime-linux.sh',
            'scripts/build-runtime-macos.sh',
            'scripts/build-runtime-windows.ps1',
            'scripts/generate-runtime-manifest.mjs',
            'src/runtime/memory/data/runtime-manifest.json',
          ]));
          const voiceRuntimeNeeded = mode !== 'skip' && (mode === 'force' || changedSince(currentTag, [
            '.github/workflows/build-voice-runtime.yml',
            'scripts/voice-runtime-config.json',
            'scripts/build-voice-runtime-unix.sh',
            'scripts/build-voice-runtime-windows.ps1',
            'scripts/build-ffmpeg-runtime.sh',
            'scripts/generate-voice-runtime-manifest.mjs',
            'scripts/plan-voice-runtime-release.mjs',
            'scripts/verify-voice-runtime-release.mjs',
            'scripts/sync-voice-runtime-manifest.mjs',
          ]));
          const criticalChanged = changedSince(currentTag, RELEASE_CRITICAL_PATHS);
          // The release gate already ran the identical critical lane
          // (the default test lane) on every gated main push. When every gate
          // run covering commits since the published release succeeded and no
          // critical path changed after the newest gated commit, the release
          // validate step would only re-verify an already verified state, so
          // it may skip the lane. Any uncertainty (missing runs, failed or
          // in-flight runs, gh errors) falls back to re-running it.
          const gateVerifiedCritical = () => {
            if (!criticalChanged || !currentTagExists) return false;
            try {
              const shas = execFileSync('git', ['rev-list', `${currentTag}..HEAD`], { encoding: 'utf8' })
                .split(/\s+/).filter(Boolean); // newest first
              if (!shas.length) return false;
              const list = spawnSync('gh', [
                'run', 'list', '--workflow', 'release-gate.yml',
                '--branch', process.env.DEFAULT_BRANCH || 'main',
                '--limit', '200', '--json', 'headSha,status,conclusion',
              ], { encoding: 'utf8', env: process.env });
              if (list.status !== 0) return false;
              const runs = JSON.parse(list.stdout || '[]');
              const range = new Set(shas);
              const covering = runs.filter((run) => range.has(run.headSha));
              if (!covering.length) return false;
              if (!covering.every((run) => run.status === 'completed' && run.conclusion === 'success')) {
                return false;
              }
              const newestGated = shas.find((sha) => covering.some((run) => run.headSha === sha));
              return !changedBetween(newestGated, RELEASE_CRITICAL_PATHS);
            } catch {
              return false;
            }
          };
          const gateVerified = gateVerifiedCritical();

          const values = {
            app_version: appVersion,
            app_tag: `v${appVersion}`,
            patch_build: String(mode !== 'skip' && patch.build),
            patch_bump: String(mode !== 'skip' && patch.bump),
            patch_version: patch.version,
            patch_tag: patch.tag,
            graph_build: String(mode !== 'skip' && graph.build),
            graph_bump: String(mode !== 'skip' && graph.bump),
            graph_version: graph.version,
            graph_tag: graph.tag,
            spawn_build: String(mode !== 'skip' && spawn.build),
            spawn_bump: String(mode !== 'skip' && spawn.bump),
            spawn_version: spawn.version,
            spawn_tag: spawn.tag,
            supervisor_build: String(mode !== 'skip' && supervisor.build),
            supervisor_bump: String(mode !== 'skip' && supervisor.bump),
            supervisor_version: supervisor.version,
            supervisor_tag: supervisor.tag,
            runtime_tag: runtimeTag,
            native_changed: String(nativeChanged),
            runtime_needed: String(runtimeNeeded),
            voice_runtime_needed: String(voiceRuntimeNeeded),
            critical_changed: String(criticalChanged),
            run_critical: String(criticalChanged && !gateVerified),
          };
          for (const [key, value] of Object.entries(values)) appendFileSync(output, `${key}=${value}\n`);
          console.log(JSON.stringify({ mode, resume, preBumped, ...values }, null, 2));
          NODE

      # Mobile apps ship with this release when their sources changed since the
      # newest mobile-v* tag; the version is that tag's next patch (or minor).
      - name: Plan the mobile release
        id: mobile
        env:
          MOBILE_MODE: ${{ inputs.mobile }}
          MOBILE_BUMP: ${{ inputs.mobile_bump }}
        run: node scripts/mobile-release.mjs plan

  prepare-native:
    name: prepare-native-tags
    needs: plan
    if: ${{ needs.plan.outputs.native_changed == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # version commit and tag pushes
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Bump changed native components and create immutable tags
        id: bump
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PATCH_BUILD: ${{ needs.plan.outputs.patch_build }}
          PATCH_BUMP: ${{ needs.plan.outputs.patch_bump }}
          PATCH_VERSION: ${{ needs.plan.outputs.patch_version }}
          PATCH_TAG: ${{ needs.plan.outputs.patch_tag }}
          GRAPH_BUILD: ${{ needs.plan.outputs.graph_build }}
          GRAPH_BUMP: ${{ needs.plan.outputs.graph_bump }}
          GRAPH_VERSION: ${{ needs.plan.outputs.graph_version }}
          GRAPH_TAG: ${{ needs.plan.outputs.graph_tag }}
          SPAWN_BUILD: ${{ needs.plan.outputs.spawn_build }}
          SPAWN_BUMP: ${{ needs.plan.outputs.spawn_bump }}
          SPAWN_VERSION: ${{ needs.plan.outputs.spawn_version }}
          SPAWN_TAG: ${{ needs.plan.outputs.spawn_tag }}
          SUPERVISOR_BUILD: ${{ needs.plan.outputs.supervisor_build }}
          SUPERVISOR_BUMP: ${{ needs.plan.outputs.supervisor_bump }}
          SUPERVISOR_VERSION: ${{ needs.plan.outputs.supervisor_version }}
          SUPERVISOR_TAG: ${{ needs.plan.outputs.supervisor_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$DEFAULT_BRANCH"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function setCargoVersion(name, directory, version) {
            const tomlPath = `${directory}/Cargo.toml`;
            const lockPath = `${directory}/Cargo.lock`;
            const toml = readFileSync(tomlPath, 'utf8').replace(
              /(^version\s*=\s*")[^"]+(")/m, `$1${version}$2`,
            );
            let lock = readFileSync(lockPath, 'utf8');
            const block = new RegExp(`(\\[\\[package\\]\\]\\nname = "${name}"\\nversion = ")[^"]+(")`);
            if (!block.test(lock)) throw new Error(`Missing ${name} package entry in ${lockPath}`);
            lock = lock.replace(block, `$1${version}$2`);
            writeFileSync(tomlPath, toml);
            writeFileSync(lockPath, lock);
          }
          if (process.env.PATCH_BUMP === 'true') {
            setCargoVersion('mixdog-patch', 'native/mixdog-patch', process.env.PATCH_VERSION);
          }
          if (process.env.GRAPH_BUMP === 'true') {
            setCargoVersion('mixdog-graph', 'native/mixdog-graph', process.env.GRAPH_VERSION);
          }
          if (process.env.SPAWN_BUMP === 'true') {
            setCargoVersion('mixdog-spawn', 'native/mixdog-spawn', process.env.SPAWN_VERSION);
          }
          if (process.env.SUPERVISOR_BUMP === 'true') {
            setCargoVersion('mixdog-supervisor', 'native/mixdog-supervisor', process.env.SUPERVISOR_VERSION);
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mixdog-patch/Cargo.toml native/mixdog-patch/Cargo.lock \
            native/mixdog-graph/Cargo.toml native/mixdog-graph/Cargo.lock \
            native/mixdog-spawn/Cargo.toml native/mixdog-spawn/Cargo.lock \
            native/mixdog-supervisor/Cargo.toml native/mixdog-supervisor/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(native): prepare incremental release assets"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

          create_tag() {
            local enabled="$1" tag="$2"
            if [[ "$enabled" != true ]]; then return; fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              local remote release_state
              remote=$(git ls-remote --tags origin "refs/tags/${tag}" | awk 'NR == 1 { print $1 }')
              release_state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
              if [[ "$remote" == "$(git rev-parse HEAD)" ]]; then
                echo "${tag} already points at the release commit; resuming its worker."
              elif [[ "$release_state" == "false" ]]; then
                echo "::error::Published tag ${tag} is immutable and does not match the release commit."
                exit 1
              else
                echo "Moving unpublished recovery tag ${tag} to the release commit."
                git tag --force "$tag"
                git push --force origin "refs/tags/${tag}"
              fi
            else
              git tag "$tag"
              git push origin "refs/tags/${tag}"
            fi
          }
          create_tag "$PATCH_BUILD" "$PATCH_TAG"
          create_tag "$GRAPH_BUILD" "$GRAPH_TAG"
          create_tag "$SPAWN_BUILD" "$SPAWN_TAG"
          create_tag "$SUPERVISOR_BUILD" "$SUPERVISOR_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The native version bump above changes the native sources the old-glibc
  # Linux tools are cached by, so release.yml's linux-native-tools missed its
  # cache on every native-change deploy and built for ~4 minutes on the
  # release's critical path. Build them now, beside the native release
  # workers, from the bumped commit: nothing later in the deploy touches
  # native/, so the release commit computes the same per-tool keys and hits.
  # Only the caches are warmed; the release run's own call uploads the
  # artifacts its consumers download. Nothing needs this job, so a failure
  # here only costs the release its own build.
  linux-native-tools-warm:
    name: prebuild-linux-native-tools
    needs: [plan, prepare-native]
    if: ${{ needs.plan.outputs.native_changed == 'true' }}
    uses: ./.github/workflows/linux-native-tools.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare-native.outputs.sha }}
      upload_artifact: false

  runtime:
    name: incremental-runtime
    needs: plan
    if: ${{ needs.plan.outputs.runtime_needed == 'true' }}
    uses: ./.github/workflows/build-runtime.yml
    permissions:
      contents: write # callee build/aggregate upload releases and push the manifest
    with:
      tag: ${{ needs.plan.outputs.runtime_tag }}
      force_rebuild: ${{ inputs.native == 'force' }}
      refresh_manifest: false

  voice:
    name: incremental-voice-runtime
    needs: plan
    if: ${{ needs.plan.outputs.voice_runtime_needed == 'true' }}
    uses: ./.github/workflows/build-voice-runtime.yml
    permissions:
      contents: write # callee prepares/uploads/publishes releases and pushes the manifest

  patch:
    name: incremental-patch
    needs: [plan, prepare-native]
    if: ${{ needs.plan.outputs.patch_build == 'true' }}
    uses: ./.github/workflows/patch-release.yml
    permissions:
      contents: write # callee manifest job releases and pushes
    with:
      tag: ${{ needs.plan.outputs.patch_tag }}

  graph:
    name: incremental-graph
    needs: [plan, prepare-native]
    if: ${{ needs.plan.outputs.graph_build == 'true' }}
    uses: ./.github/workflows/graph-release.yml
    permissions:
      contents: write # callee prepare/sync create releases and push the manifest
    with:
      tag: ${{ needs.plan.outputs.graph_tag }}

  spawn:
    name: incremental-spawn
    needs: [plan, prepare-native]
    if: ${{ needs.plan.outputs.spawn_build == 'true' }}
    uses: ./.github/workflows/spawn-release.yml
    permissions:
      contents: write # callee prepare/sync create releases and push the manifest
    with:
      tag: ${{ needs.plan.outputs.spawn_tag }}

  supervisor:
    name: incremental-supervisor
    needs: [plan, prepare-native]
    if: ${{ needs.plan.outputs.supervisor_build == 'true' }}
    uses: ./.github/workflows/supervisor-release.yml
    permissions:
      contents: write # callee prepare/sync create releases and push the manifest
    with:
      tag: ${{ needs.plan.outputs.supervisor_tag }}

  prepare-app:
    name: prepare-app-release
    needs: [plan, prepare-native, runtime, voice, patch, graph, spawn, supervisor]
    if: >-
      ${{
        always()
        && needs.plan.result == 'success'
        && (needs.prepare-native.result == 'success' || needs.prepare-native.result == 'skipped')
        && (needs.runtime.result == 'success' || needs.runtime.result == 'skipped')
        && (needs.voice.result == 'success' || needs.voice.result == 'skipped')
        && (needs.patch.result == 'success' || needs.patch.result == 'skipped')
        && (needs.graph.result == 'success' || needs.graph.result == 'skipped')
        && (needs.spawn.result == 'success' || needs.spawn.result == 'skipped')
        && (needs.supervisor.result == 'success' || needs.supervisor.result == 'skipped')
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # version commit and tag pushes
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Commit synchronized app version and tag
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.plan.outputs.app_version }}
          TAG: ${{ needs.plan.outputs.app_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$DEFAULT_BRANCH"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" != "$VERSION" ]]; then
            npm version "$VERSION" --no-git-tag-version --ignore-scripts
            npm --prefix apps/desktop version "$VERSION" --no-git-tag-version --ignore-scripts
            npm --prefix apps/relay version "$VERSION" --no-git-tag-version --ignore-scripts
          fi
          node scripts/sync-client-version-floors.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          const version = process.env.VERSION;
          const date = new Date().toISOString().slice(0, 10);
          // CHANGELOG.md and every translated changelog/<lang>.md are stamped alike.
          const files = [
            'CHANGELOG.md',
            ...readdirSync('changelog').filter(name => name.endsWith('.md')).sort().map(name => `changelog/${name}`),
          ];
          for (const file of files) {
            let text = readFileSync(file, 'utf8');
            const versionHeading = `## v${version}`;
            const unreleasedPattern = /^## Unreleased[^\n]*\n([\s\S]*?)(?=^##\s)/m;
            const unreleased = text.match(unreleasedPattern);
            const unreleasedBody = unreleased?.[1].trim() || '';
            if (!text.includes(`\n${versionHeading}`)) {
              text = text.replace(/^## Unreleased[^\n]*$/m, `## Unreleased\n\n## v${version} - ${date}`);
              writeFileSync(file, text);
            } else if (unreleasedBody) {
              // A failed unpublished release can be resumed at the same version.
              // Fold recovery notes into that version instead of leaving already
              // shipped fixes in Unreleased after the draft is published.
              text = text.replace(unreleasedPattern, '## Unreleased\n\n');
              // The heading line carries its date: keep the whole line and fold below it.
              const escaped = versionHeading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              text = text.replace(new RegExp(`^${escaped}[^\\n]*$`, 'm'), (heading) => `${heading}\n\n${unreleasedBody}`);
              writeFileSync(file, text);
            }
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md changelog \
            apps/desktop/package.json apps/desktop/package-lock.json \
            apps/relay/package.json apps/relay/package-lock.json
          # Every floor sync-client-version-floors.mjs raised.
          git add -u -- src/runtime/agent/orchestrator/providers
          if ! git diff --cached --quiet; then
            git commit -m "mixdog ${TAG}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            REMOTE=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR == 1 { print $1 }')
            if [[ "$REMOTE" != "$(git rev-parse HEAD)" ]]; then
              IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
              if [[ "$IS_DRAFT" == "false" ]]; then
                echo "::error::Published tag ${TAG} is immutable and does not match main."
                exit 1
              fi
              echo "Moving unpublished recovery tag ${TAG} to the synchronized release commit."
              git tag --force "$TAG"
              git push --force origin "refs/tags/${TAG}"
            fi
          else
            git tag "$TAG"
            git push origin "refs/tags/${TAG}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # iOS ships beside the release, not inside it: a failed upload or beta-review
  # submission fails this job (and the run) loudly but holds back neither the
  # desktop publish nor the relay, and TestFlight review is never awaited.
  # Android ships inside release.yml because the relay deploy waits for it.
  mobile-ios:
    name: release-mobile-ios
    needs: [plan, prepare-app]
    # prepare-app's transitive skips would fail the implicit success().
    if: ${{ !cancelled() && needs.prepare-app.result == 'success' && needs.plan.outputs.mobile_release == 'true' }}
    uses: ./.github/workflows/mobile-ios.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.plan.outputs.mobile_version }}
      ref: ${{ needs.prepare-app.outputs.sha }}
    secrets:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      TESTFLIGHT_EXTERNAL_GROUP_ID: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUP_ID }}

  release:
    name: release-all-platforms
    needs: [plan, prepare-app]
    # prepare-app intentionally accepts skipped incremental workers. GitHub's
    # implicit success() still sees those transitive skips and would skip this
    # reusable call, so gate only on the two direct release dependencies.
    if: ${{ always() && needs.plan.result == 'success' && needs.prepare-app.result == 'success' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write # callee prepare/publish/desktop jobs
      id-token: write # callee publish: npm --provenance
      actions: read # callee desktop packages poll this run for the desktop-out artifact
    with:
      tag: ${{ needs.plan.outputs.app_tag }}
      ref: ${{ needs.prepare-app.outputs.sha }}
      run_critical: ${{ needs.plan.outputs.run_critical == 'true' }}
      mobile_version: ${{ needs.plan.outputs.mobile_version }} # empty: no mobile release
    secrets: inherit

  # Last job: confirm what users will actually see once publish and the relay
  # deploy are done (Latest pointer, update feeds, npm, relay /app link).
  # It runs whenever the release call was not cancelled, even if it failed: the
  # Android release (or the relay deploy) can turn `release` red after the
  # desktop release is already public, and that state is exactly what needs
  # checking. The first step skips the checks when no app release was
  # published (the desktop publish never happened).
  post-release-check:
    name: post-release-check
    needs: [plan, prepare-app, release]
    if: ${{ always() && needs.plan.result == 'success' && needs.prepare-app.result == 'success' && needs.release.result != 'cancelled' && needs.release.result != 'skipped' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-app.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # 404 (release absent) skips the checks with a notice; auth, transport
      # and 5xx errors are retried with backoff and then fail the job.
      - name: Detect whether the app release was published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.app_tag }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: node scripts/post-release-check.mjs detect-published

      - name: Verify the published release end to end
        if: ${{ steps.published.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.app_tag }}
          RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
          MOBILE_VERSION: ${{ needs.plan.outputs.mobile_version }}
        run: node scripts/post-release-check.mjs

  # Runs beside post-release-check once the release call is done (it used to
  # be release.yml's last job, after the relay deploy). GITHUB_RUN_ID is this
  # Deploy run either way, so the current and baseline job sets are unchanged.
  release-timings:
    needs: [prepare-app, release]
    if: ${{ always() && needs.release.result != 'skipped' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-app.outputs.sha }}
          persist-credentials: false
      - name: Record timing and warn on material regressions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > /tmp/current-jobs.json
          WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)
          PREVIOUS_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -n "$PREVIOUS_ID" ]]; then
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_ID}/jobs?per_page=100" \
              > /tmp/previous-jobs.json
          else
            printf '[]\n' > /tmp/previous-jobs.json
          fi
          node scripts/release-timing-report.mjs \
            /tmp/current-jobs.json /tmp/previous-jobs.json
