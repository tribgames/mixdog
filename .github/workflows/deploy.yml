name: Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Application version increment"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      native:
        description: "Native assets: auto detects changes, force rebuilds, skip reuses manifests"
        required: true
        type: choice
        options: [auto, force, skip]
        default: auto
      mobile:
        description: "Mobile apps (Android APK + iOS TestFlight): auto ships when mobile sources changed since the last mobile-v* tag"
        required: true
        type: choice
        options: [auto, force, skip]
        default: auto
      mobile_bump:
        description: "Mobile version increment from the last mobile-v* tag"
        required: true
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    name: plan-incremental-deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      app_version: ${{ steps.plan.outputs.app_version }}
      app_tag: ${{ steps.plan.outputs.app_tag }}
      graph_build: ${{ steps.plan.outputs.graph_build }}
      graph_bump: ${{ steps.plan.outputs.graph_bump }}
      graph_version: ${{ steps.plan.outputs.graph_version }}
      graph_tag: ${{ steps.plan.outputs.graph_tag }}
      runtime_tag: ${{ steps.plan.outputs.runtime_tag }}
      native_changed: ${{ steps.plan.outputs.native_changed }}
      runtime_needed: ${{ steps.plan.outputs.runtime_needed }}
      voice_runtime_needed: ${{ steps.plan.outputs.voice_runtime_needed }}
      native_sinks: ${{ steps.plan.outputs.native_sinks }}
      mobile_release: ${{ steps.mobile.outputs.mobile_release }}
      mobile_version: ${{ steps.mobile.outputs.mobile_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --tags --force origin
          # Retried for a transient registry failure; a deterministic one
          # fails all three attempts.
          for attempt in 1 2 3; do
            npm ci --ignore-scripts --no-audit --no-fund && break
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          node --test scripts/workflow-refs.test.mjs scripts/verify-release-assets.test.mjs scripts/set-core-version.test.mjs

      # The commit this deploy starts from, resolved once: every later commit of the deploy descends from it and the default branch is
      # moved from exactly it (release.yml `push-release-refs`, a lease on this commit). Nothing is pushed to a branch or a tag before
      # the full gate has verified the commit the push names; a run of the gate found in history is never taken for that proof.
      - name: Resolve the commit of this deploy
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve app version and changed native components
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
          NATIVE_MODE: ${{ inputs.native }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { checkChangelogLocales } from './scripts/check-changelog-locales.mjs';
          import { NATIVE_RELEASE_TOOLS, nativeReleaseStatuses, unreleasedProblems } from './scripts/native-release-status.mjs';

          const output = process.env.GITHUB_OUTPUT;
          const mode = process.env.NATIVE_MODE;
          const strict = /^\d+\.\d+\.\d+$/;
          const readJson = path => JSON.parse(readFileSync(path, 'utf8'));
          const cargoVersion = path => {
            const value = readFileSync(path, 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            if (!strict.test(value || '')) throw new Error(`Invalid Cargo version in ${path}`);
            return value;
          };
          const increment = (version, bump = 'patch') => {
            const parts = version.split('.').map(Number);
            if (bump === 'major') return `${parts[0] + 1}.0.0`;
            if (bump === 'minor') return `${parts[0]}.${parts[1] + 1}.0`;
            return `${parts[0]}.${parts[1]}.${parts[2] + 1}`;
          };
          const tagExists = tag => spawnSync('git', ['rev-parse', '--verify', '--quiet', `refs/tags/${tag}`]).status === 0;
          // one full listing of the releases: a failed lookup stops the run, and only a listing that lacks the tag says there is none
          const { releaseState, listReleases } = await import(`${process.cwd()}/scripts/ci/release-state.mjs`);
          const releases = listReleases(process.env.GITHUB_REPOSITORY);
          const releaseExists = tag => releaseState(releases, tag).state === 'public';
          const changedBetween = (base, paths) => {
            const result = spawnSync('git', ['diff', '--quiet', `${base}..HEAD`, '--', ...paths]);
            if (result.status === 0) return false;
            if (result.status === 1) return true;
            throw new Error(`git diff failed for ${base}: ${result.stderr?.toString() || result.status}`);
          };
          const changedSince = (tag, paths) => {
            if (!tagExists(tag)) return true;
            return changedBetween(tag, paths);
          };
          const compare = (a, b) => {
            const left = a.split('.').map(Number);
            const right = b.split('.').map(Number);
            for (let index = 0; index < 3; index++) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };

          const currentApp = readJson('package.json').version;
          if (!strict.test(currentApp)) throw new Error(`Invalid app version ${currentApp}`);
          const currentTag = `v${currentApp}`;
          const currentTagExists = tagExists(currentTag);
          const currentReleaseExists = releaseExists(currentTag);
          const resume = currentTagExists && !currentReleaseExists;
          // Protocol-breaking work is pre-bumped before merge so a checkout can
          // never impersonate the published app version. Release that pending
          // identity as-is instead of incrementing it a second time.
          const preBumped = !currentTagExists && !currentReleaseExists;
          const appVersion = resume || preBumped
            ? currentApp
            : increment(currentApp, process.env.BUMP);

          // Release gate: a fresh release requires changelog entries.
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const unreleasedSection = changelog.split(/^## /m).find(section => section.startsWith('Unreleased'));
          const unreleasedBody = unreleasedSection ? unreleasedSection.replace(/^Unreleased[^\n]*\n?/, '').trim() : '';
          if (!resume && !unreleasedBody) {
            throw new Error('CHANGELOG.md: the Unreleased section is empty - a release requires changelog entries');
          }
          // Every changelog/<lang>.md must carry the same Unreleased entries.
          if (!resume) {
            const localeProblems = checkChangelogLocales({ includeUnreleased: true });
            if (localeProblems.length) {
              throw new Error(`Translated changelogs are out of step with CHANGELOG.md:\n${localeProblems.join('\n')}`);
            }
          }

          function component({ name, manifestPath, cargoPath, tagPrefix, paths }) {
            const manifestVersion = readJson(manifestPath).version;
            const currentCargo = cargoVersion(cargoPath);
            if (!strict.test(manifestVersion)) throw new Error(`Invalid ${name} manifest version`);
            if (compare(currentCargo, manifestVersion) < 0) {
              throw new Error(`${name} Cargo version ${currentCargo} is older than manifest ${manifestVersion}`);
            }
            const pending = currentCargo !== manifestVersion;
            const changed = changedSince(`${tagPrefix}${manifestVersion}`, paths);
            const build = mode === 'force' || (mode === 'auto' && (pending || changed));
            const bump = build && !pending;
            const version = bump ? increment(manifestVersion) : currentCargo;
            return { build, bump, version, tag: `${tagPrefix}${version}` };
          }

          // The graph search binary is the one native tool still released on
          // its own. mixdog-patch and mixdog-spawn are libraries of the core
          // (the Rust workspace links them; nothing starts a binary of theirs),
          // so no release is cut for them. Their last releases and manifests
          // stay as published: an installed app of an older version fetches
          // patch-manifest.json from the default branch and the patch-v / spawn-v
          // release assets it names.
          const graph = component({
            name: 'graph',
            manifestPath: 'src/runtime/agent/orchestrator/tools/graph-manifest.json',
            cargoPath: 'native/mixdog-graph/Cargo.toml',
            tagPrefix: 'graph-v',
            paths: ['native/mixdog-graph'],
          });
          // native=skip reuses the pinned manifest. That is only safe while no
          // native source moved since the release the manifest pins; otherwise
          // the app would ship without the committed native fix.
          if (mode === 'skip') {
            const problems = unreleasedProblems(
              nativeReleaseStatuses(undefined, NATIVE_RELEASE_TOOLS.filter(tool => tool.kind === 'graph')),
            );
            if (problems.length) {
              throw new Error(`native=skip would ship stale native tools. Re-run Deploy with native=auto.\n${problems.join('\n')}`);
            }
          }
          const runtimeTag = readJson('src/runtime/memory/data/runtime-manifest.json').release_tag;
          if (!/^runtime-v\d+\.\d+\.\d+$/.test(runtimeTag)) throw new Error(`Invalid runtime tag ${runtimeTag}`);
          const nativeChanged = mode !== 'skip' && graph.build;
          const runtimeNeeded = mode !== 'skip' && (mode === 'force' || changedSince(currentTag, [
            '.github/workflows/build-runtime.yml',
            'scripts/ci/release-assets.mjs',
            'scripts/ci/release-state.mjs',
            'scripts/build-runtime-linux.sh',
            'scripts/build-runtime-macos.sh',
            'scripts/build-runtime-windows.ps1',
            'scripts/generate-runtime-manifest.mjs',
            'scripts/plan-runtime-release-tag.mjs',
            'scripts/smoke-runtime-negative.sh',
            'scripts/smoke-runtime-negative.ps1',
            'src/runtime/memory/data/runtime-manifest.json',
          ]));
          const voiceRuntimeNeeded = mode !== 'skip' && (mode === 'force' || changedSince(currentTag, [
            '.github/workflows/build-voice-runtime.yml',
            'scripts/voice-runtime-config.json',
            'scripts/build-voice-runtime-unix.sh',
            'scripts/build-voice-runtime-windows.ps1',
            'scripts/build-ffmpeg-runtime.sh',
            'scripts/generate-voice-runtime-manifest.mjs',
            'scripts/plan-voice-runtime-release.mjs',
            'scripts/verify-voice-runtime-release.mjs',
            'scripts/sync-voice-runtime-manifest.mjs',
          ]));
          const values = {
            app_version: appVersion,
            app_tag: `v${appVersion}`,
            graph_build: String(mode !== 'skip' && graph.build),
            graph_bump: String(mode !== 'skip' && graph.bump),
            graph_version: graph.version,
            graph_tag: graph.tag,
            runtime_tag: runtimeTag,
            native_changed: String(nativeChanged),
            runtime_needed: String(runtimeNeeded),
            voice_runtime_needed: String(voiceRuntimeNeeded),
            native_sinks: String(runtimeNeeded || voiceRuntimeNeeded || (mode !== 'skip' && graph.build)),
          };
          for (const [key, value] of Object.entries(values)) appendFileSync(output, `${key}=${value}\n`);
          console.log(JSON.stringify({ mode, resume, preBumped, ...values }, null, 2));
          NODE

      # Mobile apps ship with this release when their sources changed since the
      # newest mobile-v* tag; the version is that tag's next patch (or minor).
      - name: Plan the mobile release
        id: mobile
        env:
          MOBILE_MODE: ${{ inputs.mobile }}
          MOBILE_BUMP: ${{ inputs.mobile_bump }}
        run: node scripts/mobile-release.mjs plan

  # The commit the native release workers publish from: the deploy's commit with the native version bump, made here and written to no
  # branch and no tag. When it differs from the deploy's commit it is pushed to refs/mixdog-candidates/<run>/native only, a ref no
  # workflow, release or update feed reads, so the gate and the workers can check it out by SHA. The commit is deterministic (the bot
  # identity and the deploy commit's date), so a deploy re-run from the same commit makes the same SHA and finds its own graph tag.
  native-commit:
    name: prepare-native-commit
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # the candidate ref only (scripts/ci/coverage/wiring.mjs: a candidate writer pushes refs/mixdog-candidates/ and nothing else)
    outputs:
      sha: ${{ steps.bump.outputs.sha || steps.keep.outputs.sha }}
    steps:
      # No graph version bump: the deploy's commit is the native commit, so there is nothing to check out or commit.
      - name: Use the deploy's commit
        id: keep
        if: ${{ needs.plan.outputs.graph_bump != 'true' }}
        env:
          BASE: ${{ needs.plan.outputs.sha }}
        run: echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: ${{ needs.plan.outputs.graph_bump == 'true' }}
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Commit the changed native components' versions
        id: bump
        if: ${{ needs.plan.outputs.graph_bump == 'true' }}
        env:
          BASE: ${{ needs.plan.outputs.sha }}
          GRAPH_BUMP: ${{ needs.plan.outputs.graph_bump }}
          GRAPH_VERSION: ${{ needs.plan.outputs.graph_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          // The core builds the tool's library through a mirror package of the
          // same name inside its workspace (native/core/crates/<name>), which
          // restates [package] version; both are bumped together or the
          // mixdog-testkit native_mirrors test fails and mixdogd is compiled with
          // a CARGO_PKG_VERSION that is not the released tool's.
          function setCargoVersion(name, directory, version) {
            const tomlPath = `${directory}/Cargo.toml`;
            const lockPath = `${directory}/Cargo.lock`;
            const mirrorTomlPath = `native/core/crates/${name}/Cargo.toml`;
            const coreLockPath = 'native/core/Cargo.lock';
            const setVersion = text => text.replace(/(^version\s*=\s*")[^"]+(")/m, `$1${version}$2`);
            const setLockVersion = (path) => {
              const lock = readFileSync(path, 'utf8');
              const block = new RegExp(`(\\[\\[package\\]\\]\\nname = "${name}"\\nversion = ")[^"]+(")`);
              if (!block.test(lock)) throw new Error(`Missing ${name} package entry in ${path}`);
              writeFileSync(path, lock.replace(block, `$1${version}$2`));
            };
            writeFileSync(tomlPath, setVersion(readFileSync(tomlPath, 'utf8')));
            writeFileSync(mirrorTomlPath, setVersion(readFileSync(mirrorTomlPath, 'utf8')));
            setLockVersion(lockPath);
            setLockVersion(coreLockPath);
          }
          if (process.env.GRAPH_BUMP === 'true') {
            setCargoVersion('mixdog-graph', 'native/mixdog-graph', process.env.GRAPH_VERSION);
          }
          NODE

          git add native/mixdog-graph/Cargo.toml native/mixdog-graph/Cargo.lock \
            native/core/crates/mixdog-graph/Cargo.toml native/core/Cargo.lock
          if ! git diff --cached --quiet; then
            DATE=$(git show -s --format=%cI "$BASE")
            GIT_AUTHOR_DATE="$DATE" GIT_COMMITTER_DATE="$DATE" \
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(native): prepare incremental release assets"
          fi
          SHA=$(git rev-parse HEAD)
          if [[ "$SHA" != "$BASE" ]]; then git push origin "${SHA}:refs/mixdog-candidates/${GITHUB_RUN_ID}/native"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # The full-release gate for the commit the incremental asset workers publish from (native-commit): every lane of release-gate.yml and
  # the reconciliation of what that commit's source defines with what the lanes executed. Only when a native worker runs: runtime,
  # voice and graph list it in `needs` with the default success semantics, so a skipped or red gate leaves every one of them, their
  # tags and their releases unwritten. The app's own commit is gated again inside release.yml, before any branch or tag push.
  coverage-gate:
    name: native-assets-coverage
    needs: [plan, native-commit]
    if: ${{ needs.plan.outputs.native_sinks == 'true' }}
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ needs.native-commit.outputs.sha }}
      gate: native-assets
    secrets:
      # The gate builds its archives on the project's own machines while they are on, as release.yml's gate does.
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # The native version bump above changes the native sources the old-glibc
  # Linux tools are cached by, so release.yml's linux-native-tools missed its
  # cache on every native-change deploy and built for ~4 minutes on the
  # release's critical path. Build them now, beside the native release
  # workers, from the bumped commit: nothing later in the deploy touches
  # native/, so the release commit computes the same per-tool keys and hits.
  # Only the caches are warmed; the release run's own call uploads the
  # artifacts its consumers download. Nothing needs this job, so a failure
  # here only costs the release its own build.
  linux-native-tools-warm:
    name: prebuild-linux-native-tools
    needs: [plan, native-commit]
    if: ${{ needs.plan.outputs.native_changed == 'true' }}
    uses: ./.github/workflows/linux-native-tools.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.native-commit.outputs.sha }}
      upload_artifact: false

  # The native workers publish from the gated commit: each checks it out by SHA, creates or verifies its tag at it (never moving one),
  # and leaves the manifest the app bundles as an artifact of this run; none of them writes a branch. prepare-app commits the manifests.
  runtime:
    name: incremental-runtime
    needs: [plan, native-commit, coverage-gate]
    if: ${{ needs.plan.outputs.runtime_needed == 'true' }}
    uses: ./.github/workflows/build-runtime.yml
    permissions:
      contents: write # only the callee's post-smoke aggregate publishes
    with:
      tag: ${{ needs.plan.outputs.runtime_tag }}
      sha: ${{ needs.native-commit.outputs.sha }}
      force_rebuild: ${{ inputs.native == 'force' }}
      refresh_manifest: false

  voice:
    name: incremental-voice-runtime
    needs: [plan, native-commit, coverage-gate]
    if: ${{ needs.plan.outputs.voice_runtime_needed == 'true' }}
    uses: ./.github/workflows/build-voice-runtime.yml
    permissions:
      contents: write # callee prepares/uploads/publishes releases
    with:
      sha: ${{ needs.native-commit.outputs.sha }}

  graph:
    name: incremental-graph
    needs: [plan, native-commit, coverage-gate]
    if: ${{ needs.plan.outputs.graph_build == 'true' }}
    uses: ./.github/workflows/graph-release.yml
    permissions:
      contents: write # callee creates the graph tag at the gated commit and its release
    with:
      tag: ${{ needs.plan.outputs.graph_tag }}
      sha: ${{ needs.native-commit.outputs.sha }}

  # The app's release commit: the native commit with the manifests the workers left, the synchronized app version and the stamped
  # changelogs. Like native-commit it writes no branch and no tag: it is pushed to refs/mixdog-candidates/<run>/app only, and
  # release.yml gates exactly this SHA before it moves the default branch and creates the app tag (push-release-refs). A worker is
  # accepted as skipped only when the plan did not ask for it.
  prepare-app:
    name: prepare-app-commit
    needs: [plan, native-commit, coverage-gate, runtime, voice, graph]
    if: >-
      ${{
        always()
        && needs.plan.result == 'success'
        && needs.native-commit.result == 'success'
        && (needs.coverage-gate.result == 'success' || (needs.plan.outputs.native_sinks != 'true' && needs.coverage-gate.result == 'skipped'))
        && (needs.runtime.result == 'success' || (needs.plan.outputs.runtime_needed != 'true' && needs.runtime.result == 'skipped'))
        && (needs.voice.result == 'success' || (needs.plan.outputs.voice_runtime_needed != 'true' && needs.voice.result == 'skipped'))
        && (needs.graph.result == 'success' || (needs.plan.outputs.graph_build != 'true' && needs.graph.result == 'skipped'))
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # the candidate ref only (scripts/ci/coverage/wiring.mjs: a candidate writer pushes refs/mixdog-candidates/ and nothing else)
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.native-commit.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # The manifests the native workers of this run generated from what they published (artifacts of this run, never a branch).
      - name: Download the runtime manifest
        if: needs.runtime.outputs.manifest_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.runtime.outputs.manifest_id }}
          digest-mismatch: error
          path: _manifests/runtime
      - name: Download the voice runtime manifest
        if: needs.voice.outputs.bundled_manifest == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: voice-runtime-manifest-${{ github.run_id }}
          path: _manifests/voice
      - name: Download the graph manifest
        if: needs.plan.outputs.graph_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-records-${{ github.run_id }}
          path: _manifests/graph
      - name: Bundle the manifests of the published native assets
        env:
          RUNTIME_TAG: ${{ needs.runtime.outputs.tag }}
          RUNTIME_MANIFEST_ID: ${{ needs.runtime.outputs.manifest_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RUNTIME_MANIFEST_ID" ]]; then
            test "$(node -p "require('./_manifests/runtime/runtime-manifest.json').release_tag")" = "$RUNTIME_TAG"
            cp _manifests/runtime/runtime-manifest.json src/runtime/memory/data/runtime-manifest.json
          fi
          if [[ -d _manifests/voice ]]; then node scripts/sync-voice-runtime-manifest.mjs _manifests/voice/voice-runtime-manifest.json; fi
          if [[ -d _manifests/graph ]]; then cp _manifests/graph/graph-manifest.json src/runtime/agent/orchestrator/tools/graph-manifest.json; fi
          rm -rf _manifests

      - name: Commit synchronized app version and manifests
        id: release
        env:
          BASE: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.app_version }}
          TAG: ${{ needs.plan.outputs.app_tag }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" != "$VERSION" ]]; then
            npm version "$VERSION" --no-git-tag-version --ignore-scripts
            npm --prefix apps/desktop version "$VERSION" --no-git-tag-version --ignore-scripts
            npm --prefix apps/relay version "$VERSION" --no-git-tag-version --ignore-scripts
          fi
          # The Rust workspace carries the release version too (`mixdogd --version`,
          # the server manifest); one script sets it and the check proves the three agree.
          node scripts/set-core-version.mjs "$VERSION"
          node scripts/check-release-version.mjs
          BASE_COMMIT_DATE=$(git show -s --format=%cI "$BASE")
          export BASE_COMMIT_DATE
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          const version = process.env.VERSION;
          const date = new Date(process.env.BASE_COMMIT_DATE).toISOString().slice(0, 10);
          // CHANGELOG.md and every translated changelog/<lang>.md are stamped alike.
          const files = [
            'CHANGELOG.md',
            ...readdirSync('changelog').filter(name => name.endsWith('.md')).sort().map(name => `changelog/${name}`),
          ];
          for (const file of files) {
            let text = readFileSync(file, 'utf8');
            const versionHeading = `## v${version}`;
            const unreleasedPattern = /^## Unreleased[^\n]*\n([\s\S]*?)(?=^##\s)/m;
            const unreleased = text.match(unreleasedPattern);
            const unreleasedBody = unreleased?.[1].trim() || '';
            if (!text.includes(`\n${versionHeading}`)) {
              text = text.replace(/^## Unreleased[^\n]*$/m, `## Unreleased\n\n## v${version} - ${date}`);
              writeFileSync(file, text);
            } else if (unreleasedBody) {
              // A failed unpublished release can be resumed at the same version.
              // Fold recovery notes into that version instead of leaving already
              // shipped fixes in Unreleased after the draft is published.
              text = text.replace(unreleasedPattern, '## Unreleased\n\n');
              // The heading line carries its date: keep the whole line and fold below it.
              const escaped = versionHeading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              text = text.replace(new RegExp(`^${escaped}[^\\n]*$`, 'm'), (heading) => `${heading}\n\n${unreleasedBody}`);
              writeFileSync(file, text);
            }
          }
          NODE
          git add package.json package-lock.json CHANGELOG.md changelog \
            apps/desktop/package.json apps/desktop/package-lock.json \
            apps/relay/package.json apps/relay/package-lock.json \
            native/core/Cargo.toml native/core/Cargo.lock native/mixdog-main-native/Cargo.lock \
            src/runtime/memory/data/runtime-manifest.json \
            src/runtime/channels/data/voice-runtime-manifest.json \
            src/runtime/agent/orchestrator/tools/graph-manifest.json
          if ! git diff --cached --quiet; then
            DATE=$(git show -s --format=%cI "$BASE")
            GIT_AUTHOR_DATE="$DATE" GIT_COMMITTER_DATE="$DATE" \
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "mixdog ${TAG}"
          fi
          test -z "$(git status --porcelain)"
          SHA=$(git rev-parse HEAD)
          # A pushed release tag is never moved: a tag left by an earlier run must already name this commit (a re-run of the same
          # deploy), otherwise the release cannot be made under it.
          REMOTE=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR == 1 { print $1 }')
          if [[ -n "$REMOTE" && "$REMOTE" != "$SHA" ]]; then
            echo "::error::${TAG} already names ${REMOTE}, not this release commit ${SHA}; a release tag is never moved. Release the next version instead."
            exit 1
          fi
          if [[ "$SHA" != "$BASE" ]]; then git push origin "${SHA}:refs/mixdog-candidates/${GITHUB_RUN_ID}/app"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # iOS ships after the release: a TestFlight upload is an external mutation, so it runs only once the release call (whose
  # `coverage-gate` covered this exact commit, and whose publish needs it) has succeeded. A failed upload or beta-review submission
  # fails this job (and the run) loudly but holds back neither the desktop publish nor the relay, and TestFlight review is never
  # awaited. Android ships inside release.yml because the relay deploy waits for it.
  mobile-ios:
    name: release-mobile-ios
    needs: [plan, prepare-app, release]
    # prepare-app's transitive skips would fail the implicit success().
    if: ${{ !cancelled() && needs.prepare-app.result == 'success' && needs.release.result == 'success' && needs.plan.outputs.mobile_release == 'true' }}
    uses: ./.github/workflows/mobile-ios.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.plan.outputs.mobile_version }}
      ref: ${{ needs.prepare-app.outputs.sha }}
    secrets:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      TESTFLIGHT_EXTERNAL_GROUP_ID: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUP_ID }}

  release:
    name: release-all-platforms
    needs: [plan, prepare-app]
    # prepare-app intentionally accepts skipped incremental workers. GitHub's
    # implicit success() still sees those transitive skips and would skip this
    # reusable call, so gate only on the two direct release dependencies.
    if: ${{ always() && needs.plan.result == 'success' && needs.prepare-app.result == 'success' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write # callee prepare/publish/desktop jobs
      id-token: write # callee publish: npm --provenance
      actions: read # callee desktop packages poll this run for the desktop-out artifact
    with:
      tag: ${{ needs.plan.outputs.app_tag }}
      ref: ${{ needs.prepare-app.outputs.sha }}
      base: ${{ needs.plan.outputs.sha }}
      mobile_version: ${{ needs.plan.outputs.mobile_version }} # empty: no mobile release
    secrets: inherit

  # Failed attempts retain their candidate refs so successful producers can
  # be reused by a retry. A successful release is reachable from public refs.
  candidate-cleanup:
    name: remove-candidate-refs
    needs: [native-commit, prepare-app, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write # deletes refs/mixdog-candidates/<run>/* only
    steps:
      - name: Delete this run's candidate refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/mixdog-candidates/${GITHUB_RUN_ID}/" --jq '.[].ref' > /tmp/candidates
          while IFS= read -r ref; do
            name=${ref#"refs/mixdog-candidates/${GITHUB_RUN_ID}/"}
            [[ "$name" != "$ref" && "$name" != */* ]]
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/mixdog-candidates/${GITHUB_RUN_ID}/${name}"
          done < /tmp/candidates

  # Last job: confirm what users will actually see once publish and the relay
  # deploy are done (Latest pointer, update feeds, npm, relay /app link).
  # It runs whenever the release call was not cancelled, even if it failed: the
  # Android release (or the relay deploy) can turn `release` red after the
  # desktop release is already public, and that state is exactly what needs
  # checking. The first step skips the checks when no app release was
  # published (the desktop publish never happened).
  post-release-check:
    name: post-release-check
    needs: [plan, prepare-app, release]
    if: ${{ always() && needs.plan.result == 'success' && needs.prepare-app.result == 'success' && needs.release.result != 'cancelled' && needs.release.result != 'skipped' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-app.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # 404 (release absent) skips the checks with a notice; auth, transport
      # and 5xx errors are retried with backoff and then fail the job.
      - name: Detect whether the app release was published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.app_tag }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: node scripts/post-release-check.mjs detect-published

      - name: Verify the published release end to end
        if: ${{ steps.published.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.app_tag }}
          RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
          MOBILE_VERSION: ${{ needs.plan.outputs.mobile_version }}
        run: node scripts/post-release-check.mjs

  # Runs beside post-release-check once the release call is done (it used to
  # be release.yml's last job, after the relay deploy). GITHUB_RUN_ID is this
  # Deploy run either way, so the current and baseline job sets are unchanged.
  release-timings:
    needs: [prepare-app, release]
    if: ${{ always() && needs.release.result != 'skipped' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-app.outputs.sha }}
          persist-credentials: false
      - name: Record timing and warn on material regressions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > /tmp/current-jobs.json
          WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)
          PREVIOUS_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -n "$PREVIOUS_ID" ]]; then
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_ID}/jobs?per_page=100" \
              > /tmp/previous-jobs.json
          else
            printf '[]\n' > /tmp/previous-jobs.json
          fi
          node scripts/release-timing-report.mjs \
            /tmp/current-jobs.json /tmp/previous-jobs.json
