# Reusable application release worker. Deploy computes and commits the version,
# then calls this workflow with an immutable tag + SHA. The npm package remains
# staged as an Actions artifact, while verified desktop packages upload directly
# to one hidden GitHub draft. The draft becomes public only after the exact
# five-platform asset set succeeds. Deploy is the only release entry point;
# there is no direct tag-push trigger.
# Requires the NPM_TOKEN repo secret (npm automation token).

name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Strict vMAJOR.MINOR.PATCH release tag"
        required: true
        type: string
      ref:
        description: "Immutable commit SHA to build and publish"
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: write # version commit, tag push, release creation
  id-token: write # npm --provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const tag = process.env.RELEASE_TAG || '';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          const coreVersion = '(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)';
          if (!new RegExp(`^${coreVersion}$`).test(version)) {
            throw new Error(`package.json version is not strict MAJOR.MINOR.PATCH: ${version}`);
          }
          if (!new RegExp(`^v${coreVersion}$`).test(tag)) {
            throw new Error(`Release tag is not strict vMAJOR.MINOR.PATCH: ${tag}`);
          }
          if (tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} does not match package.json version ${version}`);
          }
          console.log(`Verified release identity ${tag}.`);
          NODE

      # Native package assembly below downloads and hash-verifies all four
      # platform assets once behind a versioned cache. This gate validates
      # metadata only, avoiding a duplicate all-platform download on every app
      # release.
      - name: Verify release asset metadata
        run: node scripts/verify-release-assets.mjs --metadata-only

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      # Smoke's routing corpus exercises the real grep tool, which shells out
      # to ripgrep; the ubuntu runner image does not ship rg by default.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # src/tui/dist is gitignored; smoke imports it. prepack rebuilds it
      # again at publish time, but the smoke gate needs it present first.
      - name: Build TUI
        run: npm run build:tui

      - name: Smoke
        run: npm run smoke

      - name: Pack staged npm release
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(npm pack --silent | tail -n 1)
          test -n "$PACKAGE"
          echo "file=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Stage npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          retention-days: 2

  # The deploy gate runs only ship-critical invariants: release assets,
  # apply_patch integrity, and provider stream/tool compatibility. Mutable
  # workflow and product specifications stay in the advisory test lane.
  release-invariants:
    name: verify-critical
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build TUI
        run: npm run build:tui

      - name: Verify the critical release lane
        run: npm run test:release-critical

  # main/preload/renderer output is platform-neutral. Build it once, cache it
  # by the exact desktop/shared source inputs, then feed the same verified
  # artifact to every native packager instead of running Vite five times.
  desktop-build:
    name: build-desktop-once
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Restore unchanged desktop output
        id: desktop-out
        uses: actions/cache@v6
        with:
          path: apps/desktop/out
          key: >-
            desktop-out-v1-${{ hashFiles(
              'apps/desktop/src/**',
              'apps/desktop/electron.vite.config.ts',
              'apps/desktop/tsconfig*.json',
              'apps/desktop/package-lock.json',
              'src/runtime/shared/**'
            ) }}

      - uses: actions/setup-node@v6
        if: steps.desktop-out.outputs.cache-hit != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install build dependencies
        if: steps.desktop-out.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm ci --prefix apps/desktop --prefer-offline --no-audit --no-fund

      - name: Build platform-neutral desktop output
        if: steps.desktop-out.outputs.cache-hit != 'true'
        run: npm run build --prefix apps/desktop

      - name: Stage common desktop output
        uses: actions/upload-artifact@v7
        with:
          name: desktop-out
          path: apps/desktop/out
          if-no-files-found: error
          retention-days: 2

  # Keep partially uploaded platform assets invisible. Every platform writes to
  # this one draft, and the final job publishes it only after the remote asset
  # set and npm package have both been verified.
  prepare-github-release:
    name: prepare-hidden-release
    needs: [validate, release-invariants]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Create or resume one hidden draft
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ inputs.ref || github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true

  # Desktop update feed. electron-updater reads latest.yml from the LATEST
  # GitHub release, so a tag without these assets leaves every installed app
  # stranded on its current version ("no update available" forever).
  desktop-windows:
    needs: [validate, release-invariants, desktop-build, prepare-github-release]
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      MIXDOG_RUNTIME_DEPENDENCY_CACHE: ${{ github.workspace }}/.cache/runtime-dependencies/win32-x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package-lock.json') }}
          restore-keys: desktop-electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve runtime dependency cache key
        id: runtime-dependencies
        shell: pwsh
        run: |
          $key = node scripts/runtime-dependency-cache-key.mjs --platform=win32 --arch=x64
          $npmKey = node scripts/dependency-lock-cache-key.mjs apps/desktop/package-lock.json
          "key=$key" >> $env:GITHUB_OUTPUT
          "npm_key=$npmKey" >> $env:GITHUB_OUTPUT
          "npm_cache=$((npm config get cache).Trim())" >> $env:GITHUB_OUTPUT

      - name: Restore stable desktop npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.runtime-dependencies.outputs.npm_cache }}
          key: desktop-npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-dependencies.outputs.npm_key }}

      - name: Restore pruned runtime dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.MIXDOG_RUNTIME_DEPENDENCY_CACHE }}
          key: desktop-${{ steps.runtime-dependencies.outputs.key }}

      - name: Restore prepared runtime archive
        uses: actions/cache@v6
        with:
          path: apps/desktop/.runtime
          key: desktop-prepared-runtime-v1-${{ steps.runtime-dependencies.outputs.key }}-${{ hashFiles('package.json', 'package-lock.json', 'README.md', 'NOTICE.md', 'LICENSES/**', 'scripts/**', 'src/**', 'vendor/**', 'apps/desktop/package-lock.json', 'apps/desktop/scripts/prepare-runtime.mjs') }}

      - name: Install desktop dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: apps/desktop

      - name: Download common desktop output
        uses: actions/download-artifact@v8
        with:
          name: desktop-out
          path: apps/desktop/out

      # No signing certificate in CI: electron-builder emits an unsigned NSIS
      # installer, which the updater accepts (verifyUpdateCodeSignature: false).
      - name: Build Windows installer
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $env:MIXDOG_RUNTIME_NPM_CACHE = (npm config get cache).Trim()
          npm run prepare:runtime -- --platform=win32 --arch=x64
          npm run brand:win
          npx --no-install electron-builder --win --x64 --publish never

      - name: Verify packaged Windows runtime
        run: npm run test:packaging
        working-directory: apps/desktop

      - name: Smoke packaged Windows memory runtime
        run: npm run verify:packaged-runtime
        working-directory: apps/desktop

      - name: Upload verified Windows assets to hidden draft
        timeout-minutes: 6
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $assets = @(
            'apps/desktop/dist/mixdog-desktop-win-x64.exe',
            'apps/desktop/dist/mixdog-desktop-win-x64.exe.blockmap',
            'apps/desktop/dist/latest.yml'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing Windows release asset: $asset"
            }
          }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload exited with $LASTEXITCODE" }

  # Native macOS/Linux desktop packages. Each runner's postinstall keeps only
  # its own Transformers.js Node bundle and ONNX platform/architecture payload.
  desktop-unix:
    needs: [validate, release-invariants, desktop-build, prepare-github-release]
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      MIXDOG_RUNTIME_DEPENDENCY_CACHE: >-
        ${{ github.workspace }}/.cache/runtime-dependencies/${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: arm64, artifact_arch: arm64, runner: macos-14, target: mac }
          # Keep x64 on Intel: packaged-runtime verification launches host
          # Electron against x64-only native embedding binaries.
          - { platform: darwin, arch: x64, artifact_arch: x64, runner: macos-15-intel, target: mac }
          - { platform: linux, arch: x64, artifact_arch: x86_64, runner: ubuntu-22.04, target: linux }
          - { platform: linux, arch: arm64, artifact_arch: arm64, runner: ubuntu-22.04-arm, target: linux }
    name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package-lock.json') }}
          restore-keys: desktop-electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve runtime dependency cache key
        id: runtime-dependencies
        shell: bash
        run: |
          echo "key=$(node scripts/runtime-dependency-cache-key.mjs \
            --platform=${{ matrix.platform }} --arch=${{ matrix.arch }})" >> "$GITHUB_OUTPUT"
          echo "npm_key=$(node scripts/dependency-lock-cache-key.mjs \
            apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"
          echo "npm_cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore stable desktop npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.runtime-dependencies.outputs.npm_cache }}
          key: desktop-npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-dependencies.outputs.npm_key }}

      - name: Restore pruned runtime dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.MIXDOG_RUNTIME_DEPENDENCY_CACHE }}
          key: desktop-${{ steps.runtime-dependencies.outputs.key }}

      - name: Restore prepared runtime archive
        uses: actions/cache@v6
        with:
          path: apps/desktop/.runtime
          key: desktop-prepared-runtime-v1-${{ steps.runtime-dependencies.outputs.key }}-${{ hashFiles('package.json', 'package-lock.json', 'README.md', 'NOTICE.md', 'LICENSES/**', 'scripts/**', 'src/**', 'vendor/**', 'apps/desktop/package-lock.json', 'apps/desktop/scripts/prepare-runtime.mjs') }}

      - name: Install desktop dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: apps/desktop

      - name: Download common desktop output
        uses: actions/download-artifact@v8
        with:
          name: desktop-out
          path: apps/desktop/out

      - name: Build desktop package
        shell: bash
        working-directory: apps/desktop
        run: |
          MIXDOG_RUNTIME_NPM_CACHE="$(npm config get cache)" \
          npm run prepare:runtime -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
          npx --no-install electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Verify packaged desktop runtime
        run: npm run test:packaging
        working-directory: apps/desktop

      - name: Smoke packaged desktop memory runtime
        run: npm run verify:packaged-runtime
        working-directory: apps/desktop

      - name: Upload verified macOS assets to hidden draft
        if: matrix.platform == 'darwin'
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "apps/desktop/dist/mixdog-desktop-mac-${{ matrix.artifact_arch }}.dmg"
            "apps/desktop/dist/mixdog-desktop-mac-${{ matrix.artifact_arch }}.zip"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          if [[ "${{ matrix.arch }}" == x64 ]]; then
            bash .github/scripts/upload-release-assets.sh "${assets[@]}"
          else
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          fi

      - name: Upload verified Linux asset to hidden draft
        if: matrix.platform == 'linux'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          asset="apps/desktop/dist/mixdog-desktop-linux-${{ matrix.artifact_arch }}.AppImage"
          test -f "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber

  publish:
    name: publish-staged-release
    needs: [validate, release-invariants, prepare-github-release, desktop-windows, desktop-unix]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download staged npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: staged-npm

      - name: Verify complete hidden release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REF: ${{ inputs.ref || github.sha }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$RELEASE_REF"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > /tmp/release.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > /tmp/assets.json
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          import { readFileSync } from 'node:fs';

          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Staged ref version ${version} does not match ${process.env.RELEASE_TAG}`);
          }
          const npm = readdirSync('staged-npm').filter(name => name.endsWith('.tgz'));
          if (npm.length !== 1) throw new Error(`Expected one staged npm package, found ${npm.length}`);

          const release = JSON.parse(readFileSync('/tmp/release.json', 'utf8'));
          if (String(release.id) !== process.env.RELEASE_ID
              || release.tag_name !== process.env.RELEASE_TAG
              || release.target_commitish !== process.env.RELEASE_REF
              || !release.draft || release.prerelease) {
            throw new Error('Hidden GitHub release identity no longer matches this immutable build');
          }

          const expected = [
            'latest.yml',
            'mixdog-desktop-linux-arm64.AppImage',
            'mixdog-desktop-linux-x86_64.AppImage',
            'mixdog-desktop-mac-arm64.dmg',
            'mixdog-desktop-mac-arm64.zip',
            'mixdog-desktop-mac-x64.dmg',
            'mixdog-desktop-mac-x64.zip',
            'mixdog-desktop-win-x64.exe',
            'mixdog-desktop-win-x64.exe.blockmap',
          ].sort();
          const assets = JSON.parse(readFileSync('/tmp/assets.json', 'utf8')).flat();
          const actual = assets.map(asset => asset.name).sort();
          if (new Set(actual).size !== actual.length
              || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Hidden release asset set is not exact: ${JSON.stringify(actual)}`);
          }
          for (const asset of assets) {
            if (asset.state !== 'uploaded' || !(asset.size > 0)
                || !/^sha256:[0-9a-f]{64}$/.test(String(asset.digest || ''))) {
              throw new Error(`Incomplete hidden release asset: ${asset.name}`);
            }
          }
          console.log(`Verified hidden ${process.env.RELEASE_TAG}: 1 npm + ${assets.length} desktop assets.`);
          NODE

      - name: Publish staged npm package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CI: "true"
          MIXDOG_MODE: "ship"
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          if npm view "mixdog@${VERSION}" version --silent 2>/dev/null | grep -qxF "$VERSION"; then
            echo "mixdog@${VERSION} is already published; resuming finalization."
          else
            npm publish ./staged-npm/*.tgz --provenance --access public
          fi

      - name: Publish one complete GitHub release
        env:
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true > /tmp/published.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('/tmp/published.json', 'utf8'));
          if (release.draft || release.tag_name !== process.env.RELEASE_TAG) {
            throw new Error('GitHub release finalization did not publish the expected tag');
          }
          NODE
