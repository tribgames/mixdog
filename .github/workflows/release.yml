# Reusable application release worker. Deploy computes and commits the version,
# then calls this workflow with an immutable tag + SHA. The npm package remains
# staged as an Actions artifact, while verified desktop packages upload directly
# to one hidden GitHub draft. The draft becomes public only after the exact
# five-platform asset set succeeds. Deploy is the only release entry point;
# there is no direct tag-push trigger.
# Requires the NPM_TOKEN repo secret (npm automation token).

name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Strict vMAJOR.MINOR.PATCH release tag"
        required: true
        type: string
      ref:
        description: "Immutable commit SHA to build and publish"
        required: true
        type: string
      run_critical:
        description: "Run source-critical release invariants changed since the prior app release"
        required: false
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        required: true
      RELAY_SSH_KEY:
        required: true
      RELAY_KNOWN_HOSTS:
        required: true

permissions:
  contents: write # version commit, tag push, release creation
  id-token: write # npm --provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const tag = process.env.RELEASE_TAG || '';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          const coreVersion = '(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)';
          if (!new RegExp(`^${coreVersion}$`).test(version)) {
            throw new Error(`package.json version is not strict MAJOR.MINOR.PATCH: ${version}`);
          }
          if (!new RegExp(`^v${coreVersion}$`).test(tag)) {
            throw new Error(`Release tag is not strict vMAJOR.MINOR.PATCH: ${tag}`);
          }
          if (tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} does not match package.json version ${version}`);
          }
          console.log(`Verified release identity ${tag}.`);
          NODE

      # Validate every bundled native manifest before install or publish.
      - name: Verify bundled release assets
        run: node scripts/verify-release-assets.mjs

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      # Smoke's routing corpus exercises the real grep tool, which shells out
      # to ripgrep; the ubuntu runner image does not ship rg by default.
      - name: Install ripgrep
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout --kill-after=5s 50s bash -c \
              'sudo apt-get -o Acquire::Retries=2 -o DPkg::Lock::Timeout=15 update &&
               sudo apt-get -o Acquire::Retries=2 -o DPkg::Lock::Timeout=15 install -y ripgrep'; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::ripgrep install failed or timed out after two attempts"
              exit 1
            fi
            sleep 5
          done

      # src/tui/dist is gitignored; smoke imports it. Build it once, then pack
      # with lifecycle scripts disabled so prepack does not rebuild it.
      - name: Build TUI
        run: npm run build:tui

      - name: Smoke
        run: npm run smoke

      - name: Verify changed source-critical release invariants
        if: inputs.run_critical
        run: npm run test:release-critical

      - name: Pack staged npm release
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(npm pack --silent --ignore-scripts | tail -n 1)
          test -n "$PACKAGE"
          echo "file=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Stage npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          retention-days: 2

  # main/preload/renderer output is platform-neutral. Build it once, cache it
  # by the exact desktop/shared source inputs, then feed the same verified
  # artifact to every native packager instead of running Vite five times.
  desktop-build:
    name: build-desktop-once
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The lock file cannot enter this key through hashFiles: Deploy rewrites
      # its version field one job earlier, which missed the cache on every
      # single release. The manifest digest below ignores that field, so the
      # key follows the dependency tree instead of the release number and the
      # gate's build of the same source can serve this job.
      - name: Resolve version-neutral desktop cache key
        id: desktop-key
        shell: bash
        run: |
          echo "manifest=$(node scripts/manifest-cache-key.mjs \
            apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"

      # Key mirrored in release-gate.yml, which warms it on every main push.
      - name: Restore unchanged desktop output
        id: desktop-out
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/out
          key: >-
            desktop-out-v2-${{ steps.desktop-key.outputs.manifest }}-${{ hashFiles(
              'apps/desktop/src/**',
              'apps/desktop/electron.vite.config.ts',
              'apps/desktop/tsconfig*.json',
              'src/runtime/shared/**'
            ) }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.desktop-out.outputs.cache-hit != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install build dependencies
        if: steps.desktop-out.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm ci --prefix apps/desktop --prefer-offline --no-audit --no-fund

      - name: Build platform-neutral desktop output
        if: steps.desktop-out.outputs.cache-hit != 'true'
        run: npm run build --prefix apps/desktop

      - name: Stage common desktop output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-out
          path: apps/desktop/out
          if-no-files-found: error
          retention-days: 2

  # Each platform has an independent runtime -> package chain. A slow platform
  # no longer prevents the other four packaging jobs from starting.
  desktop-runtime-win32-x64:
    uses: ./.github/workflows/desktop-runtime.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      runner: windows-2022
      platform: win32
      arch: x64

  desktop-runtime-darwin-arm64:
    uses: ./.github/workflows/desktop-runtime.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      runner: macos-14
      platform: darwin
      arch: arm64

  desktop-runtime-darwin-x64:
    uses: ./.github/workflows/desktop-runtime.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      runner: macos-15-intel
      platform: darwin
      arch: x64

  desktop-runtime-linux-x64:
    uses: ./.github/workflows/desktop-runtime.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      runner: ubuntu-22.04
      platform: linux
      arch: x64

  desktop-runtime-linux-arm64:
    uses: ./.github/workflows/desktop-runtime.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      runner: ubuntu-22.04-arm
      platform: linux
      arch: arm64

  # Keep partially uploaded platform assets invisible. Every platform writes to
  # this one draft, and the final job publishes it only after the remote asset
  # set and npm package have both been verified.
  prepare-github-release:
    name: prepare-hidden-release
    needs: [validate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Create or resume one hidden draft
        id: draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ inputs.ref || github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true

  # Desktop update feed. electron-updater reads latest.yml from the LATEST
  # GitHub release, so a tag without these assets leaves every installed app
  # stranded on its current version ("no update available" forever).
  desktop-windows:
    needs: [validate, desktop-build, desktop-runtime-win32-x64, prepare-github-release]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: windows-2022
      platform: win32
      arch: x64
      artifact_arch: x64
      target: win

  desktop-darwin-arm64:
    needs: [validate, desktop-build, desktop-runtime-darwin-arm64, prepare-github-release]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: macos-14
      platform: darwin
      arch: arm64
      artifact_arch: arm64
      target: mac

  desktop-darwin-x64:
    needs: [validate, desktop-build, desktop-runtime-darwin-x64, prepare-github-release]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: macos-15-intel
      platform: darwin
      arch: x64
      artifact_arch: x64
      target: mac

  desktop-linux-x64:
    needs: [validate, desktop-build, desktop-runtime-linux-x64, prepare-github-release]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: ubuntu-22.04
      platform: linux
      arch: x64
      artifact_arch: x86_64
      target: linux

  desktop-linux-arm64:
    needs: [validate, desktop-build, desktop-runtime-linux-arm64, prepare-github-release]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: ubuntu-22.04-arm
      platform: linux
      arch: arm64
      artifact_arch: arm64
      target: linux

  publish:
    name: publish-staged-release
    needs: [validate, prepare-github-release, desktop-windows, desktop-darwin-arm64, desktop-darwin-x64, desktop-linux-x64, desktop-linux-arm64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download staged npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: staged-npm

      - name: Verify complete hidden release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REF: ${{ inputs.ref || github.sha }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$RELEASE_REF"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > /tmp/release.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > /tmp/assets.json
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          import { readFileSync } from 'node:fs';

          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Staged ref version ${version} does not match ${process.env.RELEASE_TAG}`);
          }
          const npm = readdirSync('staged-npm').filter(name => name.endsWith('.tgz'));
          if (npm.length !== 1) throw new Error(`Expected one staged npm package, found ${npm.length}`);

          const release = JSON.parse(readFileSync('/tmp/release.json', 'utf8'));
          if (String(release.id) !== process.env.RELEASE_ID
              || release.tag_name !== process.env.RELEASE_TAG
              || release.target_commitish !== process.env.RELEASE_REF
              || !release.draft || release.prerelease) {
            throw new Error('Hidden GitHub release identity no longer matches this immutable build');
          }

          const expected = [
            'latest.yml',
            'mixdog-desktop-linux-arm64.AppImage',
            'mixdog-desktop-linux-x86_64.AppImage',
            'mixdog-desktop-mac-arm64.dmg',
            'mixdog-desktop-mac-arm64.zip',
            'mixdog-desktop-mac-x64.dmg',
            'mixdog-desktop-mac-x64.zip',
            'mixdog-desktop-win-x64.exe',
            'mixdog-desktop-win-x64.exe.blockmap',
          ].sort();
          const assets = JSON.parse(readFileSync('/tmp/assets.json', 'utf8')).flat();
          const actual = assets.map(asset => asset.name).sort();
          if (new Set(actual).size !== actual.length
              || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Hidden release asset set is not exact: ${JSON.stringify(actual)}`);
          }
          for (const asset of assets) {
            if (asset.state !== 'uploaded' || !(asset.size > 0)
                || !/^sha256:[0-9a-f]{64}$/.test(String(asset.digest || ''))) {
              throw new Error(`Incomplete hidden release asset: ${asset.name}`);
            }
          }
          console.log(`Verified hidden ${process.env.RELEASE_TAG}: 1 npm + ${assets.length} desktop assets.`);
          NODE

      - name: Publish staged npm package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CI: "true"
          MIXDOG_MODE: "ship"
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          if npm view "mixdog@${VERSION}" version --silent 2>/dev/null | grep -qxF "$VERSION"; then
            echo "mixdog@${VERSION} is already published; resuming finalization."
          else
            npm publish ./staged-npm/*.tgz --provenance --access public
          fi

      - name: Publish one complete GitHub release
        env:
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true > /tmp/published.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('/tmp/published.json', 'utf8'));
          if (release.draft || release.tag_name !== process.env.RELEASE_TAG) {
            throw new Error('GitHub release finalization did not publish the expected tag');
          }
          NODE

  deploy-relay:
    name: deploy-production-web-relay
    needs: [publish, desktop-build]
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Download verified renderer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-out
          path: apps/desktop/out
      - name: Stage release web app
        run: npm run stage:web --prefix apps/relay
      - name: Configure pinned production SSH identity
        env:
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          RELAY_KNOWN_HOSTS: ${{ secrets.RELAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELAY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$RELAY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Atomically deploy and verify production
        env:
          RELAY_HOST: ${{ vars.RELAY_HOST }}
          RELAY_PORT: ${{ vars.RELAY_PORT }}
          RELAY_USER: ${{ vars.RELAY_USER }}
          RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELAY_PORT" =~ ^[0-9]+$ ]]
          ARCHIVE="/tmp/mixdog-relay-${RELEASE_TAG}.tar.gz"
          REMOTE_DIR="/tmp/mixdog-relay-${RELEASE_TAG}"
          tar -czf "$ARCHIVE" -C apps/relay .
          scp -P "$RELAY_PORT" "$ARCHIVE" "$RELAY_USER@$RELAY_HOST:$ARCHIVE"
          ssh -p "$RELAY_PORT" "$RELAY_USER@$RELAY_HOST" \
            "set -euo pipefail; rm -rf '$REMOTE_DIR'; mkdir -p '$REMOTE_DIR'; tar -xzf '$ARCHIVE' -C '$REMOTE_DIR'; bash '$REMOTE_DIR/deploy/deploy-release.sh' '$RELAY_DOMAIN' '$RELEASE_TAG'; rm -rf '$REMOTE_DIR' '$ARCHIVE'"
          EXPECTED=$(sha256sum apps/relay/renderer/index.html | awk '{print $1}')
          ACTUAL=$(ssh -p "$RELAY_PORT" "$RELAY_USER@$RELAY_HOST" \
            "sha256sum /opt/mixdog-relay/renderer/index.html | awk '{print \$1}'")
          test "$EXPECTED" = "$ACTUAL"
          curl --fail --silent --show-error "https://$RELAY_DOMAIN/healthz" | grep -q '"status":"ok"'

  release-timings:
    if: always()
    needs: [publish, deploy-relay]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Record timing and warn on material regressions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > /tmp/current-jobs.json
          WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)
          PREVIOUS_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -n "$PREVIOUS_ID" ]]; then
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_ID}/jobs?per_page=100" \
              > /tmp/previous-jobs.json
          else
            printf '[]\n' > /tmp/previous-jobs.json
          fi
          node scripts/release-timing-report.mjs \
            /tmp/current-jobs.json /tmp/previous-jobs.json
