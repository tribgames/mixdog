# Reusable application release worker. Deploy computes and commits the version,
# then calls this workflow with an immutable tag + SHA. The npm package remains
# staged as an Actions artifact, while verified desktop packages upload directly
# to one hidden GitHub draft. The draft becomes public only after the exact
# four-platform asset set succeeds. Deploy is the only release entry point;
# there is no direct tag-push trigger.
# Requires the NPM_TOKEN repo secret (npm automation token). The optional
# MAC_CERTIFICATE_* and APPLE_API_* secrets sign and notarize the macOS app;
# the optional AZURE_* secrets sign the Windows installer.

name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Strict vMAJOR.MINOR.PATCH release tag"
        required: true
        type: string
      ref:
        description: "Immutable commit SHA to build and publish"
        required: true
        type: string
      run_critical:
        description: "Run source-critical release invariants changed since the prior app release"
        required: false
        type: boolean
        default: true
      mobile_version:
        description: "Android app version X.Y.Z to publish as mobile-vX.Y.Z before the relay deploy; empty for none"
        required: false
        type: string
        default: ""
    secrets:
      NPM_TOKEN:
        required: true
      RELAY_SSH_KEY:
        required: true
      RELAY_KNOWN_HOSTS:
        required: true
      # Developer ID signing and notarization for the macOS package; without
      # them the app is packaged unsigned.
      MAC_CERTIFICATE_P12_BASE64:
        required: false
      MAC_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      # Azure Artifact Signing for the Windows installer; without them it is
      # packaged unsigned.
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      # Android APK signing and Firebase config; only read with mobile_version.
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      FIREBASE_GOOGLE_SERVICES_JSON_B64:
        required: false

# Read-only by default; jobs that create/publish releases or use npm
# provenance raise their own permissions.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Only immutable identity gates expensive package work. Bundled-asset,
  # npm, and smoke validation still block publication, but no longer make every
  # platform sit idle for more than a minute before it can start.
  identity:
    name: validate-release-identity
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const tag = process.env.RELEASE_TAG || '';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          const coreVersion = '(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)';
          if (!new RegExp(`^${coreVersion}$`).test(version)) {
            throw new Error(`package.json version is not strict MAJOR.MINOR.PATCH: ${version}`);
          }
          if (!new RegExp(`^v${coreVersion}$`).test(tag)) {
            throw new Error(`Release tag is not strict vMAJOR.MINOR.PATCH: ${tag}`);
          }
          if (tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} does not match package.json version ${version}`);
          }
          console.log(`Verified release identity ${tag}.`);
          NODE

  validate:
    name: validate-and-stage-npm
    needs: identity
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # onnxruntime-node's postinstall fetches the CUDA execution-provider
    # libraries from NuGet on linux/x64, and a connect timeout there failed
    # `npm ci`. This job tests and packs the npm package (`npm pack` ships no
    # node_modules), so it skips them exactly as release-gate.yml does.
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json

      # Package jobs may populate only a hidden draft in parallel. Publication
      # still waits for every bundled native manifest to pass here.
      - name: Verify bundled release assets
        run: node scripts/verify-release-assets.mjs

      # Last line of defence for native tools: whatever path led here, the
      # release must not bundle a manifest that pins an older native build than
      # the native source being released (Deploy builds and pins it first).
      - name: Verify native sources match the pinned native releases
        run: node scripts/native-release-status.mjs --check

      # Retried for a transient registry failure; a deterministic one fails
      # all three attempts.
      - name: Install
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1

      # src/tui/dist is gitignored; smoke imports it. Build it once, then pack
      # with lifecycle scripts disabled so prepack does not rebuild it.
      - name: Build TUI
        run: npm run build:tui

      - name: Smoke
        run: npm run smoke

      # The gate already ran the default lane on every gated main push; this
      # re-runs it only when a critical path changed after the newest gated
      # commit (deploy.yml run_critical). The tool-contract files inside the
      # lane drive the debug native spawn binary.
      # Same runner provisioning as release-gate.yml.
      - name: Install fonts and LibreOffice for the Office suites
        if: inputs.run_critical
        uses: ./.github/actions/office-runtime

      # An exact hit restores the compiled binary itself and skips cargo.
      - name: Cache the native spawn test binary
        id: spawn-bin
        if: inputs.run_critical
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/mixdog-spawn/target/debug/mixdog-spawn
          key: spawn-test-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/mixdog-spawn/Cargo.lock', 'native/mixdog-spawn/Cargo.toml', 'native/mixdog-spawn/build.rs', 'native/mixdog-spawn/src/**') }}

      - name: Cache the native spawn test build
        if: inputs.run_critical && steps.spawn-bin.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mixdog-spawn/target
          key: spawn-test-cargo-${{ runner.os }}-${{ hashFiles('native/mixdog-spawn/Cargo.lock', 'native/mixdog-spawn/src/**') }}
          restore-keys: spawn-test-cargo-${{ runner.os }}-

      - name: Build the native spawn test binary
        if: inputs.run_critical && steps.spawn-bin.outputs.cache-hit != 'true'
        run: npm run build:spawn:test

      - name: Verify changed source-critical release invariants
        if: inputs.run_critical
        run: |
          npm test
          npm run smoke:patch

      # `npm pack --ignore-scripts` below skips prepack, so the shipped-history
      # generation never runs there: fail instead when the committed file is
      # stale (needs the full history fetched above; a shallow clone is skipped
      # by the script's own guard).
      - name: Verify shipped definition history is current
        run: node scripts/build-shipped-history.mjs --check

      - name: Pack staged npm release
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(npm pack --silent --ignore-scripts | tail -n 1)
          test -n "$PACKAGE"
          echo "file=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Stage npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          retention-days: 2

  # main/preload/renderer output is platform-neutral. Build it once, cache it
  # by the exact desktop/shared source inputs, then feed the same verified
  # artifact to every native packager instead of running Vite four times.
  desktop-build:
    name: build-desktop-once
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      # The platform-neutral output bundles no native addon; each packager's
      # prepare-runtime installs the runtime dependencies (and, on linux-x64,
      # the CUDA provider libraries) itself. Skipping the NuGet fetch here
      # removes the failure mode that took down `npm ci`.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # The lock file cannot enter this key through hashFiles: Deploy rewrites
      # its version field one job earlier, which missed the cache on every
      # single release. The manifest digest below ignores that field, so the
      # key follows the dependency tree instead of the release number and the
      # gate's build of the same source can serve this job.
      - name: Resolve version-neutral desktop cache key
        id: desktop-key
        shell: bash
        run: |
          echo "manifest=$(node scripts/manifest-cache-key.mjs \
            apps/desktop/package-lock.json)" >> "$GITHUB_OUTPUT"

      # Key mirrored in release-gate.yml, which warms it on every main push.
      # The renderer bundles CHANGELOG.md and the desktop package version
      # (Settings > About > changelog), so both belong in the key: the
      # release commit Deploy stamps must rebuild instead of reusing the
      # gate's pre-release output.
      - name: Restore unchanged desktop output
        id: desktop-out
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/out
          key: >-
            desktop-out-v4-${{ steps.desktop-key.outputs.manifest }}-${{ hashFiles(
              'CHANGELOG.md',
              'changelog/*.md',
              'apps/desktop/package.json',
              'apps/desktop/src/**',
              '!apps/desktop/src/**/*.test.mjs',
              '!apps/desktop/src/**/*.test.jsx',
              'apps/desktop/electron.vite.config.ts',
              'apps/desktop/tsconfig*.json',
              'src/runtime/shared/**',
              '!src/runtime/shared/**/*.test.mjs'
            ) }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.desktop-out.outputs.cache-hit != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install build dependencies
        if: steps.desktop-out.outputs.cache-hit != 'true'
        # The two trees are independent, so they install side by side; each
        # PID is waited on so either failure fails the step.
        run: |
          npm ci --prefer-offline --no-audit --no-fund &
          root_pid=$!
          npm ci --prefix apps/desktop --prefer-offline --no-audit --no-fund &
          desktop_pid=$!
          status=0
          wait "$root_pid" || status=1
          wait "$desktop_pid" || status=1
          exit "$status"

      # `npm run build` is typecheck && build:fast in sequence. The typecheck
      # emits nothing the build reads, so it runs beside build:fast; the step
      # still fails if either does, and the output is cached only on success.
      - name: Build platform-neutral desktop output
        if: steps.desktop-out.outputs.cache-hit != 'true'
        run: |
          npm run typecheck --prefix apps/desktop &
          typecheck_pid=$!
          status=0
          npm run build:fast --prefix apps/desktop || status=1
          wait "$typecheck_pid" || status=1
          exit "$status"

      - name: Stage common desktop output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-out
          path: apps/desktop/out
          if-no-files-found: error
          retention-days: 2

  # Keep partially uploaded platform assets invisible. Every platform writes to
  # this one draft, and the final job publishes it only after the remote asset
  # set and npm package have both been verified.
  prepare-github-release:
    name: prepare-hidden-release
    needs: [identity]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Create or resume one hidden draft
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ inputs.ref || github.sha }}
          draft: true
          prerelease: false
          # The body comes from CHANGELOG.md at publish time. GitHub's generated
          # notes list merged PRs only, and Deploy commits straight to main, so
          # they would leave just a compare link.

  # Desktop update feed. electron-updater reads latest.yml from the LATEST
  # GitHub release, so a tag without these assets leaves every installed app
  # stranded on its current version ("no update available" forever).
  desktop-windows:
    needs: [desktop-build, prepare-github-release]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: windows-2022
      platform: win32
      arch: x64
      artifact_arch: x64
      target: win
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  desktop-darwin-arm64:
    needs: [desktop-build, prepare-github-release]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: macos-15
      platform: darwin
      arch: arm64
      artifact_arch: arm64
      target: mac
    secrets:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  desktop-darwin-x64:
    needs: [desktop-build, prepare-github-release]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: macos-15-intel
      platform: darwin
      arch: x64
      artifact_arch: x64
      target: mac
    secrets:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # mixdog-computer/-graph/-patch built in manylinux_2_28 (glibc 2.28), so the
  # native tools do not follow the package runner's glibc. The shipped Linux
  # package floor is glibc 2.31 (runtime built on ubuntu:20.04), enforced by
  # the payload checks. This is the single producer of the
  # native-tools-glibc228-<arch> artifacts in this run: linux-verify-full
  # consumes them (native_tools_prebuilt) instead of building again.
  linux-native-tools:
    needs: [identity]
    uses: ./.github/workflows/linux-native-tools.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref }}

  desktop-linux-x64:
    needs: [desktop-build, prepare-github-release, linux-native-tools]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: ubuntu-22.04
      platform: linux
      arch: x64
      artifact_arch: x86_64
      target: linux

  desktop-linux-arm64:
    needs: [desktop-build, prepare-github-release, linux-native-tools]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: ubuntu-22.04-arm
      platform: linux
      arch: arm64
      artifact_arch: arm64
      target: linux

  # Full Linux verification (update proof, sandbox .deb, distro containers,
  # native-tool exec matrix) gates publication.
  linux-verify-full:
    needs: [identity, linux-native-tools]
    uses: ./.github/workflows/linux-desktop-verify.yml
    permissions:
      contents: read
    with:
      full: true
      native_tools_prebuilt: true
      # Every checkout inside the called workflow uses this exact commit
      # (and asserts HEAD == ref), not the caller's default-branch sha.
      ref: ${{ inputs.ref }}

  # The commit the Linux verification actually checked out must be the release commit.
  linux-verify-sha-gate:
    needs: [linux-verify-full]
    runs-on: ubuntu-22.04
    steps:
      - env:
          VERIFIED: ${{ needs.linux-verify-full.outputs.verified_sha }}
          RELEASE_SHA: ${{ inputs.ref }}
        run: |
          echo "verified: $VERIFIED"
          echo "release:  $RELEASE_SHA"
          test -n "$VERIFIED"
          test "$VERIFIED" = "$RELEASE_SHA"

  publish:
    name: publish-staged-release
    needs: [validate, prepare-github-release, desktop-windows, desktop-darwin-arm64, desktop-darwin-x64, desktop-linux-x64, desktop-linux-arm64, linux-verify-full, linux-verify-sha-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download staged npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: staged-npm

      # electron-updater on macOS reads one latest-mac.yml, but each macOS job
      # builds a single architecture and so emits a feed for its own zip only.
      # Merge both into the one feed and add it to the hidden draft.
      - name: Download macOS update feeds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-mac-feed-*
          path: mac-feeds

      - name: Merge and upload macOS update feed
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/merge-mac-update-feed.mjs --version="${RELEASE_TAG#v}" --out=latest-mac.yml \
            mac-feeds/desktop-mac-feed-arm64/latest-mac.yml mac-feeds/desktop-mac-feed-x64/latest-mac.yml
          bash .github/scripts/upload-release-assets.sh latest-mac.yml

      - name: Verify complete hidden release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REF: ${{ inputs.ref || github.sha }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$RELEASE_REF"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > /tmp/release.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > /tmp/assets.json
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          import { readFileSync } from 'node:fs';

          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Staged ref version ${version} does not match ${process.env.RELEASE_TAG}`);
          }
          const npm = readdirSync('staged-npm').filter(name => name.endsWith('.tgz'));
          if (npm.length !== 1) throw new Error(`Expected one staged npm package, found ${npm.length}`);

          const release = JSON.parse(readFileSync('/tmp/release.json', 'utf8'));
          if (String(release.id) !== process.env.RELEASE_ID
              || release.tag_name !== process.env.RELEASE_TAG
              || release.target_commitish !== process.env.RELEASE_REF
              || !release.draft || release.prerelease) {
            throw new Error('Hidden GitHub release identity no longer matches this immutable build');
          }

          // Per-platform requirements. The publish job already needs every
          // desktop package job, so each group is an explicit part of the
          // release contract rather than a side effect of another platform.
          const requirements = {
            windows: [
              'latest.yml',
              'mixdog-desktop-win-x64.exe',
              'mixdog-desktop-win-x64.exe.blockmap',
            ],
            // latest-mac.yml is merged from both architectures' feeds by the
            // publish job; the zip blockmaps serve the differential updater.
            macos: [
              'latest-mac.yml',
              'mixdog-desktop-mac-arm64.dmg',
              'mixdog-desktop-mac-arm64.zip',
              'mixdog-desktop-mac-arm64.zip.blockmap',
              'mixdog-desktop-mac-x64.dmg',
              'mixdog-desktop-mac-x64.zip',
              'mixdog-desktop-mac-x64.zip.blockmap',
            ],
            // electron-updater reads latest-linux*.yml; a .deb install uses
            // DebUpdater, which downloads the .deb named in that feed.
            linux: [
              'latest-linux.yml',
              'latest-linux-arm64.yml',
              'mixdog-desktop-linux-arm64.AppImage',
              'mixdog-desktop-linux-arm64.deb',
              'mixdog-desktop-linux-x86_64.AppImage',
              'mixdog-desktop-linux-amd64.deb',
            ],
          };
          const expected = Object.values(requirements).flat().sort();
          const assets = JSON.parse(readFileSync('/tmp/assets.json', 'utf8')).flat();
          const actual = assets.map(asset => asset.name).sort();
          for (const [platform, names] of Object.entries(requirements)) {
            const missing = names.filter(name => !actual.includes(name));
            if (missing.length) {
              throw new Error(`Hidden release is missing ${platform} assets: ${missing.join(', ')}`);
            }
          }
          if (new Set(actual).size !== actual.length
              || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Hidden release asset set is not exact: ${JSON.stringify(actual)}`);
          }
          // Every file a Linux update feed points at must be a draft asset,
          // and each feed must offer both the AppImage and the .deb.
          for (const feedName of ['latest-linux.yml', 'latest-linux-arm64.yml']) {
            const feedAsset = assets.find(asset => asset.name === feedName);
            const response = await fetch(feedAsset.url, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/octet-stream',
              },
            });
            if (!response.ok) throw new Error(`Cannot read ${feedName}: HTTP ${response.status}`);
            const feed = await response.text();
            const referenced = new Set(
              [...feed.matchAll(/^\s*(?:-\s+)?(?:url|path):\s*['"]?([^'"\s]+)['"]?\s*$/gm)].map(m => m[1])
            );
            for (const ext of ['.AppImage', '.deb']) {
              if (![...referenced].some(name => name.endsWith(ext))) {
                throw new Error(`${feedName} does not reference a ${ext} file`);
              }
            }
            for (const name of referenced) {
              if (!actual.includes(name)) {
                throw new Error(`${feedName} references ${name}, which is not a hidden release asset`);
              }
            }
          }
          for (const asset of assets) {
            if (asset.state !== 'uploaded' || !(asset.size > 0)
                || !/^sha256:[0-9a-f]{64}$/.test(String(asset.digest || ''))) {
              throw new Error(`Incomplete hidden release asset: ${asset.name}`);
            }
          }
          console.log(`Verified hidden ${process.env.RELEASE_TAG}: 1 npm + ${assets.length} desktop assets.`);
          NODE

      - name: Publish staged npm package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CI: "true"
          MIXDOG_MODE: "ship"
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          if npm view "mixdog@${VERSION}" version --silent 2>/dev/null | grep -qxF "$VERSION"; then
            echo "mixdog@${VERSION} is already published; resuming finalization."
          else
            npm publish ./staged-npm/*.tgz --provenance --access public
          fi

      - name: Publish one complete GitHub release
        env:
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Release notes are the CHANGELOG.md section Deploy stamped with this
          # version, followed by the compare link to the previous version.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const sections = readFileSync('CHANGELOG.md', 'utf8').split(/^## /m);
          const headingOf = section => section.split('\n')[0].trim();
          const isVersion = section => /^v\d/.test(section);
          const index = sections.findIndex(section => {
            const heading = headingOf(section);
            return heading === tag || heading.startsWith(`${tag} `);
          });
          if (index === -1) throw new Error(`CHANGELOG.md has no "## ${tag}" section`);
          const body = sections[index].replace(/^[^\n]*\n?/, '').trim();
          if (!body) throw new Error(`CHANGELOG.md: the ${tag} section is empty`);
          const previous = sections.slice(index + 1).find(isVersion);
          const compare = previous
            ? `\n\n**Full Changelog**: https://github.com/${process.env.GITHUB_REPOSITORY}/compare/${headingOf(previous).split(' ')[0]}...${tag}`
            : '';
          writeFileSync('/tmp/release-notes.md', `${body}${compare}\n`);
          NODE
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true -F body=@/tmp/release-notes.md > /tmp/published.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('/tmp/published.json', 'utf8'));
          if (release.draft || release.tag_name !== process.env.RELEASE_TAG) {
            throw new Error('GitHub release finalization did not publish the expected tag');
          }
          NODE

  # Renderer staging is deterministic and does not touch production. Do it
  # while native packages build, then leave only the seven-second atomic remote
  # activation behind the public release boundary.
  stage-relay:
    name: stage-production-web-relay
    needs: [identity, desktop-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Download verified renderer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-out
          path: apps/desktop/out
      - name: Restore renderer precompression cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/relay/.web-precompress
          key: relay-web-precompress-v1-${{ hashFiles('apps/desktop/out/renderer/**') }}
          restore-keys: relay-web-precompress-v1-
      - name: Stage release web app
        run: npm run stage:web --prefix apps/relay
      - name: Stage production relay artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The name is keyed to the run alone. A partial re-run preserves this
          # successful job and still re-runs deploy-relay as a dependent of the
          # failed one, so an attempt-scoped name would point at an artifact
          # that was never uploaded for that attempt. `overwrite` keeps a full
          # re-run, where this job does execute again, from colliding with the
          # earlier attempt's artifact.
          name: production-relay-${{ github.run_id }}
          overwrite: true
          path: |
            apps/relay/server.mjs
            apps/relay/package.json
            apps/relay/package-lock.json
            apps/relay/lib
            apps/relay/deploy
            apps/relay/renderer
          if-no-files-found: error
          retention-days: 2

  # The Android APK release ships with the app release when Deploy planned one
  # (scripts/mobile-release.mjs). It runs beside the desktop build and gates
  # only the relay deploy below, whose /app page links it.
  mobile-android:
    name: release-mobile-android
    if: ${{ inputs.mobile_version != '' }}
    uses: ./.github/workflows/mobile-android.yml
    permissions:
      contents: write # callee creates the mobile-v* release and its tag
    with:
      version: ${{ inputs.mobile_version }}
      ref: ${{ inputs.ref }}
    secrets:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}

  # The Android release /app links: the newest published mobile-v* release
  # whose APK downloads, re-checked here. It runs once the Android release is
  # done; when that was skipped or failed, the newest earlier release stays
  # linked, never one that is missing.
  android-link:
    name: resolve-android-install-link
    needs: [mobile-android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      url: ${{ steps.link.outputs.url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Resolve the newest downloadable Android release
        id: link
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_VERSION: ${{ inputs.mobile_version }}
          ANDROID_RESULT: ${{ needs.mobile-android.result }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mobile-release.mjs link
          linked="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if [[ -n "$MOBILE_VERSION" && "$linked" != "mobile-v${MOBILE_VERSION}" ]]; then
            echo "::error title=Android release not linked::mobile-v${MOBILE_VERSION} (${ANDROID_RESULT}) is not downloadable; /app keeps linking ${linked:-the releases list}."
          fi

  deploy-relay:
    name: deploy-production-web-relay
    needs: [publish, stage-relay, android-link]
    # android-link follows a possibly skipped Android release; that transitive
    # skip would fail the implicit success().
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.stage-relay.result == 'success' && needs.android-link.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    permissions: {}
    steps:
      - name: Download staged production relay
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-relay-${{ github.run_id }}
          path: apps/relay
      - name: Configure pinned production SSH identity
        env:
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          RELAY_KNOWN_HOSTS: ${{ secrets.RELAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELAY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$RELAY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Atomically deploy and verify production
        env:
          RELAY_HOST: ${{ vars.RELAY_HOST }}
          RELAY_PORT: ${{ vars.RELAY_PORT }}
          RELAY_USER: ${{ vars.RELAY_USER }}
          RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ANDROID_URL: ${{ needs.android-link.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELAY_PORT" =~ ^[0-9]+$ ]]
          [[ "$ANDROID_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases$ || "$ANDROID_URL" =~ ^https://github\.com/tribgames/mixdog/releases/download/mobile-v[0-9]+\.[0-9]+\.[0-9]+/[A-Za-z0-9_.-]+\.apk$ ]]
          DESKTOP_VERSION="${RELEASE_TAG#v}"
          ARCHIVE="/tmp/mixdog-relay-${RELEASE_TAG}.tar.gz"
          REMOTE_DIR="/tmp/mixdog-relay-${RELEASE_TAG}"
          tar -czf "$ARCHIVE" -C apps/relay .
          scp -P "$RELAY_PORT" "$ARCHIVE" "$RELAY_USER@$RELAY_HOST:$ARCHIVE"
          ssh -p "$RELAY_PORT" "$RELAY_USER@$RELAY_HOST" \
            "set -euo pipefail; rm -rf '$REMOTE_DIR'; mkdir -p '$REMOTE_DIR'; tar -xzf '$ARCHIVE' -C '$REMOTE_DIR'; bash '$REMOTE_DIR/deploy/deploy-release.sh' '$RELAY_DOMAIN' '$RELEASE_TAG' '$DESKTOP_VERSION' '$ANDROID_URL'; rm -rf '$REMOTE_DIR' '$ARCHIVE'"
          EXPECTED=$(sha256sum apps/relay/renderer/index.html | awk '{print $1}')
          ACTUAL=$(ssh -p "$RELAY_PORT" "$RELAY_USER@$RELAY_HOST" \
            "sha256sum /opt/mixdog-relay/renderer/index.html | awk '{print \$1}'")
          test "$EXPECTED" = "$ACTUAL"
          curl --fail --silent --show-error "https://$RELAY_DOMAIN/healthz" | grep -q '"status":"ok"'
          app_page="$(curl --fail --silent --show-error "https://$RELAY_DOMAIN/app")"
          grep -qF "href=\"$ANDROID_URL\"" <<<"$app_page"

  release-timings:
    if: always()
    needs: [publish, deploy-relay]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Record timing and warn on material regressions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > /tmp/current-jobs.json
          WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)
          PREVIOUS_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -n "$PREVIOUS_ID" ]]; then
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_ID}/jobs?per_page=100" \
              > /tmp/previous-jobs.json
          else
            printf '[]\n' > /tmp/previous-jobs.json
          fi
          node scripts/release-timing-report.mjs \
            /tmp/current-jobs.json /tmp/previous-jobs.json
