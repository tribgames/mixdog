# Reusable application release worker. Deploy computes and commits the version
# (to no branch and no tag), then calls this workflow with the tag, the commit's
# SHA and the default branch commit it descends from. The full gate verifies
# that SHA (coverage-gate) before push-release-refs moves the branch and creates
# the tag, and every publishing job needs both. The npm packages (one per
# platform and the main package that lists them, built from the programs mixdogd-build.yml
# builds once) remain staged as an Actions artifact, while verified desktop packages upload directly
# to one hidden GitHub draft. The draft becomes public only after the exact
# four-platform asset set succeeds. Deploy is the only release entry point;
# there is no direct tag-push trigger.
# Requires the NPM_TOKEN repo secret (npm automation token) and the
# MIXDOG_GOOGLE_OAUTH_CLIENT_ID / MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET repo
# secrets: Mixdog's Google OAuth desktop client, which every shipped mixdogd
# embeds at build time (mixdogd-build.yml). The release fails up front without
# them. The optional MAC_CERTIFICATE_* and APPLE_API_* secrets sign and
# notarize the macOS app; the optional AZURE_* secrets sign the Windows
# installer.

name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Strict vMAJOR.MINOR.PATCH release tag"
        required: true
        type: string
      ref:
        description: "Immutable commit SHA to build and publish"
        required: true
        type: string
      base:
        description: "The default branch's commit the release commit descends from; the branch is moved only from exactly it"
        required: true
        type: string
      mobile_version:
        description: "Android app version X.Y.Z to publish as mobile-vX.Y.Z before the relay deploy; empty for none"
        required: false
        type: string
        default: ""
    secrets:
      NPM_TOKEN:
        required: true
      RELAY_SSH_KEY:
        required: true
      RELAY_KNOWN_HOSTS:
        required: true
      # Mixdog's Google OAuth desktop client; embedded into every shipped build.
      MIXDOG_GOOGLE_OAUTH_CLIENT_ID:
        required: true
      MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET:
        required: true
      # Lists the project's own runners, so a build goes to one that is on (mixdogd-build.yml, release-gate.yml); without it
      # every build runs on a hosted runner.
      RUNNER_STATUS_TOKEN:
        required: false
      # Developer ID signing and notarization for the macOS package; without
      # them the app is packaged unsigned.
      MAC_CERTIFICATE_P12_BASE64:
        required: false
      MAC_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      # Azure Artifact Signing for the Windows installer; without them it is
      # packaged unsigned.
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      # Android APK signing and Firebase config; only read with mobile_version.
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      FIREBASE_GOOGLE_SERVICES_JSON_B64:
        required: false

# Read-only by default; jobs that create/publish releases or use npm
# provenance raise their own permissions.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Only immutable identity gates expensive package work. Bundled-asset,
  # npm, and smoke validation still block publication, but no longer make every
  # platform sit idle for more than a minute before it can start.
  identity:
    name: validate-release-identity
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # Fail before any package work (and before the hidden draft exists) when
      # the Google OAuth client secrets are missing: the mixdogd build compiles
      # in whatever it is given, and would otherwise ship without the client.
      - name: Require the Google OAuth client secrets
        env:
          MIXDOG_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.MIXDOG_GOOGLE_OAUTH_CLIENT_ID }}
          MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$MIXDOG_GOOGLE_OAUTH_CLIENT_ID" ] || [ -z "$MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::MIXDOG_GOOGLE_OAUTH_CLIENT_ID and MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET must both be set"
            exit 1
          fi

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const tag = process.env.RELEASE_TAG || '';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          const coreVersion = '(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)';
          if (!new RegExp(`^${coreVersion}$`).test(version)) {
            throw new Error(`package.json version is not strict MAJOR.MINOR.PATCH: ${version}`);
          }
          if (!new RegExp(`^v${coreVersion}$`).test(tag)) {
            throw new Error(`Release tag is not strict vMAJOR.MINOR.PATCH: ${tag}`);
          }
          if (tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} does not match package.json version ${version}`);
          }
          console.log(`Verified release identity ${tag}.`);
          NODE

      # The desktop package and the Rust workspace (what every mixdogd reports)
      # carry the release version too.
      - name: Verify the desktop and core versions match the release
        run: node scripts/check-release-version.mjs

  validate:
    name: validate-release-source
    needs: identity
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # onnxruntime-node's postinstall fetches the CUDA execution-provider
    # libraries from NuGet on linux/x64, and a connect timeout there failed
    # `npm ci`. This job tests the Node lane, which needs no native binding,
    # so it skips them exactly as release-gate.yml does.
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # Package jobs may populate only a hidden draft in parallel. Publication
      # still waits for every bundled native manifest to pass here.
      - name: Verify bundled release assets
        run: node scripts/verify-release-assets.mjs

      # Last line of defence for native tools: whatever path led here, the
      # release must not bundle a manifest that pins an older native build than
      # the native source being released (Deploy builds and pins it first).
      - name: Verify native sources match the pinned native releases
        run: node scripts/native-release-status.mjs --check

  # The full-release gate for the exact release commit (release-gate.yml, called with the immutable SHA this run was started for):
  # every lane of the gate on that commit, then the reconciliation of what the tracked source defines with what the lanes executed.
  # It replaces the source-critical re-runs this workflow used to select from run history; there is no input that says a commit was
  # already verified. `publish` and every other release sink of this run lists it in `needs` with the default success semantics
  # (scripts/ci/coverage/wiring.mjs checks that, and the sink list, on every change to a workflow).
  coverage-gate:
    name: full-release-coverage
    needs: identity
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.ref }}
      gate: release
      joins: true
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # The first write of the release to the repository, and only once the gate has verified this exact commit: the default branch
  # moves from the deploy's commit (`base`, a lease: if anything else moved it, nothing is pushed) to the release commit, and the app
  # tag is created at it, in one atomic push. A tag that already exists is never moved: the push is refused unless it already names
  # this commit. Every sink of this run that publishes under the tag needs this job.
  push-release-refs:
    name: push-verified-release-refs
    needs: [identity, coverage-gate, prepared-runtime-join]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write # the default branch and the app tag
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/assert-sha
        with:
          expected: ${{ inputs.ref }}
      - name: Move the default branch and create the tag at the verified commit
        env:
          SHA: ${{ inputs.ref }}
          BASE: ${{ inputs.base }}
          TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE" "$SHA"
          git push --atomic --force-with-lease="refs/heads/${DEFAULT_BRANCH}:${BASE}" origin \
            "${SHA}:refs/heads/${DEFAULT_BRANCH}" "${SHA}:refs/tags/${TAG}"
          test "$(git ls-remote origin "refs/heads/${DEFAULT_BRANCH}" | awk '{ print $1 }')" = "$SHA"
          test "$(git ls-remote origin "refs/tags/${TAG}" | awk '{ print $1 }')" = "$SHA"

  # The join of the prepared environments only this workflow builds (scripts/ci/coverage/plan.json `joinLegs`): the Windows package
  # job runs the suite that reads its prepared runtime, which the gate's lanes skip; its receipt, from this run and this commit, must
  # hold a pass of each case an exception sends there, against the gate's manifest of the same commit (cli.mjs join).
  prepared-runtime-join:
    name: prepared-runtime-evidence
    needs: [coverage-gate, desktop-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Download the gate's manifest of this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-manifest-release-${{ inputs.ref }}
          path: coverage
      - name: Download the evidence of the join legs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: join-evidence-release-${{ inputs.ref }}-windows-desktop-package-1of1
          path: join-evidence
      - name: Require the prepared-environment replacements
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
          ALLOW_REUSED_EVIDENCE: "true"
        run: |
          node scripts/ci/coverage/cli.mjs join --manifest coverage/manifest.json --evidence join-evidence \
            --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW_REF"

  # main/preload/renderer output is platform-neutral. Build it once, cache it
  # by the exact desktop/shared source inputs, then feed the same verified
  # artifact to every native packager instead of running Vite four times.
  # The packagers `need` this job (and mixdogd and server-cores) instead of
  # polling for their artifacts on a macOS or Windows runner that bills while it
  # idles; publish and stage-relay need it directly too.
  desktop-build:
    name: build-desktop-once
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      # The platform-neutral output bundles no native addon; each packager's
      # prepare-runtime installs the runtime dependencies (and, on linux-x64,
      # the CUDA provider libraries) itself. Skipping the NuGet fetch here
      # removes the failure mode that took down `npm ci`.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The lock file cannot enter this key through hashFiles: Deploy rewrites
      # its version field one job earlier, which missed the cache on every
      # single release. The manifest digest below ignores that field, so the
      # key follows the dependency tree instead of the release number and the
      # gate's build of the same source can serve this job.
      - name: Resolve version-neutral desktop cache key
        id: desktop-key
        shell: bash
        run: |
          manifest=$(node scripts/manifest-cache-key.mjs package-lock.json apps/desktop/package-lock.json)
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      # Key mirrored in release-gate.yml, which warms it on every main push. It hashes every tree the bundle imports
      # from outside apps/desktop/src, including the hosted phone client in apps/mobile/src. A hit
      # restores the old bundle and skips the typecheck.
      # The renderer bundles CHANGELOG.md and the desktop package version
      # (Settings > About > changelog), so both belong in the key: the
      # release commit Deploy stamps must rebuild instead of reusing the
      # gate's pre-release output.
      - name: Restore unchanged desktop output
        id: desktop-out
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/out
          key: >-
            desktop-out-v8-${{ steps.desktop-key.outputs.manifest }}-${{ hashFiles(
              'CHANGELOG.md',
              'changelog/*.md',
              'apps/desktop/package.json',
              'apps/desktop/src/**',
              'apps/desktop/scripts/**',
              'apps/desktop/electron.vite.config.ts',
              'apps/desktop/tsconfig*.json',
              'apps/mobile/src/**',
              'apps/relay/lib/feedback-attachments.mjs',
              'apps/relay/lib/media-http.mjs',
              'apps/relay/lib/relay-close-codes.mjs',
              'packages/**',
              'src/**',
              '!**/*.test.mjs',
              '!**/*.test.ts',
              '!**/*.test.tsx',
              '!**/*.test.jsx'
            ) }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.desktop-out.outputs.cache-hit != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install build dependencies
        if: steps.desktop-out.outputs.cache-hit != 'true'
        # The two trees are independent, so they install side by side; each
        # PID is waited on so either failure fails the step.
        run: |
          npm ci --prefer-offline --no-audit --no-fund &
          root_pid=$!
          npm ci --prefix apps/desktop --prefer-offline --no-audit --no-fund &
          desktop_pid=$!
          status=0
          wait "$root_pid" || status=1
          wait "$desktop_pid" || status=1
          exit "$status"

      # `npm run build` is typecheck && build:fast in sequence. The typecheck
      # emits nothing the build reads, so it runs beside build:fast; the step
      # still fails if either does, and the output is cached only on success.
      - name: Build platform-neutral desktop output
        if: steps.desktop-out.outputs.cache-hit != 'true'
        run: |
          npm run typecheck --prefix apps/desktop &
          typecheck_pid=$!
          status=0
          npm run build:fast --prefix apps/desktop || status=1
          wait "$typecheck_pid" || status=1
          exit "$status"

      - name: Stage common desktop output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-out
          path: apps/desktop/out
          if-no-files-found: error
          retention-days: 2

  # Keep partially uploaded platform assets invisible. Every platform writes to
  # this one draft, and the final job publishes it only after the remote asset
  # set and npm package have both been verified.
  prepare-github-release:
    name: prepare-hidden-release
    needs: [identity]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      # A public release of the tag is refused; one draft is resumed only if it names this commit; the draft is then used by its id.
      # The listing is the evidence: a failed lookup stops the run, and only a complete listing that lacks the tag creates a draft. The
      # body comes from CHANGELOG.md at publish time (GitHub's generated notes list merged PRs only, and Deploy commits straight to
      # main, so they would leave just a compare link).
      - name: Create or resume one hidden draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REF: ${{ inputs.ref }}
        run: node scripts/ci/release-state.mjs

  # mixdogd, the Rust core, for every target a desktop package carries (the
  # app's own core and the four server cores): the single producer of the
  # mixdogd-<target> artifacts in this run. The desktop packagers stage them
  # (stage-core.mjs) and linux-verify-full consumes them (mixdogd_prebuilt).
  mixdogd:
    needs: [identity]
    uses: ./.github/workflows/mixdogd-build.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref }}
    secrets:
      MIXDOG_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.MIXDOG_GOOGLE_OAUTH_CLIENT_ID }}
      MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.MIXDOG_GOOGLE_OAUTH_CLIENT_SECRET }}
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # The four server bundles (Linux and macOS only: server cores are Unix-only). The job waits for the four Unix mixdogd
  # artifacts in its own step, so it neither idles behind the Windows build nor holds a runner while it waits. The
  # macOS bundles are signed with the app's Developer ID before any packager takes them: the notary inspects the
  # programs inside them in each macOS app.
  server-cores:
    needs: [identity]
    uses: ./.github/workflows/server-cores-build.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.ref }}
      sign_darwin: true
    secrets:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

  # The npm packages: one per platform (scripts/npm-platforms.mjs), staged from the programs mixdogd-build.yml built once
  # (mixdogd-<target> and mixdog-entry-<target>), and the main package, which lists them as optional dependencies at the
  # release version. It waits for the builds only, not for the tests of validate, and no packager waits for it.
  pack-npm:
    name: pack-npm-packages
    needs: [identity, mixdogd]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.tarballs.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      # Each artifact lands in a folder of its own name: native-artifacts/mixdogd-<target>/ and .../mixdog-entry-<target>/.
      - name: Download the core and its helper of every platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mixdogd-*
          path: native-artifacts
      - name: Download the terminal program of every platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mixdog-entry-*
          path: native-artifacts
      - name: Stage the platform packages
        run: node scripts/stage-npm-native.mjs --artifacts native-artifacts --out staged-packages
      # The committed package.json lists no platform package (`npm ci` would look for them before they exist); the
      # package that is packed and published lists every one at this release's version.
      - name: List the platform packages in the main package
        run: node scripts/stage-npm-native.mjs --lock-optional-dependencies
      - name: Pack every package
        run: |
          set -euo pipefail
          mkdir npm-tarballs
          npm pack --ignore-scripts --pack-destination npm-tarballs >/dev/null
          for dir in staged-packages/*/; do
            npm pack --ignore-scripts --pack-destination npm-tarballs "$dir" >/dev/null
          done
          ls -l npm-tarballs
      - name: Check the tarballs and start the launcher from an install of them
        run: node scripts/check-npm-packages.mjs --dir npm-tarballs --run
      - name: Stage npm packages
        id: tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.run_attempt }}
          path: npm-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 2

  # The same install, started on the other operating systems: the launcher, the manifest it writes and each program of the
  # platform package, from the packed tarballs. pack-npm did Linux x64 beside the check of the files.
  verify-npm-install:
    name: verify-npm-install-${{ matrix.key }}
    needs: [identity, pack-npm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: linux-arm64, runner: ubuntu-22.04-arm }
          - { key: darwin-arm64, runner: macos-15 }
          - { key: win32-x64, runner: windows-2022 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Require the verified npm artifact ID
        env:
          NPM_ARTIFACT: ${{ needs.pack-npm.outputs.artifact_id }}
        shell: bash
        run: '[[ "$NPM_ARTIFACT" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack-npm.outputs.artifact_id }}
          digest-mismatch: error
          path: npm-tarballs
      - name: Start the launcher from the packed tarballs
        run: node scripts/check-npm-packages.mjs --dir npm-tarballs --run ${{ matrix.key }}

  # Desktop update feed. electron-updater reads latest.yml from the LATEST
  # GitHub release, so a tag without these assets leaves every installed app
  # stranded on its current version ("no update available" forever).
  # Each packager starts once the common desktop output, every mixdogd and the
  # server bundles it stages exist.
  desktop-windows:
    needs: [prepare-github-release, desktop-build, mixdogd, server-cores]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
      actions: read
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: windows-2022
      platform: win32
      arch: x64
      artifact_arch: x64
      target: win
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  desktop-darwin-arm64:
    needs: [prepare-github-release, desktop-build, mixdogd, server-cores]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
      actions: read
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: macos-15
      platform: darwin
      arch: arm64
      artifact_arch: arm64
      target: mac
    secrets:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  desktop-darwin-x64:
    needs: [prepare-github-release, desktop-build, mixdogd, server-cores]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
      actions: read
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: macos-15-intel
      platform: darwin
      arch: x64
      artifact_arch: x64
      target: mac
    secrets:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # mixdog-computer/-graph/-patch built in manylinux_2_28 (glibc 2.28), so the
  # native tools do not follow the package runner's glibc. The shipped Linux
  # package floor is glibc 2.31 (runtime built on ubuntu:20.04), enforced by
  # the payload checks. This is the single producer of the
  # native-tools-glibc228-<arch> artifacts in this run: linux-verify-full
  # consumes them (native_tools_prebuilt) instead of building again.
  linux-native-tools:
    needs: [identity]
    uses: ./.github/workflows/linux-native-tools.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref }}

  desktop-linux-x64:
    needs: [prepare-github-release, linux-native-tools, desktop-build, mixdogd, server-cores]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
      actions: read
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: ubuntu-22.04
      platform: linux
      arch: x64
      artifact_arch: x86_64
      target: linux

  desktop-linux-arm64:
    needs: [prepare-github-release, linux-native-tools, desktop-build, mixdogd, server-cores]
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
      actions: read
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      release_id: ${{ needs.prepare-github-release.outputs.release_id }}
      runner: ubuntu-22.04-arm
      platform: linux
      arch: arm64
      artifact_arch: arm64
      target: linux

  # All full Linux checks use the immutable artifacts of the two packagers.
  # Their byte records, not merely the shared source SHA, also gate publication.
  # The x64 root and desktop suites are not repeated here (arm64_tests_only): the
  # gate ran them on this source, and only arm64 is exercised nowhere else.
  linux-verify-full:
    needs: [identity, linux-native-tools, mixdogd, server-cores, desktop-linux-x64, desktop-linux-arm64]
    uses: ./.github/workflows/linux-desktop-verify.yml
    permissions:
      contents: read
      actions: read
    with:
      full: true
      native_tools_prebuilt: true
      mixdogd_prebuilt: true
      server_cores_prebuilt: true
      packages_prebuilt: true
      package_x64_id: ${{ needs.desktop-linux-x64.outputs.linux_package_id }}
      package_arm64_id: ${{ needs.desktop-linux-arm64.outputs.linux_package_id }}
      arm64_tests_only: true
      # Every checkout inside the called workflow uses this exact commit
      # (and asserts HEAD == ref), not the caller's default-branch sha.
      ref: ${{ inputs.ref }}

  # The commit the Linux verification actually checked out must be the release commit.
  linux-verify-sha-gate:
    needs: [linux-verify-full]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - env:
          VERIFIED: ${{ needs.linux-verify-full.outputs.verified_sha }}
          RELEASE_SHA: ${{ inputs.ref }}
        run: |
          echo "verified: $VERIFIED"
          echo "release:  $RELEASE_SHA"
          test -n "$VERIFIED"
          test "$VERIFIED" = "$RELEASE_SHA"

  publish:
    name: publish-staged-release
    needs: [coverage-gate, push-release-refs, prepared-runtime-join, validate, desktop-build, server-cores, pack-npm, verify-npm-install, prepare-github-release, desktop-windows, desktop-darwin-arm64, desktop-darwin-x64, desktop-linux-x64, desktop-linux-arm64, linux-verify-full, linux-verify-sha-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Require artifact IDs from the verified jobs
        env:
          NPM_ARTIFACT: ${{ needs.pack-npm.outputs.artifact_id }}
          MAC_ARM64_FEED: ${{ needs.desktop-darwin-arm64.outputs.mac_feed_id }}
          MAC_X64_FEED: ${{ needs.desktop-darwin-x64.outputs.mac_feed_id }}
        shell: bash
        run: '[[ "$NPM_ARTIFACT" =~ ^[0-9]+$ && "$MAC_ARM64_FEED" =~ ^[0-9]+$ && "$MAC_X64_FEED" =~ ^[0-9]+$ && "$MAC_ARM64_FEED" != "$MAC_X64_FEED" ]]'

      - name: Download staged npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack-npm.outputs.artifact_id }}
          digest-mismatch: error
          path: staged-npm

      # electron-updater on macOS reads one latest-mac.yml, but each macOS job
      # builds a single architecture and so emits a feed for its own zip only.
      # Merge both into the one feed and add it to the hidden draft.
      - name: Download arm64 macOS update feed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.desktop-darwin-arm64.outputs.mac_feed_id }}
          digest-mismatch: error
          path: mac-feeds/arm64

      - name: Download x64 macOS update feed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.desktop-darwin-x64.outputs.mac_feed_id }}
          digest-mismatch: error
          path: mac-feeds/x64

      - name: Merge and upload macOS update feed
        id: merged-feed
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/merge-mac-update-feed.mjs --version="${RELEASE_TAG#v}" --out=latest-mac.yml \
            mac-feeds/arm64/latest-mac.yml mac-feeds/x64/latest-mac.yml
          bash .github/scripts/upload-release-assets.sh latest-mac.yml

      - name: Verify complete hidden release
        env: &desktop-release
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ASSETS: ${{ needs.desktop-windows.outputs.assets }}
          MAC_ARM64_ASSETS: ${{ needs.desktop-darwin-arm64.outputs.assets }}
          MAC_X64_ASSETS: ${{ needs.desktop-darwin-x64.outputs.assets }}
          LINUX_ARM64_ASSETS: ${{ needs.desktop-linux-arm64.outputs.assets }}
          LINUX_X64_ASSETS: ${{ needs.desktop-linux-x64.outputs.assets }}
          MERGED_FEED: ${{ steps.merged-feed.outputs.assets }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$RELEASE_REF"
          node scripts/ci/release-assets.mjs verify-desktop

      # The six tarballs are what pack-npm checked; nothing else may be in the folder.
      - name: Verify the staged npm packages
        run: node scripts/check-npm-packages.mjs --dir staged-npm

      # The platform packages first, the main package last: the main package lists them, so an install of it can
      # never find a version whose platform package is missing. Only exact bytes count as already published.
      - name: Publish staged npm packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CI: "true"
          MIXDOG_MODE: "ship"
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node scripts/ci/publish-npm.mjs staged-npm "${RELEASE_TAG#v}"

      - name: Publish one complete GitHub release
        env: *desktop-release
        shell: bash
        run: |
          set -euo pipefail
          # The tag still names the commit the gate verified (push-release-refs created it there); a moved tag publishes nothing.
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$RELEASE_REF"
          # Release notes are the CHANGELOG.md section Deploy stamped with this
          # version, followed by the compare link to the previous version.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const sections = readFileSync('CHANGELOG.md', 'utf8').split(/^## /m);
          const headingOf = section => section.split('\n')[0].trim();
          const isVersion = section => /^v\d/.test(section);
          const index = sections.findIndex(section => {
            const heading = headingOf(section);
            return heading === tag || heading.startsWith(`${tag} `);
          });
          if (index === -1) throw new Error(`CHANGELOG.md has no "## ${tag}" section`);
          const body = sections[index].replace(/^[^\n]*\n?/, '').trim();
          if (!body) throw new Error(`CHANGELOG.md: the ${tag} section is empty`);
          const previous = sections.slice(index + 1).find(isVersion);
          const compare = previous
            ? `\n\n**Full Changelog**: https://github.com/${process.env.GITHUB_REPOSITORY}/compare/${headingOf(previous).split(' ')[0]}...${tag}`
            : '';
          writeFileSync('/tmp/release-notes.md', `${body}${compare}\n`);
          NODE
          node scripts/ci/release-assets.mjs publish-desktop /tmp/release-notes.md

  # Renderer staging is deterministic and does not touch production. Do it
  # while native packages build, then leave only the seven-second atomic remote
  # activation behind the public release boundary.
  stage-relay:
    name: stage-production-web-relay
    needs: [identity, desktop-build, mixdogd]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Download verified renderer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-out
          path: apps/desktop/out
      # The relay is the mixdog-relay binary the mixdogd job built for the VPS
      # (Linux x64); the box runs no other runtime.
      - name: Download the relay binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mixdog-relay-x86_64-unknown-linux-gnu
          path: apps/relay
      # download-artifact does not keep the mode; deploy-release.sh installs the
      # binary 0755 on the VPS, and this check fails here if it cannot run.
      - name: Restore the relay binary mode
        run: |
          chmod 0755 apps/relay/mixdog-relay
          test -x apps/relay/mixdog-relay
      - name: Restore renderer precompression cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/relay/.web-precompress
          key: relay-web-precompress-v1-${{ hashFiles('apps/desktop/out/renderer/**') }}
          restore-keys: relay-web-precompress-v1-
      - name: Stage release web app
        run: npm run stage:web --prefix apps/relay
      - name: Stage production relay artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The name is keyed to the run alone. A partial re-run preserves this
          # successful job and still re-runs deploy-relay as a dependent of the
          # failed one, so an attempt-scoped name would point at an artifact
          # that was never uploaded for that attempt. `overwrite` keeps a full
          # re-run, where this job does execute again, from colliding with the
          # earlier attempt's artifact.
          name: production-relay-${{ github.run_id }}
          overwrite: true
          path: |
            apps/relay/mixdog-relay
            apps/relay/deploy
            apps/relay/renderer
          if-no-files-found: error
          retention-days: 2

  # The Android APK release ships with the app release when Deploy planned one
  # (scripts/mobile-release.mjs). It runs beside the desktop build and gates
  # only the relay deploy below, whose /app page links it.
  mobile-android:
    name: release-mobile-android
    needs: [coverage-gate, push-release-refs]
    if: ${{ inputs.mobile_version != '' }}
    uses: ./.github/workflows/mobile-android.yml
    permissions:
      contents: write # callee creates the mobile-v* release and its tag
    with:
      version: ${{ inputs.mobile_version }}
      ref: ${{ inputs.ref }}
    secrets:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}

  # The Android release /app links: the newest published mobile-v* release
  # whose APK downloads, re-checked here. It runs once the Android release is
  # done; when that was skipped or failed, the newest earlier release stays
  # linked, never one that is missing.
  android-link:
    name: resolve-android-install-link
    needs: [mobile-android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      url: ${{ steps.link.outputs.url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Resolve the newest downloadable Android release
        id: link
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_VERSION: ${{ inputs.mobile_version }}
          ANDROID_RESULT: ${{ needs.mobile-android.result }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mobile-release.mjs link
          linked="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if [[ -n "$MOBILE_VERSION" && "$linked" != "mobile-v${MOBILE_VERSION}" ]]; then
            echo "::error title=Android release not linked::mobile-v${MOBILE_VERSION} (${ANDROID_RESULT}) is not downloadable; /app keeps linking ${linked:-the releases list}."
          fi

  deploy-relay:
    name: deploy-production-web-relay
    needs: [publish, stage-relay, android-link]
    # android-link follows a possibly skipped Android release; that transitive
    # skip would fail the implicit success().
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.stage-relay.result == 'success' && needs.android-link.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    permissions: {}
    steps:
      - name: Download staged production relay
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-relay-${{ github.run_id }}
          path: apps/relay
      - name: Configure pinned production SSH identity
        env:
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          RELAY_KNOWN_HOSTS: ${{ secrets.RELAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELAY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$RELAY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Atomically deploy and verify production
        env:
          RELAY_HOST: ${{ vars.RELAY_HOST }}
          RELAY_PORT: ${{ vars.RELAY_PORT }}
          RELAY_USER: ${{ vars.RELAY_USER }}
          RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
          RELEASE_TAG: ${{ inputs.tag }}
          ANDROID_URL: ${{ needs.android-link.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELAY_PORT" =~ ^[0-9]+$ ]]
          [[ "$ANDROID_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases$ || "$ANDROID_URL" =~ ^https://github\.com/tribgames/mixdog/releases/download/mobile-v[0-9]+\.[0-9]+\.[0-9]+/[A-Za-z0-9_.-]+\.apk$ ]]
          DESKTOP_VERSION="${RELEASE_TAG#v}"
          ARCHIVE="/tmp/mixdog-relay-${RELEASE_TAG}.tar.gz"
          REMOTE_DIR="/tmp/mixdog-relay-${RELEASE_TAG}"
          tar -czf "$ARCHIVE" -C apps/relay .
          scp -P "$RELAY_PORT" "$ARCHIVE" "$RELAY_USER@$RELAY_HOST:$ARCHIVE"
          ssh -p "$RELAY_PORT" "$RELAY_USER@$RELAY_HOST" \
            "set -euo pipefail; rm -rf '$REMOTE_DIR'; mkdir -p '$REMOTE_DIR'; tar -xzf '$ARCHIVE' -C '$REMOTE_DIR'; bash '$REMOTE_DIR/deploy/deploy-release.sh' '$RELAY_DOMAIN' '$RELEASE_TAG' '$DESKTOP_VERSION' '$ANDROID_URL'; rm -rf '$REMOTE_DIR' '$ARCHIVE'"
          EXPECTED=$(sha256sum apps/relay/renderer/index.html | awk '{print $1}')
          ACTUAL=$(ssh -p "$RELAY_PORT" "$RELAY_USER@$RELAY_HOST" \
            "sha256sum /opt/mixdog-relay/renderer/index.html | awk '{print \$1}'")
          test "$EXPECTED" = "$ACTUAL"
          curl --fail --silent --show-error "https://$RELAY_DOMAIN/healthz" | grep -q '"status":"ok"'
          app_page="$(curl --fail --silent --show-error "https://$RELAY_DOMAIN/app")"
          grep -qF "href=\"$ANDROID_URL\"" <<<"$app_page"
