name: dependency-audit

# Fails on high or critical advisories in the lockfiles (issue #159). The root
# audit covers production dependencies only, since those are what npm installs
# for the terminal product and what ships in runtime.asar; the relay and mobile
# audits are production-only too (their dev dependencies build nothing that
# ships); the desktop audit includes its dev dependencies, which build the
# installer. npm audit reads package-lock.json, so no install is needed. The
# Rust job audits every Cargo.lock in the tree against the RustSec database:
# cargo audit fails on any vulnerability (unmaintained and yanked notices are
# warnings), which is the stricter gate for the code that ships as mixdogd. A
# copy of a registry crate in the tree (those in native/core/vendor, patched in
# by the core and by the standalone workspaces) has no registry source in its
# lock entry and cargo audit passes over it, so the releases those copies were
# made from are audited from native/core/vendor/audit-bases.lock.
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - apps/desktop/package.json
      - apps/desktop/package-lock.json
      - apps/relay/package.json
      - apps/relay/package-lock.json
      - apps/mobile/package.json
      - apps/mobile/package-lock.json
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - native/core/vendor/audit-bases.lock
      - .github/workflows/dependency-audit.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - apps/desktop/package.json
      - apps/desktop/package-lock.json
      - apps/relay/package.json
      - apps/relay/package-lock.json
      - apps/mobile/package.json
      - apps/mobile/package-lock.json
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - native/core/vendor/audit-bases.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root-runtime
            directory: .
            flags: --omit=dev
          - name: desktop
            directory: apps/desktop
            flags: ""
          - name: relay
            directory: apps/relay
            flags: --omit=dev
          - name: mobile
            directory: apps/mobile
            flags: --omit=dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: npm audit (high and critical)
        working-directory: ${{ matrix.directory }}
        run: npm audit ${{ matrix.flags }} --audit-level=high

  # Every tracked Cargo.lock, so a new crate is audited without touching this
  # file. No toolchain build of the workspace: only cargo-audit is installed
  # (compiled once, then restored from the cache by its version).
  cargo:
    name: audit-cargo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_AUDIT_VERSION: "0.23.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Restore cargo-audit
        id: tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: cargo audit (every Cargo.lock)
        run: |
          status=0
          fetch=""
          while IFS= read -r lock; do
            echo "::group::cargo audit $lock"
            cargo audit --file "$lock" $fetch || status=1
            echo "::endgroup::"
            # The advisory database is fetched once, by the first lockfile.
            fetch="--no-fetch"
          done < <(git ls-files '*Cargo.lock')
          exit "$status"
      - name: cargo audit (the releases the patched copies are of)
        if: ${{ !cancelled() }}
        working-directory: native/core
        run: |
          status=0
          # What must be listed comes from every tracked Cargo manifest and lockfile, read as TOML, not from the file
          # under check.
          python3 - <<'PY' || status=1
          import pathlib
          import posixpath
          import subprocess
          import sys
          import tomllib

          ROOT = pathlib.Path(subprocess.check_output(["git", "rev-parse", "--show-toplevel"], text=True).strip())
          BASES = "native/core/vendor/audit-bases.lock"
          # Mixdog's own packages whose names do not start with `mixdog`. Any other tracked package is a copy of a
          # third-party crate, wherever it lives, and must be listed in the file.
          OWN = {
              "fancy-regex-differential": "native/core/vendor/fancy-regex-differential, the test of the fancy-regex copy",
              "treerun": "scripts/rust-core/tree-helper",
          }

          failed = False


          def fail(message):
              global failed
              failed = True
              print(f"::error file={BASES}::{message}")


          def read(path):
              return tomllib.loads((ROOT / path).read_text(encoding="utf-8"))


          def tracked(pattern):
              out = subprocess.check_output(["git", "ls-files", "-z", "--", pattern], cwd=ROOT, text=True)
              return [path for path in out.split("\0") if path]


          def own(name):
              return name.startswith("mixdog") or name in OWN


          manifests = {path: read(path) for path in tracked("*Cargo.toml")}
          packages = {
              posixpath.dirname(path): doc["package"] for path, doc in manifests.items() if "package" in doc
          }
          copies = {path: package for path, package in packages.items() if not own(package["name"])}
          if not copies:
              fail("no tracked package is a copy: the guard no longer reads the tree")

          listed = {package["name"]: package.get("version") for package in read(BASES).get("package", [])}
          for path, package in sorted(copies.items()):
              name, declared = package["name"], package["version"]
              if listed.get(name) != declared:
                  fail(f"{name} is {declared} in {path}/Cargo.toml and {listed.get(name, 'missing')} here")
          copied = {package["name"] for package in copies.values()}
          for name in sorted(set(listed) - copied):
              fail(f"{name} is listed here and no tracked copy of it is left")

          # A path patch of any registry, in any workspace, must take a tracked package: a copy, so listed above.
          patches = 0
          for manifest, doc in sorted(manifests.items()):
              for registry in doc.get("patch", {}).values():
                  for name, spec in registry.items():
                      if isinstance(spec, dict) and "path" in spec:
                          patches += 1
                          target = posixpath.normpath(posixpath.join(posixpath.dirname(manifest), spec["path"]))
                          if target not in packages:
                              fail(f"{manifest} patches {name} from {target}, which is not a tracked package")
          if not patches:
              fail("no tracked manifest has a path patch: the guard no longer reads Cargo's patch sets")

          # A lock entry without a source is a path package: it must be a tracked one, so a copy is listed above.
          known = {(package["name"], package["version"]) for package in copies.values()}
          for lock in tracked("*Cargo.lock"):
              for package in read(lock).get("package", []):
                  if "source" in package or own(package["name"]):
                      continue
                  if (package["name"], package["version"]) not in known:
                      fail(f"{lock} has {package['name']} {package['version']} from a path that is no tracked copy")
          sys.exit(1 if failed else 0)
          PY
          cargo audit --file vendor/audit-bases.lock || status=1
          exit "$status"
