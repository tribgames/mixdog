# NO PRAGMA RULE. `pragma solidity ^0.8.19;` is a compiler directive, not a
# declaration: it declares no name, nothing can reference it, and the only name
# it could carry is the version expression itself — which reached the record as
# the symbol `solidity ^0.8.19`, the one symbol name in the whole graph with a
# space in it. Dropping the rule drops the row and nothing else: the directive
# is still parsed, and the identifiers a grammar spells inside one (`pragma
# experimental ABIEncoderV2`) still reach `tokens`.
# mixdog-kind: import
id: solidity-import
language: Solidity
role: item
symbolType: module
rule:
  kind: import_directive
  has:
    field: source
    pattern: $PATH
transform:
  SPEC:
    replace:
      source: $PATH
      replace: '^"|"$'
      by: ''
name: $SPEC
isImport: true
isExported: false
---
# mixdog-kind: contract
id: solidity-contract
language: Solidity
role: item
symbolType: class
rule:
  kind: contract_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
isExported: true
---
# mixdog-kind: interface
id: solidity-interface
language: Solidity
role: item
symbolType: interface
rule:
  kind: interface_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
isExported: true
---
# mixdog-kind: library
id: solidity-library
language: Solidity
role: item
symbolType: class
rule:
  kind: library_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
isExported: true
---
# mixdog-kind: function
id: solidity-function
language: Solidity
role: item
symbolType: function
rule:
  all:
    - kind: function_definition
    - has:
        field: name
        pattern: $NAME
    - not:
        inside:
          kind: contract_body
          stopBy: end
name: $NAME
isExported: true
---
# mixdog-kind: function
id: solidity-member-function
language: Solidity
role: member
parentRuleIds: [solidity-contract, solidity-interface, solidity-library]
symbolType: method
rule:
  kind: function_definition
  has:
    field: name
    pattern: $NAME
name: $NAME
isPublic:
  has:
    kind: visibility
    regex: '^(public|external)$'
