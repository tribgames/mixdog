# Terraform / HCL outline rules.
#
# Import forms (the native walk descends into every block, so a `module` body
# stays visible even though the module block is itself an item):
# - `module "x" { source = "./modules/x" }` is an import edge when the source is
#   a LOCAL PATH. Registry (`hashicorp/consul/aws`) and remote (`git::…`,
#   `github.com/…`) sources name no file in this repository, so they are not
#   edges — see `hcl-module-source`.
# - `terraform.required_providers` `source` values are also import items;
#   the native walk reaches them regardless of enclosing item matches.
# Nested `dynamic` blocks are not extracted.
#
# mixdog-kind: resource
id: hcl-resource
language: Hcl
role: item
symbolType: object
rule:
  all:
    - kind: block
    - has:
        nthChild: 1
        kind: identifier
        regex: '^resource$'
    - has:
        nthChild: 2
        kind: string_lit
        pattern: $TYPE
    - has:
        nthChild: 3
        kind: string_lit
        pattern: $NAME
transform:
  TYPE_SPEC:
    replace:
      source: $TYPE
      replace: '^"|"$'
      by: ''
  NAME_SPEC:
    replace:
      source: $NAME
      replace: '^"|"$'
      by: ''
name: $TYPE_SPEC.$NAME_SPEC
isExported: true
