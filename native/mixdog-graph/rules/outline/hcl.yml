---

# mixdog-kind: import
# `module "vpc" { source = "./modules/vpc" }` — only a local path (`./…`,
# `../…`, `/…`) is a file this repository can resolve; a registry or git
# source is a remote dependency, not an edge.
id: hcl-module-source
language: Hcl
role: item
symbolType: module
# The `attribute` node exposes no key/val FIELDS in this grammar, so the two
# children are addressed by position: 1 is the name, 2 is the value.
rule:
  all:
    - kind: attribute
    - has:
        nthChild: 1
        kind: identifier
        regex: '^source$'
    - has:
        nthChild: 2
        regex: '^"(\./|\.\./|/)'
        pattern: $VALUE
    - inside:
        kind: block
        stopBy: end
        has:
          nthChild: 1
          kind: identifier
          regex: '^module$'
transform:
  SPEC:
    replace:
      source: $VALUE
      replace: '^["'']|["'']$'
      by: ''
name: $SPEC
isImport: true
isExported: false
---
# mixdog-kind: import
# Optional: `source = "hashicorp/aws"` inside `required_providers`.
id: hcl-required-provider-source
language: Hcl
role: item
symbolType: module
rule:
  all:
    - kind: object_elem
    - has:
        field: key
        regex: '^source$'
    - has:
        field: val
        pattern: $VALUE
    - inside:
        kind: block
        stopBy: end
        has:
          kind: identifier
          regex: '^required_providers$'
transform:
  SPEC:
    replace:
      source: $VALUE
      replace: '^[''"]|[''"]$'
      by: ''
name: $SPEC
isImport: true
isExported: false
