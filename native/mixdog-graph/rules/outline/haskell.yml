# mixdog-kind: function
id: haskell-class-method
language: Haskell
role: member
parentRuleIds: [haskell-class]
symbolType: method
rule:
  any:
    - kind: function
      has:
        field: name
        pattern: $NAME
    - kind: signature
      has:
        field: name
        pattern: $NAME
    - kind: bind
      has:
        field: name
        pattern: $NAME
name: $NAME
isPublic: true
