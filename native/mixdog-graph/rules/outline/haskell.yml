# mixdog-kind: module
id: haskell-module
language: Haskell
role: item
symbolType: module
rule:
  kind: header
  has:
    field: module
    pattern: $NAME
name: $NAME
isExported: true
---
# mixdog-kind: import
id: haskell-import
language: Haskell
role: item
symbolType: module
rule:
  kind: import
  has:
    field: module
    pattern: $NAME
name: $NAME
isImport: true
isExported: false
---
# mixdog-kind: function
# Top-level function definitions (not class/instance/where binds).
id: haskell-function
language: Haskell
role: item
symbolType: function
rule:
  all:
    - kind: function
    - has:
        field: name
        pattern: $NAME
    - not:
        inside:
          kind: local_binds
          stopBy: end
    - not:
        inside:
          kind: class
          stopBy: end
    - not:
        inside:
          kind: instance
          stopBy: end
name: $NAME
isExported: true
---
# mixdog-kind: function
# Top-level type signatures (`foo :: a -> a`).
id: haskell-signature
language: Haskell
role: item
symbolType: function
rule:
  all:
    - kind: signature
    - has:
        field: name
        pattern: $NAME
    - not:
        inside:
          kind: local_binds
          stopBy: end
    - not:
        inside:
          kind: class
          stopBy: end
    - not:
        inside:
          kind: instance
          stopBy: end
name: $NAME
isExported: true
---
# mixdog-kind: function
# Simple top-level binds (`foo = ...`) that are not local.
id: haskell-bind
language: Haskell
role: item
symbolType: function
rule:
  all:
    - kind: bind
    - has:
        field: name
        pattern: $NAME
    - not:
        inside:
          kind: local_binds
          stopBy: end
    - not:
        inside:
          kind: class
          stopBy: end
    - not:
        inside:
          kind: instance
          stopBy: end
name: $NAME
isExported: true
