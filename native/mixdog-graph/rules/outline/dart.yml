---
# mixdog-kind: method
# An ABSTRACT method (`void start();` in an abstract class or an implicit
# interface) has no `method_declaration` node at all: the grammar files it as
# `class_member > declaration > function_signature`. `inside: declaration` is
# what separates it from the `function_signature` a bodied `method_declaration`
# and a top-level `function_declaration` also carry.
id: dart-abstract-method
language: Dart
role: member
parentRuleIds: [dart-class, dart-mixin, dart-enum, dart-extension]
symbolType: method
rule:
  kind: function_signature
  all:
    - inside:
        kind: declaration
    - has:
        field: name
        pattern: $NAME
name: $NAME
isPublic:
  not:
    has:
      field: name
      regex: '^_'
---
# mixdog-kind: method
# Operator name is the bindable `binary_operator` token (`+`, `==`, …).
# Unnamed `[]` / `[]=` / `~` tokens are omitted (same as the tree-sitter query).
id: dart-operator
language: Dart
role: member
parentRuleIds: [dart-class, dart-mixin, dart-enum, dart-extension]
symbolType: method
rule:
  kind: method_declaration
  has:
    field: signature
    has:
      kind: operator_signature
      has:
        field: operator
        kind: binary_operator
        pattern: $NAME
name: $NAME
isPublic: true
