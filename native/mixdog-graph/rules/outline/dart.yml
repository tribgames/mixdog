# mixdog-kind: import
# Ports dart_import `import 'uri'` (quotes stripped). `part of` is intentionally omitted.
id: dart-import
language: Dart
role: item
symbolType: module
rule:
  kind: library_import
  has:
    kind: import_specification
    has:
      field: uri
      pattern: $URI
transform:
  SPEC:
    replace:
      source: $URI
      replace: '^[''"]|[''"]$'
      by: ''
name: $SPEC
isImport: true
isExported: false
---
# mixdog-kind: import
# Ports dart_import `export 'uri'`.
id: dart-export
language: Dart
role: item
symbolType: module
rule:
  kind: library_export
  has:
    field: uri
    pattern: $URI
transform:
  SPEC:
    replace:
      source: $URI
      replace: '^[''"]|[''"]$'
      by: ''
name: $SPEC
isImport: true
isExported: true
---
# mixdog-kind: import
# Ports dart_import `part 'uri'` (not `part of`).
id: dart-part
language: Dart
role: item
symbolType: module
rule:
  kind: part_directive
  has:
    field: uri
    pattern: $URI
transform:
  SPEC:
    replace:
      source: $URI
      replace: '^[''"]|[''"]$'
      by: ''
name: $SPEC
isImport: true
isExported: false
---
# mixdog-kind: class
id: dart-class
language: Dart
role: item
symbolType: class
rule:
  kind: class_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
isExported:
  not:
    has:
      field: name
      regex: '^_'
