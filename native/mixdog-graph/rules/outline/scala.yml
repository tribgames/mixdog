# mixdog-kind: import
# Ports scala_import: dotted prefix; selector braces and `._` wildcards stripped.
id: scala-import
language: Scala
role: item
symbolType: module
rule:
  kind: import_declaration
  pattern: $DECL
transform:
  AFTER:
    replace:
      source: $DECL
      replace: '^import\s+'
      by: ''
  NOSEL:
    replace:
      source: $AFTER
      replace: '\s*[\{\n].*$|\._\s*$'
      by: ''
  SPEC:
    replace:
      source: $NOSEL
      replace: '\.+$'
      by: ''
name: $SPEC
isImport: true
isExported: false
---
# mixdog-kind: function
id: scala-function
language: Scala
role: item
symbolType: function
rule:
  kind: function_definition
  has:
    field: name
    pattern: $NAME
name: $NAME
isExported: true
---
# mixdog-kind: class
id: scala-class
language: Scala
role: item
symbolType: class
rule:
  kind: class_definition
  has:
    field: name
    pattern: $NAME
name: $NAME
isExported: true
---
# mixdog-kind: object
id: scala-object
language: Scala
role: item
symbolType: object
rule:
  kind: object_definition
  has:
    field: name
