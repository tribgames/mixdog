---
# -------------------------------------------------------------------- Python
# The default `from $MODULE import $NAME` pattern only matches a single-segment
# module (`from pathlib import Path`); this reports the module node itself, so
# dotted (`a.b.c`) and relative (`.pkg`) modules resolve too.
id: mixdog-python-import-from
language: Python
role: item
symbolType: module
rule:
  kind: import_from_statement
  has:
    field: module_name
    pattern: $MODULE
name: $MODULE
isImport: true
isExported: false
---
# `from __future__ import ...` is its own node kind.
id: mixdog-python-future-import
language: Python
role: item
symbolType: module
rule:
  kind: future_import_statement
name: __future__
isImport: true
isExported: false
---
# `import a, b` carries one dotted_name per module; matching the spec node
# instead of the statement reports both.
id: mixdog-python-import-name
language: Python
role: item
symbolType: module
rule:
  all:
    - kind: dotted_name
    - pattern: $NAME
    - inside:
        any:
          - kind: import_statement
          - kind: aliased_import
            inside:
              kind: import_statement
name: $NAME
isImport: true
isExported: false
---
# ------------------------------------------------------------------------ Go
# The default rules name the whole `type (...)` declaration; the graph reports
# one symbol per spec, spanning the spec node.
id: mixdog-go-type-spec
language: Go
role: item
symbolType: struct
rule:
  kind: type_spec
  has:
    field: name
    pattern: $NAME
name: $NAME
---
# An interface method (`Read(p []byte) (int, error)`) is a bodyless method
# DECLARATION — the same kind (`method`) a `func (r *R) Read(…)` gets, and the
# only declaration of that name in a package that only defines the interface.
id: mixdog-go-interface-method
language: Go
role: item
symbolType: method
rule:
  kind: method_elem
  has:
    field: name
    pattern: $NAME
name: $NAME
---
# ---------------------------------------------------------------------- Rust
# `use` is an import; `pub use` was NOT matched by the pre-Stage-2 regex
# (`^\s*use`), so it stays a non-import item that maps to no symbol.
id: mixdog-rust-use
language: Rust
role: item
symbolType: module
rule:
  all:
    - kind: use_declaration
    - pattern: $DECL
transform:
  UNPREFIXED:
    replace:
      source: $DECL
      replace: '^(pub\s*(\([^)]*\))?\s*)?use\s+'
      by: ''
  SPEC:
    replace:
      source: $UNPREFIXED
      replace: ';\s*$'
      by: ''
name: $SPEC
isImport:
  not:
    has:
      kind: visibility_modifier
---
# `mod x;` is both a module symbol and a `mod::x` import edge; `mod x { .. }`
# is only a symbol.
id: mixdog-rust-mod
language: Rust
role: item
symbolType: module
rule:
  kind: mod_item
  has:
    field: name
    pattern: $NAME
name: $NAME
isImport:
  not:
    has:
      kind: declaration_list
---
id: mixdog-rust-type
language: Rust
role: item
symbolType: struct
rule:
  kind: type_item
