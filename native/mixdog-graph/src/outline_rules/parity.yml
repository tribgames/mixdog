id: mixdog-java-import
language: Java
role: item
symbolType: module
rule:
  all:
    - kind: import_declaration
    - pattern: $DECL
transform:
  UNPREFIXED:
    replace:
      source: $DECL
      replace: '^import\s+'
      by: ''
  SPEC:
    replace:
      source: $UNPREFIXED
      replace: '\s*;\s*$'
      by: ''
name: $SPEC
isImport: true
isExported: false
