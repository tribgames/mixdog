# Outline rules that keep mixdog-graph's FileRecord symbol/import contract
# intact on top of ast-grep's `DEFAULT_OUTLINE_RULES`.
#
# WHY THIS FILE EXISTS
# --------------------
# The upstream default rules are written for a code-outline view: they stop at
# the first matching item, they name exported declarations after the wrapping
# `export`/`type` statement, and they skip declaration shapes an outline does
# not need (nested functions, `var`, type aliases, macros, ...). The code graph
# contract is different: every declaration at every nesting depth, with the
# span of the declaration node itself, in the per-language `kind` vocabulary
# the tree-sitter queries used before Stage 2.
#
# Each rule below therefore either
#   (a) covers a declaration shape the defaults do not match at all, or
#   (b) matches the SAME node as a default rule but with the name/flag shape
#       the graph needs — rules in this file are registered BEFORE the
#       defaults, and the first item rule that matches a node wins.
#
# `symbolType` is LSP-ish metadata; the graph `kind` is decided by
# `outline.rs::symbol_kind` (ast_kind first, then symbolType), so a rule here
# only has to pick the closest LSP category.
#
# TSX is NOT written out: `.tsx` parses with the separate `tsx` grammar, and
# `outline.rs::tsx_variant` loads every `language: TypeScript` document below a
# second time with the language line rewritten to `Tsx`. A genuinely
# TSX-specific rule would have to be written here as `language: Tsx`.

# ---------------------------------------------------------------- TypeScript
# `export ... from './x'` is an import edge for the graph (the pre-Stage-2
# regex matched `import|export ... from '...'` alike); the default rule marks
# it isImport:false, so this one has to win.
id: mixdog-ts-export-from
language: TypeScript
role: item
symbolType: module
rule:
  kind: export_statement
  has:
    field: source
    pattern: $SOURCE
name: $SOURCE
isImport: true
isExported: true
---
# CommonJS `require('x')` and dynamic `import('x')`.
# The callee only has to END in `require`, because the pre-Stage-2 regex
# matched the substring `require("x")` anywhere: an ESM file that loads a CJS
# module through `const _require = createRequire(import.meta.url)` calls
# `_require('../../lib/x.cjs')`, and that edge is a real dependency the graph
# carried before. `import` stays exact so `import.meta` cannot match.
id: mixdog-ts-require
language: TypeScript
role: item
symbolType: module
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: 'require$|^import$'
    - has:
        field: arguments
        has:
          kind: string
          pattern: $SOURCE
name: $SOURCE
isImport: true
isExported: false
---
# Declarations report the declaration node (not the `export` wrapper the
# default rules match) and derive `isExported` from the wrapper instead of
# hardcoding it.
id: mixdog-ts-function
language: TypeScript
role: item
symbolType: function
rule:
  kind: function_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
isExported:
  inside:
    kind: export_statement
---
# Keeps the default rule id so `ts-class-method` / `ts-class-field` still
# attach as members of this item.
id: ts-class
language: TypeScript
role: item
symbolType: class
rule:
  kind: class_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
isExported:
  inside:
    kind: export_statement
