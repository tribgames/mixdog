---
# A class EXPRESSION (`const X = class Named {}`) is never exported itself;
# the binding that holds it may be. `isExported` has to be spelled out because
# an item rule that omits it defaults to TRUE.
id: mixdog-ts-class-expression
language: TypeScript
role: item
symbolType: class
rule:
  kind: class
  has:
    field: name
