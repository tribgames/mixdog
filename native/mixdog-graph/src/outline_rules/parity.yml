  kind: method_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
---
id: mixdog-php-require
language: Php
role: item
symbolType: module
rule:
  any:
    - kind: require_expression
    - kind: require_once_expression
    - kind: include_expression
    - kind: include_once_expression
  has:
    kind: string
    pattern: $SPEC
name: $SPEC
isImport: true
isExported: false
---
# --------------------------------------------------------------------- Swift
# `import class Foo.Bar` / `@preconcurrency import Foo` keep the module path.
id: mixdog-swift-import
language: Swift
role: item
symbolType: module
rule:
  all:
    - kind: import_declaration
    - pattern: $DECL
transform:
  UNPREFIXED:
    replace:
      source: $DECL
      replace: '^(@[A-Za-z_][A-Za-z0-9_]*\s+)*import\s+((typealias|struct|class|enum|protocol|let|var|func)\s+)?'
      by: ''
  SPEC:
    replace:
      source: $UNPREFIXED
      replace: '\s+[\s\S]*$'
      by: ''
name: $SPEC
isImport: true
isExported: false
---
# A protocol requirement (`func start()`) is a bodyless declaration under its
# own node kind. Swift reports every `func` as `function`, protocol or not.
id: mixdog-swift-protocol-function
language: Swift
role: item
symbolType: function
rule:
  kind: protocol_function_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
