---
# Methods anywhere (class bodies are covered by the default member rules, this
# also reaches object literals and classes inside functions). A method is
# never `export`ed on its own.
#
# The key has to be a `property_identifier`, which is what a NAME is on the
# wire: a `symbols` row carries the name as one bare word, so a QUOTED key
# (`'handle-dialog'() {}`, a `string` node) and a COMPUTED key (`[name]() {}`,
# `[Symbol.iterator]() {}`) report no symbol at all. Unquoting the string would
# hand the row a name with spaces or punctuation in it, and a computed key has
# no name until run time.
id: mixdog-ts-method
language: TypeScript
role: item
symbolType: method
rule:
  kind: method_definition
  has:
    field: name
    kind: property_identifier
    pattern: $NAME
name: $NAME
isExported: false
---
# A METHOD SIGNATURE of an interface or a type literal
# (`preflightSteps?(cmd: C, steps: C[]): Promise<void>;`) is the one place that
# method's name is declared: `references preflightSteps` finds no declaration
# without it. Both `interface_body` and `object_type` (`type L = { on(): void }`)
# spell it `method_signature`.
#
# PROPERTY signatures (`flag: boolean`) stay out: a data field is not a
# declaration a caller can jump to as a function, and interfaces carry far more
# of them than of methods. That holds for a FUNCTION TYPE as well
# (`onClick: () => void`, `subscribe: (fn: Fn) => Unsubscribe`): the type
# states a shape, never a body, and the callable that fills it is declared by
# the object literal or class that implements the interface — which
# `mixdog-ts-object-method` and the method rules already report. A
# `method_signature` is the opposite case: it is a method declaration with its
# body left to the implementor.
id: mixdog-ts-method-signature
language: TypeScript
role: item
symbolType: method
rule:
  kind: method_signature
  has:
    field: name
    kind: property_identifier
    pattern: $NAME
name: $NAME
isExported: false
---
# `abstract run(): void;` in an abstract class — same shape, different node.
id: mixdog-ts-abstract-method-signature
language: TypeScript
role: item
symbolType: method
rule:
  kind: abstract_method_signature
  has:
    field: name
    kind: property_identifier
    pattern: $NAME
name: $NAME
isExported: false
---
# A FUNCTION-VALUED PROPERTY of an object literal declares that function under
# the property's name, and that name is the only one a caller can reference:
#   `fill: async (ctx) => {}`          arrow
#   `foo: function () {}`              anonymous function / generator expression
#   `preflightSteps: createInputPreflight({ … })`   factory call
# Method shorthand and `get`/`set` are `method_definition` nodes, which
# `mixdog-ts-method` already reports.
#
# The FACTORY form is deliberately narrow: a plain identifier callee whose ONLY
# argument is a CONFIGURATION OBJECT (`createInputPreflight({ … })`) builds one
# named unit and binds it under the property name. Every other call is a
# computed VALUE — `generatedAt: new Date().toISOString()`,
# `index: resolve(dir, 'x')`, `atMs: Math.round(n)`, `rows: items.flatMap(fn)` —
# and matching those adds 8.5k data properties to this repo alone, which is the
# flood a property rule has to stay out of.
#
# "Only argument" is what keeps an OPTIONS BAG out: `headers: authHeaders(key,
# { Accept: 'application/json' })`, `description: t('{{name}} …', { name })` and
# `body: encodeMessage('Request', { … })` all carry an object argument, and all
# of them compute a value from their leading arguments instead of naming a
# unit. `nthChild: 1` pins the object to the first argument, and no second
# argument may exist.
#
# A NAMED function expression (`named: function inner() {}`) is skipped: the
# expression already declares `inner`, and a pair item would land on the same
# line as a competing symbol.
#
# Data properties — literals, arrays, objects, `new X()`, and references such
# as `runCommand: router.runCommand` (an alias of a declaration elsewhere) —
# are not declarations and stay out.
id: mixdog-ts-object-method
language: TypeScript
role: item
symbolType: method
rule:
  kind: pair
  all:
    - has:
        field: key
        kind: property_identifier
        pattern: $NAME
    - has:
        field: value
        any:
          - kind: arrow_function
          - all:
              - kind: call_expression
              - has:
                  field: function
                  kind: identifier
              - has:
                  field: arguments
                  all:
                    - has:
                        kind: object
                        nthChild: 1
                    - not:
                        has:
                          nthChild: 2
          - all:
              - any:
                  - kind: function_expression
                  - kind: generator_function
              - not:
                  has:
                    field: name
                    kind: identifier
name: $NAME
isExported: false
---
# Top-level `const`/`let`/`var` bindings, exported or not. The declarator node
# is the span the graph reports, not the wrapping export statement.
id: mixdog-ts-binding
language: TypeScript
role: item
symbolType: variable
rule:
  kind: variable_declarator
  all:
    - has:
        field: name
        kind: identifier
        pattern: $NAME
    - inside:
        any:
          - kind: lexical_declaration
            inside:
              any:
                - kind: program
                - kind: export_statement
          - kind: variable_declaration
            inside:
              any:
                - kind: program
                - kind: export_statement
name: $NAME
isExported:
  inside:
    any:
      - kind: lexical_declaration
      - kind: variable_declaration
    inside:
      kind: export_statement
---
# `module Foo {}` (the identifier form; the string form is ambient and covered
# by the default ambient-module rules).
id: mixdog-ts-module
language: TypeScript
role: item
symbolType: module
rule:
  kind: module
  has:
    field: name
    kind: identifier
    pattern: $NAME
name: $NAME
isExported:
  inside:
    kind: export_statement
