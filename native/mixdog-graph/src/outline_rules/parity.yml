name: $NAME
---
# A trait method signature (`fn handle(&self) -> bool;`) is a declaration with
# no body. Rust has no separate `method` kind — a `fn` with a body in the same
# trait is reported as `function` — so a signature is one too.
id: mixdog-rust-function-signature
language: Rust
role: item
symbolType: function
