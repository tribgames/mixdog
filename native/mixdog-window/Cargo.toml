[package]
name = "mixdog-window"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Native window procedure that keeps a Mixdog desktop Mica window painted active"
license = "Apache-2.0"
publish = false

# Loaded by window-mica.ts as a Node-API module
[lib]
name = "mixdog_window"
path = "src/lib.rs"
crate-type = ["cdylib"]

[workspace]

[dependencies]
napi = { version = "=3.12.2", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "=3.6.3"

[build-dependencies]
napi-build = "=2.4.1"

# A panic must not unwind across the Node-API boundary.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
