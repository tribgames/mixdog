# comctl32 and user32 are raw-dylib and the C runtime is linked statically, so
# rustup's own linker builds both architectures without the MSVC or Windows SDK
# import libraries and the module needs no VC++ Redistributable.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
