# The library links no import libraries or C runtime (src/lib.rs), so rustup's
# own linker builds both architectures without the MSVC or Windows SDK tools.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "link-arg=/NODEFAULTLIB"]

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "link-arg=/NODEFAULTLIB"]
