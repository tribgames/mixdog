[package]
name = "mixdog-token"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mixdog-token"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# github/rust-gems linear-time BPE (o200k ranks embedded): counts without
# materializing token ids and avoids fancy-regex backtracking, several times
# faster than tiktoken-rs per thread.
bpe-openai = "0.2"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
