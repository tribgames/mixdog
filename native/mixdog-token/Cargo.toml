[package]
name = "mixdog-token"
version = "0.2.0"
edition = "2021"
autobins = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# github/rust-gems linear-time BPE (o200k ranks embedded): counts without
# materializing token ids and avoids fancy-regex backtracking, several times
# faster than tiktoken-rs per thread.
bpe-openai = "0.2"
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
rayon = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
