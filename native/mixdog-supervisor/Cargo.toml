[package]
name = "mixdog-supervisor"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "mixdog-supervisor"
path = "src/main.rs"

[features]
# The suite's instruments and seams (--threads, --empty-working-set,
# MIXDOG_SUPERVISOR_STALL_READINGS); a product build has none of them.
suite = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
