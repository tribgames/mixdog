# crates/mixdog-secure-desktop restates native/mixdog-secure-desktop's `rust-version` (1.87), the only member that names
# one; resolver 3 would otherwise pick every dependency added from then on for that Rust instead of the newest release.
[resolver]
incompatible-rust-versions = "allow"

# rustup's own linker links the core's 230 MB binaries several times faster than MSVC link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
