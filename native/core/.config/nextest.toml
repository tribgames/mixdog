# WHERE EVERY TEST RUNS (the one list). A test is in exactly one of these places.
#
#   default / ci   Every test that is not #[ignore]d. CI runs the `ci` profile (below) over a nextest archive built once per OS
#                  (release-gate.yml, job `core-build`), split into partitions run side by side (`core-tests`), on Linux x64,
#                  macOS arm64 and Windows x64: the whole workspace on a push to main, a manual run and the release gate, the changed
#                  crates and their reverse dependencies on a pull request (scripts/ci/core-select.mjs). The merge check runs `default`.
#   agent          Local only: `default` without the heavy matrices (a branch that does not touch them). CI does not use it.
#   pg             #[ignore]d tests that compose the real core over a Postgres runtime (the daemon's compose, session_project, ssh_origin
#                  and server modules). CI: release-gate.yml job `core-pg` from the `core-build` archive (Linux always, macOS
#                  on a push to main and a manual run), when the archive holds mixdog-app-server-daemon; rust-core-unix.yml (manual) too.
#   services-pg    #[ignore]d memory tests that need only a Postgres runtime. CI: `core-pg`, when the archive holds mixdog-services.
#   services-models, migration-corpus, office-throughput, pwsh-50-mib
#                  #[ignore]d tests that need what a hosted runner does not have: real ONNX models and the network, the migration
#                  corpus (a user's data), a real LibreOffice and Chromium, a 414 MiB PowerShell command. Run by hand with their
#                  profile and `--run-ignored only`; never in CI.
#                  The environment variables they read have no default: an unset one fails the test.
#   (no profile)   The other #[ignore]d tests, each needing a machine with that thing: a real Microsoft Office or a screen on Windows
#                  (mixdog-office tests/live_com, mixdog-office-com *_live), a real LibreOffice (mixdog-ooxml soffice_lifecycle),
#                  a quiet machine to time on (mixdog-tui perf_pty).
#                  `cargo nextest run --run-ignored only -p <crate>` runs them there. Never in CI.
#
# An #[ignore]d test that fits none of these belongs in one: add it here, with the reason its attribute gives.

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

# Every profile reports its terminal testcases as JUnit (target/nextest/<profile>/junit.xml): the release proof reads execution from it
# (scripts/ci/run-nextest.mjs, scripts/ci/coverage/adapters.mjs). Profiles schedule work; they never define which tests exist
# (docs/testing.md, "Release coverage").
[profile.default.junit]
path = "junit.xml"

# `--profile ci`: what a hosted runner runs from the archive. `default` and its overrides (every [[profile.default.overrides]] and the
# test groups apply here), no retries: a test that fails once is red, never green on a second try (a retry hides the flaky test that
# a real defect is). Slow and failing tests are named in the log, a failure's output printed where it fails and again at the end.
[profile.ci]
retries = 0
fail-fast = false
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"

# The report of a `ci` run also names every selected test its #[ignore] kept from running, as a <testcase> with a <skipped> child (nextest
# 0.9.143+; the gate pins 0.9.151): the ignore disposition the release proof needs is nextest's own record of the invocation, never a
# listing. The profiles that run `--run-ignored only` keep the default ("none"), where a skipped element would be a deselected test.
[profile.ci.junit]
path = "junit.xml"
report-skipped = "ignored"

# `--profile ci-ignored --run-ignored only`: `ci` for a run of ignored tests on a hosted runner (core-tests' interactive entry scenarios),
# whose report keeps the default and names no deselected test.
[profile.ci-ignored]
retries = 0
fail-fast = false
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"

# `--profile agent`: a crate's suite without the heavy migration crash matrices, for a branch that does not touch them.
# The default profile still runs them all; the merge check uses it.
[profile.agent]
default-filter = '''not (
    (package(mixdog-migrate) & (test(/^desktop_profile::tests::/) | test(/every_crash_point/)))
)'''

# `--profile pg --run-ignored only -p mixdog-app-server-daemon`, the one command of the merge check and of CI (`core-pg` runs it from the archive): the #[ignore]d tests that compose
# the real core and the runner's own cluster proof (`compose_test_support`). They need
# a Postgres runtime (`MIXDOG_PG_RUNTIME` names an unpacked runtime directory; with it unset or broken the test fails, it does not skip). They are
# in the `pg-cluster` group below, so they run one at a time, with the time the composed tests get (below).
[profile.pg]
default-filter = '''package(mixdog-app-server-daemon) & (
    test(/^compose::(tests|session_project_flow_tests)::/)
  | test(/^server::tests::/)
  | test(/^ssh_origin_tests::/)
  | test(/^serving::tests::start_serves_both/)
  | test(=compose_domains::tests::every_method_of_the_domains_built_here_has_a_real_service)
  | test(/^compose_test_support::runner_tests::/)
  | test(=model_proxy_client_tests::a_client_mode_server_runs_its_turns_on_the_pc_and_fails_them_without_one)
)'''

# The other #[ignore]d tests, one profile per need. Each is run as `nextest run --profile <name> --run-ignored only` (the filter also matches
# tests that are not ignored; only the ignored ones run) and fails when its filter matches nothing. A variable that is unset or wrong fails
# its tests, it does not skip them. The memory tests of mixdog-services are in the `pg-cluster` group below: one cluster at a time.
#
# services-pg: mixdog-services' memory tests that need only a Postgres runtime. MIXDOG_PG_RUNTIME names an unpacked runtime directory
# (the one `pg` uses). `a_killed_core` is the child process of a test of the profile, not a test of its own.
[profile.services-pg]
default-filter = '''package(mixdog-services) & test(/^memory::(tests|thread_search::tests)::/)
  & not test(=memory::tests::boot::a_killed_core)
  & not test(/^memory::tests::(embeddings|ingest|recall|reindex)::/)'''
slow-timeout = { period = "120s", terminate-after = 5 }

# services-models: the tests that load a real model. MIXDOG_ORT_LIBRARY names the ONNX Runtime library (the Node product's
# `onnxruntime-node/bin/napi-v6/win32/x64/onnxruntime.dll`); MIXDOG_MEMORY_MODELS a model cache holding
# `Xenova/multilingual-e5-small` (the Node product's `<data>/memory-models`); MIXDOG_EFFORT_JUDGE_DIR the installed effort judge
# (`model.onnx`, `tokenizer.json`, `calibration.json`); MIXDOG_PG_RUNTIME as above, for the memory tests among them.
# `the_shipped_model_installs_and_embeds_a_probe_string` also downloads the model from the hub: it needs the network.
[profile.services-models]
default-filter = '''package(mixdog-services) & (
    test(/^effort_judge::tests::/)
  | test(/^model_install::/)
  | test(/^memory::tests::(embeddings|ingest|recall|reindex)::/)
)'''
# One at a time: each loads a 120-150 MB graph, and the effort judge answers `warming` to a call that finds its load unfinished.
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 5 }

# migration-corpus: the release gates over the migration corpus. MIXDOG_MIGRATION_CORPUS names the corpus (`v145/`, `dev146/`, `home/`,
# `fixture-busy-seed/`, `manifest.json`); MIXDOG_CORPUS_DATA_DIR a directory whose `prompt-attachments/sha256/` holds the blobs the
# corpus sessions name (`MIXDOG_DATA_DIR` is not used: the build gate points it at an empty directory).
[profile.migration-corpus]
default-filter = '''
    package(mixdog-migrate)
  | (package(mixdog-agent) & test(/^message_row::tests::/))
  | (package(mixdog-ledger) & test(/corpus_ledger_/))'''
slow-timeout = { period = "60s", terminate-after = 5 }


# office-throughput: RL G8 through the real pool, the Node worker and the shared render browser. It needs LibreOffice, Chromium and `node`
# on this machine, and is run as `nextest run --profile office-throughput --features test-support --run-ignored only -p mixdog-exthost`
# on a machine with nothing else heavy running. `G8_SCALE=smoke` (the default) proves every call kind; `full` also asserts the ratios.
# Not in the integration check yet: on the 2026-11-12 run the docx, xlsx and pdf calls answered in 11-15 s and the `html.to_pdf` call
# (the shared render browser, Chrome found by `find_browser`) never answered within the 600 s the profile gives it.
[profile.office-throughput]
default-filter = 'package(mixdog-exthost) & test(=g8::office_throughput)'
slow-timeout = { period = "120s", terminate-after = 5 }

# pwsh-50-mib: the 50 MiB PowerShell command, run as `nextest run --profile pwsh-50-mib --run-ignored only -p mixdog-app-server-daemon`.
# It takes 53 s alone and 414 MiB of working set on top of its warm-up call, so the default profile runs the same assertion just over the
# helper's 1 MiB input queue (`a_command_just_over_the_input_queue_answers_its_length`) instead.
[profile.pwsh-50-mib]
default-filter = 'package(mixdog-app-server-daemon) & test(=exec::tests::pwsh_50_mib_command)'
slow-timeout = { period = "120s", terminate-after = 3 }

# Each of the two migration crash matrices spreads its fault points over eight work dirs of its own;
# they run one after the other, so at most eight sync-bound migrations of the pair are in flight.
[test-groups]
migration-crash-matrix = { max-threads = 1 }
pg-cluster = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(mixdog-migrate) & (test(=desktop_profile::tests::the_crash_matrix_ends_in_the_state_of_an_uninterrupted_run) | test(=run::tests::every_crash_point_resumes_to_the_same_tree))'
test-group = 'migration-crash-matrix'

# The four migration crash matrices are fsync-bound: each passed in 84-95 s with its temp dirs on an idle drive and
# was killed at the default 120 s in five of five workspace runs on 2026-11-10 with them on the build drive, which
# the builds keep 85-99% busy. They are excluded from `--profile agent`; where they do run, they get the time.
[[profile.default.overrides]]
filter = 'package(mixdog-migrate) & (test(/^desktop_profile::tests::(a_late_pass_killed_at_every_point|a_late_pass_started_with_a_profile|the_crash_matrix)/) | test(=run::tests::every_crash_point_resumes_to_the_same_tree))'
slow-timeout = { period = "60s", terminate-after = 6 }

# The tests of mixdog-services' `memory::tests` and `memory::thread_search::tests` that need only a database share one Postgres cluster across the test processes (`memory/tests/shared_pg.rs`: started by the first of them, a database per
# test made from a template, stopped by its own supervisor when no test holds it), so they run in parallel with everything else.
# The tests that start a cluster of their own (a stack's opening with `initdb` and a postmaster, a cluster killed and restarted,
# the cluster's log read for the statements it received) stay in this group: one cluster of their own at a time, the load a single
# one was verified under (the postmasters of a run still in recovery when the tests connect, shutdowns queueing behind the same
# disk). A test added to those modules shares the cluster unless it names `TestPg::start_own` or a stack; add it here then.
# The daemon's real-core tests (#[ignore], MIXDOG_PG_RUNTIME) each start a cluster the same way.
[[profile.default.overrides]]
filter = 'package(mixdog-services) & (test(/^memory::tests::boot::/) | test(=memory::tests::session_search::a_replaced_sensitive_row_leaves_no_file_of_the_cluster_whatever_step_a_kill_stops)) | (package(mixdog-app-server-daemon) & (test(/^compose::(tests|session_project_flow_tests)::/) | test(/^ssh_origin_tests::/) | test(/^server::tests::/) | test(/^serving::tests::start_serves_both/) | test(=compose_domains::tests::every_method_of_the_domains_built_here_has_a_real_service) | test(=compose_test_support::runner_tests::a_cluster_left_running_by_a_killed_child_is_ended_before_its_directory_is_removed) | test(=model_proxy_client_tests::a_client_mode_server_runs_its_turns_on_the_pc_and_fails_them_without_one)))'
test-group = 'pg-cluster'

# The daemon's real-core tests run their core in a child process under the runner's one budget (`compose_test_support::BUDGET`, 690 s, checked
# at compile time to stay under this limit): nextest ends the test only after the runner's report, at 720 s. Applies to every profile (`pg` among them).
# The runner's own cluster test is among them. `compose_test_support::runner_tests::every_composed_test_is_run_by_the_pg_profile_with_its_time`
# fails when a test using the runner is missing here or from the `pg` filter.
[[profile.default.overrides]]
filter = '''package(mixdog-app-server-daemon) & (
    test(=compose::session_project_flow_tests::the_session_tool_switches_its_callers_project_and_flags_it_through_the_product_route)
  | test(=compose::tests::release_runs_the_barriers_then_the_stop_steps_once)
  | test(=compose::tests::the_release_has_requested_closing_before_its_first_budgeted_step)
  | test(=compose::tests::the_stop_steps_flush_the_daemon_log_and_then_end_the_run_token)
  | test(=compose::tests::an_exec_core_counts_its_requests_and_logs_no_unbound_lifecycle)
  | test(=compose_domains::tests::every_method_of_the_domains_built_here_has_a_real_service)
  | test(=server::tests::a_client_initializes_and_starts_a_thread_over_the_pair)
  | test(=server::tests::every_thread_and_turn_method_of_the_table_reaches_a_handler)
  | test(/^ssh_origin_tests::/)
  | test(=server::tests::a_wedged_stop_step_does_not_hold_the_headless_shutdown)
  | test(=server::tests::shutdown_stops_the_core_in_registration_order_and_refuses_new_clients)
  | test(=serving::tests::start_serves_both_listeners_and_a_stop_releases_once)
  | test(=compose_test_support::runner_tests::a_cluster_left_running_by_a_killed_child_is_ended_before_its_directory_is_removed)
  | test(=model_proxy_client_tests::a_client_mode_server_runs_its_turns_on_the_pc_and_fails_them_without_one)
)'''
slow-timeout = { period = "120s", terminate-after = 6 }

# DS-WS-5 gates a real latency: an external write must reach the subscriber within 400 ms (250 ms of that is the watcher's batching
# window). The OS watch cannot be given a clock, so the claim can only be measured on a machine that is not busy; beside the git replays
# of mixdog-scm (chains of git processes, 15-60 s each) the test's setup took 6 s longer than alone and no event came in 3 s. It
# takes every test thread, so it runs alone.
[[profile.default.overrides]]
filter = 'package(mixdog-workspace) & test(=nothing_runs_while_idle_and_external_writes_are_pushed)'
threads-required = 'num-test-threads'
