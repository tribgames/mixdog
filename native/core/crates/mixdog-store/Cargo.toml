[package]
name = "mixdog-store"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The crash hook of fsio::publish_file_with: for the dev-dependencies of crates whose tests kill a publication, never a
# production build.
crash-hook = []
# `SqliteStore::close` / `CoreState::close`, the test teardown that closes the database files before a test's folder is removed:
# for the dev-dependencies of crates whose tests open a store, never a production build.
test-support = []

[dependencies]
mixdog-rt = { workspace = true }
mixdog-js = { workspace = true }
mixdog-statefile = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
regress = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-app-protocol = { workspace = true, features = ["codegen"] }
mixdog-js = { workspace = true, features = ["fixture-tools"] }
mixdog-store = { path = ".", features = ["crash-hook", "test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true, features = ["codegen"] }
