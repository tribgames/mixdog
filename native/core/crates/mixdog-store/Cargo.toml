[package]
name = "mixdog-store"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-rt = { workspace = true }
mixdog-js = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
regress = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
