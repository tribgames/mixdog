[package]
name = "mixdog-secrets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The lane executors the tests run blocking keychain work on.
test-support = ["mixdog-rt/test-support"]
# A counter of the credential reads the stores perform (mixdog_secrets::work): for a dev-dependency, never a normal build.
count-work = []

[dependencies]
mixdog-rt = { workspace = true }
mixdog-js = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
base64 = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure Rust (zbus): no system libdbus, so the core starts on a minimal server.
secret-service = { workspace = true, features = ["rt-async-io-crypto-rust"] }
zbus = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
mixdog-secrets = { path = ".", features = ["count-work", "test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-js = { workspace = true, features = ["fixture-tools"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
