[package]
name = "mixdog-skill-scripts"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The test build of `skill-run` (src/bin/skill_run_probe.rs), which tests/launch.rs starts through real launchers.
test-support = []

[[bin]]
name = "skill-run-probe"
path = "src/bin/skill_run_probe.rs"
required-features = ["test-support"]

[dependencies]
mixdog-fsio = { workspace = true }
mixdog-js = { workspace = true }
mixdog-mcp = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(unix)'.dependencies]
# `skill-run` forwards SIGINT and SIGTERM to the interpreter it waits on.
libc = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
mixdog-testkit = { workspace = true }
tempfile = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
fancy-regex = { workspace = true, features = ["probe"] }
mixdog-ai = { workspace = true, features = ["count-work", "replay-bytes", "test-support", "virtual-clock"] }
mixdog-browser-engine = { workspace = true, features = ["test-support"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
mixdog-mcp = { workspace = true, features = ["test-support"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-scm = { workspace = true, features = ["write-queue-hook"] }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-skill-scripts = { path = ".", features = ["test-support"] }
mixdog-spawn = { workspace = true, features = ["core", "core-test", "lease-clock", "scripted-shell"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-tools = { workspace = true, features = ["policy-observer"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
