[package]
name = "mixdog-office-author"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
# The DevTools client (`cdp`): one WebSocket to the shared render browser, plain `ws://` on the loopback.
futures = { workspace = true, features = ["std", "alloc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
url = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-fsio = { workspace = true }
mixdog-js = { workspace = true }
mixdog-office-base = { workspace = true }
mixdog-office-design = { workspace = true }
mixdog-office-quality = { workspace = true }
mixdog-raster = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }
mixdog-ooxml = { workspace = true }
mixdog-fonts = { workspace = true }
tempfile = { workspace = true }
mixdog-pdf = { workspace = true }

[dev-dependencies]
# The twin tests (`tests/twin_brief.rs`, `tests/twin_measure_deck.rs`) locate the Node source, load their recording and compare through the base crate's `twin` helpers.
mixdog-office-base = { workspace = true, features = ["test-support"] }
mixdog-testkit = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "net"] }
# The live twin test starts the lane executors a route's file and image work runs on.
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
