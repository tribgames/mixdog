[package]
name = "mixdog-ai"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The loopback TLS server and manifest reader of the wire parity checks (`transport::loopback`, `transport::manifest`).
test-support = ["dep:rcgen"]
# Counters of the credential reads, provider constructions and provider-map loads (mixdog_ai::work): for the dev-dependency of
# the crate whose tests count them, never a normal build.
count-work = ["dep:mixdog-secrets", "mixdog-secrets/count-work"]

[dependencies]
rcgen = { workspace = true, optional = true }
mixdog-rt = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-js = { workspace = true }
mixdog-statefile = { workspace = true }
mixdog-core-api = { workspace = true }
aes-gcm = { workspace = true }
arc-swap = { workspace = true }
jsonschema = { workspace = true }
x25519-dalek = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
ring = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true, features = ["zlib-rs"] }
httparse = { workspace = true }
brotli = { workspace = true }
futures = { workspace = true, features = ["std"] }
h2 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["stream", "socks"] }
# A proxy reached over https: the TLS client of the CONNECT tunnel and of the connection check.
rustls = { workspace = true, features = ["ring", "std"] }
rustls-native-certs = { workspace = true }
# The connection check's one HEAD, over the connection its own typed tunnel opened.
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio-rustls = { workspace = true, features = ["ring"] }
serde = { workspace = true }
# preserve_order: wire bodies keep insertion order (prompt-cache prefixes are byte prefixes).
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
sha2 = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time", "io-util"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# Only for the credential-read counter: `mixdog_ai::work` adds the reads the secret stores perform.
mixdog-secrets = { workspace = true, optional = true }
zstd = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
mixdog-testkit = { workspace = true }
# The pinned test clients and the loopback server (`transport::loopback`) exist behind this feature only.
mixdog-ai = { path = ".", features = ["count-work", "test-support"] }
mixdog-js = { workspace = true, features = ["fixture-tools"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "test-util"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-app-protocol = { workspace = true }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
