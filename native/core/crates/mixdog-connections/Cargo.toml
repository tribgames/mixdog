[package]
name = "mixdog-connections"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-ssh = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-app-protocol = { workspace = true }
mixdog-app-server-client = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-statefile = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
reqwest = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
async-trait = { workspace = true }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util", "net", "io-util"] }
