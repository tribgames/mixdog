[package]
name = "mixdog-ooxml"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
mixdog-fsio = { workspace = true }
mixdog-js = { workspace = true }
mixdog-office-base = { workspace = true }
mixdog-ooxml-text = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
# The container of an Office package: entry order, DEFLATE and DOS time stamps as jszip wrote them.
zip = { workspace = true }
oem_cp = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }
mixdog-fonts = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-statefile = { workspace = true }
reqwest = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "net", "process", "io-util"] }
mixdog-xlsx-formula = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
icu_collator = { workspace = true }
icu_locale_core = { workspace = true }
mixdog-raster = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
tar = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-js = { workspace = true, features = ["prefilter-probe"] }
mixdog-image-egress = { workspace = true, features = ["test-support"] }
mixdog-imaging = { workspace = true, features = ["test-support"] }

[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
