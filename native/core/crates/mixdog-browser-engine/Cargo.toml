[package]
name = "mixdog-browser-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# `FakeHost` (scripted host answers and JSONL transcript replay) for the tests of later tasks and of the replay package.
test-support = []

[dependencies]
mixdog-app-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-browser-policy = { workspace = true }
mixdog-core-base = { workspace = true }
mixdog-js = { workspace = true }
icu_locale_core = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
# Only `task_local!`: the per-command loss latch (`error::track_connection_loss`). Timers and tasks stay on mixdog-rt.
tokio = { workspace = true, features = ["rt"] }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-browser-engine = { path = ".", features = ["test-support"] }
mixdog-tools = { workspace = true, features = ["policy-observer", "test-support"] }
regex = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-ai = { workspace = true, features = ["count-work", "replay-bytes", "test-support", "virtual-clock"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-js = { workspace = true, features = ["prefilter-probe"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-scm = { workspace = true, features = ["write-queue-hook"] }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-spawn = { workspace = true, features = ["core", "core-test", "lease-clock", "scripted-shell"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls", "test-support"] }
mixdog-image-egress = { workspace = true, features = ["test-support"] }
mixdog-imaging = { workspace = true, features = ["test-support"] }
mixdog-graph-host = { workspace = true, features = ["test-support"] }
