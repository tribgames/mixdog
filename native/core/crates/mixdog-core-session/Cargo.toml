[package]
name = "mixdog-core-session"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true, features = ["alloc", "async-await", "executor"] }
mixdog-agent = { workspace = true }
mixdog-ai = { workspace = true }
mixdog-app-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-js = { workspace = true }
mixdog-mcp = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-scm = { workspace = true }
mixdog-services = { workspace = true }
mixdog-spawn = { path = "../../../mixdog-spawn", features = ["core"] }
mixdog-statefile = { workspace = true }
mixdog-store = { workspace = true }
mixdog-tools = { workspace = true }
mixdog-workspace = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
mixdog-core-agents = { workspace = true }
mixdog-core-base = { workspace = true }
mixdog-core-config = { workspace = true }
mixdog-core-domains = { workspace = true }
mixdog-core-goal = { workspace = true }
mixdog-core-ports = { workspace = true }
mixdog-core-prompt = { workspace = true }
mixdog-core-run = { workspace = true }
mixdog-core-review = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[features]
# A test build ends the process at the point MIXDOG_NEW_TASK_CRASH_AT names (session/new_task.rs); no normal build enables it.
crash-gates = []
# A replay's clock (mixdog-rt virtual_clock.rs): the session's wall clock and timers stand still until the replay advances them.
# Never in an ordinary build.
virtual-clock = ["mixdog-rt/virtual-clock"]
test-support = ["dep:tempfile", "dep:mixdog-core-review", "mixdog-core-review/test-support", "mixdog-core-api/mock", "mixdog-rt/test-support", "mixdog-store/test-support"]

[dev-dependencies]
mixdog-js = { workspace = true, features = ["fixture-tools"] }
mixdog-mcp = { workspace = true, features = ["test-support"] }
mixdog-migrate = { workspace = true, features = ["crash-hook"] }
mixdog-ledger = { workspace = true }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
tempfile = { workspace = true }
tokio-util = { workspace = true }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
mixdog-core-review = { workspace = true, features = ["test-support"] }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-ai = { workspace = true, features = ["count-work", "test-support"] }
mixdog-app-protocol = { workspace = true, features = ["codegen"] }
mixdog-core-domains = { workspace = true, features = ["count-work"] }
mixdog-core-session = { path = ".", features = ["crash-gates", "test-support"] }
mixdog-spawn = { path = "../../../mixdog-spawn", features = ["core", "core-test", "lease-clock"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-core-config = { workspace = true, features = ["count-work"] }
mixdog-protocol = { workspace = true, features = ["codegen"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-core-run = { workspace = true, features = ["test-support"] }
