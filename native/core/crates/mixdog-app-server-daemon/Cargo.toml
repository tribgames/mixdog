[package]
name = "mixdog-app-server-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Forwarded to mixdog-workspace: the controls a replay of the download recording drives a spawned core with. Never in an ordinary build.
replay-controls = ["mixdog-workspace/replay-controls"]
crash-gates = ["mixdog-core-session/crash-gates"]

[dependencies]
mixdog-app-protocol = { workspace = true }
mixdog-app-server = { workspace = true }
mixdog-app-server-transport = { workspace = true }
mixdog-app-server-client = { workspace = true }
mixdog-core-base = { workspace = true }
mixdog-core = { workspace = true }
mixdog-core-run = { workspace = true }
mixdog-core-session = { workspace = true }
mixdog-core-goal = { workspace = true }
mixdog-core-prompt = { workspace = true }
mixdog-core-review = { workspace = true }
mixdog-core-rooms = { workspace = true }
mixdog-core-domains = { workspace = true }
mixdog-core-config = { workspace = true }
mixdog-agent = { workspace = true }
mixdog-core-agents = { workspace = true }
mixdog-core-ports = { workspace = true }
mixdog-js = { workspace = true }
mixdog-remote = { workspace = true }
mixdog-tools = { workspace = true }
mixdog-workspace = { workspace = true }
mixdog-scm = { workspace = true }
mixdog-exthost = { workspace = true }
mixdog-services = { workspace = true }
mixdog-ai = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
chrono-tz = { workspace = true }
reqwest = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
mixdog-mcp = { workspace = true }
mixdog-migrate = { workspace = true }
mixdog-secrets = { workspace = true }
mixdog-spawn = { path = "../../../mixdog-spawn", features = ["core"] }
mixdog-store = { workspace = true }
mixdog-statefile = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
mixdog-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-rt = { workspace = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "signal", "rt", "time"] }
tracing = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The credential-read counter (`mixdog_ai::work`) seen from a crate that only depends on the crates that read: the
# `credential_reads_tests` integration test. Only this crate's test builds turn the features on.
mixdog-core = { workspace = true, features = ["count-work"] }
mixdog-core-domains = { workspace = true, features = ["count-work"] }
mixdog-ai = { workspace = true, features = ["count-work"] }
# The mock seams and the inline lane backend are test fixtures only; the daemon runs on `mixdog_rt::exec`.
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
# The unpair replay drives the downloads' clock by file, which only a build with this feature reads.
mixdog-workspace = { workspace = true, features = ["replay-controls"] }
# The real session directory (`held_runs_tests`: the approval predicate over real threads and connections).
mixdog-core-session = { workspace = true, features = ["test-support"] }
# The op scopes of the remote access service in the composed test (support::testing::scopes).
mixdog-core-base = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util", "net"] }
# The scripted relay of `domain_seams/remote/e2e.rs` (shared with mixdog-remote's integration tests).
tokio-tungstenite = { workspace = true, features = ["handshake"] }
