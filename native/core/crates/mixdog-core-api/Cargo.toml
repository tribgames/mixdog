[package]
name = "mixdog-core-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Mock core, mock transport, mock feed and the feed conformance scenarios (`mixdog_core_api::mock`).
mock = ["mixdog-rt/test-support"]

[dependencies]
mixdog-protocol = { workspace = true }
mixdog-app-protocol = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-js = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
mixdog-core-api = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["rt", "macros"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-app-protocol = { workspace = true }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true }
