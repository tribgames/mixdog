[package]
name = "mixdog-migrate"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
icu_collator = { workspace = true }
icu_locale_core = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
mixdog-agent = { workspace = true }
mixdog-core = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-js = { workspace = true }
mixdog-mcp = { workspace = true }
mixdog-store = { workspace = true }
mixdog-ledger = { workspace = true }
mixdog-protocol = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
mixdog-ai = { workspace = true }
mixdog-rt = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

