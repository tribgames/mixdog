[package]
name = "mixdog-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Inline lane executors and the stdio mock server binary used by the integration suite.
test-support = ["mixdog-rt/test-support"]

[[bin]]
name = "mixdog-mcp-mock-server"
path = "mock/server.rs"
test = false
required-features = ["test-support"]

[dependencies]
mixdog-rt = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-js = { workspace = true }
mixdog-statefile = { workspace = true }
mixdog-workspace = { workspace = true }
mixdog-tools = { workspace = true }
mixdog-secrets = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true, features = ["std", "alloc"] }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
# The Gmail app-password check speaks IMAP and SMTP over TLS itself.
rustls = { workspace = true, features = ["ring", "std"] }
rustls-native-certs = { workspace = true }
tokio-rustls = { workspace = true, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "io-util", "macros", "net"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
mixdog-testkit = { workspace = true }
mixdog-mcp = { path = ".", features = ["test-support"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
# A throwaway certificate for the fake Gmail servers.
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "test-util"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-ai = { workspace = true, features = ["count-work", "test-support"] }
mixdog-app-protocol = { workspace = true }
mixdog-js = { workspace = true, features = ["fixture-tools"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-spawn = { path = "../../../mixdog-spawn", features = ["core", "core-test", "lease-clock", "scripted-shell"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-scm = { workspace = true, features = ["write-queue-hook"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-tools = { workspace = true, features = ["policy-observer"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
