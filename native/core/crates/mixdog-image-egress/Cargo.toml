[package]
name = "mixdog-image-egress"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Leaf contract for every image that leaves the app: origins, destination policy, refusals, and the sealed prepared batch"

[lints]
workspace = true

[features]
# ImageFacts::for_test for other crates' tests.
test-support = []

[dependencies]
sha2 = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-image-egress = { path = ".", features = ["test-support"] }
