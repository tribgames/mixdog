[package]
name = "mixdog-exthost-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The scripted worker the pool tests drive (`ext_worker_dev`).
test-support = ["mixdog-rt/test-support"]

[[bin]]
name = "ext_worker_dev"
path = "src/bin/ext_worker_dev.rs"
required-features = ["test-support"]

[[test]]
name = "pdf_render_ocr"
path = "tests/pdf_render_ocr.rs"
required-features = ["test-support"]

[[test]]
name = "pool_e2e"
path = "tests/pool_e2e.rs"
required-features = ["test-support"]

[[test]]
name = "office_journal"
path = "tests/office_journal.rs"
required-features = ["test-support"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
dunce = { workspace = true }
mixdog-fonts = { workspace = true }
mixdog-fsio = { workspace = true }
mixdog-imaging = { workspace = true }
mixdog-js = { workspace = true }
mixdog-office-base = { workspace = true }
mixdog-office-com = { workspace = true }
mixdog-office-pdf = { workspace = true }
mixdog-ooxml = { workspace = true }
mixdog-ooxml-text = { workspace = true }
mixdog-pdf = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-skill-scripts = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "io-std", "fs", "macros", "process"] }
tokio-util = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }
async-trait = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-office = { workspace = true }
mixdog-office-author = { workspace = true }
mixdog-office-design = { workspace = true }
mixdog-office-quality = { workspace = true }
mixdog-raster = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
mixdog-exthost = { workspace = true, features = ["test-support"] }
mixdog-protocol = { workspace = true }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
fancy-regex = { workspace = true, features = ["probe"] }
mixdog-agent = { workspace = true, features = ["test-support"] }
mixdog-ai = { workspace = true, features = ["count-work", "replay-bytes", "test-support", "virtual-clock"] }
mixdog-browser-engine = { workspace = true, features = ["test-support"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-exthost-worker = { path = ".", features = ["test-support"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-js = { workspace = true, features = ["prefilter-probe"] }
mixdog-mcp = { workspace = true, features = ["test-support"] }
mixdog-office-com = { workspace = true, features = ["test-support"] }
mixdog-scm = { workspace = true, features = ["write-queue-hook"] }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-skill-scripts = { workspace = true, features = ["test-support"] }
mixdog-spawn = { workspace = true, features = ["core", "core-test", "lease-clock", "scripted-shell"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-tools = { workspace = true, features = ["policy-observer"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
