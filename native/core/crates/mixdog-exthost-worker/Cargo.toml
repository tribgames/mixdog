[package]
name = "mixdog-exthost-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The scripted worker the pool tests drive (`ext_worker_dev`).
test-support = []

[[bin]]
name = "ext_worker_dev"
path = "src/bin/ext_worker_dev.rs"
required-features = ["test-support"]

[[test]]
name = "methods_twin"
path = "tests/methods_twin.rs"
required-features = ["test-support"]

[[test]]
name = "still_twin"
path = "tests/still_twin.rs"
required-features = ["test-support"]

[[test]]
name = "pool_e2e"
path = "tests/pool_e2e.rs"
required-features = ["test-support"]

[[test]]
name = "office_journal"
path = "tests/office_journal.rs"
required-features = ["test-support"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
dunce = { workspace = true }
mixdog-fsio = { workspace = true }
mixdog-imaging = { workspace = true }
mixdog-js = { workspace = true }
mixdog-office-base = { workspace = true }
mixdog-ooxml-text = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "io-std", "fs", "macros"] }
tokio-util = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
mixdog-core-api = { workspace = true }
mixdog-exthost = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-rt = { workspace = true, features = ["test-support"] }
mixdog-testkit = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
