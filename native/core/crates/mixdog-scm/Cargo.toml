[package]
name = "mixdog-scm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Development only: `GhClient::on_write_queued`, told when a write waits behind another write of its repository.
write-queue-hook = []

[dependencies]
mixdog-protocol = { workspace = true }
mixdog-app-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-js = { workspace = true }
mixdog-workspace = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
gix = { workspace = true, features = ["revision", "index", "status", "blob-diff", "dirwalk"] }
serde = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
mixdog-testkit = { workspace = true }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
tempfile = { workspace = true }
mixdog-spawn = { workspace = true, features = ["core", "core-test", "lease-clock", "scripted-shell"] }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "fs", "test-util"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-app-protocol = { workspace = true }
mixdog-js = { workspace = true, features = ["fixture-tools"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-scm = { path = ".", features = ["write-queue-hook"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
