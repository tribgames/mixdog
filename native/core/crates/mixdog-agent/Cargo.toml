[package]
name = "mixdog-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The loop talks to providers and tools through the domain traits in
# `mixdog-core-api` (injected as `Arc<dyn …>`). From `mixdog-ai` and
# `mixdog-tools` it reuses shared pieces instead of copying them: for example the
# effort projection, the route reads of `service::admin_route` and the error
# presenter of `service::error_text`; the tool policy behind `env::PolicyGate` and
# the `orch` ports the agent tool implements.
mixdog-core-api = { workspace = true }
mixdog-ai = { workspace = true }
mixdog-tools = { workspace = true }
mixdog-js = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-rt = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tokio-util = { workspace = true }
url = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[features]
# Test-only: gates in the streamed dispatch of edits (`test_hooks`). No normal build enables it.
test-support = []

[dev-dependencies]
mixdog-testkit = { workspace = true }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-services = { workspace = true, features = ["assigned-pg-port", "test-support"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "test-util"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-ai = { workspace = true, features = ["count-work", "replay-bytes", "test-support", "virtual-clock"] }
mixdog-app-protocol = { workspace = true }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-spawn = { workspace = true, features = ["core", "core-test", "lease-clock", "scripted-shell"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-trace = { workspace = true, features = ["flush-probe"] }
mixdog-workspace ={ workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true }
mixdog-agent = { path = ".", features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-scm = { workspace = true, features = ["write-queue-hook"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-tools = { workspace = true, features = ["policy-observer"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-core-base = { workspace = true, features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-exthost = { workspace = true, features = ["test-support"] }
