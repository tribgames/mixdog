[package]
name = "mixdog-workspace"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
kill-points = []
count-jobs = []
# The clock, hold points and open-file count a replay of the download recording drives a spawned core with (`replay_controls.rs`). Never in an
# ordinary build: the replay builds `mixdogd` with `--features mixdog-workspace/replay-controls`.
replay-controls = []

[dependencies]
mixdog-rt = { workspace = true }
mixdog-js = { workspace = true }
mixdog-store = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
flate2 = { workspace = true }
grep = { workspace = true }
ignore = { workspace = true }
trash = { workspace = true }
notify = { workspace = true }
regex = { workspace = true }
regress = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemServices", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
mixdog-workspace = { path = ".", features = ["kill-points", "count-jobs", "replay-controls"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
mixdog-spawn = { path = "../../../mixdog-spawn", features = ["core", "core-test", "lease-clock"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "test-util"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-app-protocol = { workspace = true, features = ["codegen"] }
mixdog-js = { workspace = true, features = ["fixture-tools"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true, features = ["codegen"] }
