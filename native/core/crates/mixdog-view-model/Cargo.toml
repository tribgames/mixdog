[package]
name = "mixdog-view-model"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[[test]]
name = "features"
path = "tests/features/main.rs"

[dependencies]
mixdog-js = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-termtext = { workspace = true }
mixdog-tui-style = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
mixdog-testkit = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-js = { workspace = true, features = ["prefilter-probe"] }
