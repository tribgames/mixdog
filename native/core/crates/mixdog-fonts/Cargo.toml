[package]
name = "mixdog-fonts"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Font faces, system font discovery, CSS font matching with fallback, HarfBuzz-equal shaping and canvas measureText"

[lints]
workspace = true

[dependencies]
futures = { workspace = true, features = ["alloc"] }
mixdog-fsio = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-statefile = { workspace = true }
rustybuzz = { workspace = true }
sha2 = { workspace = true }
ttf-parser = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
mixdog-office-base = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
