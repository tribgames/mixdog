[package]
name = "mixdog-fonts"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Font faces, system font discovery, CSS font matching with fallback, HarfBuzz-equal shaping and canvas measureText"

[lints]
workspace = true

[dependencies]
futures = { workspace = true, features = ["alloc"] }
mixdog-fsio = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-statefile = { workspace = true }
rustybuzz = { workspace = true }
sha2 = { workspace = true }
ttf-parser = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
mixdog-office-base = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
