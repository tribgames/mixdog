[package]
name = "mixdog-raster"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The raster operations of the Office stack that sharp (libvips) did: decode, resize with every fit and kernel, crop, extend, composite, greyscale, trim and channel statistics over RGBA8 pixels"

[lints]
workspace = true

[dependencies]
image = { workspace = true }
mixdog-imaging = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }
mixdog-fonts = { workspace = true }
mixdog-fsio = { workspace = true }
tiny-skia = { workspace = true }
ttf-parser = { workspace = true }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[dev-dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }
mixdog-testkit = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
