[package]
name = "mixdog-session-view"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-app-protocol = { workspace = true }
mixdog-app-server-client = { workspace = true }
mixdog-js = { workspace = true }
mixdog-view-model = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }
mixdog-rt = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-js = { workspace = true, features = ["prefilter-probe"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
