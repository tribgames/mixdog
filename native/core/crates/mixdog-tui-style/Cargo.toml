[package]
name = "mixdog-tui-style"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "How the terminal UI looks: the fifteen themes and the live theme, the glyphs, the SGR colour helpers and the colour level Ink and chalk decide, the statusline colour bridge, the spinner verbs and byline, and the duration labels"

[lints]
workspace = true

[dependencies]
mixdog-js = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-js = { workspace = true, features = ["prefilter-probe"] }
