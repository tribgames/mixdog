id: no-boolean-literal-compare
language: Tsx
severity: info
message: Comparison of a boolean expression against a boolean literal.
note: 'Only for an operand that is a boolean by construction (`!x`, a comparison or `instanceof`/`in` expression, `Boolean(x)`): there `x === true` is just `x` and `x === false` is `!x`. A comparison of any other operand can be a deliberate tri-state test (the value may also be undefined or null), so it is not reported. This rule has no autofix.'
rule:
  any:
    - pattern: $A === true
    - pattern: $A === false
    - pattern: $A !== true
    - pattern: $A !== false
    - pattern: $A == true
    - pattern: $A == false
    - pattern: $A != true
    - pattern: $A != false
    - pattern: true === $A
    - pattern: false === $A
    - pattern: true !== $A
    - pattern: false !== $A
    - pattern: true == $A
    - pattern: false == $A
    - pattern: true != $A
    - pattern: false != $A
constraints:
  A:
    any:
      - kind: unary_expression
        has:
          field: operator
          regex: '^!$'
      - kind: binary_expression
        has:
          field: operator
          regex: '^(===|!==|==|!=|<|>|<=|>=|instanceof|in)$'
      - pattern: Boolean($$$)
