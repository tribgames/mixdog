id: todo-marker
language: TypeScript
severity: info
message: TODO/FIXME/XXX comment.
note: Only a comment that starts with an uppercase TODO, FIXME or XXX marker matches; the word inside prose, identifiers or strings does not. Marker comments are informational. They have no autofix; resolve or remove them in a later change.
rule:
  kind: comment
  regex: '(?m)^\s*(?://+!?|/\*+!?|#+|--+|;+|\*+)?\s*(?:TODO|FIXME|XXX)\b'
