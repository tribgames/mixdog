[package]
name = "mixdog-services"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-ai = { workspace = true }
mixdog-tools = { workspace = true }
mixdog-store = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-js = { workspace = true }
# Linked as a library by path (not a workspace member), as mixdog-tools does.
mixdog-graph = { path = "../../../mixdog-graph" }
mixdog-agent = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-protocol = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
deadpool-postgres = { workspace = true }
ort = { workspace = true }
thiserror = { workspace = true }
tokio-postgres = { workspace = true }
unicode-normalization = { workspace = true }
hmac = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
same-file = { workspace = true }
zstd = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
walkdir = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
mixdog-rt = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
