[package]
name = "mixdog-services"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Test-only: for other crates' replays, the scheduler's call recorder (`Scheduler::record_calls`) and the effort judge over a
# recorded step distribution (`effort_judge::judge::StepProbs`). No normal build enables it; a release build with it fails
# (build.rs).
test-support = []

[lints]
workspace = true

[dependencies]
mixdog-ai = { workspace = true }
mixdog-tools = { workspace = true }
mixdog-store = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-js = { workspace = true }
mixdog-app-protocol = { workspace = true }
# Linked as a library (crates/mixdog-graph builds native/mixdog-graph's sources), as mixdog-tools does.
mixdog-graph = { workspace = true }
mixdog-agent = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-remote = { workspace = true }
mixdog-workspace = { workspace = true }
mixdog-exthost = { workspace = true }
mixdog-core-base = { workspace = true }
mixdog-statefile = { workspace = true }
mixdog-fsio = { workspace = true }
mixdog-trace = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
deadpool-postgres = { workspace = true }
ort = { workspace = true }
thiserror = { workspace = true }
tokio-postgres = { workspace = true }
unicode-normalization = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
same-file = { workspace = true }
zstd = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true, features = ["std", "executor"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
walkdir = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-testkit = { workspace = true }
tempfile = { workspace = true }
# The relay fixture of the webhook tunnel tests: a WebSocket server that sees the leg's request.
tokio-tungstenite = { workspace = true, features = ["connect", "handshake", "rustls-tls-native-roots"] }
# The real process manager the tidy tests spawn under, as mixdog-scm's tests do.
mixdog-spawn = { workspace = true, features = ["core", "core-test", "lease-clock", "scripted-shell"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-ai = { workspace = true, features = ["count-work", "test-support"] }
mixdog-app-protocol = { workspace = true }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-agent = { workspace = true, features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-scm = { workspace = true, features = ["write-queue-hook"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-tools = { workspace = true, features = ["policy-observer"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-services = { path = ".", features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-exthost = { workspace = true, features = ["test-support"] }
