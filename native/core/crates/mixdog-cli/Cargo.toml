[package]
name = "mixdog-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mixdogd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The controls a replay drives a spawned core with. Each is off until its environment variable switches it on, and is
# for development builds only (build.rs fails a release-profile build with one; native/core/build-support/dev_only.rs).
# The phone terminal replay (apps/desktop/src/renderer/remote-protocol-terminal.scenario.mjs): the terminal size leases
# on a clock the replay steps (mixdog-spawn `lease-clock`, MIXDOG_TERMINAL_LEASE_CLOCK).
terminal-lease-clock = ["mixdog-spawn/lease-clock"]
# The download recording's controls (mixdog-workspace, replay_controls.rs) and the tool-failure recording's held flush
# timer (mixdog-core-run, failure_log.rs `replay_held`); the terminal lane replay's scripted shell (mixdog-spawn
# `scripted-shell`, MIXDOG_TERMINAL_SCRIPTED_SHELL).
# `replay/storesSettled`, the lone-surrogate wire replay's barrier before it looks at the core's files
# (mixdog-app-server-daemon replay_stores_settled.rs).
replay-controls = ["mixdog-workspace/replay-controls", "mixdog-core-run/replay-controls", "mixdog-spawn/scripted-shell", "mixdog-app-server-daemon/replay-controls"]
crash-gates = ["mixdog-core-session/crash-gates"]
# The core's clock is a replay's (mixdog-rt virtual_clock.rs, MIXDOG_VIRTUAL_CLOCK): RT-C, RT-W, the timers and the wall
# clock stand still until the replay advances them; the usage row's send times read it (mixdog-ai), and the memory store
# runs on the port the replay assigned (mixdog-services pg/cluster.rs `assigned_port`).
virtual-clock = ["mixdog-ai/virtual-clock", "mixdog-core-session/virtual-clock", "mixdog-services/assigned-pg-port"]
# A replay's barrier on the model's bytes (mixdog-ai transport/replay_bytes.rs, MIXDOG_REPLAY_BYTES).
replay-bytes = ["mixdog-ai/replay-bytes", "mixdog-core/replay-bytes"]
# A replay's settled signal (mixdog-core-session session/replay_settled.rs, MIXDOG_REPLAY_SETTLED).
replay-settled = ["mixdog-core-session/replay-settled"]
# Every replay control, and for every library `mixdogd` links the features a test build gives it, so a test run and
# this build compile each library once (D:\mixdog-build\tools\unify-test-features.py writes it; cargo-gate adds it).
dev-controls = ["crash-gates", "replay-bytes", "replay-controls", "replay-settled", "terminal-lease-clock", "virtual-clock", "fancy-regex/perf", "fancy-regex/probe", "fancy-regex/std", "fancy-regex/unicode", "fancy-regex/variable-lookbehinds", "mixdog-agent/test-support", "mixdog-ai/count-work", "mixdog-ai/replay-bytes", "mixdog-ai/test-support", "mixdog-ai/virtual-clock", "mixdog-app-server/replay-controls", "mixdog-app-server-daemon/replay-controls", "mixdog-core/count-work", "mixdog-core/replay-bytes", "mixdog-core/test-support", "mixdog-core-api/mock", "mixdog-core-base/test-support", "mixdog-core-config/count-work", "mixdog-core-domains/count-work", "mixdog-core-review/test-support", "mixdog-core-rooms/test-support", "mixdog-core-run/replay-controls", "mixdog-core-run/test-support", "mixdog-core-session/crash-gates", "mixdog-core-session/replay-settled", "mixdog-core-session/test-support", "mixdog-core-session/virtual-clock", "mixdog-exthost/test-support", "mixdog-fsio/elide-syncs", "mixdog-js/fixture-tools", "mixdog-js/prefilter-probe", "mixdog-mcp/test-support", "mixdog-migrate/crash-hook", "mixdog-rt/test-support", "mixdog-rt/virtual-clock", "mixdog-scm/write-queue-hook", "mixdog-secrets/count-work", "mixdog-secrets/test-support", "mixdog-services/assigned-pg-port", "mixdog-services/test-support", "mixdog-spawn/core", "mixdog-spawn/core-test", "mixdog-spawn/lease-clock", "mixdog-spawn/scripted-shell", "mixdog-store/crash-hook", "mixdog-store/test-support", "mixdog-tools/policy-observer", "mixdog-trace/flush-probe", "mixdog-workspace/count-jobs", "mixdog-workspace/kill-points", "mixdog-workspace/replay-controls"]

[dependencies]
# Reached through mixdog-app-server-daemon; named here only so the features above reach them.
fancy-regex = { workspace = true, optional = true }
mixdog-agent = { workspace = true, optional = true }
mixdog-core-base = { workspace = true, optional = true }
mixdog-core-config = { workspace = true, optional = true }
mixdog-core-domains = { workspace = true, optional = true }
mixdog-core-review = { workspace = true, optional = true }
mixdog-core-rooms = { workspace = true, optional = true }
mixdog-core-run = { workspace = true, optional = true }
mixdog-core-session = { workspace = true, optional = true }
mixdog-fsio = { workspace = true, optional = true }
mixdog-mcp = { workspace = true, optional = true }
mixdog-scm = { workspace = true, optional = true }
mixdog-secrets = { workspace = true, optional = true }
mixdog-spawn = { workspace = true, optional = true }
mixdog-tools = { workspace = true, optional = true }
mixdog-trace = { workspace = true, optional = true }
mixdog-workspace = { workspace = true, optional = true }
mixdog-app-server-daemon = { workspace = true }
mixdog-app-server-client = { workspace = true }
mixdog-app-server = { workspace = true }
# `mixdog exec` composes its own core in process (src/exec/launcher.rs).
mixdog-ai = { workspace = true }
mixdog-core = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-services = { workspace = true }
mixdog-exthost = { workspace = true }
mixdog-migrate = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-store = { workspace = true }
mixdog-js = { workspace = true }
mixdog-protocol = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
# The exec replay's stand-in provider (tests/exec_replay.rs): the request head and the gzip body the provider sends.
flate2 = { workspace = true }
httparse = { workspace = true }
mixdog-testkit = { workspace = true }
# The crash record replay's boot faults (tests/crash_record_replay.rs, src/boot_fault.rs): in the test build of `mixdogd` only.
mixdog-cli = { path = ".", features = ["crash-gates", "mixdog-core-session"] }
tokio = { workspace = true, features = ["net", "io-util"] }
# The CLI replay (tests/exec_cli_replay.rs): the stand-in serves TLS under a throwaway certificate the binary is pinned to.
rcgen = { workspace = true }
regex = { workspace = true }
notify = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
tokio-rustls = { workspace = true, features = ["ring"] }

# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-ai = { workspace = true, features = ["count-work", "replay-bytes", "test-support", "virtual-clock"] }
mixdog-app-protocol = { workspace = true }
mixdog-core = { workspace = true, features = ["count-work", "replay-bytes", "test-support"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-core-domains = { workspace = true, features = ["count-work"] }
mixdog-core-review = { workspace = true, features = ["test-support"] }
mixdog-core-session = { workspace = true, features = ["crash-gates", "replay-settled", "test-support", "virtual-clock"] }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
mixdog-mcp = { workspace = true, features = ["test-support"] }
mixdog-migrate = { workspace = true, features = ["crash-hook"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-spawn = { workspace = true, features = ["core", "core-test", "lease-clock", "scripted-shell"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-core-config = { workspace = true, features = ["count-work"] }
mixdog-protocol = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-core-run = { workspace = true, features = ["replay-controls", "test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-agent = { workspace = true, features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-scm = { workspace = true, features = ["write-queue-hook"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-tools = { workspace = true, features = ["policy-observer"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
fancy-regex = { workspace = true, features = ["perf", "probe", "std", "unicode", "variable-lookbehinds"] }
mixdog-core-rooms = { workspace = true, features = ["test-support"] }
mixdog-app-server = { workspace = true, features = ["replay-controls"] }
mixdog-app-server-daemon = { workspace = true, features = ["replay-controls"] }
mixdog-services = { workspace = true, features = ["assigned-pg-port", "test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-exthost = { workspace = true, features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-trace = { workspace = true, features = ["flush-probe"] }

[target.'cfg(windows)'.build-dependencies]
# The version resource and icon of mixdogd.exe (build.rs).
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# `serve` leaves the console it was given and claims the desktop app's AppUserModelID (Task Manager's grouping).
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
# The CLI replay's Ctrl+C (a console control event to the binary's own console) and the processes a killed run leaves.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-exthost = { workspace = true, features = ["test-support"] }
