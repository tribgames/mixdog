[package]
name = "mixdog-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mixdogd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The controls a replay drives a spawned core with. Each is off until its environment variable switches it on, and is
# for development builds only (build.rs fails a release-profile build with one; native/core/build-support/dev_only.rs).
# The phone terminal replay (apps/desktop/src/renderer/remote-protocol-terminal.scenario.mjs): the terminal size leases
# on a clock the replay steps (mixdog-spawn `lease-clock`, MIXDOG_TERMINAL_LEASE_CLOCK).
terminal-lease-clock = ["mixdog-spawn/lease-clock"]
# The download recording's controls (mixdog-workspace, replay_controls.rs) and the tool-failure recording's held flush
# timer (mixdog-core-run, failure_log.rs `replay_held`).
replay-controls = ["mixdog-workspace/replay-controls", "mixdog-core-run/replay-controls"]
crash-gates = ["mixdog-core-session/crash-gates"]
# Every replay control, and for every library `mixdogd` links the features a test build gives it, so a test run and
# this build compile each library once (D:\mixdog-build\tools\unify-test-features.py writes it; cargo-gate adds it).
dev-controls = ["crash-gates", "replay-controls", "terminal-lease-clock", "mixdog-agent/test-support", "mixdog-ai/count-work", "mixdog-ai/test-support", "mixdog-core/count-work", "mixdog-core-api/mock", "mixdog-core-base/test-support", "mixdog-core-config/count-work", "mixdog-core-domains/count-work", "mixdog-core-review/test-support", "mixdog-core-run/replay-controls", "mixdog-core-run/test-support", "mixdog-core-session/crash-gates", "mixdog-core-session/test-support", "mixdog-js/fixture-tools", "mixdog-mcp/test-support", "mixdog-migrate/crash-hook", "mixdog-rt/test-support", "mixdog-secrets/count-work", "mixdog-secrets/test-support", "mixdog-services/test-support", "mixdog-spawn/core", "mixdog-spawn/core-test", "mixdog-spawn/lease-clock", "mixdog-store/crash-hook", "mixdog-store/test-support", "mixdog-workspace/count-jobs", "mixdog-workspace/kill-points", "mixdog-workspace/replay-controls"]

[dependencies]
# Reached through mixdog-app-server-daemon; named here only so the features above reach them.
mixdog-agent = { workspace = true, optional = true }
mixdog-ai = { workspace = true, optional = true }
mixdog-core = { workspace = true, optional = true }
mixdog-core-api = { workspace = true, optional = true }
mixdog-core-base = { workspace = true, optional = true }
mixdog-core-config = { workspace = true, optional = true }
mixdog-core-domains = { workspace = true, optional = true }
mixdog-core-review = { workspace = true, optional = true }
mixdog-core-run = { workspace = true, optional = true }
mixdog-core-session = { workspace = true, optional = true }
mixdog-mcp = { workspace = true, optional = true }
mixdog-secrets = { workspace = true, optional = true }
mixdog-services = { workspace = true, optional = true }
mixdog-spawn = { path = "../../../mixdog-spawn", optional = true }
mixdog-workspace = { workspace = true, optional = true }
mixdog-app-server-daemon = { workspace = true }
mixdog-app-server-client = { workspace = true }
mixdog-exthost = { workspace = true }
mixdog-migrate = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-store = { workspace = true }
mixdog-js = { workspace = true }
mixdog-protocol = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-ai = { workspace = true, features = ["count-work", "test-support"] }
mixdog-app-protocol = { workspace = true }
mixdog-core = { workspace = true, features = ["count-work"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-core-domains = { workspace = true, features = ["count-work"] }
mixdog-core-review = { workspace = true, features = ["test-support"] }
mixdog-core-session = { workspace = true, features = ["crash-gates", "test-support"] }
mixdog-js = { workspace = true, features = ["fixture-tools"] }
mixdog-mcp = { workspace = true, features = ["test-support"] }
mixdog-migrate = { workspace = true, features = ["crash-hook"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-spawn = { path = "../../../mixdog-spawn", features = ["core", "core-test", "lease-clock"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-core-config = { workspace = true, features = ["count-work"] }
mixdog-protocol = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-core-run = { workspace = true, features = ["replay-controls", "test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-agent = { workspace = true, features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-services = { workspace = true, features = ["test-support"] }
