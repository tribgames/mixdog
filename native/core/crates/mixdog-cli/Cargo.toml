[package]
name = "mixdog-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mixdogd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The controls a replay of the download recording drives a spawned core with (mixdog-workspace, replay_controls.rs). Never in an ordinary build.
replay-controls = ["mixdog-app-server-daemon/replay-controls"]
crash-gates = ["mixdog-app-server-daemon/crash-gates"]

[dependencies]
mixdog-app-server-daemon = { workspace = true }
mixdog-app-server-client = { workspace = true }
mixdog-exthost = { workspace = true }
mixdog-migrate = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-store = { workspace = true }
mixdog-js = { workspace = true }
mixdog-protocol = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }
