[package]
name = "mixdog-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
futures = { workspace = true, features = ["alloc", "async-await", "std", "executor"] }
mixdog-agent = { workspace = true }
mixdog-ai = { workspace = true }
mixdog-app-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-exthost = { workspace = true }
mixdog-js = { workspace = true }
mixdog-ledger = { workspace = true }
mixdog-mcp = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-secrets = { workspace = true }
mixdog-services = { workspace = true }
mixdog-statefile = { workspace = true }
mixdog-store = { workspace = true }
mixdog-tools = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
mixdog-core-agents = { workspace = true }
mixdog-core-base = { workspace = true }
mixdog-core-config = { workspace = true }
mixdog-core-domains = { workspace = true }
mixdog-core-goal = { workspace = true }
mixdog-core-ports = { workspace = true }
mixdog-core-prompt = { workspace = true }
mixdog-core-rooms = { workspace = true }
mixdog-core-run = { workspace = true }
mixdog-core-session = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation"] }

[features]
# Test-only: the work counters the hot-path tests read, here and in the crates below. A test build of this crate (the
# self dev-dependency below) or of a crate that depends on it turns it on; no normal build does.
count-work = ["mixdog-ai/count-work", "mixdog-core-config/count-work", "mixdog-core-domains/count-work"]

[dev-dependencies]
mixdog-core = { path = ".", features = ["count-work"] }
mixdog-js = { workspace = true, features = ["fixture-tools"] }
mixdog-core-review = { workspace = true, features = ["test-support"] }
mixdog-spawn = { path = "../../../mixdog-spawn", features = ["core"] }
tempfile = { workspace = true }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
mixdog-core-session = { workspace = true, features = ["test-support"] }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-trace = { workspace = true }
