[package]
name = "mixdog-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-core-api = { workspace = true }
mixdog-store = { workspace = true }
mixdog-js = { workspace = true }
mixdog-agent = { workspace = true }
mixdog-ledger = { workspace = true }
mixdog-mcp = { workspace = true }
mixdog-services = { workspace = true }
mixdog-workspace = { workspace = true }
mixdog-scm = { workspace = true }
mixdog-remote = { workspace = true }
mixdog-exthost = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-app-protocol = { workspace = true }
mixdog-tools = { workspace = true }
mixdog-ai = { workspace = true }
futures = { workspace = true, features = ["alloc", "async-await"] }
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
pulldown-cmark = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }

[dev-dependencies]
mixdog-migrate = { workspace = true }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
mixdog-spawn = { path = "../../../mixdog-spawn", features = ["core"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
