[package]
name = "mixdog-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
futures = { workspace = true, features = ["alloc", "async-await", "std", "executor"] }
mixdog-agent = { workspace = true }
mixdog-ai = { workspace = true }
mixdog-app-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-exthost = { workspace = true }
mixdog-js = { workspace = true }
mixdog-ledger = { workspace = true }
mixdog-mcp = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-secrets = { workspace = true }
mixdog-services = { workspace = true }
mixdog-statefile = { workspace = true }
mixdog-store = { workspace = true }
mixdog-tools = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
mixdog-core-agents = { workspace = true }
mixdog-core-base = { workspace = true }
mixdog-core-config = { workspace = true }
mixdog-core-domains = { workspace = true }
mixdog-core-goal = { workspace = true }
mixdog-core-ports = { workspace = true }
mixdog-core-prompt = { workspace = true }
mixdog-core-rooms = { workspace = true }
mixdog-core-run = { workspace = true }
mixdog-core-session = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation"] }

[features]
# Test-only: the work counters the hot-path tests read, here and in the crates below. A test build of this crate (the
# self dev-dependency below) or of a crate that depends on it turns it on; no normal build does.
count-work = ["mixdog-ai/count-work", "mixdog-core-config/count-work", "mixdog-core-domains/count-work"]
# Test-only: what the replays in `crates/mixdog-core-replays` reach inside this library (`run_host::fixture_fs`,
# `replay_access`). Refused in a release build (build.rs).
test-support = ["mixdog-rt/test-support"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
mixdog-core = { path = ".", features = ["count-work", "test-support"] }
bytes = { workspace = true }
flate2 = { workspace = true }
tokio-tungstenite = { workspace = true }
zstd = { workspace = true }
# The loopback TLS server of the wire parity check (`mixdog_ai::transport::loopback`) and the client that trusts only its certificate.
mixdog-ai = { workspace = true, features = ["count-work", "test-support"] }
reqwest = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
tokio-rustls = { workspace = true, features = ["ring"] }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
mixdog-migrate = { workspace = true, features = ["crash-hook"] }
mixdog-core-review = { workspace = true, features = ["test-support"] }
mixdog-spawn = { workspace = true, features = ["core", "core-test", "lease-clock", "scripted-shell"] }
tempfile = { workspace = true }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "net", "io-util", "process"] }
mixdog-core-session = { workspace = true, features = ["crash-gates", "test-support", "virtual-clock"] }
mixdog-core-run = { workspace = true, features = ["replay-controls", "test-support"] }
mixdog-core-rooms = { workspace = true, features = ["test-support"] }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-trace = { workspace = true, features = ["flush-probe"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-app-protocol = { workspace = true }
mixdog-core-domains = { workspace = true, features = ["count-work"] }
mixdog-mcp = { workspace = true, features = ["test-support"] }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-core-config = { workspace = true, features = ["count-work"] }
mixdog-protocol = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-agent = { workspace = true, features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-scm = { workspace = true, features = ["write-queue-hook"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-tools = { workspace = true, features = ["policy-observer"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
fancy-regex = { workspace = true, features = ["perf", "probe", "std", "unicode", "variable-lookbehinds"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-services = { workspace = true, features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-exthost = { workspace = true, features = ["test-support"] }
