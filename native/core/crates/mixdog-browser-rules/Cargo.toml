[package]
name = "mixdog-browser-rules"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The Browser Use URL and redaction rules, with nothing but the JavaScript-semantics crate and the url parser (no async runtime, no workspace-hack): shared by mixdog-browser-policy and the desktop Node-API module"

[lints]
workspace = true

[dependencies]
mixdog-js = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
