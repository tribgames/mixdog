[package]
name = "mixdog-ooxml-text"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-fsio = { workspace = true }
mixdog-js = { workspace = true }
# zlib-rs is the backend that words a corrupt stream as zlib does ("invalid block type"), which Node's message carries.
flate2 = { workspace = true, features = ["zlib-rs"] }
sha2 = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
mixdog-testkit = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
