[package]
name = "mixdog-term"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-fsio = { workspace = true }
mixdog-js = { workspace = true }
mixdog-termtext = { workspace = true }
mixdog-tui-style = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The VT test grid (testing.rs) replays frames for the tests of this crate and of the crates above it, so it is a
# regular dependency.
vte = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
] }
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
portable-pty = { workspace = true }
tempfile = { workspace = true }
