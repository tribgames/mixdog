[package]
name = "mixdog-office-quality"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
mixdog-js = { workspace = true }
mixdog-office-base = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }
mixdog-fsio = { workspace = true }
mixdog-ooxml = { workspace = true }
mixdog-raster = { workspace = true }
base64 = { workspace = true }
mixdog-office-pdf = { workspace = true }
mixdog-office-design = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tempfile = { workspace = true }
mixdog-office-author = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-js = { workspace = true, features = ["prefilter-probe"] }
mixdog-office-com = { workspace = true, features = ["test-support"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-image-egress = { workspace = true, features = ["test-support"] }
mixdog-imaging = { workspace = true, features = ["test-support"] }
