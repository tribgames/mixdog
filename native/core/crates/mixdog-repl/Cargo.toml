[package]
name = "mixdog-repl"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The plain REPL of the native mixdog binary (`mixdog --plain`): a readline loop over the session store with streamed replies, tool cards, a markdown re-render and a per-turn statusline"

[lints]
workspace = true

[dependencies]
mixdog-session-view = { workspace = true }
mixdog-markdown-ansi = { workspace = true }
mixdog-term = { workspace = true }
mixdog-termtext = { workspace = true }
mixdog-tui-style = { workspace = true }
mixdog-view-model = { workspace = true }
mixdog-tui = { workspace = true }
mixdog-launch = { workspace = true }
mixdog-js = { workspace = true }
mixdog-rt = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }
