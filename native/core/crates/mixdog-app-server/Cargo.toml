[package]
name = "mixdog-app-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-app-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-rt = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-core-session = { workspace = true, features = ["test-support"] }
mixdog-store = { workspace = true }
mixdog-rt = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }
