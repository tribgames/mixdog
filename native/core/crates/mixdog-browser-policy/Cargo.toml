[package]
name = "mixdog-browser-policy"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-browser-rules = { path = "../mixdog-browser-rules" }
async-trait = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
url = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
mixdog-testkit = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
