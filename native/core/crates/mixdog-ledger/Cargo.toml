[package]
name = "mixdog-ledger"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-js = { workspace = true }
mixdog-rt = { workspace = true }
mixdog-store = { workspace = true }
mixdog-protocol = { workspace = true }
mixdog-core-api = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mixdog-rt = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
tempfile = { workspace = true }
# The golden twin holds shortest-round-trip doubles; serde_json's default parser can be 1 ulp off.
serde_json = { workspace = true, features = ["float_roundtrip"] }
