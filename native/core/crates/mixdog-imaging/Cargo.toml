[package]
name = "mixdog-imaging"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The image codec behind the image.* methods and the read tool: decode, colour-convert, resize, re-encode and the token gate"

[lints]
workspace = true

[dependencies]
avif-parse = "=2.1.0"
base64 = { workspace = true }
mixdog-image-egress = { workspace = true }
flate2 = { workspace = true }
image = { workspace = true }
libwebp-sys = { workspace = true }
moxcms = { workspace = true, features = ["options"] }
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
ravif = { version = "=0.12.0", default-features = false }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
sha2 = { workspace = true }
tiff = "0.10.3"
zune-core = { workspace = true }
zune-jpeg = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[features]
# Fake HEIC codecs for other crates' tests.
test-support = []

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[dev-dependencies]
mixdog-testkit = { workspace = true }
serde_json = { workspace = true }
