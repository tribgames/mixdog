[package]
name = "mixdog-app-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# JSON Schema and TypeScript derives plus the `export` module that writes the goldens.
# Off for every ordinary build; the crate's own tests turn it on (see dev-dependencies).
codegen = ["dep:schemars", "dep:ts-rs", "mixdog-protocol/codegen"]

[dependencies]
mixdog-js = { workspace = true }
mixdog-protocol = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
# Self dependency: a test build of this package (`cargo test`, `cargo nextest`) resolves the
# `codegen` feature on, so the golden tests run in the plain workspace test run without
# `required-features` skipping them. Dev-dependency features do not reach `cargo build`.
mixdog-app-protocol = { workspace = true, features = ["codegen"] }
pretty_assertions = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-js = { workspace = true, features = ["fixture-tools"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true }
