[package]
name = "mixdog-pdf"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "PDF reader of the read path: structure (lexer, parser, xref with repair), document and page tree, codecs wired in, following pdf.js 6.4.299"

[lints]
workspace = true

[dependencies]
mixdog-js = { workspace = true }
brotli = { workspace = true }
flate2 = { workspace = true }
mixdog-pdf-codec = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
mixdog-fsio = { workspace = true }
mixdog-office-base = { workspace = true, features = ["test-support"] }
mixdog-testkit = { workspace = true }
serde_json = { workspace = true }
