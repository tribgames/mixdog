[package]
name = "mixdog-pdf"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "PDF reader of the read path: structure (lexer, parser, xref with repair), document and page tree, codecs wired in, following pdf.js 6.4.299"

[lints]
workspace = true

[dependencies]
mixdog-js = { workspace = true }
brotli = { workspace = true }
mixdog-fonts = { workspace = true }
mixdog-fsio = { workspace = true }
url = { workspace = true }
flate2 = { workspace = true }
mixdog-pdf-codec = { workspace = true }
tracing = { workspace = true }
mixdog-office-base = { workspace = true }
mixdog-raster = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
aes = { workspace = true }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-testkit = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
