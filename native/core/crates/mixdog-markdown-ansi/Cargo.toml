[package]
name = "mixdog-markdown-ansi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-highlight = { workspace = true }
mixdog-js = { workspace = true }
mixdog-termtext = { workspace = true }
mixdog-tui-style = { workspace = true }
regress = { workspace = true }
serde = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
