[package]
name = "mixdog-rt"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Inline executors for packages that test against mocks (`mixdog_rt::testing`).
test-support = []
# A replay's clock (virtual_clock.rs): RT-C and RT-W on a tokio clock the replay freezes and advances. Never in an ordinary build.
virtual-clock = ["tokio/test-util"]

[dependencies]
arc-swap = { workspace = true }
crossbeam-channel = { workspace = true }
# The driver features are named here so RT-C and RT-W always have time and I/O drivers
# (`enable_all`), regardless of what other crates in the build enable.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros"] }
tokio-util = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-rt = { path = ".", features = ["test-support", "virtual-clock"] }
