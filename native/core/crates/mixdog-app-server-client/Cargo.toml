[package]
name = "mixdog-app-server-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mixdog-app-protocol = { workspace = true }
mixdog-protocol = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true, features = ["std"] }
rand = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "net", "io-util"] }
# Loopback `ws://` only (remote targets arrive through a tunnel or the relay as a loopback port), so no TLS feature.
tokio-tungstenite = { workspace = true, features = ["connect"] }
uuid = { workspace = true, features = ["v7"] }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net", "io-util", "test-util"] }
tempfile = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-app-protocol = { workspace = true }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-protocol = { workspace = true }
