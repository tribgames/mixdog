[package]
name = "mixdog-tui-widgets"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The widgets of the terminal UI: each one a pure function from its props and the columns to painted rows and their exact row count (pickers, slash palette, question panel, confirm bar, sign-in URL, text entry panel, right hint)"

[lints]
workspace = true

[dependencies]
mixdog-js = { workspace = true }
mixdog-markdown-ansi = { workspace = true }
mixdog-term = { workspace = true }
mixdog-termtext = { workspace = true }
mixdog-tui-style = { workspace = true }
mixdog-view-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-js = { workspace = true, features = ["fixture-tools", "prefilter-probe"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
