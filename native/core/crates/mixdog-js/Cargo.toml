[package]
name = "mixdog-js"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flate2 = { workspace = true }
rand = { workspace = true }
regress = { workspace = true, features = ["utf16"] }
icu_collator = { workspace = true }
icu_locale_core = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
# Test hooks of the literal pre-check of long texts (`regex::prefilter_probe`): the patterns built, the engine's own
# decision, and when the pre-check applies.
prefilter-probe = []

[dev-dependencies]
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-js = { path = ".", features = ["prefilter-probe"] }
