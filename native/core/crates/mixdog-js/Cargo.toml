[package]
name = "mixdog-js"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regress = { workspace = true }
icu_collator = { workspace = true }
icu_locale_core = { workspace = true }
sys-locale = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
sha2 = { workspace = true, optional = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[features]
# The loader of the tool references recorded goldens carry (`fixture_tools`): a dev-dependency of the crates that replay them.
fixture-tools = ["dep:sha2"]

[dev-dependencies]
mixdog-testkit = { workspace = true }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (D:\mixdog-build\tools\unify-test-features.py).
mixdog-js = { path = ".", features = ["fixture-tools"] }
