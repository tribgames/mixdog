[package]
name = "mixdog-office-com"
version.workspace = true
edition.workspace = true
publish.workspace = true
# tests/fake_host.rs is a program (the stand-in host), not a test target.
autotests = false

[lints]
workspace = true

[dependencies]
mixdog-fsio = { workspace = true }
mixdog-rt = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "process", "io-util", "macros", "sync", "time"] }
tokio-util = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }
zip = { workspace = true }
oem_cp = { workspace = true }

[target."cfg(windows)".dependencies]
# src/ps/collate.rs (CompareStringEx: Sort-Object and -eq on strings), src/ps/datetime.rs (ToUniversalTime with the dynamic time zone).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Time"] }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics",
  "Win32_Graphics_GdiPlus",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-testkit = { workspace = true }
# The recorded corpus nests deeper than the parser's default limit of 128 (Node's JSON.parse has none).
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-office-com = { path = ".", features = ["test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }

[features]
# The stand-in host the transport tests start in place of the host program (tests/fake_host.rs) and the config that selects it.
test-support = []

[[bin]]
name = "fake-office-host"
path = "tests/fake_host.rs"
required-features = ["test-support"]

[[bin]]
name = "office-com-host-test"
path = "tests/bin/office_com_host_test.rs"
required-features = ["test-support"]

[[test]]
name = "it"
path = "tests/it/main.rs"

[target."cfg(windows)".dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
