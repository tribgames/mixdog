[package]
name = "mixdog-office-com-recorder"
version.workspace = true
edition.workspace = true
publish = false
description = "Test tool: an IDispatch proxy DLL that records every COM call the unchanged PowerShell Office hosts make (the recorder of crates/mixdog-office-com). Windows only; nothing links it."

[lib]
name = "mixdog_office_com_recorder"
# The cdylib is the DLL hook.ps1 loads; the rlib is what the unit tests link.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
mixdog-office-com = { workspace = true }
serde_json = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../../mixdog-workspace-hack" }
