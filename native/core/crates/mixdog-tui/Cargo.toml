[package]
name = "mixdog-tui"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false
description = "The terminal UI of the native mixdog binary: the prompt editor and the application state machines (panel surface, slash dispatch, pickers, transcript window, mouse selection, handlers, view, run loop)"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
mixdog-term = { workspace = true }
mixdog-termtext = { workspace = true }
mixdog-tui-style = { workspace = true }
mixdog-tui-widgets = { workspace = true }
mixdog-markdown-ansi = { workspace = true }
mixdog-view-model = { workspace = true }
mixdog-session-view = { workspace = true }
mixdog-launch = { workspace = true }
mixdog-js = { workspace = true }
mixdog-fsio = { workspace = true }
# The footer's rules and the prompt history's files, without the core that also reads them.
mixdog-core-files = { workspace = true }
mixdog-statefile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
mixdog-workspace-hack = { version = "0.1", path = "../mixdog-workspace-hack" }

[dev-dependencies]
portable-pty = { workspace = true }
vte = { workspace = true }
tempfile = { workspace = true }
mixdog-testkit = { workspace = true }
mixdog-cli = { workspace = true, features = ["crash-gates"] }
mixdog-core = { workspace = true, features = ["count-work", "replay-bytes", "test-support"] }
# Every workspace crate this crate's tests build, with its test-only features, so a test build has one feature set
# whatever packages are selected (<build-tools>\unify-test-features.py).
fancy-regex = { workspace = true, features = ["probe"] }
mixdog-acp = { workspace = true, features = ["test-support"] }
mixdog-agent = { workspace = true, features = ["test-support"] }
mixdog-ai = { workspace = true, features = ["count-work", "replay-bytes", "test-support", "virtual-clock"] }
mixdog-app-server = { workspace = true, features = ["replay-controls"] }
mixdog-app-server-daemon = { workspace = true, features = ["replay-controls", "test-hooks"] }
mixdog-browser-engine = { workspace = true, features = ["test-support"] }
mixdog-core-api = { workspace = true, features = ["mock"] }
mixdog-core-base = { workspace = true, features = ["test-support"] }
mixdog-core-config = { workspace = true, features = ["count-work"] }
mixdog-core-domains = { workspace = true, features = ["count-work"] }
mixdog-core-review = { workspace = true, features = ["test-support"] }
mixdog-core-rooms = { workspace = true, features = ["test-support"] }
mixdog-core-run = { workspace = true, features = ["replay-controls", "test-support"] }
mixdog-core-session = { workspace = true, features = ["crash-gates", "replay-settled", "test-support", "virtual-clock"] }
mixdog-exthost = { workspace = true, features = ["test-support"] }
mixdog-exthost-worker = { workspace = true, features = ["test-support"] }
mixdog-fsio = { workspace = true, features = ["elide-syncs"] }
mixdog-js = { workspace = true, features = ["prefilter-probe"] }
mixdog-launch = { workspace = true, features = ["fake-core"] }
mixdog-mcp = { workspace = true, features = ["test-support"] }
mixdog-migrate = { workspace = true, features = ["crash-hook"] }
mixdog-office-com = { workspace = true, features = ["test-support"] }
mixdog-rt = { workspace = true, features = ["test-support", "virtual-clock"] }
mixdog-scm = { workspace = true, features = ["write-queue-hook"] }
mixdog-secrets = { workspace = true, features = ["count-work", "test-support"] }
mixdog-services = { workspace = true, features = ["assigned-pg-port", "test-support"] }
mixdog-skill-scripts = { workspace = true, features = ["test-support"] }
mixdog-spawn = { workspace = true, features = ["core", "core-test", "lease-clock", "scripted-shell"] }
mixdog-store = { workspace = true, features = ["crash-hook", "test-support"] }
mixdog-tools = { workspace = true, features = ["policy-observer", "test-support"] }
mixdog-trace = { workspace = true, features = ["flush-probe"] }
mixdog-workspace = { workspace = true, features = ["count-jobs", "kill-points", "replay-controls", "test-support"] }
mixdog-app-server-client = { workspace = true, features = ["test-support"] }
mixdog-image-egress = { workspace = true, features = ["test-support"] }
mixdog-imaging = { workspace = true, features = ["test-support"] }
mixdog-graph-host = { workspace = true, features = ["test-support"] }
