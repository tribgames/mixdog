# The crates.io releases the patched copies in this directory are copies of, in Cargo.lock form, for `cargo audit`.
# A patched copy is a path package: its entry in ../Cargo.lock has no `source`, and cargo-audit skips a package
# without one, so an advisory against the release a copy was made from would go unreported. This file gives those
# releases back their registry identity. It is read by .github/workflows/dependency-audit.yml and by nothing else:
# Cargo never sees it. One entry per `[patch.crates-io]` copy of ../Cargo.toml that the workflow does not name as
# excluded, at the version of the copy's `Cargo.toml`; the workflow fails on a patch that is missing here, on a
# version that differs and on an entry without its patch.
version = 4

[[package]]
name = "rtc"
version = "0.21.1"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "4e2ca201de5ccc83aa3c08d49a2f08d7ed0aeeb2052fb1ccc517a8b77a6927ce"

