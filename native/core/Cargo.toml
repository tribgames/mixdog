# Mixdog Rust core workspace. Owner: WP-INTEGRATE (WORK-PACKAGES §1 rule 3).
# Crate list and layering: SPEC §3.2. Edition 2024, one [[bin]] `mixdogd` in `mixdog-cli`.
#
# The existing native tools (native/mixdog-spawn, -patch, -graph, -computer,
# -secure-desktop) are NOT members yet: each is a standalone edition-2021 package with its
# own Cargo.lock, `--locked --manifest-path` CI/release builds and per-crate target/ dirs
# (see .github/workflows/{spawn,patch,graph}-release.yml, release-gate.yml). Joining them
# would move their lockfile, target dir and release profile. They are linked into the core
# by path dependency when their owning packages (WP-PROC, WP-TOOLS-*, WP-DESKTOP) land.
[workspace]
resolver = "3"
members = [
    "crates/mixdog-protocol",
    "crates/mixdog-app-protocol",
    "crates/mixdog-core-api",
    "crates/mixdog-rt",
    "crates/mixdog-fsio",
    "crates/mixdog-testkit",
    "crates/mixdog-js",
    "crates/mixdog-trace",
    "crates/mixdog-statefile",
    "crates/mixdog-store",
    "crates/mixdog-ledger",
    "crates/mixdog-migrate",
    "crates/mixdog-ai",
    "crates/mixdog-sandboxing",
    "crates/mixdog-tools",
    "crates/mixdog-agent",
    "crates/mixdog-mcp",
    "crates/mixdog-secrets",
    "crates/mixdog-services",
    "crates/mixdog-workspace",
    "crates/mixdog-scm",
    "crates/mixdog-remote",
    "crates/mixdog-exthost",
    "crates/mixdog-core-base",
    "crates/mixdog-core-review",
    "crates/mixdog-core-config",
    "crates/mixdog-core-ports",
    "crates/mixdog-core-rooms",
    "crates/mixdog-core-goal",
    "crates/mixdog-core-domains",
    "crates/mixdog-core-run",
    "crates/mixdog-core-agents",
    "crates/mixdog-core-session",
    "crates/mixdog-core-prompt",
    "crates/mixdog-core",
    "crates/mixdog-app-server",
    "crates/mixdog-app-server-transport",
    "crates/mixdog-app-server-daemon",
    "crates/mixdog-app-server-client",
    "crates/mixdog-cli",
]

[workspace.package]
version = "1.4.5" # == root package.json version; scripts/check-release-version.mjs enforces it
edition = "2024"
publish = false

# RL §13 bans (WP-RT): the ban list is in clippy.toml. A crate that owns a banned item (mixdog-fsio,
# mixdog-testkit) carries a crate-local clippy.toml; other crates route through mixdog-fsio, no #[allow].
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"

# ~47 packages build in parallel on one PC: keep dev/test artefacts small (no incremental
# cache, no debug info) so the shared target groups stay within disk budget and links stay short.
# Test failure locations do not need debug info; set CARGO_PROFILE_DEV_DEBUG=line-tables-only
# for line numbers in backtraces.
[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
# Internal crates (layering: SPEC §3.2; protocol/api crates at the bottom).
mixdog-protocol = { path = "crates/mixdog-protocol" }
mixdog-app-protocol = { path = "crates/mixdog-app-protocol" }
mixdog-core-api = { path = "crates/mixdog-core-api" }
mixdog-rt = { path = "crates/mixdog-rt" }
mixdog-fsio = { path = "crates/mixdog-fsio" }
mixdog-testkit = { path = "crates/mixdog-testkit" }
mixdog-js = { path = "crates/mixdog-js" }
mixdog-trace = { path = "crates/mixdog-trace" }
# The patch engine Node runs, linked as a library (WP-TOOLS-FS apply_patch). Default features off:
# the Windows version resource belongs to the standalone helper executable, not to the core.
mixdog-patch = { path = "../mixdog-patch", default-features = false }
mixdog-statefile = { path = "crates/mixdog-statefile" }
mixdog-store = { path = "crates/mixdog-store" }
mixdog-ledger = { path = "crates/mixdog-ledger" }
mixdog-migrate = { path = "crates/mixdog-migrate" }
mixdog-ai = { path = "crates/mixdog-ai" }
mixdog-sandboxing = { path = "crates/mixdog-sandboxing" }
mixdog-tools = { path = "crates/mixdog-tools" }
mixdog-agent = { path = "crates/mixdog-agent" }
mixdog-mcp = { path = "crates/mixdog-mcp" }
mixdog-secrets = { path = "crates/mixdog-secrets" }
mixdog-services = { path = "crates/mixdog-services" }
mixdog-workspace = { path = "crates/mixdog-workspace" }
mixdog-scm = { path = "crates/mixdog-scm" }
mixdog-remote = { path = "crates/mixdog-remote" }
mixdog-exthost = { path = "crates/mixdog-exthost" }
mixdog-core-base = { path = "crates/mixdog-core-base" }
mixdog-core-review = { path = "crates/mixdog-core-review" }
mixdog-core-config = { path = "crates/mixdog-core-config" }
mixdog-core-ports = { path = "crates/mixdog-core-ports" }
mixdog-core-rooms = { path = "crates/mixdog-core-rooms" }
mixdog-core-goal = { path = "crates/mixdog-core-goal" }
mixdog-core-domains = { path = "crates/mixdog-core-domains" }
mixdog-core-run = { path = "crates/mixdog-core-run" }
mixdog-core-agents = { path = "crates/mixdog-core-agents" }
mixdog-core-session = { path = "crates/mixdog-core-session" }
mixdog-core-prompt = { path = "crates/mixdog-core-prompt" }
mixdog-core = { path = "crates/mixdog-core" }
mixdog-app-server = { path = "crates/mixdog-app-server" }
mixdog-app-server-transport = { path = "crates/mixdog-app-server-transport" }
mixdog-app-server-daemon = { path = "crates/mixdog-app-server-daemon" }
mixdog-app-server-client = { path = "crates/mixdog-app-server-client" }

# External crates. Versions match codex-rs/Cargo.toml wherever Codex uses the same crate;
# the few not in Codex are marked. Declared once here, referenced with `workspace = true`.
aes-gcm = "0.10.3" # not in Codex (WP-REMOTE: relay E2EE, media frames, RFC 8291 payloads)
anyhow = "1"
arc-swap = "1.9.0"
async-trait = "0.1.92" # not in Codex
base64 = "0.22.1"
bytes = "1.10.1"
chrono = "0.4.43"
deadpool-postgres = "0.14" # not in Codex (it uses sqlx); memory store pool
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-30"] } # not in Codex; embedding inference, ONNX Runtime 1.30 loaded at run time
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] } # not in Codex; memory + session_search over Postgres
unicode-normalization = "0.1" # NFKC for the embedding tokenizer normalizer and import folding
unicode-segmentation = "1" # grapheme clusters for the Goal title clip (Intl.Segmenter)
chrono-tz = "0.10" # not in Codex (schedule timezones)
iana-time-zone = "0.1.65" # the OS zone for mixdog_js::time (JS Date local time)
clap = "4"
crossbeam-channel = "0.5.15"
dirs = "6"
secret-service = "4" # not in Codex's pins; the pure-Rust (zbus) Secret Service client behind the Linux keychain (mixdog-secrets)
security-framework = "3" # not in Codex's pins; the macOS keychain items `security add-generic-password` reads and writes (mixdog-secrets)
zbus = { version = "4.4", default-features = false } # not in Codex's pins; D-Bus error types behind the Linux keychain (mixdog-secrets)
dom_query = "0.29" # not in Codex (web extraction)
dom_smoothie = "0.19" # not in Codex (web extraction)
encoding_rs = "0.8" # not in Codex (web charset decoding)
flate2 = "1.1.8"
futures = { version = "0.3", default-features = false }
gix = { version = "0.89.0", default-features = false, features = ["sha1"] }
globset = "0.4"
hkdf = "0.12.4" # not in Codex (WP-REMOTE)
jsonschema = { version = "0.60", default-features = false } # not in Codex (WP-AI-COMPAT: tool input schema acceptance, 2020-12 meta-schema + $ref resolution)
x25519-dalek = { version = "2", features = ["static_secrets"] } # not in Codex (WP-AI-COMPAT: MiMo login payload key agreement)
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.5"
hyper = { version = "1.12", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
ignore = "0.4.23"
grep = "0.3.2" # not in Codex: ripgrep's library crates, as Node's resident search server uses them (WP-WS FileService::search_text)
indexmap = "2.12.0"
insta = "1.46.3"
libc = "0.2.182"
notify = "8.2.0"
once_cell = "1.20.2"
p256 = { version = "0.13.2", default-features = false, features = ["ecdh", "jwk", "std"] } # not in Codex (WP-REMOTE)
pretty_assertions = "1.4.1"
rand = "0.9"
rayon = "1" # not in Codex; WP-GRAPH-GIT parallel graph parse (same major as mixdog-graph)
pulldown-cmark = { version = "0.13", default-features = false }
rcgen = "0.14" # dev only: throwaway TLS certificates for fake-server tests
regex = "1.12.3"
ring ="0.17.14" # RS256 signing of the Vertex AI service-account JWT (already in the rustls graph)
trash = "5.2" # not in Codex: OS recycle bin for projectFs/trash (WP-WS), as Node's shell.trashItem
regress = "0.10" # not in Codex: ECMAScript-syntax regex engine for user-facing text search (WP-WS)
reqwest = { version = "0.12", default-features = false, features = ["charset", "cookies", "http2", "macos-system-configuration", "rustls-tls-native-roots"] }
rusqlite = { version = "0.41.1", features = ["bundled"] } # not in Codex (it uses sqlx)
rustls = { version = "0.23.46", default-features = false }
rustls-native-certs = "0.8"
schemars = "0.8.22"
semver = "1.0"
serde = { version = "1", features = ["rc", "derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] } # Node keeps key insertion order: config file writes and provider request bytes depend on it; numbers parse correctly rounded so stored bodies keep Node's values bit for bit
serde_yaml = "0.9.34"
serial_test = "3.2.0"
sha1 = "0.10" # not in Codex (1.4.5 message-id seeds and dev log standing are SHA-1)
sha2 = "0.10"
icu_collator = "2" # ICU collation for `localeCompare` parity (tools/toolsStatus ordering, WP-TOOLS-ORCH)
icu_locale_core = "2"
sys-locale = "0.3" # the process's default locale, as Node's ICU resolves it
shlex = "1.3.0"
socket2 = { version = "0.6", features = ["all"] } # not in Codex's pins list; already in the tokio/hyper graph
h2 = "0.4" # error types of reqwest's HTTP/2 failures (transport fault mapping)
similar = "2.7.0"
strum = "0.27.2"
strum_macros = "0.28.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = "0.3.47"
tokio = "1"
tokio-rustls = { version = "0.26.4", default-features = false }
tokio-stream = "0.1.18"
tokio-test = "0.4"
# Codex pins openai-oss-forks git revisions of tokio-tungstenite/tungstenite, which add a
# `proxy` feature; the crates.io releases used here have none, so it is not requested.
# Each crate names the features it uses (client connect, server handshake, TLS).
tokio-tungstenite = { version = "0.28.0", default-features = false }
tokio-util = "0.7.18"
toml = "0.9.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
ts-rs = "11"
tungstenite = { version = "0.27.0", features = ["deflate"] }
same-file = "1" # WP-SVC-MISC: import opens the file it verified
url = "2"
uuid = "1"
walkdir = "2.5.0"
which = "8"
windows-sys = "0.61.2"
wiremock = "0.6"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] } # WP-SVC-MISC: tidy engine archives
# WP-WEBRTC: sans-I/O WebRTC stack and its async layer (same release, pinned together), libvpx
# VP8 encoder (prebuilt static libvpx, checksum-verified at build), pure-Rust JPEG decoder.
webrtc = "=0.21.1" # not in Codex
rtc = "=0.21.1" # not in Codex; protocol core under `webrtc`
shiguredo_libvpx = "=2026.2.0-canary.3" # not in Codex
jpeg-decoder = { version = "0.3", default-features = false } # not in Codex
