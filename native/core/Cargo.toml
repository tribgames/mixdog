tokio-util = "0.7.18"
toml = "0.9.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
ts-rs = "11"
tungstenite = { version = "0.27.0", features = ["deflate", "proxy"] }
url = "2"
uuid = "1"
walkdir = "2.5.0"
which = "8"
windows-sys = "0.61.2"
wiremock = "0.6"
zstd = "0.13"
