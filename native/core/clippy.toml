disallowed-types = [
  { path = "tokio::sync::Mutex", allow-invalid = true, reason = "an async mutex held across .await stalls the runtime; use std::sync::Mutex for short sections or a channel/actor" },
  { path = "tokio::sync::RwLock", allow-invalid = true, reason = "an async lock held across .await stalls the runtime; use std::sync::RwLock for short sections, ArcSwap, or a channel/actor" },
  { path = "tokio::fs::File", allow-invalid = true, reason = "tokio::fs hides a blocking pool; run file I/O as a lane job (mixdog-rt)" },
  { path = "tokio::fs::OpenOptions", allow-invalid = true, reason = "tokio::fs hides a blocking pool; run file I/O as a lane job (mixdog-rt)" },
  # std::fs handles: a File or ReadDir in hand means blocking reads through the Read/Write
  # traits, which method paths cannot see.
  { path = "std::fs::File", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::fs::OpenOptions", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::fs::ReadDir", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
