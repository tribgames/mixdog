  { path = "std::fs::create_dir_all", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::fs::metadata", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::fs::symlink_metadata", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::fs::canonicalize", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::fs::exists", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::fs::File::open", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
