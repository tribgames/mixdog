# RL §13 bans. Owner: WP-RT; WP-INTEGRATE owns the workspace wiring.
#
# Clippy reads the clippy.toml nearest the crate and does not merge, so a crate that is the sanctioned
# home of a banned item carries its own clippy.toml restating every other ban here (mixdog-fsio for
# std::fs and Path I/O, mixdog-testkit for test fixtures). Everything else goes through mixdog-fsio;
# a source-level #[allow] for these bans is not accepted. Keep those two files in step with this one.
#
# Blocking filesystem or sleep work belongs in a job on a lane token (mixdog-rt), never on
# RT-C/RT-W; async code gets time from tokio::time.

disallowed-methods = [
  { path = "tokio::task::spawn_blocking", allow-invalid = true, reason = "uses tokio's unbounded blocking pool; submit a job to a lane token (mixdog-rt)" },
  { path = "tokio::runtime::Handle::spawn_blocking", allow-invalid = true, reason = "uses tokio's unbounded blocking pool; submit a job to a lane token (mixdog-rt)" },
  { path = "tokio::runtime::Runtime::spawn_blocking", allow-invalid = true, reason = "uses tokio's unbounded blocking pool; submit a job to a lane token (mixdog-rt)" },
  { path = "tokio::task::block_in_place", allow-invalid = true, reason = "blocks an RT-C/RT-W worker; submit a job to a lane token (mixdog-rt)" },

  { path = "std::thread::sleep", reason = "blocks the thread; use tokio::time in async code or run on a lane/thread token" },

  { path = "std::fs::read", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::fs::read_to_string", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
