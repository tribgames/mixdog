  { path = "std::path::Path::exists", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::path::Path::is_file", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },
  { path = "std::path::Path::is_dir", reason = "blocking file I/O; run it as a lane job (mixdog-rt)" },

  { path = "tokio::fs::read", allow-invalid = true, reason = "tokio::fs hides a blocking pool; run file I/O as a lane job (mixdog-rt)" },
