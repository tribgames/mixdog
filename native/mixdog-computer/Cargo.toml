[package]
name = "mixdog-computer"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Computer Use desktop backend for macOS and Linux"

[[bin]]
name = "mixdog-computer"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSURL", "NSValue"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "xinput", "screensaver", "res"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
