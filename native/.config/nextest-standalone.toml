# Select this with --config-file for standalone manifests. Nextest resolves package filters
# against the selected manifest's package graph, so the core workspace's overrides cannot be loaded here.

[profile.ci]
slow-timeout = { period = "30s", terminate-after = 4 }
retries = 0
fail-fast = false
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"

# Keep the receipt runner's <workspace root>/target/nextest/ci/junit.xml path.
# Ignored tests must be recorded by the invocation itself for the release skip check.
[profile.ci.junit]
path = "junit.xml"
report-skipped = "ignored"
