[package]
name = "mixdog-patch"
version = "0.7.34"
edition = "2021"

[lib]
name = "mixdog_patch_engine"
path = "src/lib.rs"

# `resource` stamps the helper executable's Windows version info. A crate that links the engine
# as a library (the Rust core) turns it off, so no resource is linked into its own executable.
[features]
default = ["resource"]
resource = []

[[bin]]
name = "mixdog-patch"
path = "src/main.rs"

[dependencies]
memchr = "2"
sha2 = "0.10"
unicode-normalization = "0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Solely for the Task Manager identity claimed in main.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Shell"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
