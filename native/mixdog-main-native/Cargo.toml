[package]
name = "mixdog-main-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Node-API module of the Mixdog desktop main process: the Browser Use URL and redaction rules, on every platform"
license = "Apache-2.0"
publish = false

# Loaded by apps/desktop/src/main/native-module.ts as mixdog_main_native.node
[lib]
name = "mixdog_main_native"
path = "src/lib.rs"
crate-type = ["cdylib"]

[workspace]

[dependencies]
napi = { version = "=3.12.2", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "=3.6.3"
# The rules themselves; the crate takes only mixdog-js and url (no tokio, no hyper, no workspace-hack).
mixdog-browser-rules = { path = "../core/crates/mixdog-browser-rules" }

[build-dependencies]
napi-build = "=2.4.1"

# A panic must not unwind across the Node-API boundary.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
